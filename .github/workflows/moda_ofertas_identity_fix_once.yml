name: Moda e Ofertas — Correção pontual de identidade

on:
  push:
    paths:
      - "blogger_stores/moda_ofertas_identity_fix_kickoff.txt"

permissions:
  contents: write

concurrency:
  group: moda-ofertas-identity-fix-once
  cancel-in-progress: false

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir transformação idempotente e reforçar verificação
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('blogger_stores/src/moda_ofertas_store.py')
          raw = path.read_text(encoding='utf-8')

          old = '''    ("Beleza &amp; Cuidados", "Acessórios"),
              ("cuidados pessoais e beleza", "carteiras, cintos, óculos e relógios"),
          '''
          new = '''    ('<a class="bls-cat" href="#bls-acessorios"><b>Beleza &amp; Cuidados</b><small>cuidados pessoais e beleza</small></a>', '<a class="bls-cat" href="#bls-acessorios"><b>Acessórios</b><small>carteiras, cintos, óculos e relógios</small></a>'),
          '''
          if old not in raw:
              raise SystemExit('Bloco global Beleza/Acessórios não encontrado; abortando fail-closed.')
          raw = raw.replace(old, new, 1)

          old_func = '''def transform_identity(raw: str) -> str:
              out = raw
              for old, new in IDENTITY_REPLACEMENTS:
                  out = out.replace(old, new)
              return out
          '''
          new_func = '''def transform_identity(raw: str) -> str:
              out = raw
              for old, new in IDENTITY_REPLACEMENTS:
                  out = out.replace(old, new)

              # Normalizações idempotentes: preservam a categoria final de beleza e
              # mantêm texto/âncora dos CTAs do hero semanticamente alinhados.
              out = out.replace(
                  '<article class="bls-panel" id="bls-beleza-cuidados"><div class="bls-panel-head"><span>Seleção da categoria</span><h3>Acessórios</h3>',
                  '<article class="bls-panel" id="bls-beleza-cuidados"><div class="bls-panel-head"><span>Seleção da categoria</span><h3>Beleza &amp; Cuidados</h3>',
              )
              out = out.replace(
                  '<a class="bls-btn bls-btn-main" href="#bls-moda-masculina">Ver moda feminina</a>',
                  '<a class="bls-btn bls-btn-main" href="#bls-moda-feminina">Ver moda feminina</a>',
              )
              out = out.replace(
                  '<a class="bls-btn bls-btn-soft" href="#bls-calcados-bolsas">Ver acessórios</a>',
                  '<a class="bls-btn bls-btn-soft" href="#bls-acessorios">Ver acessórios</a>',
              )
              out = out.replace(
                  '<a class="bls-btn bls-btn-main" href="#bls-acessorios">Ver beleza</a>',
                  '<a class="bls-btn bls-btn-main" href="#bls-beleza-cuidados">Ver beleza</a>',
              )
              out = out.replace(
                  '<a class="bls-btn bls-btn-soft" href="#bls-beleza-cuidados">Ver moda masculina</a>',
                  '<a class="bls-btn bls-btn-soft" href="#bls-moda-masculina">Ver moda masculina</a>',
              )
              return out
          '''
          if old_func not in raw:
              raise SystemExit('transform_identity original não encontrado; abortando fail-closed.')
          raw = raw.replace(old_func, new_func, 1)

          marker = '        "blogger-liq-layout-wide-css",\n'
          strengthened = '''        "blogger-liq-layout-wide-css",
              '<h3>Beleza &amp; Cuidados</h3>',
              'href="#bls-moda-feminina">Ver moda feminina</a>',
              'href="#bls-acessorios">Ver acessórios</a>',
              'href="#bls-beleza-cuidados">Ver beleza</a>',
              'href="#bls-moda-masculina">Ver moda masculina</a>',
          '''
          if marker not in raw:
              raise SystemExit('Marcador verify_identity não encontrado; abortando fail-closed.')
          raw = raw.replace(marker, strengthened, 1)

          path.write_text(raw, encoding='utf-8')
          print('MODA_OFERTAS_IDENTITY_SOURCE_FIX_READY')
          PY

      - name: Compilar e validar patch estático
        run: |
          set -euo pipefail
          python -m py_compile blogger_stores/src/moda_ofertas_store.py
          grep -q '<h3>Beleza &amp; Cuidados</h3>' blogger_stores/src/moda_ofertas_store.py
          grep -q 'href="#bls-beleza-cuidados">Ver beleza</a>' blogger_stores/src/moda_ofertas_store.py
          ! grep -q '    ("Beleza &amp; Cuidados", "Acessórios"),' blogger_stores/src/moda_ofertas_store.py
          echo "MODA_OFERTAS_IDENTITY_STATIC_FIX_PASS"

      - name: Atualizar kickoff do segundo LIVE controlado
        run: |
          cat > blogger_stores/moda_ofertas_live_kickoff.txt <<'EOF'
          Segundo LIVE controlado Moda e Ofertas — correção de identidade visual — 2026-11-02
          Exigir título Beleza & Cuidados e CTAs com rótulo/âncora coerentes antes do schedule.
          EOF

      - name: Commitar correção e disparar novo LIVE
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogger_stores/src/moda_ofertas_store.py blogger_stores/moda_ofertas_live_kickoff.txt
          git commit -m "moda ofertas: corrigir identidade visual antes do schedule"
          git pull --rebase origin main
          git push origin HEAD:main

# ONE_TIME_IDENTITY_FIX_2026_11_02
