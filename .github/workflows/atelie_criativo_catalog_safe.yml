name: V31 Atelie Criativo - catalogo Shopee SAFE (sem publicacao)
on:
  pull_request:
    paths:
      - "atelie_criativo/catalog_safe_v31.py"
      - ".github/workflows/atelie_criativo_catalog_safe.yml"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  catalogo-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar sintaxe e dependencia
        run: |
          python -m py_compile atelie_criativo/catalog_safe_v31.py src/blogger_policy_guard.py
          test -n "$SHOPEE_APP_ID" && test -n "$SHOPEE_SECRET"
      - name: Teste unitario offline
        run: GITHUB_EVENT_NAME=pull_request python atelie_criativo/catalog_safe_v31.py --self-test
      - name: Consultar Shopee API somente leitura
        run: python -u atelie_criativo/catalog_safe_v31.py
      - name: Arquivar catalogo validado sem credenciais
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atelie-catalogo-shopee-safe-16
          path: atelie_criativo/catalogo_produtos_safe.json
          if-no-files-found: error
          retention-days: 3
