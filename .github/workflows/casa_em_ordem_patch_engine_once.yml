name: Casa em Ordem — Patch pontual semântico v3

on:
  push:
    paths:
      - "blogger_stores/casa_em_ordem_patch_engine_once.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bloquear cesto em caixa e porta-papel em prateleira
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          targets = {
              Path('blogger_stores/src/casa_em_ordem_store.py'): {
                  '"caixa organizadora": ["caixa de som", "caixa amplificada", "caixa eletrica", "ferramenta", "automotivo", "pet", "cachorro", "gato"],': '"caixa organizadora": ["caixa de som", "caixa amplificada", "caixa eletrica", "ferramenta", "automotivo", "cesto", "para pet", "cachorro", "gato"],',
                  '"caixa organizadora": ["caixa de som", "caixa amplificada", "caixa eletrica", "ferramenta", "automotivo", "para pet", "cachorro", "gato"],': '"caixa organizadora": ["caixa de som", "caixa amplificada", "caixa eletrica", "ferramenta", "automotivo", "cesto", "para pet", "cachorro", "gato"],',
                  '"prateleira banheiro sem furo": ["miniatura", "boneca", "pet"],': '"prateleira banheiro sem furo": ["miniatura", "boneca", "porta papel", "papel higienico", "suporte shampoo", "para pet"],',
                  '"prateleira banheiro sem furo": ["miniatura", "boneca", "para pet"],': '"prateleira banheiro sem furo": ["miniatura", "boneca", "porta papel", "papel higienico", "suporte shampoo", "para pet"],',
              },
              Path('config/shopee_casa_em_ordem_intent_rules.json'): {
                  '"caixa de ferramenta", "caixa ferramenta", "automotivo", "para pet", "cachorro", "gato"': '"caixa de ferramenta", "caixa ferramenta", "automotivo", "cesto", "para pet", "cachorro", "gato"',
                  '"miniatura", "casa de boneca", "para pet"': '"miniatura", "casa de boneca", "porta papel", "papel higienico", "suporte shampoo", "para pet"',
                  '"version": 2': '"version": 3',
              },
          }

          changed=[]
          for p,replacements in targets.items():
              raw=p.read_text(encoding='utf-8')
              before=raw
              for old,new in replacements.items():
                  if old in raw:
                      raw=raw.replace(old,new,1)
              if raw == before:
                  raise SystemExit(f'CASA_ORDEM_PATCH_V3_FAIL: nenhuma alteração em {p}')
              p.write_text(raw,encoding='utf-8')
              changed.append(str(p))
          print('CASA_ORDEM_PATCH_V3_PASS:', ', '.join(changed))
          PY
          python -m py_compile blogger_stores/src/casa_em_ordem_store.py
          python -m json.tool config/shopee_casa_em_ordem_intent_rules.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogger_stores/src/casa_em_ordem_store.py config/shopee_casa_em_ordem_intent_rules.json
          git commit -m "casa em ordem: endurecer caixa e prateleira no perfil v3"
          git pull --rebase origin main
          git push origin HEAD:main
