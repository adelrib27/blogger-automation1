name: C81 - verificar saldo e solicitar piloto WordPress
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v31_c81_wp_pilot_20261121.yml']
permissions: {}
jobs:
  credit:
    if: github.event.after != '0000000000000000000000000000000000000000' && github.event.head_commit.message == 'C81: verificar saldo e disparar piloto WordPress de 21/11'
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    steps:
      - name: Consultar saldo da chave operacional
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          curl -fsS --max-time 20 -H "Authorization: Bearer $FIRECRAWL_API_KEY" https://api.firecrawl.dev/v2/team/credit-usage | jq -e '.data.remainingCredits | select(type == "number" and . >= 2)'
  dispatch:
    needs: credit
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v31_universal_request_queue_daily.yml --repo "$GITHUB_REPOSITORY" --ref main -f budget=1 -f confirm_real_conversion=true -f pilot_site_key=wordpress_casa_decoracao
