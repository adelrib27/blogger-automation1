name: Casa Prática Lab — Loja controlada pelo Tema V20

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casa-pratica-lab-theme-owned-store-layout
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Guardas de código e alvo LAB
        run: |
          set -euo pipefail
          python -m py_compile \
            src/blogger_policy_guard.py src/criar_rascunho.py \
            blogger_stores/src/blogger_new_blog_store_page_target.py \
            blogger_stores/src/casa_pratica_lab_remove_layout_patch_v20.py
          grep -q 'BLOGGER_LIQ_LAYOUT_PATCH_START' blogger_stores/src/casa_pratica_lab_remove_layout_patch_v20.py
          grep -q '8930870316690519385' blogger_stores/src/casa_pratica_lab_remove_layout_patch_v20.py
          grep -q '7110845449177208439' blogger_stores/src/casa_pratica_lab_remove_layout_patch_v20.py
          grep -q '7691087355641688975' blogger_stores/src/casa_pratica_lab_remove_layout_patch_v20.py
      - name: Recovery manual — remover patch legado no LAB e validar Tema V20 nativo
        run: PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_remove_layout_patch_v20.py

# RECOVERY_ONLY_MANUAL
# LAB_ONLY
# NO_PUSH_NO_SCHEDULE
# NO_SHOPEE_SELECTION_CHANGE
# NO_ROTATION_PERSIST
# STAGING_MUST_REMAIN_DRAFT
