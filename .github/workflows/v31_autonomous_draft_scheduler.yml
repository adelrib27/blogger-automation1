name: V31 - fila editorial autônoma DRAFT
on:
  schedule:
    - cron: '47 */4 * * *'
  workflow_dispatch:
    inputs:
      site_key:
        description: Site V31 cadastrado
        type: string
        required: true
permissions:
  contents: read
jobs:
  choose-one:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.V31_AUTODRAFT_ACTIVE == 'true')
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.site.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: site
        env:
          REQUESTED: ${{ inputs.site_key }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, time
          from affiliate_hub_v31.autonomous_review import PROFILE
          from affiliate_hub_v31.site_request_queue import load_requests
          settings = json.loads(PROFILE.read_text(encoding="utf-8"))
          sites = sorted(r["site_key"] for r in load_requests() if r["site_key"] in settings)
          preferred = os.environ["REQUESTED"]
          if not sites or (preferred and preferred not in sites):
              raise SystemExit("no_configured_site")
          print("site=" + (preferred or sites[int(time.time()) // 14400 % len(sites)]))
          PY
  draft:
    needs: choose-one
    uses: ./.github/workflows/v31_independent_review_draft.yml
    with:
      site_key: ${{ needs.choose-one.outputs.site }}
    secrets: inherit
