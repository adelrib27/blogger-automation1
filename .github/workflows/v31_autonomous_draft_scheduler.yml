name: V31 - fila editorial autônoma DRAFT
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v31_autonomous_draft_scheduler.yml']
  schedule:
    - cron: '47 */4 * * *'
  workflow_dispatch:
    inputs:
      site_key:
        description: Site V31 cadastrado
        type: string
        required: true
permissions:
  contents: read
jobs:
  observe-homologation:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'schedule' &&
      (vars.V31_AUTODRAFT_ACTIVE != 'true' ||
       vars.V31_AUTODRAFT_ROLLOUT_SITE == '' ||
       (vars.V31_AUTODRAFT_ROLLOUT_SITE == 'all' &&
        vars.V31_AUTODRAFT_FULL_ROLLOUT_APPROVED != 'true'))))
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - run: python -m unittest affiliate_hub_v31.tests.test_autonomous_review affiliate_hub_v31.tests.test_automatic_wordpress_drafts -q
      - name: Conferir IDs, títulos e hashes por GET e SELECT
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          V31_WORDPRESS_SITE_CREDENTIALS_JSON: ${{ secrets.V31_WORDPRESS_SITE_CREDENTIALS_JSON }}
          CASA_WORDPRESS_USERNAME: ${{ secrets.CASA_WORDPRESS_USERNAME }}
          CASA_WORDPRESS_APP_PASSWORD: ${{ secrets.CASA_WORDPRESS_APP_PASSWORD }}
          V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
          V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
        run: python -m affiliate_hub_v31.audit_draft_pilots
  choose-one:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && vars.V31_AUTODRAFT_ACTIVE == 'true' &&
        vars.V31_AUTODRAFT_ROLLOUT_SITE != '' &&
        (vars.V31_AUTODRAFT_ROLLOUT_SITE != 'all' ||
         vars.V31_AUTODRAFT_FULL_ROLLOUT_APPROVED == 'true')))
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.site.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências da seleção sem credenciais nem writes
        run: python -m pip install 'boto3>=1.36,<2' 'cryptography>=42' requests
      - name: C140 — validar 50 cenários antes de selecionar site e DRAFT
        run: python -m affiliate_hub_v31.editorial_scope_validation --cases 50 --cycle-index ${{ github.run_number }}
      - id: site
        env:
          REQUESTED: ${{ inputs.site_key }}
          IS_SCHEDULE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          V31_AUTODRAFT_ACTIVE: ${{ vars.V31_AUTODRAFT_ACTIVE }}
          V31_AUTODRAFT_ROLLOUT_SITE: ${{ vars.V31_AUTODRAFT_ROLLOUT_SITE }}
          V31_AUTODRAFT_FULL_ROLLOUT_APPROVED: ${{ vars.V31_AUTODRAFT_FULL_ROLLOUT_APPROVED }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, time
          from affiliate_hub_v31.autonomous_review import PROFILE
          from affiliate_hub_v31.site_request_queue import load_requests, autonomous_sites_for_writes
          settings = json.loads(PROFILE.read_text(encoding="utf-8"))
          registered = {r["site_key"] for r in load_requests() if r["site_key"] in settings}
          # Manual canary is an explicit site choice; schedule may only
          # migrate routes granted by BOTH the arm and rollout variables.
          sites = sorted(autonomous_sites_for_writes() if
                         os.environ["IS_SCHEDULE"] == "true" else registered)
          preferred = os.environ["REQUESTED"]
          if not sites or (preferred and preferred not in sites):
              raise SystemExit("no_configured_site")
          print("site=" + (preferred or sites[int(time.time()) // 14400 % len(sites)]))
          PY
  draft:
    needs: choose-one
    uses: ./.github/workflows/v31_independent_review_draft.yml
    with:
      site_key: ${{ needs.choose-one.outputs.site }}
    secrets: inherit

  release:
    needs: draft
    if: >-
      github.event_name == 'schedule' &&
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main' &&
      vars.V31_AUTODRAFT_ACTIVE == 'true' &&
      vars.V31_AUTOLIVE_ACTIVE == 'true' &&
      needs.draft.outputs.verified_draft != ''
    runs-on: ubuntu-latest
    environment: v31-autonomous-live
    concurrency:
      group: v31-editorial-catalog-single-writer
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.36,<2' 'cryptography>=42' requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Verificar política, reivindicar tentativa e confirmar estado
        env:
          V31_VERIFIED_DRAFT: ${{ needs.draft.outputs.verified_draft }}
          V31_AUTO_LIVE_APPROVED_POLICY_SHA256: ${{ vars.V31_AUTO_LIVE_APPROVED_POLICY_SHA256 }}
          V31_AUTONOMOUS_RELEASE_PUBLIC_KEY_HEX: ${{ vars.V31_AUTONOMOUS_RELEASE_PUBLIC_KEY_HEX }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
          V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
          V31_D1_SAFE_WRITES_ENABLED: V31_D1_SAFE_SQL_ONLY
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          V31_WORDPRESS_SITE_CREDENTIALS_JSON: ${{ secrets.V31_WORDPRESS_SITE_CREDENTIALS_JSON }}
          CASA_WORDPRESS_USERNAME: ${{ secrets.CASA_WORDPRESS_USERNAME }}
          CASA_WORDPRESS_APP_PASSWORD: ${{ secrets.CASA_WORDPRESS_APP_PASSWORD }}
        run: python -m affiliate_hub_v31.autonomous_live --execute-approved-policy

  audit:
    needs: [choose-one, draft, release]
    if: always() && needs.choose-one.result == 'success'
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Registrar fila e orçamento sem expor conteúdo
        env:
          SITE: ${{ needs.choose-one.outputs.site }}
          DRAFT_RESULT: ${{ needs.draft.result }}
          LIVE_RESULT: ${{ needs.release.result }}
          VERIFICATION_RECEIPT: ${{ needs.draft.outputs.verification_receipt }}
          VERIFIED_DRAFT: ${{ needs.draft.outputs.verified_draft }}
          V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
          V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from affiliate_hub_v31.d1_http_runner import CloudflareD1HTTPRunner
          from affiliate_hub_v31.autodraft_schedule_outcome import summarize_draft_cycle
          from affiliate_hub_v31.routing import sites
          site = os.environ["SITE"]
          route = sites().get(site)
          if not route:
              raise SystemExit("audit_route_unknown")
          clock = datetime.now(timezone.utc)
          target = (site, route["campaign"])
          query = CloudflareD1HTTPRunner.from_environment()
          jobs = query("""SELECT status, count(*) AS total FROM v31_ready_jobs
                          WHERE site_key=? AND campaign=? GROUP BY status ORDER BY status""", target)
          budget = query("""SELECT kind, used, max_allowed, blocked_until_epoch FROM v31_search_budget
                            WHERE site_key=? AND campaign=? AND day_utc=? ORDER BY kind""",
                         (*target, clock.date().isoformat()))
          outcome = summarize_draft_cycle(
              site_key=site, verification_receipt=os.environ["VERIFICATION_RECEIPT"],
              verified_draft=os.environ["VERIFIED_DRAFT"],
              draft_job=os.environ["DRAFT_RESULT"], live_job=os.environ["LIVE_RESULT"])
          result = {"site": site, "outcome": outcome,
                    "jobs": jobs, "daily_research": budget}
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              print("### Estado operacional V31", file=summary)
              print("```json", json.dumps(result, indent=2), "```", sep="\n", file=summary)
          PY
