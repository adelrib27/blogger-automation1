name: V31 Universal - Converter por Tema e Blog Real (somente cache, sem posts)
on:
  workflow_dispatch:
    inputs:
      site_key:
        description: 'Blog Blogger/WordPress cadastrado em sites.d ou site_routes.json'
        required: true
        type: string
      topic:
        description: 'Assunto informado na criacao do blog, nao previsto em lista fixa'
        required: true
        type: string
      budget:
        description: 'Maximo global 1 a 3 links Shopee nesta execucao'
        required: true
        type: choice
        options: ['1','2','3']
        default: '1'
      confirm_conversion:
        description: 'Confirmo criar links oficiais SOMENTE para a campanha real deste blog; sem publicar'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  converter-universal-sem-publicar:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_conversion == true
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar cliente R2
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Validar regressao completa antes das mutations
        run: |
          python -m compileall -q affiliate_hub_v31
          python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: C140 — 50 simulações SAFE antes de converter URLs
        run: python -m affiliate_hub_v31.editorial_scope_validation --cases 50 --cycle-index ${{ github.run_number }}
      - name: Plano de links por assunto no site real, nenhuma chamada Shopee
        env:
          V31_SITE: ${{ inputs.site_key }}
          V31_TOPIC: ${{ inputs.topic }}
          V31_BUDGET: ${{ inputs.budget }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          python -m affiliate_hub_v31.universal_conversion \
            --site-key "$V31_SITE" --topic "$V31_TOPIC" --budget "$V31_BUDGET"
      - name: Converter apenas selecionados aprovados, campanha validada, sem publicar
        env:
          V31_SITE: ${{ inputs.site_key }}
          V31_TOPIC: ${{ inputs.topic }}
          V31_BUDGET: ${{ inputs.budget }}
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          python -m affiliate_hub_v31.universal_conversion \
            --site-key "$V31_SITE" --topic "$V31_TOPIC" --budget "$V31_BUDGET" --execute
