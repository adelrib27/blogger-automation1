name: Facebook Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facebook-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar conexão de leitura com a Página do Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python src/testar_facebook_lab.py

      - name: Preparar conteúdo social a partir do Blogger
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python src/preparar_social_lab.py

      - name: Montar dry-run do Facebook sem publicar
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python src/preparar_facebook_dry_run.py

      - name: Salvar dry-run para inspeção
        uses: actions/upload-artifact@v4
        with:
          name: facebook-dry-run
          path: |
            artifacts/facebook_dry_run.json
            artifacts/social_payload.json
            artifacts/facebook_connection_test.json
          if-no-files-found: error
