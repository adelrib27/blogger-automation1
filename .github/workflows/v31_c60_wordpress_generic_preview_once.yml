name: V31 C60 TEMP main - escritor WordPress UNIVERSAL preview R2/site real
on:
  push:
    branches: [main]
    paths:
      - affiliate_hub_v31/C60_WORDPRESS_GENERIC_PREVIEW_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  preview-generic-wordpress-no-post:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2' requests
      - name: Testar quotas idempotência autenticação e POST sempre DRAFT (fakes)
        run: |
          set -euo pipefail
          python -m unittest affiliate_hub_v31.tests.test_automatic_wordpress_drafts affiliate_hub_v31.tests.test_wordpress_related_posts -q
      - name: Restaurar R2 e executar prévia C60 contra WordPress Casa real, sem POST
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,tempfile
          from pathlib import Path
          from affiliate_hub_v31.catalog import Catalog
          from affiliate_hub_v31.r2_state import R2State,verify_database
          from affiliate_hub_v31.routing import sites
          from affiliate_hub_v31.automatic_wordpress_drafts import (
             WordPressRestClient,run
          )
          site='wordpress_casa_decoracao'
          route=sites()[site]
          client=WordPressRestClient(base_url=route['identifier'])
          history=client.list_posts(include_unpublished=False)
          if not isinstance(history,list) or len(history)<2:
              raise SystemExit('V31_C60_REAL_WP_PUBLIC_HISTORY_UNAVAILABLE')
          class ReadOnlyCache:
              def __init__(self,rows): self.rows=rows
              def list_posts(self,*,include_unpublished):
                  if include_unpublished:
                      raise AssertionError('V31_C60_PUBLIC_PREVIEW_MUST_NOT_USE_DRAFTS')
                  return self.rows
              def site_settings(self):
                  raise AssertionError('V31_C60_PREVIEW_MUST_NOT_AUTH')
              def create_draft(self,**_):
                  raise AssertionError('V31_C60_PREVIEW_MUST_NOT_POST')
          client=ReadOnlyCache(history)
          with tempfile.TemporaryDirectory(prefix='v31-c60-wp-') as td:
              file=Path(td)/'catalog.sqlite3'
              if not R2State.from_env().restore_to(file):
                  raise SystemExit('V31_C60_R2_MISSING')
              verify_database(file)
              with Catalog(file) as cat:
                  candidates=cat.db.execute("""
                     SELECT DISTINCT p.title FROM products p
                     JOIN affiliate_links a ON a.product_key=p.product_key
                     WHERE a.campaign=? AND p.moderation='eligible'
                     AND p.image_url IS NOT NULL AND p.image_url!=''
                     ORDER BY length(p.title),p.title LIMIT 18
                  """,(route['campaign'],)).fetchall()
                  if not candidates:
                      raise SystemExit('V31_C60_NO_CASA_CAMPAIGN_PRODUCTS')
                  statuses=[]
                  selected=None
                  for (title,) in candidates:
                      result=run(site_key=site,preview_topic=str(title)[:150],
                          execute_draft=False,wp_client=client,catalog=cat)
                      statuses.append(result['status'])
                      if result['status']=='READY_FOR_DRAFT_REVIEW':
                          selected=result
                          break
                  if selected is None:
                      print('V31_C60_PREVIEW_STATUS '+json.dumps({
                       'status_counts':{x:statuses.count(x) for x in set(statuses)},
                       'topics_checked':len(statuses)}))
                      raise SystemExit('V31_C60_NO_MATCHING_UNPUBLISHED_PRODUCT')
                  if (selected['wordpress_posts_created']!=0 or
                      selected['publication_calls']!=0 or
                      selected['internal_links']<1 or
                      selected['exact_campaign'] is not True or
                      selected['real_product_image'] is not True):
                      raise SystemExit('V31_C60_WRITER_PREVIEW_GATE_FAILED')
                  print('V31_C60_REAL_GENERIC_WORDPRESS_PREVIEW_PASS '+json.dumps({
                    'wordpress_site_registered':True,
                    'public_posts_seen':len(history),
                    'topics_checked':len(statuses),
                    'real_photo':True,'exact_campaign':True,
                    'internal_post_links':selected['internal_links'],
                    'wordpress_posts_created':0,'r2_writes':0,
                    'shopee_mutations':0
                  },sort_keys=True))
          PY
