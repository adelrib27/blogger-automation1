name: BUILD PORTABLE FINAL CORRIGIDO CASA PRATICA

on:
  push:
    paths:
      - ".github/workflows/build_portable_after_casa_pratica_fix_once.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main final
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
          fetch-depth: 1
      - name: Checkout runner validado
        uses: actions/checkout@v4
        with:
          ref: blogger-safe-ui-provisioning-v0-2
          path: runner-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build + compileall + secret scan
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python main-src/portable/build_portable_package.py --main-root main-src --runner-root runner-src --output-dir dist
          cp dist/Blogger_Automation_Unificado_2026-11-02_FINAL.zip dist/Blogger_Automation_Unificado_2026-11-02_FINAL_CORRIGIDO.zip
          sha256sum dist/Blogger_Automation_Unificado_2026-11-02_FINAL_CORRIGIDO.zip > dist/Blogger_Automation_Unificado_2026-11-02_FINAL_CORRIGIDO.zip.sha256.txt
      - name: Instalar requirements e testar sistema exportado
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/dist/Blogger_Automation_Unificado_2026-11-02_FINAL"
          pip install -r "$PKG/requirements.txt"
          cd "$PKG"
          python run.py policy-test
          python run.py doctor
          python - <<'PY'
          import importlib
          for name in ('googleapiclient','google.auth','google_auth_oauthlib','google.genai','requests','cloudinary','PIL','playwright'):
              importlib.import_module(name)
              print('IMPORT_OK', name)
          PY
          cd "$PKG/local_runner"
          python - <<'PY'
          import importlib
          for name in ('apply_theme_safe','apply_theme_auto','backup_theme_auto','run_with_cdp_resilience_v08','provision_new_blog_v20','local_service_v08'):
              importlib.import_module(name)
              print('RUNNER_IMPORT_OK', name)
          PY
          grep -q 'data-share-compact' "$PKG/blogger_stores/src/blogger_store_share_card.py"
          grep -q 'bg-photo-container{display:none' "$PKG/blogger_stores/src/blogger_new_blog_store_page_target.py"
          grep -q 'fundo limpo + carousel + share compacto' "$PKG/blogger_stores/src/casa_pratica_lab_public_acceptance.py"
          echo CASA_PRATICA_FINAL_FIX_INCLUDED_PASS
      - name: Upload pacote corrigido
        uses: actions/upload-artifact@v4
        with:
          name: Blogger_Automation_Unificado_2026-11-02_FINAL_CORRIGIDO
          path: |
            dist/Blogger_Automation_Unificado_2026-11-02_FINAL_CORRIGIDO.zip
            dist/Blogger_Automation_Unificado_2026-11-02_FINAL_CORRIGIDO.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30

# DELETE_AFTER_ARTIFACT_DOWNLOAD
