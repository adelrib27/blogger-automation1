name: Casa e Decoração — Editorial Manual v3

on:
  workflow_dispatch:
    inputs:
      generation_batch_size:
        description: "Artigos a gerar nesta execução (1-3)"
        required: false
        default: "1"
      publish_after_generation:
        description: "Publicar após gerar (sempre sujeito ao limite diário de 3 e à rotação)"
        required: true
        type: boolean
        default: false
      publish_limit:
        description: "Máximo nesta execução (1-3; limite diário continua 3)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: casa-decoracao-editorial-v3
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      SHOPEE_OPPORTUNITIES_CONFIG: casa_decoracao/config/shopee_oportunidades.json
      SHOPEE_INTENT_RULES: casa_decoracao/config/shopee_intent_rules.json
      SHOPEE_OUTPUT_DIR: casa_decoracao/data/shopee_oportunidades
      SHOPEE_CATEGORY: all
      SHOPEE_TOP_N: "32"
      CASA_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CASA_CLOUDFLARE_ACCOUNT_ID }}
      CASA_CLOUDFLARE_API_TOKEN: ${{ secrets.CASA_CLOUDFLARE_API_TOKEN }}
      CASA_AI_MODEL: "@cf/qwen/qwen3-30b-a3b-fp8"
      CASA_GENERATION_ENABLED: "true"
      CASA_GENERATION_BATCH_SIZE: ${{ inputs.generation_batch_size }}
      CASA_WORDPRESS_USERNAME: ${{ secrets.CASA_WORDPRESS_USERNAME }}
      CASA_WORDPRESS_APP_PASSWORD: ${{ secrets.CASA_WORDPRESS_APP_PASSWORD }}
      CASA_WORDPRESS_STATUS: publish
      CASA_LIVE_PUBLISH_ENABLED: ${{ inputs.publish_after_generation && 'true' || 'false' }}
      CASA_PUBLISH_LIMIT: ${{ inputs.publish_limit }}
      CASA_DAILY_PUBLISH_CAP: "3"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar base
        run: |
          python casa_decoracao/src/category_rotation.py
          python casa_decoracao/src/self_test.py
          python casa_decoracao/src/cta_card_self_test.py
      - name: Descobrir Shopee
        run: python -u casa_decoracao/src/shopee_oportunidades_casa.py
      - name: Montar fila
        run: python -u casa_decoracao/src/build_editorial_queue.py
      - name: Gerar
        run: python -u casa_decoracao/src/generate_articles.py
      - name: Publicar se autorizado nesta execução
        if: ${{ inputs.publish_after_generation }}
        run: python -u casa_decoracao/src/publish_generated.py
      - name: Auditar
        if: always()
        run: python -u casa_decoracao/src/audit_release_candidates.py || true
      - name: Persistir estado
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- casa_decoracao/data)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casa_decoracao/data
          git commit -m "Atualizar estado manual Casa e Decoração v3"
          git pull --rebase origin main
          git push origin HEAD:main
