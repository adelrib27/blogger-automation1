name: Casa Prática Lab — CORREÇÃO VISUAL FINAL

on:
  push:
    paths:
      - ".github/workflows/casa_pratica_lab_visual_fix_once.yml"

permissions:
  contents: read

concurrency:
  group: casa-pratica-lab-store-live
  cancel-in-progress: false

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BLOGGER_BLOG_ID: "8930870316690519385"
      BLOGGER_STORE_PAGE_ID: "7110845449177208439"
      BLOGGER_STORE_POST_ID: "7691087355641688975"
      BLOGGER_STORE_PAGE_URL: "https://casa-pratica-lab-20261102.blogspot.com/p/loja.html"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compilar e validar em memória
        run: |
          set -euo pipefail
          python -m py_compile \
            blogger_stores/src/blogger_store_share_card.py \
            blogger_stores/src/blogger_new_blog_store_page_target.py \
            blogger_stores/src/casa_pratica_lab_public_acceptance.py
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py sync-dry-run
      - name: Aplicar Page corrigida
        run: |
          set -euo pipefail
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py sync-live
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py verify-page
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_store_share_card.py verify
      - name: Aceitação pública completa
        run: PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_public_acceptance.py
      - name: Auditoria visual em navegador real
        run: |
          set -euo pipefail
          pip install 'playwright>=1.55,<2'
          python - <<'PY'
          import json
          import os
          import shutil
          import time
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          url = os.environ['BLOGGER_STORE_PAGE_URL']
          chrome = next((p for p in (
              '/usr/bin/google-chrome', '/usr/bin/google-chrome-stable',
              '/usr/bin/chromium', '/usr/bin/chromium-browser'
          ) if os.path.exists(p)), None)
          if not chrome:
              raise SystemExit('Chrome/Chromium do runner GitHub não encontrado.')

          with sync_playwright() as pw:
              browser = pw.chromium.launch(executable_path=chrome, headless=True, args=['--no-sandbox'])
              page = browser.new_page(viewport={'width': 1440, 'height': 1100}, device_scale_factor=1)
              status = 0
              ready = False
              for attempt in range(1, 5):
                  target = f"{url}?browser_visual_probe={int(time.time())}-{attempt}"
                  response = page.goto(target, wait_until='domcontentloaded', timeout=60_000)
                  status = int(response.status) if response else 0
                  print(f'BROWSER_VISUAL_HTTP_{attempt}: {status}')
                  try:
                      page.wait_for_selector('.bls-page', state='visible', timeout=15_000)
                      ready = True
                      break
                  except PlaywrightTimeoutError:
                      if attempt < 4:
                          time.sleep(12 if status == 429 else 5)
              if not ready:
                  raise SystemExit(f'Vitrine .bls-page não ficou visível; último HTTP={status}')
              page.wait_for_timeout(2500)
              data = page.evaluate(r'''() => {
                const box = el => {
                  if (!el) return null;
                  const r = el.getBoundingClientRect();
                  const s = getComputedStyle(el);
                  return {
                    display: s.display,
                    visibility: s.visibility,
                    width: Math.round(r.width * 10) / 10,
                    height: Math.round(r.height * 10) / 10,
                    top: Math.round(r.top * 10) / 10,
                    background: s.backgroundColor,
                    color: s.color
                  };
                };
                const bg = document.querySelector('.bg-photo-container');
                const share = document.getElementById('blogger-store-share-card');
                const button = document.getElementById('blogger-store-share-button');
                const label = document.querySelector('.blogger-store-share-label');
                const store = document.querySelector('.bls-page');
                return {
                  bg: box(bg),
                  share: box(share),
                  button: box(button),
                  store: box(store),
                  labelText: (label?.textContent || '').trim(),
                  shareCompact: share?.getAttribute('data-share-compact') || '',
                  storeCount: document.querySelectorAll('[data-item-id]').length,
                  heroCount: document.querySelectorAll('[data-hero-item-id]').length
                };
              }''')
              data['http_status'] = status
              print('CASA_PRATICA_LAB_BROWSER_VISUAL_METRICS=' + json.dumps(data, ensure_ascii=False, sort_keys=True))

              bg = data.get('bg') or {}
              share = data.get('share') or {}
              button = data.get('button') or {}
              if bg.get('display') != 'none' or float(bg.get('height') or 0) > 1:
                  raise SystemExit(f'Fundo decorativo ainda ocupa espaço: {bg}')
              if data.get('shareCompact') != '1' or data.get('labelText') != 'Compartilhar esta loja':
                  raise SystemExit(f'Share compacto/label inválido: {data}')
              if not (0 < float(share.get('height') or 0) <= 70):
                  raise SystemExit(f'Share card ainda alto demais: {share}')
              if not (0 < float(button.get('height') or 0) <= 56 and 0 < float(button.get('width') or 0) <= 260):
                  raise SystemExit(f'Botão de compartilhar fora das dimensões compactas: {button}')
              if button.get('background') != 'rgb(255, 255, 255)':
                  raise SystemExit(f'Botão de compartilhar não está branco: {button}')
              if button.get('color') != 'rgb(114, 156, 11)':
                  raise SystemExit(f'Ícone/cor principal de compartilhar não está verde #729c0b: {button}')
              if data.get('storeCount') != 20 or data.get('heroCount') != 12:
                  raise SystemExit(f'Vitrine alterada durante correção visual: {data}')
              page.screenshot(path='casa-pratica-lab-visual-final.png', full_page=False)
              browser.close()
          print('CASA_PRATICA_LAB_BROWSER_VISUAL_PASS: fundo=0px; share compacto branco/verde; vitrine 20+12 preservada.')
          PY
      - name: Guardar screenshot final
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casa-pratica-lab-visual-final
          path: casa-pratica-lab-visual-final.png
          if-no-files-found: warn
          retention-days: 7

# DELETE_AFTER_PASS
# BROWSER_VISUAL_AUDIT_REQUIRED
