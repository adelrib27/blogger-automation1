name: Ventiladores em Foco — Loja Shopee LIVE

on:
  workflow_dispatch:
  push:
    paths:
      - "ventiladores_store/store_live_kickoff.txt"

permissions:
  contents: write

concurrency:
  group: ventiladores-store-live
  cancel-in-progress: false

jobs:
  atualizar-loja:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      BLOGGER_BLOG_ID: "4473989735719981382"
      BLOGGER_STORE_POST_ID: "1410775502611365606"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      BLOGGER_STORE_DRY_RUN: "false"
      BLOGGER_STORE_ITEMS_PER_CATEGORY: "4"
      BLOGGER_STORE_RECENT_DAYS: "1"
      SHOPEE_TOP_N: "70"
      SHOPEE_OPPORTUNITIES_CONFIG: ventiladores_store/config/shopee_oportunidades.json
      SHOPEE_INTENT_RULES: ventiladores_store/config/shopee_intent_rules.json
      SHOPEE_OUTPUT_DIR: ventiladores_store/data/store_shopee_scan
      SHOPEE_CATEGORY: all

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validar código, Policy Guard e self-tests
        run: |
          set -euo pipefail
          python -m py_compile \
            src/criar_rascunho.py src/shopee_oportunidades.py src/shopee_oportunidades_v22.py src/shopee_oportunidades_v23.py \
            src/blogger_policy_guard.py src/blogger_policy_guard_self_test.py \
            ventiladores_store/src/shopee_oportunidades_ventiladores.py \
            ventiladores_store/src/store_auto.py ventiladores_store/src/store_auto_post.py \
            ventiladores_store/src/store_layout_patch.py ventiladores_store/src/store_auto_self_test.py \
            ventiladores_store/src/store_hero_sync.py ventiladores_store/src/store_hero_sync_post.py \
            ventiladores_store/src/post_target_proxy.py
          PYTHONPATH=src python src/blogger_policy_guard_self_test.py
          BLOGGER_STORE_DRY_RUN=true PYTHONPATH=src:ventiladores_store/src python ventiladores_store/src/store_auto_self_test.py
      - name: Confirmar secrets obrigatórios
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          test -n "$BLOGGER_CLIENT_ID"
          test -n "$BLOGGER_CLIENT_SECRET"
          test -n "$BLOGGER_REFRESH_TOKEN"
      - name: Atualizar vitrine no POST Loja
        run: PYTHONPATH=src:ventiladores_store/src python -u ventiladores_store/src/store_auto_post.py
      - name: Sincronizar 12 cards do hero
        run: PYTHONPATH=src:ventiladores_store/src python -u ventiladores_store/src/store_hero_sync_post.py
      - name: Verificar renderização pública, nicho, layout e políticas
        run: |
          set -euo pipefail
          base="https://ventiladores-em-foco.blogspot.com/2026/11/loja.html?store_verify=${GITHUB_RUN_ID}"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -L -sS -A 'Mozilla/5.0 VentiladoresStoreValidator/1.0' --max-time 40 -o /tmp/ventiladores-loja.html -w '%{http_code}' "${base}-${attempt}" || echo 000)
            if [ "$code" = "200" ]; then
              read store_count hero_count < <(python - <<'PY'
          raw=open('/tmp/ventiladores-loja.html',encoding='utf-8',errors='ignore').read()
          print(raw.count('data-item-id='), raw.count('data-hero-item-id='))
          PY
              )
              if [ "$store_count" -eq 20 ] && [ "$hero_count" -eq 12 ] && grep -q "bls-store-grid" /tmp/ventiladores-loja.html && grep -q "blh-grid" /tmp/ventiladores-loja.html; then
                ok=1; break
              fi
            fi
            echo "Tentativa pública $attempt sem PASS (HTTP $code); backoff."
            sleep $((attempt * 6))
          done
          test "$ok" -eq 1
          PYTHONPATH=src python - <<'PY'
          from blogger_policy_guard import require_store_html_allowed
          raw=open('/tmp/ventiladores-loja.html',encoding='utf-8',errors='ignore').read()
          require_store_html_allowed(raw, expected_products=20, expected_hero=12)
          print('BLOGGER_POLICY_GUARD_PUBLIC_PASS')
          PY
          grep -q "Mesa &amp; Coluna\|Mesa & Coluna" /tmp/ventiladores-loja.html
          grep -q "Ventiladores de Torre" /tmp/ventiladores-loja.html
          grep -q "Ventiladores de Teto" /tmp/ventiladores-loja.html
          grep -q "Ventiladores de Parede" /tmp/ventiladores-loja.html
          grep -q "Circuladores &amp; Portáteis\|Circuladores & Portáteis" /tmp/ventiladores-loja.html
          grep -q 'href="#bls-mesa-coluna"' /tmp/ventiladores-loja.html
          grep -q 'href="#bls-circuladores-portateis"' /tmp/ventiladores-loja.html
          grep -q "grid-template-columns:minmax(0,1fr)!important" /tmp/ventiladores-loja.html
          grep -q '\[id\^="PopularPosts"\]' /tmp/ventiladores-loja.html
          echo "PUBLIC_PASS: Ventiladores em Foco, vitrine=20, hero=12, nicho, layout e Policy Guard OK"
      - name: Persistir rotação somente após PASS público
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- ventiladores_store/data/store_rotation.json ventiladores_store/data/store_last_selection.json)" ]; then
            echo "Sem mudanças de estado."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ventiladores_store/data/store_rotation.json ventiladores_store/data/store_last_selection.json
          git commit -m "Atualizar rotação da Loja Ventiladores em Foco"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ventiladores-store-live-${{ github.run_number }}
          path: |
            ventiladores_store/data/store_last_selection.json
            ventiladores_store/data/store_shopee_scan/
            /tmp/ventiladores-loja.html
          if-no-files-found: warn
          retention-days: 14
