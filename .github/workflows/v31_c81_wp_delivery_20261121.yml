name: C81 - entrega isolada do DRAFT WordPress
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v31_c81_wp_delivery_20261121.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=42' 'boto3>=1.36,<2'
      - run: python -m unittest discover -s affiliate_hub_v31/tests -q
  wordpress:
    needs: tests
    if: github.repository == 'adelrib27/blogger-automation1' && github.event.head_commit.message == 'C81 retomar READY WordPress após corrigir paginação'
    uses: ./.github/workflows/v31_independent_review_draft.yml
    with:
      site_key: wordpress_casa_decoracao
      pilot: true
      pilot_sku: shopee:400124163:42079451217
    secrets: inherit
