name: Casa Prática Lab — prova delegada final

on:
  push:
    paths:
      - ".github/workflows/casa_pratica_lab_single_controller_once.yml"

permissions:
  contents: read

concurrency:
  group: casa-pratica-lab-store-live
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BLOGGER_BLOG_ID: "8930870316690519385"
      BLOGGER_STORE_PAGE_ID: "7110845449177208439"
      BLOGGER_STORE_POST_ID: "7691087355641688975"
      BLOGGER_STORE_PAGE_URL: "https://casa-pratica-lab-20261102.blogspot.com/p/loja.html"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Sincronizar controlador delegado
        run: |
          set -euo pipefail
          python -m py_compile blogger_stores/src/blogger_new_blog_store_page_target.py blogger_stores/src/casa_pratica_lab_public_acceptance.py
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py sync-dry-run
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py sync-live
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py ensure-staging-draft
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py verify-page

      - name: Aceitação pública
        run: PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_public_acceptance.py

      - name: Prova funcional Chrome — clique delegado 0 para 1
        run: |
          set -euo pipefail
          pip install selenium
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1200')
          d=webdriver.Chrome(options=opts)
          try:
              d.get('https://casa-pratica-lab-20261102.blogspot.com/p/loja.html?delegated_final=1')
              time.sleep(5)
              before=d.execute_script(r'''
                const pages=[...document.querySelectorAll('.bls-page')].sort((a,b)=>b.getBoundingClientRect().width-a.getBoundingClientRect().width);
                const p=pages[0], s=p&&p.querySelector('.bls-slider');
                const slides=s?[...s.querySelectorAll('.bls-slide')]:[];
                const vis=x=>{const c=getComputedStyle(x),r=x.getBoundingClientRect();return c.display!=='none'&&c.visibility!=='hidden'&&r.width>0&&r.height>0};
                return {
                  width:p?p.getBoundingClientRect().width:0, viewport:innerWidth, pages:pages.length,
                  slides:slides.length, visible:slides.filter(vis).length,
                  dots:s?s.querySelectorAll('#blsDots button').length:0,
                  active:slides.findIndex(x=>x.classList.contains('is-active')),
                  delegated:s?s.dataset.pageCarouselDelegated||'':'',
                  legacy:document.documentElement.innerHTML.includes("document.getElementById('blsSlider')"),
                  clickDelegation:document.documentElement.innerHTML.includes("closest('.bls-next')"),
                  titleVisible:[...document.querySelectorAll('.post-title-container,.post-title,.entry-title')].filter(x=>vis(x)&&/LOJA/i.test(x.textContent||'')).length
                };
              ''')
              print('BEFORE=',before)
              if before['width']<1200 or before['slides']!=3 or before['visible']!=1 or before['dots']!=3 or before['delegated']!='1' or before['legacy'] or not before['clickDelegation'] or before['titleVisible']!=0:
                  raise SystemExit(f'Estado inicial inválido: {before}')

              immediate=d.execute_script(r'''
                const p=[...document.querySelectorAll('.bls-page')].sort((a,b)=>b.getBoundingClientRect().width-a.getBoundingClientRect().width)[0];
                const slides=[...p.querySelectorAll('.bls-slide')];
                const before=slides.findIndex(x=>x.classList.contains('is-active'));
                p.querySelector('.bls-next').click();
                const after=slides.findIndex(x=>x.classList.contains('is-active'));
                return {before,after};
              ''')
              print('IMMEDIATE=',immediate)
              time.sleep(.5)
              after=d.execute_script(r'''
                const p=[...document.querySelectorAll('.bls-page')].sort((a,b)=>b.getBoundingClientRect().width-a.getBoundingClientRect().width)[0];
                const slides=[...p.querySelectorAll('.bls-slide')];
                const vis=x=>{const c=getComputedStyle(x),r=x.getBoundingClientRect();return c.display!=='none'&&c.visibility!=='hidden'&&r.width>0&&r.height>0};
                return {active:slides.findIndex(x=>x.classList.contains('is-active')),visible:slides.filter(vis).length};
              ''')
              print('AFTER=',after)
              if immediate['after']==immediate['before'] or after['active']==before['active'] or after['visible']!=1:
                  raise SystemExit(f'Carousel delegado não avançou: before={before} immediate={immediate} after={after}')
              print(f"CASA_PRATICA_LAB_BROWSER_VISUAL_PASS: width={before['width']:.0f}/{before['viewport']}; pages={before['pages']}; slides=3 visible=1; dots=3; next={before['active']}->{after['active']}; delegated_controller=PASS; title_hidden=PASS")
          finally:
              d.quit()
          PY

# DELETE_AFTER_PASS
# FINAL_DELEGATED_CONTROLLER_PROOF
