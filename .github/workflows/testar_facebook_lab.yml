name: Testar Facebook Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar conexão de leitura com a Página do Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python src/testar_facebook_lab.py

      - name: Salvar resultado para inspeção
        uses: actions/upload-artifact@v4
        with:
          name: facebook-connection-test
          path: artifacts/facebook_connection_test.json
          if-no-files-found: error
