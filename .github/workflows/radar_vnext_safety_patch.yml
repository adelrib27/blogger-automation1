name: Radar Tech BR — Reforço Editorial vNext

on:
  push:
    paths:
      - "radar_tech_br/safety_patch_kickoff.txt"

permissions:
  contents: write

concurrency:
  group: radar-tech-br-vnext-safety-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reforçar geração e gates editoriais
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          q = Path('radar_tech_br/src/quality_gate.py')
          s = q.read_text(encoding='utf-8')
          needle = '''ABSOLUTE_CLAIM_PATTERNS = (\n    r"\\bgarant(?:e|ir|indo|ido)\\b.{0,90}\\b(?:sempre|seguran[cç]a|prote[cç][aã]o|condi[cç][oõ]es? de uso)\\b",\n    r"\\b(?:100\\s*%|totalmente)\\s+(?:seguro|protegido|garantido)\\b",\n    r"\\bprote[cç][aã]o\\s+garantida\\b",\n    r"\\bpreservar\\s+a\\s+qualidade\\b",\n    r"\\bevitar?\\s+acidentes?\\b",\n)\n'''
          insert = needle + '''ACCESSIBILITY_CLAIM_PATTERNS = (\n    r"\\b(?:mobilidade reduzida|idos[oa]s?)\\b.{0,100}\\b(?:benefici|facilita|ideal|indicado|acess[ií]vel)\\w*\\b",\n    r"\\b(?:benefici|facilita|ideal|indicado|acess[ií]vel)\\w*\\b.{0,100}\\b(?:mobilidade reduzida|idos[oa]s?)\\b",\n)\nUNVERIFIED_INSTALLATION_PATTERNS = (\n    r"\\b(?:pode|podem|deve|devem)\\s+ser\\s+(?:instalad[oa]s?|fixad[oa]s?|montad[oa]s?)\\b",\n    r"\\b(?:instala[cç][aã]o|fixa[cç][aã]o)\\s+(?:é|e)\\s+(?:simples|f[aá]cil|vers[aá]til)\\b",\n)\nUNSOURCED_TREND_PATTERNS = (\n    r"\\btem\\s+se\\s+destacado\\b",\n    r"\\b(?:é|e)\\s+(?:uma\\s+)?op[cç][aã]o\\s+popular\\b",\n)\nCAUSAL_BENEFIT_PATTERNS = (\n    r"\\breduz\\w*\\b.{0,70}\\b(?:tempo|estresse|esfor[cç]o|movimento)\\b",\n    r"\\bmenos\\s+(?:estressante|cansativo)\\b",\n)\n'''
          if 'ACCESSIBILITY_CLAIM_PATTERNS' not in s:
              if needle not in s:
                  raise SystemExit('Bloco ABSOLUTE_CLAIM_PATTERNS não encontrado')
              s = s.replace(needle, insert)

          needle2 = '''    for pattern in ABSOLUTE_CLAIM_PATTERNS:\n        if re.search(pattern, folded, re.I):\n            reasons.append("alegacao_absoluta_de_seguranca_ou_conservacao")\n            break\n\n'''
          insert2 = needle2 + '''    for pattern in ACCESSIBILITY_CLAIM_PATTERNS:\n        if re.search(pattern, folded, re.I):\n            reasons.append("alegacao_de_acessibilidade_nao_sustentada")\n            break\n\n    for pattern in UNVERIFIED_INSTALLATION_PATTERNS:\n        if re.search(pattern, folded, re.I):\n            reasons.append("instalacao_ou_fixacao_nao_confirmada")\n            break\n\n    for pattern in UNSOURCED_TREND_PATTERNS:\n        if re.search(pattern, folded, re.I):\n            reasons.append("alegacao_de_popularidade_sem_fonte")\n            break\n\n    for pattern in CAUSAL_BENEFIT_PATTERNS:\n        if re.search(pattern, folded, re.I):\n            reasons.append("beneficio_funcional_nao_sustentado")\n            break\n\n'''
          if 'alegacao_de_acessibilidade_nao_sustentada' not in s:
              if needle2 not in s:
                  raise SystemExit('Ponto de inserção dos novos gates não encontrado')
              s = s.replace(needle2, insert2)
          q.write_text(s, encoding='utf-8')

          g = Path('radar_tech_br/src/generate_articles.py')
          s = g.read_text(encoding='utf-8')
          needle = '''- Não faça alegações absolutas de segurança, proteção, durabilidade ou conservação.\n- Use naturalmente a palavra-chave principal.\n'''
          replacement = '''- Não faça alegações absolutas de segurança, proteção, durabilidade ou conservação.\n- Não associe o produto a benefícios para idosos, pessoas com mobilidade reduzida, acessibilidade, saúde ou redução de esforço sem fonte verificável.\n- Não diga que um produto é popular, que “tem se destacado” ou faça afirmações de tendência sem fonte verificável.\n- Não presuma instalação, fixação em parede/teto, montagem, forma de apoio ou local de uso apenas pelo nome do produto; quando isso não estiver confirmado, oriente a conferir anúncio ou manual.\n- Não prometa redução de tempo, esforço, estresse ou movimentos e não deduza economia de espaço, uso vertical ou outros benefícios causais apenas a partir de uma característica do produto.\n- Descreva funcionamento específico somente quando estiver sustentado pelo contexto disponível; caso contrário, trate como critério a verificar.\n- Use naturalmente a palavra-chave principal.\n'''
          if 'Não associe o produto a benefícios para idosos' not in s:
              if needle not in s:
                  raise SystemExit('Ponto de reforço do prompt não encontrado')
              s = s.replace(needle, replacement)
          g.write_text(s, encoding='utf-8')

          t = Path('radar_tech_br/src/self_test.py')
          s = t.read_text(encoding='utf-8')
          needle = '''    fake_test = build(item(), plan(), editorial(bad="Nós testamos este produto e comprovamos o resultado."), enforce=False)\n    assert "alegacao_de_teste_nao_comprovada" in fake_test["quality"]["reasons"]\n\n'''
          insert = needle + '''    accessibility = build(item(), plan(), editorial(bad="Pessoas com mobilidade reduzida ou idosos podem se beneficiar porque o produto facilita o acesso."), enforce=False)\n    assert "alegacao_de_acessibilidade_nao_sustentada" in accessibility["quality"]["reasons"]\n\n    installation = build(item(), plan(), editorial(bad="O suporte pode ser instalado em paredes laterais do ambiente."), enforce=False)\n    assert "instalacao_ou_fixacao_nao_confirmada" in installation["quality"]["reasons"]\n\n    trend = build(item(), plan(), editorial(bad="Esse tipo de produto tem se destacado e é uma opção popular."), enforce=False)\n    assert "alegacao_de_popularidade_sem_fonte" in trend["quality"]["reasons"]\n\n    causal = build(item(), plan(), editorial(bad="A solução reduz o tempo gasto na rotina e deixa o uso menos estressante."), enforce=False)\n    assert "beneficio_funcional_nao_sustentado" in causal["quality"]["reasons"]\n\n'''
          if 'alegacao_de_acessibilidade_nao_sustentada' not in s:
              if needle not in s:
                  raise SystemExit('Ponto de inserção dos testes não encontrado')
              s = s.replace(needle, insert)
              s = s.replace('Self-test Radar Tech BR vNext: 10/10 OK', 'Self-test Radar Tech BR vNext: 14/14 OK')
          t.write_text(s, encoding='utf-8')
          PY

      - name: Validar reforço antes do commit
        run: |
          set -euo pipefail
          python -m py_compile radar_tech_br/src/*.py
          PYTHONPATH=radar_tech_br/src:src python radar_tech_br/src/self_test.py
          PYTHONPATH=radar_tech_br/src:src python radar_tech_br/src/cta_card_self_test.py
          PYTHONPATH=radar_tech_br/src:src python radar_tech_br/src/semantic_self_test.py

      - name: Commitar reforço validado
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_tech_br/src/quality_gate.py radar_tech_br/src/generate_articles.py radar_tech_br/src/self_test.py
          if git diff --cached --quiet; then
            echo "Reforço já aplicado."
            exit 0
          fi
          git commit -m "fix(radar): reforçar gates editoriais vNext"
          git pull --rebase origin main
          git push origin HEAD:main
