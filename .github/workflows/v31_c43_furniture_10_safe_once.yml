name: V31 C43 TEMP MAIN - 10 classificacoes reais com rollback R2
on:
  push:
    branches:
      - main
    paths:
      - affiliate_hub_v31/C43_CLASSIFICATION_TEN_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  apply-10-approved-evidence-only:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.run_attempt == 1
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Regressao completa antes da mudanca
        run: |
          python -m compileall -q affiliate_hub_v31
          python -m unittest discover -s affiliate_hub_v31/tests -q
          python casa_decoracao/src/self_test.py
          python oficina_garagem/src/self_test.py
          python src/editorial_cross_blog_guard_self_test.py
      - name: Revalidar candidatos a partir do snapshot REAL sem alterar
        env: &r2env
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: python -m affiliate_hub_v31.safe_reclassification --limit 10
      - name: Aplicar no maximo 10 evidencias verificadas e restaurar R2
        env: *r2env
        run: |
          python -m affiliate_hub_v31.safe_reclassification --execute --limit 10
          echo 'V31_C43_REAL_TEN_CLASSIFICATION_R2_VERIFIED_PASS'
      - name: Sincronizar sidecar universal em storage separado, sem links/posts
        env: *r2env
        run: |
          python -m affiliate_hub_v31.universal_inventory --execute
          echo 'V31_C43_REAL_SIDECAR_SYNCHRONIZED_PASS'
