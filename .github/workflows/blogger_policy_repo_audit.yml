name: Blogger — Auditoria de Políticas

on:
  workflow_dispatch:
  push:
    paths:
      - "src/blogger_policy_guard.py"
      - "src/blogger_policy_guard_self_test.py"
      - "src/blogger_policy_repo_audit.py"
      - "src/blogger_new_blog_policy_repo_audit.py"
      - "config/blogger_policy_guard.json"
      - "POLICY_BASELINE_BLOGGER_GOOGLE_2026.md"
      - "blogger_themes/**"
      - "blogger_store_clone/**"
      - "air_fryers_store/src/**"
      - "cabelos_store/src/**"
      - "blogger_product_store/src/**"
      - "eletroportateis_store/src/**"
      - "limpeza_inteligente_store/src/**"
      - "limpeza_store/src/**"
      - "ventiladores_store/src/**"
      - "ventiladores_em_foco_store/src/**"
      - "vitrine_pratica_store/src/**"
      - "blogger_stores/src/**"
      - "config/shopee_vida_pet_pratica*.json"
      - "blogger_stores/data/vida_pet_pratica_*.json"
      - ".github/workflows/*store_safe.yml"
      - ".github/workflows/*store_autonomous.yml"
      - ".github/workflows/vida_pet_pratica_acceptance_audit.yml"
      - ".github/workflows/blogger_policy_repo_audit.yml"
  schedule:
    - cron: "20 11 * * *"

permissions:
  contents: read

concurrency:
  group: blogger-policy-repo-audit
  cancel-in-progress: true

jobs:
  auditar-politicas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar Policy Guards e auditores
        run: |
          set -euo pipefail
          python -m py_compile \
            src/blogger_policy_guard.py src/blogger_policy_guard_self_test.py \
            src/blogger_policy_repo_audit.py src/blogger_new_blog_policy_repo_audit.py
      - name: Self-test Policy Guard
        run: PYTHONPATH=src python src/blogger_policy_guard_self_test.py
      - name: Auditar rede legada 18/18
        run: PYTHONPATH=src python src/blogger_policy_repo_audit.py
      - name: Auditar nova arquitetura Page-target
        run: PYTHONPATH=src python src/blogger_new_blog_policy_repo_audit.py

# AUDITOR_LEGACY_18_PLUS_NEW_BLOG_PAGE_TARGET_2026_11_02
