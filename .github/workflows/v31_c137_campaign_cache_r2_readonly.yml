name: V31 C137 — Cache afiliado por campanha R2 (somente leitura)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v31_c137_campaign_cache_r2_readonly.yml'
  workflow_dispatch:
    inputs:
      site_key:
        required: false
        type: string
        description: 'Opcional: site Blogger real registrado; vazio audita três prioritários'

permissions:
  contents: read

concurrency:
  group: v31-c137-r2-campaign-cache-readonly
  cancel-in-progress: false

jobs:
  inspect-official-r2-catalog:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar cliente R2 para GET e SQLite verificada
        run: python -m pip install 'boto3>=1.36,<2'
      - name: Testes SAFE de campanha e autorização DRAFT nula
        run: python -m unittest affiliate_hub_v31.tests.test_c137_campaign_cache_readiness -q
      - name: R2 GET da snapshot oficial + SQLite query_only
        env:
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          REQUESTED_SITE: ${{ inputs.site_key }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_SITE" ]; then
            python -m affiliate_hub_v31.campaign_cache_readiness --site-key "$REQUESTED_SITE"
          else
            python -m affiliate_hub_v31.campaign_cache_readiness
          fi
          echo 'C137: R2 GET; SQLite read-only; nenhuma conversão nem escrita CMS/D1/R2/LIVE.' >> "$GITHUB_STEP_SUMMARY"
