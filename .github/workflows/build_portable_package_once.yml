name: BUILD PORTABLE BLOGGER AUTOMATION FINAL

on:
  push:
    paths:
      - ".github/workflows/build_portable_package_once.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main atualizado
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
          fetch-depth: 1
      - name: Checkout runner validado
        uses: actions/checkout@v4
        with:
          ref: blogger-safe-ui-provisioning-v0-2
          path: runner-src
          fetch-depth: 1
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build portátil + compileall + secret scan
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python main-src/portable/build_portable_package.py \
            --main-root main-src \
            --runner-root runner-src \
            --output-dir dist
          ls -lh dist
          cat dist/Blogger_Automation_Unificado_2026-11-02_FINAL.zip.sha256.txt
      - name: Instalar requirements e testar imports/runtime sem credenciais
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/dist/Blogger_Automation_Unificado_2026-11-02_FINAL"
          python -m pip install --upgrade pip
          pip install -r "$PKG/requirements.txt"
          cd "$PKG"
          python - <<'PY'
          import importlib
          for name in (
              'googleapiclient', 'google.auth', 'google_auth_oauthlib', 'google.genai',
              'requests', 'cloudinary', 'PIL', 'playwright'
          ):
              importlib.import_module(name)
              print('IMPORT_OK', name)
          PY
          python run.py policy-test
          python run.py doctor
          cd "$PKG/local_runner"
          python - <<'PY'
          import importlib
          for name in (
              'apply_theme_safe', 'apply_theme_auto', 'backup_theme_auto',
              'run_with_cdp_resilience_v08', 'provision_new_blog_v20', 'local_service_v08'
          ):
              importlib.import_module(name)
              print('RUNNER_IMPORT_OK', name)
          PY
      - name: Upload pacote final
        uses: actions/upload-artifact@v4
        with:
          name: Blogger_Automation_Unificado_2026-11-02_FINAL
          path: |
            dist/Blogger_Automation_Unificado_2026-11-02_FINAL.zip
            dist/Blogger_Automation_Unificado_2026-11-02_FINAL.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30

# DELETE_AFTER_ARTIFACT_DOWNLOAD
