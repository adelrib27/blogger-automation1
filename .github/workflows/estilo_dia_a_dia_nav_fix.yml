name: Estilo no Dia a Dia — Correção pontual navegação Loja (manual recovery)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estilo-dia-a-dia-store-live
  cancel-in-progress: false

jobs:
  corrigir-navegacao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Corrigir âncora Ver moda sem alterar produtos
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import google.oauth2.credentials
          import googleapiclient.discovery
          from blogger_policy_guard import require_store_html_allowed

          blog_id='4830103887652146866'
          post_id='3362829797679236320'
          old='<a class="bls-btn bls-btn-main" href="#bls-calcados">Ver moda</a>'
          new='<a class="bls-btn bls-btn-main" href="#bls-moda-feminina">Ver moda</a>'
          import os
          creds=google.oauth2.credentials.Credentials(
              None,
              refresh_token=os.environ['BLOGGER_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['BLOGGER_CLIENT_ID'],
              client_secret=os.environ['BLOGGER_CLIENT_SECRET'],
          )
          service=googleapiclient.discovery.build('blogger','v3',credentials=creds,cache_discovery=False)
          post=service.posts().get(blogId=blog_id,postId=post_id).execute()
          raw=str(post.get('content') or '')
          require_store_html_allowed(raw, expected_products=20, expected_hero=12)
          if old in raw:
              raw=raw.replace(old,new,1)
              body={'title':post.get('title') or 'Loja','content':raw}
              if post.get('labels') is not None:
                  body['labels']=post.get('labels')
              service.posts().update(blogId=blog_id,postId=post_id,body=body).execute()
          elif new not in raw:
              raise SystemExit('ESTILO_NAV_FIX_FAIL: âncora esperada não encontrada')
          verify=service.posts().get(blogId=blog_id,postId=post_id).execute()
          final=str(verify.get('content') or '')
          require_store_html_allowed(final, expected_products=20, expected_hero=12)
          if new not in final or old in final:
              raise SystemExit('ESTILO_NAV_FIX_FAIL: correção não persistiu')
          if final.count('data-item-id=') != 20 or final.count('data-hero-item-id=') != 12:
              raise SystemExit('ESTILO_NAV_FIX_FAIL: contrato 20+12 alterado')
          print('ESTILO_NAV_FIX_PASS: Ver moda -> Moda Feminina; 20+12 preservado')
          PY

# MANUAL_RECOVERY_ONLY_AFTER_ONE_TIME_FIX_2026_11_02
