name: V31 LAB - Autoevolucao por evidencias SAFE

on:
  push:
    branches: [lab/v31-autoevolucao-safe-20261112]
    paths:
      - '**'
      - '!v31_master/autoevolution/reports/**'
      - '!v31_master/autoevolution/knowledge/state.json'
      - '!v31_master/autoevolution/experiments/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: v31-lab-autoevolucao-evidence-single
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/lab/v31-autoevolucao-safe-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Todas as regressoes V31, incluindo writer e autoevolucao
        run: python -m unittest discover -s v31_master/tests -v
      - name: Coletar janela paginada sem logs nem secrets de blogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python v31_master/autoevolution/engine.py \
            --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --out "v31_master/autoevolution/reports/${GITHUB_RUN_ID}.json"
      - name: Acumular tentativas e preservar historico
        run: |
          python v31_master/autoevolution/knowledge.py \
            --report "v31_master/autoevolution/reports/${GITHUB_RUN_ID}.json" \
            --state v31_master/autoevolution/knowledge/state.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v31-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            v31_master/autoevolution/reports/${{ github.run_id }}.json
            v31_master/autoevolution/knowledge/state.json
          if-no-files-found: error
          retention-days: 30

  persist:
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v31-autoevolucao-safe-20261112
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: v31-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-input
      - name: Revalidar dados com codigo confiavel antes da escrita
        run: python v31_master/autoevolution/evidence_guard.py
      - name: Commit restrito e push sem force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "v31_master/autoevolution/reports/${GITHUB_RUN_ID}.json" v31_master/autoevolution/knowledge/state.json
          python - <<'PY'
          import os, subprocess
          allowed = {f"v31_master/autoevolution/reports/{os.environ['GITHUB_RUN_ID']}.json", "v31_master/autoevolution/knowledge/state.json"}
          paths = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if not paths <= allowed:
              raise SystemExit('UNAPPROVED_STAGED_CHANGE')
          PY
          if git diff --cached --quiet; then
            echo 'EVIDENCE_ALREADY_PERSISTED'
            exit 0
          fi
          git commit -m "LAB evidence: run ${GITHUB_RUN_ID} [skip ci]"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
