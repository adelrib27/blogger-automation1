name: V31 LAB - Autoevolucao por evidencias SAFE

on:
  push:
    branches: [lab/v31-autoevolucao-safe-20261112]
    paths:
      - '**'
      - '!v31_master/autoevolution/reports/**'
      - '!v31_master/autoevolution/knowledge/state.json'
      - '!v31_master/autoevolution/experiments/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: v31-lab-autoevolucao-evidence-single
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'adelrib27/blogger-automation1' && github.event.repository.private == false && github.ref == 'refs/heads/lab/v31-autoevolucao-safe-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Todas as regressoes V31, incluindo writer e autoevolucao
        run: python -m unittest discover -s v31_master/tests -v

  persist:
    concurrency:
      group: v31-lab-state-writer
      cancel-in-progress: false
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/v31-autoevolucao-safe-20261112
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirmar que o codigo e o mesmo aprovado pelo job de testes
        run: |
          python - <<'PYCODE'
          import os, subprocess
          changes = subprocess.check_output(['git','diff','--name-only',os.environ['GITHUB_SHA'],'HEAD'],text=True).splitlines()
          def evidence(path):
              return path.startswith(('v31_master/autoevolution/reports/', 'v31_master/autoevolution/experiments/')) or path == 'v31_master/autoevolution/knowledge/state.json'
          if not all(evidence(path) for path in changes):
              raise SystemExit('UNTESTED_CONCURRENT_CODE_CHANGE')
          PYCODE
      - name: Coletar janela paginada sem logs nem secrets de blogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python v31_master/autoevolution/engine.py \
            --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --out "v31_master/autoevolution/reports/${GITHUB_RUN_ID}.json"
      - name: Acumular tentativas e preservar historico
        run: |
          python v31_master/autoevolution/knowledge.py \
            --report "v31_master/autoevolution/reports/${GITHUB_RUN_ID}.json" \
            --state v31_master/autoevolution/knowledge/state.json
      - name: Commit restrito e push sem force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "v31_master/autoevolution/reports/${GITHUB_RUN_ID}.json" v31_master/autoevolution/knowledge/state.json
          python - <<'PY'
          import os, subprocess
          allowed = {f"v31_master/autoevolution/reports/{os.environ['GITHUB_RUN_ID']}.json", "v31_master/autoevolution/knowledge/state.json"}
          paths = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if not paths <= allowed:
              raise SystemExit('UNAPPROVED_STAGED_CHANGE')
          PY
          if git diff --cached --quiet; then
            echo 'EVIDENCE_ALREADY_PERSISTED'
            exit 0
          fi
          git commit -m "LAB evidence: run ${GITHUB_RUN_ID} [skip ci]"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
