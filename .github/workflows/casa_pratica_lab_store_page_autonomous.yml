name: Casa Prática Lab — Loja Page-target LIVE Controlada

on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * *"
      timezone: "America/Recife"

permissions:
  contents: write

concurrency:
  group: casa-pratica-lab-store-live
  cancel-in-progress: false

jobs:
  atualizar-loja:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      BLOGGER_BLOG_ID: "8930870316690519385"
      BLOGGER_STORE_PAGE_ID: "7110845449177208439"
      BLOGGER_STORE_POST_ID: "7691087355641688975"
      BLOGGER_STORE_PAGE_URL: "https://casa-pratica-lab-20261102.blogspot.com/p/loja.html"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      SHOPEE_TOP_N: "180"
      CASA_PRATICA_LAB_STORE_RECENT_DAYS: "14"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar código e Policy Guard
        run: |
          set -euo pipefail
          python -m py_compile \
            src/shopee_oportunidades.py \
            src/shopee_oportunidades_v22.py \
            src/shopee_oportunidades_v23.py \
            src/blogger_policy_guard.py \
            src/blogger_policy_guard_self_test.py \
            src/criar_rascunho.py \
            radar_tech_br/src/refresh_blogger_offer_links.py \
            blogger_stores/src/conecta_achados_store.py \
            blogger_stores/src/casa_pratica_lab_store.py \
            blogger_stores/src/casa_pratica_lab_store_page.py \
            blogger_stores/src/blogger_new_blog_store_page_target.py
          PYTHONPATH=src python src/blogger_policy_guard_self_test.py

      - name: Confirmar secrets e alvo Page-target
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          test -n "$BLOGGER_CLIENT_ID"
          test -n "$BLOGGER_CLIENT_SECRET"
          test -n "$BLOGGER_REFRESH_TOKEN"
          test "$SHOPEE_APP_ID" = "18352820579"
          test "$BLOGGER_BLOG_ID" = "8930870316690519385"
          test "$BLOGGER_STORE_PAGE_ID" = "7110845449177208439"
          test "$BLOGGER_STORE_POST_ID" = "7691087355641688975"
          test "$BLOGGER_STORE_PAGE_URL" = "https://casa-pratica-lab-20261102.blogspot.com/p/loja.html"

      - name: Gerar seleção SAFE fresca
        run: PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_store_page.py safe

      - name: Validar Policy Guard pré-LIVE
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_store_page.py validate
          PYTHONPATH=src:blogger_stores/src python - <<'PY'
          import json
          from pathlib import Path
          from blogger_policy_guard import require_product_allowed
          data=json.loads(Path('blogger_stores/data/casa_pratica_lab_selection.json').read_text(encoding='utf-8'))
          products=[p for values in (data.get('categories') or {}).values() for p in values]
          if len(products) != 20: raise SystemExit(f'Policy Guard: {len(products)}/20')
          for product in products: require_product_allowed(product)
          print('BLOGGER_POLICY_GUARD_PRELIVE_PASS: 20/20')
          PY

      - name: Dry-runs com staging DRAFT
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_store_page.py identity-dry-run
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_store_page.py store-dry-run
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_store_page.py hero-dry-run
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py sync-dry-run

      - name: Atualizar staging, sincronizar Page e voltar staging a DRAFT
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_store_page.py store-live
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_store_page.py hero-live
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_store_page.py identity-live
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py sync-live
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py ensure-staging-draft
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py verify-page

      - name: Verificar Page LOJA pública 20+12 + Policy Guard
        run: |
          set -euo pipefail
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36"
          ok=0
          for attempt in $(seq 1 12); do
            code=$(curl -L -sS --max-time 40 -A "$ua" -H "Cache-Control: no-cache" -o /tmp/lab-page.html -w "%{http_code}" "${BLOGGER_STORE_PAGE_URL}?m=1&verify=${GITHUB_RUN_ID}-${attempt}" || true)
            echo "PUBLIC_PAGE_HTTP_${attempt}: ${code}"
            if [ "$code" = "429" ]; then sleep 15; continue; fi
            if [ "$code" != "200" ]; then sleep 10; continue; fi
            store=$(python -c "print(open('/tmp/lab-page.html',encoding='utf-8',errors='ignore').read().count('data-item-id='))")
            hero=$(python -c "print(open('/tmp/lab-page.html',encoding='utf-8',errors='ignore').read().count('data-hero-item-id='))")
            echo "PUBLIC_PAGE_COUNTS: store=${store} hero=${hero}"
            if [ "$store" -eq 20 ] && [ "$hero" -eq 12 ]; then ok=1; break; fi
            sleep 10
          done
          test "$ok" -eq 1
          PYTHONPATH=src python - <<'PY'
          from blogger_policy_guard import require_store_html_allowed
          raw=open('/tmp/lab-page.html',encoding='utf-8',errors='ignore').read()
          require_store_html_allowed(raw,expected_products=20,expected_hero=12)
          required=['bls-casa-organizacao','bls-cozinha-eletroportateis','bls-iluminacao-decoracao','bls-clima-conforto','bls-utilidades-rotina']
          missing=[x for x in required if x not in raw]
          if missing: raise SystemExit(missing)
          print('BLOGGER_POLICY_GUARD_PUBLIC_PAGE_PASS: 20+12')
          PY

      - name: Verificar home editorial e imagens dos 3 artigos
        run: |
          set -euo pipefail
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36"
          curl -L -sS --max-time 40 -A "$ua" -H "Cache-Control: no-cache" -o /tmp/lab-home.html "https://casa-pratica-lab-20261102.blogspot.com/?m=1&home=${GITHUB_RUN_ID}"
          ! grep -q '/2026/11/loja.html' /tmp/lab-home.html
          for slug in como-organizar-uma-cozinha-pequena-sem air-fryer-7-pontos-para-conferir-antes ventilador-ou-climatizador-qual-faz; do
            grep -q "/2026/11/${slug}.html" /tmp/lab-home.html
            curl -L -sS --max-time 40 -A "$ua" -o "/tmp/${slug}.html" "https://casa-pratica-lab-20261102.blogspot.com/2026/11/${slug}.html?img=${GITHUB_RUN_ID}"
            grep -q 'post-hero' "/tmp/${slug}.html"
          done
          echo 'CASA_PRATICA_LAB_HOME_EDITORIAL_PASS: Store staging fora da home; 3/3 artigos com imagem.'

      - name: Persistir rotação somente após PASS público completo
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_store_page.py persist
          if [ -z "$(git status --porcelain -- blogger_stores/data/casa_pratica_lab_selection.json blogger_stores/data/casa_pratica_lab_rotation.json)" ]; then
            echo "Sem mudanças de estado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogger_stores/data/casa_pratica_lab_selection.json blogger_stores/data/casa_pratica_lab_rotation.json
          git commit -m "Atualizar rotação Page-target da Loja Casa Prática Lab"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casa-pratica-lab-page-target-${{ github.run_number }}
          path: |
            blogger_stores/data/casa_pratica_lab_selection.json
            blogger_stores/data/casa_pratica_lab_rotation.json
            blogger_stores/data/casa_pratica_lab_scan/
            /tmp/lab-page.html
            /tmp/lab-home.html
          if-no-files-found: warn
          retention-days: 14

# CASA_PRATICA_LAB_PAGE_TARGET_CANONICAL_2026_11_02
# NEW_BLOG_STORE_CONTRACT_PAGE_20X12_STAGING_POST_DRAFT
# SCHEDULE_VALIDATED_10_20_AMERICA_RECIFE
