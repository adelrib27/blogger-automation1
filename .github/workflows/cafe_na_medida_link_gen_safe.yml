name: V31 Cafe na Medida - Gerar 4 Links Shopee SAFE
on:
  push:
    branches: [feat/cafe-na-medida-shopee-safe-20261110]
    paths:
      - "cafe_na_medida/generate_article_links_safe.py"
      - ".github/workflows/cafe_na_medida_link_gen_safe.yml"
  pull_request:
    paths:
      - "cafe_na_medida/generate_article_links_safe.py"
      - ".github/workflows/cafe_na_medida_link_gen_safe.yml"
permissions:
  contents: read
concurrency:
  group: v31-cafe-shortlinks-safe
  cancel-in-progress: false
jobs:
  gerar-links-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar sintaxe e alvos sem rede
        env:
          PYTHONPATH: src:radar_tech_br/src
        run: |
          python -m py_compile cafe_na_medida/generate_article_links_safe.py radar_tech_br/src/refresh_blogger_offer_links.py
          python cafe_na_medida/generate_article_links_safe.py --self-test
      - name: Solicitar quatro shortLinks reais na Shopee sem escrita Blogger
        if: github.event_name == 'push'
        env:
          PYTHONPATH: src:radar_tech_br/src
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          python -u cafe_na_medida/generate_article_links_safe.py
