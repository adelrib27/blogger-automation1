name: Radar Tech BR — WordPress Rascunho Seguro

on:
  workflow_dispatch:
    inputs:
      produto_teste:
        description: "Opcional: trecho do nome do produto para bloquear neste teste"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: radar-tech-br-wordpress-rascunho
  cancel-in-progress: false

jobs:
  gerar-rascunho-wordpress:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests cloudinary pillow

      - name: Verificar sintaxe Python
        run: python -m compileall -q src

      - name: Configurar produto de teste opcional
        env:
          DISPATCH_PRODUCT: ${{ github.event.inputs.produto_teste || '' }}
        run: |
          PRODUTO="$DISPATCH_PRODUCT"
          if [ -n "$PRODUTO" ]; then
            echo "RADARTECH_TEST_PRODUCT_KEYWORD=$PRODUTO" >> "$GITHUB_ENV"
            echo "Teste direcionado configurado para: $PRODUTO"
          else
            echo "Teste sem filtro de produto."
          fi

      - name: Testar conexão autenticada com WordPress
        env:
          WORDPRESS_URL: https://radartechbr.com.br
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from wordpress_api import verificar_conexao; print(verificar_conexao())"

      - name: Sincronizar publicados e rascunhos do Radar Tech BR
        env:
          WORDPRESS_URL: https://radartechbr.com.br
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
        run: python src/sincronizar_wordpress.py

      - name: Gerar artigo e criar rascunho no Radar Tech BR
        env:
          WORDPRESS_URL: https://radartechbr.com.br
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}

        run: python src/main_wordpress_teste_seguro.py

      - name: Verificar alterações no controle do WordPress
        if: success()
        id: wordpress_dados
        run: |
          if [ -n "$(git status --porcelain -- data/wordpress_historico.json data/wordpress_rascunhos.json)" ]; then
            echo "alterado=true" >> "$GITHUB_OUTPUT"
            git status --short -- data/wordpress_historico.json data/wordpress_rascunhos.json
          else
            echo "alterado=false" >> "$GITHUB_OUTPUT"
            echo "Controle do WordPress sem alterações."
          fi

      - name: Salvar controle anti-repetição do WordPress
        if: success() && steps.wordpress_dados.outputs.alterado == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wordpress_historico.json data/wordpress_rascunhos.json
          git commit -m "Atualizar controle de rascunhos do Radar Tech BR"
          git pull --rebase origin main
          git push origin HEAD:main
