name: V31 C36 TEMP — handoff universal branch tests
on:
  push:
    branches:
      - feature/v31-c36-universal-editorial-handoff-20261118
    paths:
      - affiliate_hub_v31/C36_TEST_ONCE_TRIGGER.txt
permissions:
  contents: read
jobs:
  handoff-test:
    if: github.repository == 'adelrib27/blogger-automation1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full offline regression without R2 or Shopee
        run: |
          python -m compileall -q affiliate_hub_v31
          python -m unittest discover -s affiliate_hub_v31/tests -q
          python casa_decoracao/src/self_test.py
          python oficina_garagem/src/self_test.py
          python src/editorial_cross_blog_guard_self_test.py
          echo 'V31_C36_HANDOFF_OFFLINE_REGRESSIONS_PASS'
