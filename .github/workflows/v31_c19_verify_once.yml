name: V31 C19 - Verificar FTS5 R2 + legado apos gravacao (SAFE once)

on:
  push:
    branches:
      - feature/v31-affiliate-hub-c1-safe-20261115
    paths:
      - '.github/workflows/v31_c19_verify_once.yml'

permissions:
  contents: read

concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false

jobs:
  canario-pos-indice-sem-publicar:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/feature/v31-affiliate-hub-c1-safe-20261115'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cliente R2
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Regressões do motor e indexação
        run: python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Provar FTS real no R2 restaurado
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from affiliate_hub_v31.catalog import Catalog
          from affiliate_hub_v31.r2_state import R2State,verify_database
          from affiliate_hub_v31.title_index import has_index
          with tempfile.TemporaryDirectory() as tmp:
              path=Path(tmp)/'real.sqlite3'
              assert R2State.from_env().restore_to(path)
              verify_database(path)
              with Catalog(path) as c:
                  assert has_index(c), 'fts_not_saved'
                  total=c.db.execute('SELECT COUNT(*) FROM v31_catalog_fts').fetchone()[0]
                  stats=c.stats()
                  assert total==stats['products']==203649, 'fts_count_mismatch'
                  assert stats['cached_affiliate_links']==17, 'affiliate_link_loss'
                  print('V31_C19_REAL_FTS_R2_PERSISTED_PASS')
                  print('products_indexed',total,'affiliate_links_preserved',stats['cached_affiliate_links'])
          PY
      - name: Descoberta para blog futuro com FTS real sem campanha antiga
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: python -m affiliate_hub_v31.discovery_probe
      - name: Checar reservas legadas por campanha do Wordpress
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: python -m affiliate_hub_v31.shadow_audit --site all
      - name: Radar - erro 1000 SIMULADO + R2 real, nenhum post
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: python -m affiliate_hub_v31.c9_radar_router_probe
