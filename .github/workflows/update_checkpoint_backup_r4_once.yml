name: Atualizar referência do checkpoint para backup R4 — uso único

on:
  push:
    paths:
      - ".github/workflows/update_checkpoint_backup_r4_once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Atualizar somente referência do backup no checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('CHECKPOINT_ATUAL.md')
          s=p.read_text(encoding='utf-8')
          old_ref='`BACKUP_MANIFEST_BLOGGER_AUTOMATION_2026-11-02_R3.json`'
          new_ref='`BACKUP_MANIFEST_BLOGGER_AUTOMATION_2026-11-02_R4.json`'
          old_note='> O backup R3 de 2026-11-02 foi criado antes das conclusões de Conecta Achados, Estilo no Dia a Dia, Casa em Ordem e Escolha Certa Online. Para o estado posterior ao R3, este checkpoint + inventário + rollout são a fonte operacional mais recente.'
          new_note='> O backup R4 de 2026-11-02 captura o estado consolidado após Conecta Achados, Estilo no Dia a Dia, Casa em Ordem e Escolha Certa Online: 12/18 pipelines modernos protegidos, 6 alvos restantes e Achados que Valem como próximo bloco permitido.'
          if old_ref not in s:
              raise SystemExit('CHECKPOINT_R4_PATCH_FAIL: referência R3 esperada não encontrada')
          if old_note not in s:
              raise SystemExit('CHECKPOINT_R4_PATCH_FAIL: nota R3 esperada não encontrada')
          s=s.replace(old_ref,new_ref,1).replace(old_note,new_note,1)
          p.write_text(s,encoding='utf-8',newline='\n')
          print('CHECKPOINT_R4_REFERENCE_PASS')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHECKPOINT_ATUAL.md
          git diff --cached --quiet && { echo 'Nenhuma mudança'; exit 0; }
          git commit -m "checkpoint: apontar backup operacional para R4"
          git push
