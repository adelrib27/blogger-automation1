name: Limpeza Inteligente — Loja Shopee LIVE

on:
  workflow_dispatch:
  schedule:
    - cron: "20 9 * * *"
      timezone: "America/Recife"
  push:
    paths:
      - "limpeza_inteligente_store/store_live_kickoff.txt"

permissions:
  contents: write

concurrency:
  group: limpeza-inteligente-store-live
  cancel-in-progress: false

jobs:
  atualizar-loja:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      BLOGGER_BLOG_ID: "7757953554206491487"
      BLOGGER_STORE_POST_ID: "6383277011247909539"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      BLOGGER_STORE_DRY_RUN: "false"
      BLOGGER_STORE_ITEMS_PER_CATEGORY: "4"
      BLOGGER_STORE_RECENT_DAYS: "1"
      SHOPEE_TOP_N: "70"
      SHOPEE_OPPORTUNITIES_CONFIG: limpeza_inteligente_store/config/shopee_oportunidades.json
      SHOPEE_INTENT_RULES: limpeza_inteligente_store/config/shopee_intent_rules.json
      SHOPEE_OUTPUT_DIR: limpeza_inteligente_store/data/store_shopee_scan
      SHOPEE_CATEGORY: all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validar código, Policy Guard e self-tests
        run: |
          set -euo pipefail
          python -m py_compile src/blogger_policy_guard.py src/blogger_policy_guard_self_test.py \
            limpeza_inteligente_store/src/shopee_oportunidades_limpeza.py \
            limpeza_inteligente_store/src/store_auto.py limpeza_inteligente_store/src/store_auto_post.py \
            limpeza_inteligente_store/src/store_layout_patch.py limpeza_inteligente_store/src/store_auto_self_test.py \
            limpeza_inteligente_store/src/store_hero_sync.py limpeza_inteligente_store/src/store_hero_sync_post.py \
            limpeza_inteligente_store/src/post_target_proxy.py
          PYTHONPATH=src python src/blogger_policy_guard_self_test.py
          BLOGGER_STORE_DRY_RUN=true PYTHONPATH=src:limpeza_inteligente_store/src python limpeza_inteligente_store/src/store_auto_self_test.py
      - name: Confirmar secrets obrigatórios
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"; test -n "$SHOPEE_SECRET"; test -n "$BLOGGER_CLIENT_ID"; test -n "$BLOGGER_CLIENT_SECRET"; test -n "$BLOGGER_REFRESH_TOKEN"
      - name: Pré-validar SAFE + Policy Guard
        run: |
          set -euo pipefail
          BLOGGER_STORE_DRY_RUN=true PYTHONPATH=src:limpeza_inteligente_store/src python -u limpeza_inteligente_store/src/store_auto_post.py
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from blogger_policy_guard import require_product_allowed
          data=json.loads(Path('limpeza_inteligente_store/data/store_last_selection.json').read_text(encoding='utf-8'))
          products=[p for items in (data.get('categories') or {}).values() for p in items]
          if len(products)!=20: raise SystemExit(f'Policy Guard: quantidade inválida {len(products)}/20')
          for p in products: require_product_allowed(p)
          print('BLOGGER_POLICY_GUARD_PRELIVE_PASS: 20/20')
          PY
      - name: Atualizar vitrine no POST Loja
        run: PYTHONPATH=src:limpeza_inteligente_store/src python -u limpeza_inteligente_store/src/store_auto_post.py
      - name: Sincronizar 12 cards do hero
        run: PYTHONPATH=src:limpeza_inteligente_store/src python -u limpeza_inteligente_store/src/store_hero_sync_post.py
      - name: Verificar renderização pública e políticas
        run: |
          set -euo pipefail
          base="https://limpeza-inteligente.blogspot.com/2026/11/loja.html?store_verify=${GITHUB_RUN_ID}"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -L -sS -A 'Mozilla/5.0 LimpezaStoreValidator/1.0' --max-time 40 -o /tmp/limpeza-loja.html -w '%{http_code}' "${base}-${attempt}" || echo 000)
            if [ "$code" = "200" ]; then
              read store_count hero_count < <(python - <<'PY'
          raw=open('/tmp/limpeza-loja.html',encoding='utf-8',errors='ignore').read()
          print(raw.count('data-item-id='), raw.count('data-hero-item-id='))
          PY
              )
              if [ "$store_count" -eq 20 ] && [ "$hero_count" -eq 12 ] && grep -q "bls-store-grid" /tmp/limpeza-loja.html && grep -q "blh-grid" /tmp/limpeza-loja.html; then ok=1; break; fi
            fi
            sleep $((attempt * 6))
          done
          test "$ok" -eq 1
          PYTHONPATH=src python - <<'PY'
          from blogger_policy_guard import require_store_html_allowed
          raw=open('/tmp/limpeza-loja.html',encoding='utf-8',errors='ignore').read()
          require_store_html_allowed(raw, expected_products=20, expected_hero=12)
          print('BLOGGER_POLICY_GUARD_PUBLIC_PASS')
          PY
          grep -q "Robôs Aspiradores" /tmp/limpeza-loja.html
          grep -q "Aspiradores Verticais" /tmp/limpeza-loja.html
          grep -q "Aspiradores Portáteis" /tmp/limpeza-loja.html
          grep -q "Mops &amp; Limpeza Manual\|Mops & Limpeza Manual" /tmp/limpeza-loja.html
          grep -q "Lavadoras &amp; Higienização\|Lavadoras & Higienização" /tmp/limpeza-loja.html
          grep -q "https://limpeza-inteligente.blogspot.com/p/loja.html" /tmp/limpeza-loja.html
          grep -q "grid-template-columns:minmax(0,1fr)!important" /tmp/limpeza-loja.html
          grep -q '\[id\^="PopularPosts"\]' /tmp/limpeza-loja.html
          echo "PUBLIC_PASS: Limpeza Inteligente vitrine=20 hero=12 layout e policy guard OK"
      - name: Persistir rotação somente após PASS público
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- limpeza_inteligente_store/data/store_rotation.json limpeza_inteligente_store/data/store_last_selection.json)" ]; then echo "Sem mudanças de estado."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add limpeza_inteligente_store/data/store_rotation.json limpeza_inteligente_store/data/store_last_selection.json
          git commit -m "Atualizar rotação da Loja Limpeza Inteligente"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limpeza-inteligente-store-live-${{ github.run_number }}
          path: |
            limpeza_inteligente_store/data/store_last_selection.json
            limpeza_inteligente_store/data/store_shopee_scan/
            /tmp/limpeza-loja.html
          if-no-files-found: warn
          retention-days: 14
