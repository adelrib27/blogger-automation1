name: Blogger — Auditoria SAFE do aviso europeu de cookies

on:
  workflow_dispatch:
  push:
    paths:
      - "src/blogger_eu_cookie_audit.py"
      - ".github/workflows/blogger_eu_cookie_audit_safe.yml"

permissions:
  contents: read

concurrency:
  group: blogger-eu-cookie-audit-safe
  cancel-in-progress: true

jobs:
  audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Compilar auditor
        run: python -m py_compile src/blogger_eu_cookie_audit.py

      - name: Auditar 18 blogs com gl=fr
        id: audit
        continue-on-error: true
        run: python -u src/blogger_eu_cookie_audit.py --strict

      - name: Exibir relatório resumido
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/blogger_eu_cookie_audit/report.json")
          if not path.exists():
              raise SystemExit("Relatório não foi gerado")
          report = json.loads(path.read_text(encoding="utf-8"))
          print(f"TOTAL={report['total']} PASS={report['passed']} FAIL={report['failed']}")
          for item in report["results"]:
              state = "PASS" if item["pass"] else "FAIL"
              print(
                  f"{state}\t{item['name']}\tHTTP={item['http_status']}\t"
                  f"banner={item['banner_visible']}\tdismiss={item['dismiss_visible']}\t"
                  f"dismiss_worked={item['dismiss_worked']}"
              )
          PY

      - name: Guardar screenshots e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-eu-cookie-audit-safe-${{ github.run_number }}
          path: data/blogger_eu_cookie_audit/
          if-no-files-found: error
          retention-days: 14

      - name: Falhar se houver blog sem consentimento funcional
        if: always() && steps.audit.outcome != 'success'
        run: |
          echo "Um ou mais blogs não passaram na validação do banner europeu."
          exit 1
