name: Exportar pacote validado da automação editorial

on:
  push:
    paths:
      - ".github/workflows/export_latest_package.yml"

permissions:
  contents: read

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar código-base antes de empacotar
        run: |
          set -euo pipefail
          python -m py_compile \
            src/shopee_oportunidades.py \
            src/shopee_oportunidades_v22.py \
            src/shopee_oportunidades_v23.py \
            oficina_garagem/src/audit_release_candidates.py \
            oficina_garagem/src/build_editorial_queue.py \
            oficina_garagem/src/cta_card_self_test.py \
            oficina_garagem/src/cta_context.py \
            oficina_garagem/src/editorial_normalizer.py \
            oficina_garagem/src/generate_articles.py \
            oficina_garagem/src/publish_generated.py \
            oficina_garagem/src/quality_gate.py \
            oficina_garagem/src/self_test.py \
            oficina_garagem/src/shopee_oportunidades_oficina.py \
            oficina_garagem/src/sync_drafts.py
          python oficina_garagem/src/self_test.py
          python oficina_garagem/src/cta_card_self_test.py

      - name: Montar pacote portátil sem secrets e sem estado de produção
        run: |
          set -euo pipefail
          PKG="AUTOMACAO_EDITORIAL_BASE_VALIDADA_OFICINA_2026-10-18"
          rm -rf "$PKG" "$PKG.zip"
          mkdir -p "$PKG/.github/workflows" "$PKG/oficina_garagem/src" "$PKG/oficina_garagem/config" "$PKG/src"

          cp src/shopee_oportunidades.py "$PKG/src/"
          cp src/shopee_oportunidades_v22.py "$PKG/src/"
          cp src/shopee_oportunidades_v23.py "$PKG/src/"

          cp oficina_garagem/src/*.py "$PKG/oficina_garagem/src/"
          cp oficina_garagem/config/*.json "$PKG/oficina_garagem/config/"
          cp oficina_garagem/config.json "$PKG/oficina_garagem/"
          cp oficina_garagem/automation_kickoff.txt "$PKG/oficina_garagem/"
          cp oficina_garagem/editorial_kickoff.txt "$PKG/oficina_garagem/"
          cp oficina_garagem/discovery_kickoff.txt "$PKG/oficina_garagem/"

          cp .github/workflows/oficina_editorial_autonomous.yml "$PKG/.github/workflows/"
          cp .github/workflows/oficina_editorial_safe.yml "$PKG/.github/workflows/"
          cp .github/workflows/oficina_shopee_oportunidades.yml "$PKG/.github/workflows/"

          cat > "$PKG/README_PORTABILIDADE.md" <<'EOF'
# Base validada — Automação Editorial WordPress + Shopee + Workers AI

Origem validada: Oficina & Garagem.
Objetivo deste pacote: servir como base para Radar Tech BR, Casa e Decoração e futuros blogs, preservando gates, descoberta Shopee, geração Qwen3, CTA, publicação, imagem destacada e limite diário.

## O que está incluído

- scanner Shopee compartilhado v2.3 e dependências;
- regras/configurações do Oficina usadas no teste validado;
- fila editorial, normalização, quality/safety gate e testes;
- geração com Workers AI/Qwen3;
- CTA contextual com título original do produto;
- publisher WordPress com Application Password;
- upload automático da imagem do produto e definição como featured_media antes da publicação;
- bloqueio de publicação se a imagem destacada não for confirmada;
- limite duro de 2 publicações por dia no fuso America/Sao_Paulo;
- workflows de validação segura, descoberta e automação ao vivo.

## Não incluído de propósito

- nenhum secret, token, senha ou credential;
- filas, histórico de publicação ou arquivos de estado do Oficina;
- tema WordPress do Oficina;
- conteúdo já publicado.

## Antes de usar em outro blog

Não copie em produção sem adaptação. Para cada blog, valide e ajuste no mínimo:

1. nome/pasta do projeto e prefixo das variáveis de ambiente;
2. URL do WordPress (`WP_URL`);
3. categorias e slugs (`CATEGORY_SLUGS`);
4. política editorial, regras Shopee e regressões semânticas do nicho;
5. nome dos secrets de WordPress e Cloudflare no workflow;
6. horários e quantidade diária desejados;
7. nome do projeto gravado em `publication_history.json`;
8. textos de safety gate específicos do nicho;
9. workflow seguro primeiro, com geração/publicação desligadas;
10. somente depois de todos os testes, liberar geração e publicação ao vivo.

## Secrets esperados na base atual

- `SHOPEE_APP_ID`
- `SHOPEE_SECRET`
- Cloudflare Account ID/Token (a base do Oficina reutiliza os secrets do Casa no workflow atual)
- Application Password própria do WordPress de cada blog

## Regra de migração

Use este ZIP como referência de código. Radar Tech BR e Casa e Decoração possuem estratégias editoriais próprias; portanto, substituição deve ser feita após diff e validação por blog, nunca por cópia cega.
EOF

          printf '%s\n' "$GITHUB_SHA" > "$PKG/SOURCE_COMMIT.txt"
          printf '%s\n' "Gerado em UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$PKG/BUILD_INFO.txt"
          printf '%s\n' "Validação: py_compile + self_test + cta_card_self_test executados antes do empacotamento." >> "$PKG/BUILD_INFO.txt"

          (cd "$PKG" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          zip -qr "$PKG.zip" "$PKG"
          sha256sum "$PKG.zip" > "$PKG.zip.sha256"

      - name: Guardar pacote
        uses: actions/upload-artifact@v4
        with:
          name: automacao-editorial-base-validada-oficina-2026-10-18
          path: |
            AUTOMACAO_EDITORIAL_BASE_VALIDADA_OFICINA_2026-10-18.zip
            AUTOMACAO_EDITORIAL_BASE_VALIDADA_OFICINA_2026-10-18.zip.sha256
          if-no-files-found: error
          retention-days: 30
