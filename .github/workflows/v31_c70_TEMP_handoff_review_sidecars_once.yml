name: V31 C70 TEMP — completar handoff privado apenas REVIEW_REQUIRED
on:
  push:
    paths:
      - '.github/workflows/v31_c70_TEMP_handoff_review_sidecars_once.yml'
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  private-review-handoff-once:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'test(v31-c70): salvar UMA VEZ envelopes privados REVIEW_REQUIRED e verificar leitura'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cliente R2
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Gate offline C70 antes de sidecars
        run: python -m unittest affiliate_hub_v31.tests.test_c70_handoff_continuous affiliate_hub_v31.tests.test_handoff_storage -q
      - name: Gravar apenas dois envelopes REVIEW_REQUIRED e conferir readback, zero publicacoes
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from affiliate_hub_v31.handoff_dispatch import dispatch
          from affiliate_hub_v31.handoff_storage import read_private_handoff
          from affiliate_hub_v31.r2_state import R2State
          from affiliate_hub_v31.site_request_queue import load_requests
          expected = {"blogger_moveis_para_cada_canto", "wordpress_casa_decoracao"}
          requests = load_requests()
          if {r["site_key"] for r in requests} != expected:
              raise SystemExit("C70_SITE_REQUEST_SET_CHANGED_FAIL_CLOSED")
          storage = R2State.from_env()
          result = dispatch(storage, execute=True)
          if (result["requests_evaluated"] != 2 or
                  result["private_envelopes_saved"] != 2 or
                  result["publication_calls"] != 0 or
                  result["catalog_r2_writes"] != 0):
              raise SystemExit("C70_REVIEW_HANDOFF_MUTATION_GATE_FAILED")
          total_review = 0
          for req in requests:
              read = read_private_handoff(storage, site_key=req["site_key"])
              if (read.get("site_key") != req["site_key"] or
                      read.get("status") != "REVIEW_REQUIRED" or
                      read.get("publication_allowed") is not False):
                  raise SystemExit("C70_REVIEW_HANDOFF_READBACK_BLOCKED")
              total_review += len(read["jobs"])
          if total_review != result["ready_review_jobs"]:
              raise SystemExit("C70_PRIVATE_ENVELOPES_COUNT_MISMATCH")
          print("V31_C70_PRIVATE_REVIEW_HANDOFF_READBACK_PASS")
          print(json.dumps({"requests_evaluated": 2,
                            "private_envelopes_saved": 2,
                            "ready_review_jobs": total_review,
                            "publication_calls": 0,
                            "catalog_r2_writes": 0,
                            "shopee_mutation_attempts": 0}, sort_keys=True))
          PY
