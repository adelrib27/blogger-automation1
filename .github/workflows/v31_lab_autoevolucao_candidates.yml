name: V31 JARVIS - Receitas offline sem API paga

on:
  push:
    branches: [lab/v31-autoevolucao-safe-20261112]
    paths:
      - 'v31_master/**'
      - '.github/workflows/v31_lab_autoevolucao_candidates.yml'
      - '!v31_master/autoevolution/reports/**'
      - '!v31_master/autoevolution/knowledge/**'
      - '!v31_master/autoevolution/experiments/**'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: v31-jarvis-candidates
  cancel-in-progress: false

jobs:
  prepare:
    # Standard runner on a public repo only; no model keys, artifacts, cache or paid runners.
    if: github.repository == 'adelrib27/blogger-automation1' && github.event.repository.private == false && github.ref == 'refs/heads/lab/v31-autoevolucao-safe-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.proposal.outputs.ready }}
      status: ${{ steps.proposal.outputs.status }}
      context_key: ${{ steps.proposal.outputs.context_key }}
      package: ${{ steps.transfer.outputs.package }}
      verified: ${{ steps.verify.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regressoes da engenharia existente
        run: python -m unittest discover -s v31_master/tests -v
      - name: Gerar candidato apenas de receita revisada, sem rede ou LLM
        id: proposal
        run: python v31_master/autoevolution/offline.py
      - name: Baseline, regressao vermelha e suite verde em sandbox
        id: verify
        if: steps.proposal.outputs.ready == 'true'
        run: python v31_master/autoevolution/verify_candidate.py
      - name: Transferir prova por output, sem armazenamento de artifacts
        id: transfer
        if: steps.proposal.outputs.ready == 'true' && steps.verify.outcome == 'success'
        run: python v31_master/autoevolution/transfer.py export

  publish:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.verified == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Receber pacote sem executar nenhum conteudo
        env:
          VERIFIED_PACKAGE: ${{ needs.prepare.outputs.package }}
        run: python v31_master/autoevolution/transfer.py import
      - name: Revalidar hashes e criar candidato para revisao no LAB
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python v31_master/autoevolution/publish_candidate.py

  record-outcome:
    concurrency:
      group: v31-lab-state-writer
      cancel-in-progress: false
    needs: [prepare, publish]
    if: always() && github.repository == 'adelrib27/blogger-automation1' && github.event.repository.private == false && github.ref == 'refs/heads/lab/v31-autoevolucao-safe-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guardar aprendizado sem artifacts nem chamadas de IA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULT_PROPOSE: ${{ needs.prepare.result }}
          RESULT_VERIFY: ${{ needs.prepare.outputs.verified || 'skipped' }}
          RESULT_PUBLISH: ${{ needs.publish.result }}
          RESULT_SANDBOX: ${{ needs.prepare.outputs.verified || 'skipped' }}
          PROPOSAL_STATUS: ${{ needs.prepare.outputs.status || 'UNAVAILABLE' }}
          CONTEXT_KEY: ${{ needs.prepare.outputs.context_key }}
        run: python v31_master/autoevolution/feedback.py
