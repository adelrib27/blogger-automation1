name: Casa e Decoração — Shopee Oportunidades Manual v3

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Categoria (all, Decoracao, Organizacao, Sala, Quarto, Cozinha, Banheiro, Area Externa, Cama Mesa Banho)"
        required: false
        default: "all"
      top_n:
        description: "Quantidade final de oportunidades"
        required: false
        default: "32"

permissions:
  contents: read

jobs:
  ranking-casa-decoracao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      SHOPEE_CATEGORY: ${{ inputs.category }}
      SHOPEE_TOP_N: ${{ inputs.top_n }}
      SHOPEE_OPPORTUNITIES_CONFIG: casa_decoracao/config/shopee_oportunidades.json
      SHOPEE_INTENT_RULES: casa_decoracao/config/shopee_intent_rules.json
      SHOPEE_OUTPUT_DIR: casa_decoracao/data/shopee_oportunidades
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar scanner
        run: python -m py_compile src/shopee_oportunidades.py src/shopee_oportunidades_v22.py src/shopee_oportunidades_v23.py casa_decoracao/src/shopee_oportunidades_casa.py
      - name: Gerar ranking
        run: python -u casa_decoracao/src/shopee_oportunidades_casa.py
      - name: Guardar ranking
        uses: actions/upload-artifact@v4
        with:
          name: casa-decoracao-shopee-v3-${{ github.run_number }}
          path: casa_decoracao/data/shopee_oportunidades/
          if-no-files-found: error
          retention-days: 14
