name: V31 LAB - Ponte diaria Shopee (main agenda, LAB executa)

# Este workflow nao executa nem dispara jobs externos.
# O destino Blogger 4739187376492839837 integra a denylist oficial de 24 IDs.
# Sem schedule, push, POST de workflow_dispatch, credenciais ou permissions actions:write.
# O arquivo e o nome existentes permanecem intocados na estrutura do repositorio.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bloquear-destino-inelegivel:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Nenhuma operacao e autorizada para o destino excluido
        run: echo 'V31_LAB_INELIGIBLE_BLOGGER_BLOCKED'
