name: V31 LAB - Ponte diaria Shopee (main agenda, LAB executa)

on:
  # 13:17 UTC = 10:17 America/Recife. GitHub executa schedule na branch padrao.
  schedule:
    - cron: '17 13 * * *'
  # Apenas no primeiro deploy ou mudanca nesta ponte: PROBE sem Shopee/PUT.
  push:
    branches: [main]
    paths:
      - .github/workflows/v31_lab_daily_autonomous_dispatch.yml
  # Registra o workflow na main para dispatch API direcionado a outra branch.
  workflow_dispatch:
    inputs:
      origin:
        required: true
        type: choice
        options:
          - MAIN_DEPLOY_PROBE_ONLY
          - MAIN_SCHEDULE_LAB_ONLY

permissions:
  contents: read
  actions: write

concurrency:
  group: v31-lab-main-daily-dispatch-single
  cancel-in-progress: false

jobs:
  chamar-somente-workflow-v31-na-branch-lab:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      V31_TARGET_REF: lab/v31r1-shopee-safe-20261103
    steps:
      - name: Validar evento e identidade
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'adelrib27/blogger-automation1'
          test "$GITHUB_REF" = 'refs/heads/main'
          test -n "$GH_TOKEN"
          test "$GITHUB_EVENT_NAME" = 'push' -o "$GITHUB_EVENT_NAME" = 'schedule'
      - name: Disparar workflow LAB sem acessar tokens comerciais
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            origin='MAIN_DEPLOY_PROBE_ONLY'
          else
            origin='MAIN_SCHEDULE_LAB_ONLY'
          fi
          body=$(printf '{"ref":"%s","inputs":{"origin":"%s"}}' "$V31_TARGET_REF" "$origin")
          response_code=$(curl --silent --show-error --retry 0 --max-time 35 \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$body" \
            'https://api.github.com/repos/adelrib27/blogger-automation1/actions/workflows/v31_lab_daily_autonomous_dispatch.yml/dispatches')
          test "$response_code" = '204'
          echo "V31_MAIN_DISPATCH_ACCEPTED; origin=$origin; lab_ref=$V31_TARGET_REF; no_blogger_put_in_main=true"
