name: "V31 C92 - Midea 9000 exact single conversion"
on:
  push:
    branches: [main]
    paths: [".github/workflows/v31_c92_arcond_midea_9k_convert_once.yml"]
permissions: {contents: read}
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  convert-exact-9k:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Revalidar Midea 9000 na Shopee e usar 1 slot do D1 se existir
        env:
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
          V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
          V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
          V31_D1_SAFE_WRITES_ENABLED: V31_D1_SAFE_SQL_ONLY
        run: |
          python - <<'PY'
          import os,json,time,urllib.request
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from affiliate_hub_v31.shopee_probe import authorization,ENDPOINT
          from affiliate_hub_v31.converter import generate_shortlink,valid_campaign
          from affiliate_hub_v31.d1_http_runner import CloudflareD1HTTPRunner
          campaign="arcondicionadosemduvidas"
          product="shopee:1736335904:58267891881"
          expected="https://shopee.com.br/product/1736335904/58267891881"
          a=os.environ.get("V31_EDITORIAL_SHOPEE_APP_ID","");s=os.environ.get("V31_EDITORIAL_SHOPEE_APP_SECRET","")
          if not a or not s:raise SystemExit("C92_MIDEA_NO_CREDENTIALS")
          valid_campaign(campaign)
          query='query C92Midea9000Confirm { productOfferV2(itemId:58267891881,page:1,limit:5) { nodes { itemId shopId productName productLink imageUrl offerLink priceMin periodEndTime } } }'
          body=json.dumps({"query":query,"operationName":"C92Midea9000Confirm"},separators=(",",":"))
          req=urllib.request.Request(ENDPOINT,data=body.encode(),method="POST",headers={
            "Authorization":authorization(a,s,body,int(time.time())),"Content-Type":"application/json","Accept":"application/json","User-Agent":"V31-C92-Midea9000-Once/1.0"})
          try:
            with urllib.request.urlopen(req,timeout=24) as resp:
              raw=resp.read(131073)
              if resp.status!=200 or len(raw)>131072:raise ValueError("bad_response")
            obj=json.loads(raw)
          except Exception:
            raise SystemExit("C92_MIDEA_READ_FAIL_CLOSED") from None
          if obj.get("errors"):raise SystemExit("C92_MIDEA_GRAPHQL_FAIL")
          nodes=((obj.get("data")or{}).get("productOfferV2")or{}).get("nodes")or[]
          matches=[n for n in nodes if str(n.get("shopId"))=="1736335904" and str(n.get("itemId"))=="58267891881"]
          if len(matches)!=1:raise SystemExit("C92_MIDEA_IDENTITY_UNCONFIRMED")
          n=matches[0];name=str(n.get("productName")or"").lower()
          try:price=float(n.get("priceMin")or0)
          except Exception:price=0
          if n.get("productLink")!=expected or not all(x in name for x in ("midea","9000","inverter")) or price<=0:
            raise SystemExit("C92_MIDEA_PRODUCT_NOT_MATCHED")
          img=str(n.get("imageUrl")or"")
          if urlsplit(img).scheme!="https" or urlsplit(img).hostname not in ("cf.shopee.com.br","down-br.img.susercontent.com"):
            raise SystemExit("C92_MIDEA_PHOTO_NOT_TRUSTED")
          end=n.get("periodEndTime")
          if end and int(end)<int(time.time()):raise SystemExit("C92_MIDEA_EXPIRED")
          print("C92_MIDEA_OFFER_ELIGIBLE_STOCK_NOT_GUARANTEED")
          try:
            db=CloudflareD1HTTPRunner.from_environment(allow_mutations=True)
            day=datetime.now(timezone.utc).date().isoformat()
            prev=db("SELECT day_utc,slot FROM v31_shopee_conversion_attempts WHERE campaign=? AND product_key=? LIMIT 1",(campaign,product))
            if prev:raise SystemExit("C92_MIDEA_ALREADY_ATTEMPTED_NO_RETRY")
            rows=db("""
              INSERT INTO v31_shopee_conversion_attempts(day_utc,slot,campaign,product_key)
              SELECT ?,COALESCE(MAX(slot),0)+1,?,?
              FROM v31_shopee_conversion_attempts WHERE day_utc=?
              HAVING COALESCE(MAX(slot),0)<3
              AND NOT EXISTS(SELECT 1 FROM v31_shopee_conversion_attempts WHERE campaign=? AND product_key=?)
              ON CONFLICT DO NOTHING
              RETURNING slot
            """,(day,campaign,product,day,campaign,product))
          except SystemExit:raise
          except Exception:raise SystemExit("C92_MIDEA_D1_RESERVATION_FAILED") from None
          if len(rows)!=1:raise SystemExit("C92_MIDEA_GLOBAL_QUOTA_OR_DUP_DENIED")
          print("C92_MIDEA_RESERVED_SLOT="+str(rows[0]["slot"]))
          try:short=generate_shortlink(expected,campaign,a,s)
          except Exception:raise SystemExit("C92_MIDEA_CONVERSION_UNCERTAIN_DO_NOT_RETRY") from None
          if urlsplit(short).scheme!="https" or urlsplit(short).hostname not in ("s.shopee.com.br","shope.ee"):
            raise SystemExit("C92_MIDEA_BAD_SHORTLINK")
          print("C92_MIDEA_SHORTLINK="+short)
          print("C92_MIDEA_PRODUCT_KEY="+product)
          print("C92_MIDEA_API_IMAGE="+img)
          print("C92_MIDEA_CONVERSION_PASS")
          PY
