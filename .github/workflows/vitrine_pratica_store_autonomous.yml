name: Vitrine Prática — Loja Shopee LIVE Controlada

on:
  workflow_dispatch:
  schedule:
    - cron: "35 8 * * *"
      timezone: "America/Recife"
  push:
    paths:
      - "vitrine_pratica_store/store_live_kickoff.txt"

permissions:
  contents: write

concurrency:
  group: vitrine-pratica-store-live
  cancel-in-progress: false

jobs:
  atualizar-loja:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      BLOGGER_BLOG_ID: "9144338307944682868"
      BLOGGER_STORE_POST_ID: "115613719594316807"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      BLOGGER_STORE_DRY_RUN: "false"
      BLOGGER_STORE_ITEMS_PER_CATEGORY: "4"
      BLOGGER_STORE_RECENT_DAYS: "1"
      SHOPEE_TOP_N: "50"
      SHOPEE_OPPORTUNITIES_CONFIG: vitrine_pratica_store/config/shopee_oportunidades.json
      SHOPEE_INTENT_RULES: vitrine_pratica_store/config/shopee_intent_rules.json
      SHOPEE_OUTPUT_DIR: vitrine_pratica_store/data/store_shopee_scan
      SHOPEE_CATEGORY: all

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validar código, Policy Guard e self-tests antes da publicação
        run: |
          set -euo pipefail
          python -m py_compile \
            src/blogger_policy_guard.py \
            src/blogger_policy_guard_self_test.py \
            src/criar_rascunho.py \
            src/shopee_oportunidades.py \
            src/shopee_oportunidades_v22.py \
            src/shopee_oportunidades_v23.py \
            vitrine_pratica_store/src/shopee_oportunidades_vitrine_pratica.py \
            vitrine_pratica_store/src/store_auto.py \
            vitrine_pratica_store/src/store_auto_post.py \
            vitrine_pratica_store/src/store_layout_patch.py \
            vitrine_pratica_store/src/store_auto_self_test.py \
            vitrine_pratica_store/src/store_hero_sync.py \
            vitrine_pratica_store/src/store_hero_sync_post.py \
            vitrine_pratica_store/src/post_target_proxy.py
          PYTHONPATH=src python src/blogger_policy_guard_self_test.py
          BLOGGER_STORE_DRY_RUN=true PYTHONPATH=src:vitrine_pratica_store/src python vitrine_pratica_store/src/store_auto_self_test.py
      - name: Confirmar secrets obrigatórios
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          test -n "$BLOGGER_CLIENT_ID"
          test -n "$BLOGGER_CLIENT_SECRET"
          test -n "$BLOGGER_REFRESH_TOKEN"
      - name: Pré-validar SAFE + Policy Guard
        run: |
          set -euo pipefail
          BLOGGER_STORE_DRY_RUN=true PYTHONPATH=src:vitrine_pratica_store/src python -u vitrine_pratica_store/src/store_auto_post.py
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from blogger_policy_guard import require_product_allowed

          data = json.loads(Path('vitrine_pratica_store/data/store_last_selection.json').read_text(encoding='utf-8'))
          products = [p for items in (data.get('categories') or {}).values() for p in items]
          if len(products) != 20:
              raise SystemExit(f'Policy Guard: quantidade inválida {len(products)}/20')
          for product in products:
              require_product_allowed(product)
          print('BLOGGER_POLICY_GUARD_PRELIVE_PASS: 20/20 produtos permitidos')
          PY
      - name: Atualizar vitrine no post Loja com Shopee API
        run: PYTHONPATH=src:vitrine_pratica_store/src python -u vitrine_pratica_store/src/store_auto_post.py
      - name: Sincronizar mini-cards do carrossel no post Loja
        run: PYTHONPATH=src:vitrine_pratica_store/src python -u vitrine_pratica_store/src/store_hero_sync_post.py
      - name: Aplicar correção final de layout e link LOJA
        run: PYTHONPATH=src:vitrine_pratica_store/src python -u vitrine_pratica_store/src/store_layout_patch.py
      - name: Verificar renderização pública + Policy Guard central
        run: |
          set -euo pipefail
          ok=0
          url="https://vitrine-pratica.blogspot.com/2026/11/loja.html"
          for attempt in 1 2 3 4 5 6; do
            if ! curl -L -fsS --max-time 40 "${url}?store_verify=${GITHUB_RUN_ID}-${attempt}" > /tmp/vitrine-pratica-loja.html; then
              echo "Tentativa ${attempt}: curl falhou; aguardando propagação."
              sleep 5
              continue
            fi
            store_count=$(python -c "print(open('/tmp/vitrine-pratica-loja.html', encoding='utf-8', errors='ignore').read().count('data-item-id='))")
            hero_count=$(python -c "print(open('/tmp/vitrine-pratica-loja.html', encoding='utf-8', errors='ignore').read().count('data-hero-item-id='))")
            if grep -q "bls-store-grid" /tmp/vitrine-pratica-loja.html && grep -q "blh-grid" /tmp/vitrine-pratica-loja.html && grep -q "blogger-liq-layout-wide-css" /tmp/vitrine-pratica-loja.html && grep -q "https://vitrine-pratica.blogspot.com/p/loja.html" /tmp/vitrine-pratica-loja.html && ! grep -q "liquidificadores-em-foco.blogspot.com/p/loja.html" /tmp/vitrine-pratica-loja.html && [ "$store_count" -eq 20 ] && [ "$hero_count" -eq 12 ]; then
              ok=1
              break
            fi
            echo "Tentativa ${attempt}: vitrine=${store_count}/20 hero=${hero_count}/12; aguardando propagação/identidade."
            sleep 5
          done
          test "$ok" -eq 1
          PYTHONPATH=src python - <<'PY'
          from blogger_policy_guard import require_store_html_allowed

          raw = open('/tmp/vitrine-pratica-loja.html', encoding='utf-8', errors='ignore').read()
          require_store_html_allowed(raw, expected_products=20, expected_hero=12)
          if 'https://vitrine-pratica.blogspot.com/p/loja.html' not in raw:
              raise SystemExit('Vitrine identity: URL /p/loja.html correta ausente')
          if 'liquidificadores-em-foco.blogspot.com/p/loja.html' in raw:
              raise SystemExit('Vitrine identity: domínio legado de Liquidificadores ainda presente')
          print('BLOGGER_POLICY_GUARD_PUBLIC_PASS: 20 products + 12 hero')
          print('VITRINE_IDENTITY_PUBLIC_PASS: domínio e link LOJA corretos')
          PY
          echo "Renderização pública confirmada: layout amplo + 20 cards da vitrine + 12 mini-cards no carrossel + Policy Guard central + identidade Vitrine correta."
      - name: Persistir estado da rotação somente após validação pública
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- vitrine_pratica_store/data/store_rotation.json vitrine_pratica_store/data/store_last_selection.json)" ]; then
            echo "Sem mudanças de estado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitrine_pratica_store/data/store_rotation.json vitrine_pratica_store/data/store_last_selection.json
          git commit -m "Atualizar rotação automática da Loja Vitrine Prática"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitrine-pratica-store-live-${{ github.run_number }}
          path: |
            vitrine_pratica_store/data/store_last_selection.json
            vitrine_pratica_store/data/store_shopee_scan/
            /tmp/vitrine-pratica-loja.html
          if-no-files-found: warn
          retention-days: 14

# POLICY_GUARD_CENTRAL_VITRINE_PRATICA_2026_11_01
