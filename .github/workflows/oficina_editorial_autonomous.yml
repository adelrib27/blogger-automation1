name: Oficina & Garagem — Editorial Autônomo 2x/dia

on:
  workflow_dispatch:
  push:
    paths:
      - "oficina_garagem/automation_kickoff.txt"
  schedule:
    - cron: "7 12 * * *"
    - cron: "7 21 * * *"

permissions:
  contents: write

concurrency:
  group: oficina-garagem-editorial-autonomo
  cancel-in-progress: false

jobs:
  publicar-um-slot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      SHOPEE_CATEGORY: all
      SHOPEE_TOP_N: "30"
      SHOPEE_OPPORTUNITIES_CONFIG: oficina_garagem/config/shopee_oportunidades.json
      SHOPEE_INTENT_RULES: oficina_garagem/config/shopee_intent_rules.json
      SHOPEE_OUTPUT_DIR: oficina_garagem/data/shopee_oportunidades
      OFICINA_CLOUDFLARE_ACCOUNT_ID: "b1515400afe32581994c4d3f038f835f"
      OFICINA_CLOUDFLARE_API_TOKEN: ${{ secrets.OFICINA_CLOUDFLARE_API_TOKEN }}
      OFICINA_WORDPRESS_USERNAME: "admin"
      OFICINA_WORDPRESS_APP_PASSWORD: ${{ secrets.OFICINA_WORDPRESS_APP_PASSWORD }}
      OFICINA_AI_MODEL: "@cf/qwen/qwen3-30b-a3b-fp8"
      OFICINA_GENERATION_ENABLED: "true"
      OFICINA_GENERATION_BATCH_SIZE: "1"
      OFICINA_GENERATION_BODY_ATTEMPTS: "3"
      OFICINA_CTA_ATTEMPTS: "2"
      OFICINA_LIVE_PUBLISH_ENABLED: "true"
      OFICINA_WORDPRESS_STATUS: "publish"
      OFICINA_PUBLISH_LIMIT: "1"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirmar credenciais exclusivas do Oficina
        run: |
          test -n "$SHOPEE_APP_ID" || (echo "SHOPEE_APP_ID ausente" >&2; exit 1)
          test -n "$SHOPEE_SECRET" || (echo "SHOPEE_SECRET ausente" >&2; exit 1)
          test -n "$OFICINA_CLOUDFLARE_API_TOKEN" || (echo "OFICINA_CLOUDFLARE_API_TOKEN ausente" >&2; exit 1)
          test -n "$OFICINA_WORDPRESS_APP_PASSWORD" || (echo "OFICINA_WORDPRESS_APP_PASSWORD ausente" >&2; exit 1)

      - name: Validar sintaxe e gates universais
        run: |
          python -m py_compile src/shopee_oportunidades.py src/shopee_oportunidades_v22.py src/shopee_oportunidades_v23.py
          python -m py_compile oficina_garagem/src/shopee_oportunidades_oficina.py oficina_garagem/src/build_editorial_queue.py oficina_garagem/src/quality_gate.py oficina_garagem/src/cta_context.py oficina_garagem/src/editorial_normalizer.py oficina_garagem/src/generate_articles.py oficina_garagem/src/publish_generated.py oficina_garagem/src/self_test.py oficina_garagem/src/cta_card_self_test.py
          python oficina_garagem/src/self_test.py
          python oficina_garagem/src/cta_card_self_test.py

      - name: Validar autenticação WordPress do Oficina
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "oficina_garagem/src")
          from publish_generated import request
          me = request("GET", "/wp/v2/users/me?context=edit")
          if not int(me.get("id") or 0):
              raise SystemExit("WordPress não confirmou usuário autenticado")
          print("WordPress Oficina autenticado.")
          PY

      - name: Descobrir oportunidades reais na Shopee
        run: python -u oficina_garagem/src/shopee_oportunidades_oficina.py

      - name: Montar fila sem repetir produtos já publicados
        run: python -u oficina_garagem/src/build_editorial_queue.py

      - name: Gerar um artigo com Qwen3 e gates
        run: python -u oficina_garagem/src/generate_articles.py

      - name: Publicar somente candidato DRAFT_READY
        run: python -u oficina_garagem/src/publish_generated.py

      - name: Auditar estado final
        if: always()
        run: python -u oficina_garagem/src/audit_release_candidates.py || true

      - name: Verificar saúde pública do Oficina
        if: always()
        run: |
          mkdir -p oficina_garagem/data
          if curl -fsS --max-time 30 https://oficina.radartechbr.com.br/ >/dev/null; then
            echo "ok $(date -u +%Y-%m-%dT%H:%M:%SZ)" > oficina_garagem/data/site_health.txt
          else
            echo "falha $(date -u +%Y-%m-%dT%H:%M:%SZ)" > oficina_garagem/data/site_health.txt
          fi

      - name: Salvar estado do Oficina
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- oficina_garagem/data)" ]; then
            echo "Sem mudanças de estado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oficina_garagem/data
          git commit -m "Atualizar fluxo autônomo Oficina & Garagem"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oficina-autonomo-${{ github.run_number }}
          path: oficina_garagem/data/
          if-no-files-found: warn
          retention-days: 14
