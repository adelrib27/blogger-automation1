name: V31 C9 - Radar E2E erro 1000 SIMULADO + R2 REAL (temporario)

on:
  push:
    branches:
      - feature/v31-affiliate-hub-c1-safe-20261115
    paths:
      - '.github/workflows/v31_c9_radar_router_once.yml'

permissions:
  contents: read

concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false

jobs:
  simular-radar-fallback-sem-publicar:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/feature/v31-affiliate-hub-c1-safe-20261115'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Biblioteca R2
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Compilar e executar todas as regressoes offline
        run: |
          python -m compileall -q affiliate_hub_v31
          python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Simular APENAS erro 1000, R2 real e fila Radar 5 categorias temporaria
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: python -m affiliate_hub_v31.c9_radar_router_probe
