name: V31 C46 TEMP MAIN - construir pistas de revisao para sem categoria R2
on:
  push:
    branches: [main]
    paths:
      - affiliate_hub_v31/C46_REAL_R2_REVIEW_HINTS_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  review-hints-only:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Regressão completa antes da análise
        run: python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Dry-run com TODOS os SKUs em revisão, zero mutações
        env: &r2env
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          python -m affiliate_hub_v31.universal_inventory | tee /tmp/c46-dry
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/c46-dry').read_text().splitlines()[-1])
          h=d['unclassified_review_hints']
          n=h['unclassified_review_scanned']
          count=h['review_path_hints_created']
          if (d['products_indexed']!=203649 or
              h['review_only'] is not True or
              h['new_approvals']!=0 or
              h['affiliate_conversion_calls']!=0 or
              h['publication_calls']!=0 or
              h['core_catalog_mutations']!=0 or
              d['core_catalog_untouched'] is not True or
              not 0<=count<=n):
              raise SystemExit('V31_C46_UNCLASSIFIED_REVIEW_GATE_FAILED')
          print('V31_C46_ALL_UNCLASSIFIED_REVIEW_HINTS_DRY_PASS')
          PY
      - name: Salvar apenas índice R2 privado, restaurar e validar, sem posts
        env: *r2env
        shell: bash
        run: |
          set -euo pipefail
          python -m affiliate_hub_v31.universal_inventory --execute | tee /tmp/c46-saved
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/c46-saved').read_text().splitlines()[-1])
          h=d['unclassified_review_hints']
          if (d['products_indexed']!=203649 or
              d['r2_snapshot_saved_and_verified'] is not True or
              d['core_catalog_untouched'] is not True or
              d['new_approvals']!=0 or
              d['publication_calls']!=0 or
              h['review_only'] is not True or
              h['new_approvals']!=0 or
              h['publication_calls']!=0):
              raise SystemExit('V31_C46_SIDECAR_RESTORE_INVALID')
          print('V31_C46_R2_REVIEW_HINTS_PERSISTED_PASS')
          PY
