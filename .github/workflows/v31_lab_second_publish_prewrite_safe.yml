name: V31 LAB - Second publish prewrite gate SAFE (existing PLAN, no PUT)

on:
  push:
    branches:
      - lab/v31r1-shopee-safe-20261103
    paths:
      - .github/workflows/v31_lab_second_publish_prewrite_safe.yml
      - blogger_stores/v31_core/v31_second_publish_gate_safe.py
      - blogger_stores/tests/v31_second_publish/**

permissions:
  contents: read
  actions: read

concurrency:
  group: v31-lab-second-publish-prewrite-safe
  cancel-in-progress: false

jobs:
  validar-reserva-existente-sem-put:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/lab/v31r1-shopee-safe-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout LAB somente leitura
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar ancestry reserva PLAN e Git HEAD remoto
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'adelrib27/blogger-automation1'
          test "$GITHUB_REF" = 'refs/heads/lab/v31r1-shopee-safe-20261103'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 801381b4e0d2d23fa60f478da67b6dca6ec3df32 "$GITHUB_SHA"
          actual="$(git ls-remote --exit-code origin 'refs/heads/lab/v31r1-shopee-safe-20261103' | cut -f1)"
          test "$actual" = "$GITHUB_SHA"
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('blogger_stores/v31_core')))
          from v31_second_publish_gate_safe import LEDGER_BLOB,HISTORY_BLOB,gitblob
          from v31_second_resume_safe import validate_persisted_pair
          base=Path('blogger_stores/v31_lab/state')
          lb=(base/'v31_rotation_ledger.json').read_bytes()
          hb=(base/'v31_rotation_history.json').read_bytes()
          assert gitblob(lb)==LEDGER_BLOB
          assert gitblob(hb)==HISTORY_BLOB
          led=json.loads(lb)
          hist=json.loads(hb)
          assert [op['status'] for op in led['operations']]==['PERSISTED','PLAN']
          assert len(hist['runs'])==2
          validate_persisted_pair(led,hist)
          print('V31_SECOND_PLAN_CANONICAL_GIT_READ_ONLY_PASS')
          PY
      - name: Compilar e executar testes SAFE e regressao anterior
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile blogger_stores/v31_core/v31_second_publish_gate_safe.py \
            blogger_stores/tests/v31_second_publish/test_v31_second_publish_gate_safe.py
          python -m unittest discover -s blogger_stores/tests/v31_second_publish -v
          python -m unittest discover -s blogger_stores/tests/v31_git_write_gate -v
          python -m unittest discover -s blogger_stores/tests/v31_git_executor -v
          python -m unittest discover -s blogger_stores/tests/v31_transaction -v
          python -m unittest discover -s blogger_stores/tests/v31_second_recovery -v
          python -m unittest discover -s blogger_stores/tests/v31_ledger -v
          python -m unittest discover -s blogger_stores/tests/v31_atomic -v
      - name: Recuperar selecao original da segunda rotacao (somente leitura)
        uses: actions/download-artifact@v4
        with:
          name: v31-lab-second-shopee-safe-1
          run-id: 41840458808
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v31_second_selection
      - name: Recuperar HTMLs originais do preflight (somente leitura)
        uses: actions/download-artifact@v4
        with:
          name: v31-lab-second-preflight-readonly-1
          run-id: 41841058542
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v31_second_html
      - name: Validar lote real contra PLAN existente — sem GET Blogger nesta CI
        shell: bash
        run: |
          set -euo pipefail
          echo 'aea7191e1e4ea77581b33591e0e940f6bd582114c90ea2e457a7173faf3664b7  '${RUNNER_TEMP}'/v31_second_selection/selecao_shopee_v23_SECOND_REAL_SAFE.json' | sha256sum -c -
          echo '6f3810a364fe2114865b96fa5f118c10495bfe39943406624710ac9aaf25f450  '${RUNNER_TEMP}'/v31_second_html/LOJA_ORIGINAL_BACKUP.html' | sha256sum -c -
          echo 'd33070c001281ed795489a032a504accfcab2b593010c1a9e8cf5bb86b8109b8  '${RUNNER_TEMP}'/v31_second_html/LOJA_CANDIDATA_NAO_PUBLICAR.html' | sha256sum -c -
          python - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0,str(pathlib.Path('blogger_stores/v31_core')))
          from v31_second_publish_gate_safe import gate_second_publish_safe, REPOSITORY, BRANCH
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          original=(tmp/'v31_second_html/LOJA_ORIGINAL_BACKUP.html').read_bytes()
          result=gate_second_publish_safe(
              repository=REPOSITORY, branch=BRANCH,
              branch_head=os.environ['GITHUB_SHA'],reservation_is_ancestor=True,
              profile_bytes=pathlib.Path('blogger_stores/v31_lab/perfil_v31_lab.json').read_bytes(),
              ledger_bytes=pathlib.Path('blogger_stores/v31_lab/state/v31_rotation_ledger.json').read_bytes(),
              history_bytes=pathlib.Path('blogger_stores/v31_lab/state/v31_rotation_history.json').read_bytes(),
              selection_bytes=(tmp/'v31_second_selection/selecao_shopee_v23_SECOND_REAL_SAFE.json').read_bytes(),
              original_html_bytes=original,
              candidate_html_bytes=(tmp/'v31_second_html/LOJA_CANDIDATA_NAO_PUBLICAR.html').read_bytes(),
              observed_blogger_html_bytes=original,
              observed_blogger_is_authenticated_live=False)
          assert result['status']=='V31_SECOND_PUBLISH_PREFLIGHT_SAFE_PASS'
          assert result['decision']=='EXISTING_PLAN_READBACK_ORIGINAL_SEPARATE_APPROVAL_REQUIRED'
          assert not result['blogger_put_allowed'] and not result['git_write_allowed']
          assert not result['observed_blogger_live_authenticated']
          report=tmp/'V31_SECOND_PREWRITE_ARCHIVED_ARTIFACTS_SAFE_REPORT.json'
          report.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print('V31_SECOND_PUBLISH_ARCHIVED_ARTIFACTS_EXACT_SAFE_PASS')
          PY
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code -- blogger_stores/v31_lab/state
          test -z "$(git status --porcelain -- blogger_stores/v31_lab/state)"
          echo 'V31_SECOND_PREWRITE_SAFE_PASS; blogger_get_live=false; blogger_put=false; github_state_write=false; cron=false'
      - name: Guardar metadados SAFE sem conteudo publicavel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v31-lab-second-prewrite-safe-${{ github.run_number }}
          path: ${{ runner.temp }}/V31_SECOND_PREWRITE_ARCHIVED_ARTIFACTS_SAFE_REPORT.json
          if-no-files-found: error
          retention-days: 14
