name: V31 C34 TEMP MAIN - persistir indice universal R2 203649 SAFE
on:
  push:
    branches:
      - main
    paths:
      - affiliate_hub_v31/C34_INVENTORY_PERSIST_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  persist-only-facets:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install boto3 only
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Regressao offline
        run: python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Persistir APENAS tabela de facetas universal e verificar snapshot R2 restaurado
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: |
          python - <<'PY'
          import json
          from affiliate_hub_v31.r2_state import StorageError
          from affiliate_hub_v31.universal_inventory import run_r2
          try:
              status=run_r2(execute=True)
              print('V31_C34_UNIVERSAL_INVENTORY_REAL_R2_PERSIST_RESTORE_PASS')
              print(json.dumps(status,sort_keys=True,ensure_ascii=False))
          except StorageError as e:
              # Apenas código fixo do módulo R2, não incluir resposta HTTP/credenciais.
              allow={'r2_snapshot_upload_failed','r2_snapshot_verification_failed',
                     'r2_pointer_update_failed','r2_snapshot_download_failed',
                     'snapshot_sha256_mismatch','sqlite_corruption','invalid_local_state',
                     'r2_pointer_read_failed','retention_list_limit'}
              reason=str(e)
              print('V31_C34_STORAGE_DIAGNOSTIC_'+
                    (reason if reason in allow else 'STORAGE_UNEXPECTED'))
              raise SystemExit(3)
          PY
