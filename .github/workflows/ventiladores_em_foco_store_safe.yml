name: Ventiladores em Foco — Loja Shopee SAFE

on:
  workflow_dispatch:
  push:
    paths:
      - "ventiladores_em_foco_store/config/**"
      - "ventiladores_em_foco_store/src/**"
      - "!ventiladores_em_foco_store/src/**/__pycache__/**"
      - "!ventiladores_em_foco_store/src/**/*.pyc"
      - ".github/workflows/ventiladores_em_foco_store_safe.yml"

permissions:
  contents: read

concurrency:
  group: ventiladores-em-foco-store-safe
  cancel-in-progress: false

jobs:
  validar-loja:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      BLOGGER_BLOG_ID: "4473989735719981382"
      BLOGGER_STORE_POST_ID: "1410775502611365606"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      BLOGGER_STORE_DRY_RUN: "true"
      BLOGGER_STORE_ITEMS_PER_CATEGORY: "4"
      BLOGGER_STORE_RECENT_DAYS: "1"
      SHOPEE_TOP_N: "60"
      SHOPEE_OPPORTUNITIES_CONFIG: ventiladores_em_foco_store/config/shopee_oportunidades.json
      SHOPEE_INTENT_RULES: ventiladores_em_foco_store/config/shopee_intent_rules.json
      SHOPEE_OUTPUT_DIR: ventiladores_em_foco_store/data/store_shopee_scan
      SHOPEE_CATEGORY: all

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validar código e self-test
        run: |
          set -euo pipefail
          python -m py_compile \
            src/criar_rascunho.py \
            src/shopee_oportunidades.py \
            src/shopee_oportunidades_v22.py \
            src/shopee_oportunidades_v23.py \
            ventiladores_em_foco_store/src/shopee_oportunidades_vitrine_pratica.py \
            ventiladores_em_foco_store/src/store_auto.py \
            ventiladores_em_foco_store/src/store_auto_post.py \
            ventiladores_em_foco_store/src/store_auto_self_test.py \
            ventiladores_em_foco_store/src/store_hero_sync.py \
            ventiladores_em_foco_store/src/store_hero_sync_post.py \
            ventiladores_em_foco_store/src/post_target_proxy.py \
            ventiladores_em_foco_store/src/store_layout_patch.py
          BLOGGER_STORE_DRY_RUN=true PYTHONPATH=src:ventiladores_em_foco_store/src python ventiladores_em_foco_store/src/store_auto_self_test.py
      - name: Confirmar secrets obrigatórios
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          test -n "$BLOGGER_CLIENT_ID"
          test -n "$BLOGGER_CLIENT_SECRET"
          test -n "$BLOGGER_REFRESH_TOKEN"
      - name: Executar SAFE real sem publicar
        run: PYTHONPATH=src:ventiladores_em_foco_store/src python -u ventiladores_em_foco_store/src/store_auto_post.py
      - name: Guardar diagnóstico SAFE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ventiladores-em-foco-store-safe-${{ github.run_number }}
          path: |
            ventiladores_em_foco_store/data/store_last_selection.json
            ventiladores_em_foco_store/data/store_shopee_scan/
          if-no-files-found: warn
          retention-days: 14

# Fonte de verdade: BLOGGER_STORE_VENTILADORES_VALIDADA_V1
