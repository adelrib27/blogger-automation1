name: Laboratório - Enriquecer Produtos + Cloudinary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enriquecer-produtos:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests cloudinary pillow

      - name: Validar script
        run: python -m py_compile src/enriquecer_catalogo_laboratorio.py

      - name: Executar enriquecimento em laboratório
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: python -u src/enriquecer_catalogo_laboratorio.py

      - name: Salvar resultados do laboratório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-catalogo-enriquecido
          path: |
            data/produtos_enriquecidos_laboratorio.json
            data/relatorio_enriquecimento_laboratorio.json
          if-no-files-found: warn
