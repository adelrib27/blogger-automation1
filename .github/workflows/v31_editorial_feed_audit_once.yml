name: V31 Editorial - Audit Real CSV C2.1 (Temporary SAFE)

on:
  push:
    branches:
      - feature/v31-affiliate-hub-c1-safe-20261115
    paths:
      - '.github/workflows/v31_editorial_feed_audit_once.yml'

permissions:
  contents: read

concurrency:
  group: v31-editorial-feed-audit-once-20261115
  cancel-in-progress: false

jobs:
  audit-only-no-publication:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/v31-affiliate-hub-c1-safe-20261115'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests before using feeds
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Read two real CSVs privately and print aggregates only
        env:
          V31_EDITORIAL_DATAFEED_URL_1: ${{ secrets.V31_EDITORIAL_DATAFEED_URL_1 }}
          V31_EDITORIAL_DATAFEED_URL_2: ${{ secrets.V31_EDITORIAL_DATAFEED_URL_2 }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m affiliate_hub_v31.feed_audit
