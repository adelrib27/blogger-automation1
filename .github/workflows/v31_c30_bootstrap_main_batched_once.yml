name: V31 C30 TEMP MAIN - bootstrap links R2 por campanha, max 3/run
on:
  push:
    branches:
      - main
    paths:
      - affiliate_hub_v31/C30_BATCH_*.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  refill-bounded-one-batch:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.run_attempt == 1
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar marcador de campanha e limite estrito 1-3 antes dos secrets
        shell: bash
        run: |
          set -euo pipefail
          markers="$(git diff --name-only HEAD^ HEAD | grep -E '^affiliate_hub_v31/C30_BATCH_(CASA|OFICINA|RADAR)_[123]_[0-9]+\.txt$' || true)"
          if [ "$(printf '%s\n' "$markers" | grep -c .)" -ne 1 ]; then
            echo 'V31_C30_MARKER_INVALID'
            exit 3
          fi
          if [[ "$markers" =~ ^affiliate_hub_v31/C30_BATCH_(CASA|OFICINA|RADAR)_([123])_[0-9]+\.txt$ ]]; then
            profile="${BASH_REMATCH[1]}"
            budget="${BASH_REMATCH[2]}"
          else
            exit 4
          fi
          case "$profile" in
            CASA) site='wordpress_casa_decoracao' ;;
            OFICINA) site='wordpress_oficina_garagem' ;;
            RADAR) site='wordpress_radartechbr' ;;
            *) exit 5 ;;
          esac
          echo "V31_SITE=$site" >> "$GITHUB_ENV"
          echo "V31_BUDGET=$budget" >> "$GITHUB_ENV"
          echo "V31_C30_SITE=$site MAX_MUTATIONS=$budget"
      - name: Instalar somente cliente R2
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Executar 230 regressões antes de converter
        run: |
          python -m compileall -q affiliate_hub_v31
          python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Inspecionar candidatos read-only antes do lote
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: python -m affiliate_hub_v31.cache_replenish --site "$V31_SITE" --budget "$V31_BUDGET"
      - name: Converter no maximo 3 URLs oficiais na propria campanha; salvar e restaurar R2
        env:
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: |
          python -m affiliate_hub_v31.cache_replenish --site "$V31_SITE" --budget "$V31_BUDGET" --execute
          echo 'V31_C30_CONVERSION_BATCH_ATTEMPT_SUCCESS'
      - name: Shadow de reserva por blog após o lote; nenhuma publicacao
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: python -m affiliate_hub_v31.shadow_audit --site all
