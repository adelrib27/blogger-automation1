name: Casa e Decoração — Auditoria v3

on:
  workflow_dispatch:
  push:
    paths:
      - "casa_decoracao/audit_kickoff.txt"

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CASA_GENERATION_ENABLED: "false"
      CASA_LIVE_PUBLISH_ENABLED: "false"
      CASA_WORDPRESS_STATUS: draft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar e auditar
        run: |
          python -m py_compile casa_decoracao/src/category_rotation.py casa_decoracao/src/quality_gate.py casa_decoracao/src/audit_release_candidates.py
          python casa_decoracao/src/category_rotation.py
          python casa_decoracao/src/self_test.py
          python -u casa_decoracao/src/audit_release_candidates.py
      - name: Persistir relatório
        run: |
          if [ -z "$(git status --porcelain -- casa_decoracao/data/release_audit.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casa_decoracao/data/release_audit.json
          git commit -m "Atualizar auditoria Casa e Decoração v3"
          git pull --rebase origin main
          git push origin HEAD:main
