name: V31 C92 - converter Buriti uma vez e homologar DRAFT
on:
  schedule:
    # 23 November 2026 00:23 UTC (22 Nov 21:23 Recife).
    # The runtime date gate blocks all later-year matches permanently.
    - cron: '23 0 23 11 *'
permissions:
  contents: read
jobs:
  exact-buriti-conversion:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'schedule' &&
      vars.V31_AUTODRAFT_ACTIVE == 'true' &&
      vars.V31_AUTODRAFT_ROLLOUT_SITE == 'blogger_moveis_para_cada_canto' &&
      vars.V31_AUTOLIVE_ACTIVE != 'true' &&
      vars.V31_AUTODRAFT_FULL_ROLLOUT_APPROVED != 'true'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    concurrency:
      group: v31-editorial-catalog-single-writer
      cancel-in-progress: false
    timeout-minutes: 30
    outputs:
      conversion_ready: ${{ steps.convert.outputs.conversion_ready }}
    env:
      V31_AUTODRAFT_ACTIVE: ${{ vars.V31_AUTODRAFT_ACTIVE }}
      V31_AUTODRAFT_ROLLOUT_SITE: ${{ vars.V31_AUTODRAFT_ROLLOUT_SITE }}
      V31_AUTODRAFT_FULL_ROLLOUT_APPROVED: ${{ vars.V31_AUTODRAFT_FULL_ROLLOUT_APPROVED }}
    steps:
      - id: utc_gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(date -u +%F)" == "2026-11-23" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "V31_C92_EXACT_DAY_CONFIRMED"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "V31_C92_OUTSIDE_ALLOWED_DAY_SKIP"
          fi
      - if: steps.utc_gate.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: steps.utc_gate.outputs.allowed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências de conversão e histórico Blogger
        if: steps.utc_gate.outputs.allowed == 'true'
        run: python -m pip install 'boto3>=1.36,<2' 'cryptography>=42' requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Converter exatamente Buriti somente se D1 permitir e CMS confirmar ineditismo
        id: convert
        if: steps.utc_gate.outputs.allowed == 'true'
        shell: bash
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
          V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
          V31_D1_SAFE_WRITES_ENABLED: V31_D1_SAFE_SQL_ONLY
        run: |
          set -euo pipefail
          if ! output="$(python -m affiliate_hub_v31.site_request_queue \
             --execute --budget 1 \
             --target-site-key blogger_moveis_para_cada_canto \
             --target-product-key shopee:1235923910:19299550912)"; then
             echo "V31_C92_TARGET_CONVERSION_FAILED_CLOSED"
             exit 1
          fi
          export OUT_JSON="$(printf '%s\n' "$output" | tail -n 1)"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          result=json.loads(os.environ["OUT_JSON"])
          ready=(result.get("converted")==1 and
                 result.get("shopee_mutation_attempts")==1 and
                 result.get("r2_snapshot_saved_and_verified") is True and
                 result.get("publication_calls")==0 and
                 result.get("api_interrupted") is False)
          if ready:
              print("conversion_ready=true")
          else:
              print("conversion_ready=false")
          PY
          echo "V31_C92_TARGET_CONVERSION_RESULT_CHECKED"

  independently-verify-and-deliver-draft:
    needs: exact-buriti-conversion
    if: needs.exact-buriti-conversion.result == 'success' && needs.exact-buriti-conversion.outputs.conversion_ready == 'true'
    uses: ./.github/workflows/v31_independent_review_draft.yml
    with:
      site_key: blogger_moveis_para_cada_canto
      pilot: false
    secrets: inherit
