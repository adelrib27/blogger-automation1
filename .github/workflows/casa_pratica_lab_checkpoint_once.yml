name: Casa Prática Lab — Registrar checkpoint E2E — uso único

on:
  push:
    paths:
      - ".github/workflows/casa_pratica_lab_checkpoint_once.yml"

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Registrar validação E2E sem alterar produção
        env:
          LAB_CHECKPOINT_ZB64: ""
        run: |
          set -euo pipefail
          grep -Fq 'O Blogger Policy Guard está integrado em **14 pipelines modernos**' CHECKPOINT_ATUAL.md
          grep -Fq '# 13. FILA RESTANTE — 4 BLOGS' CHECKPOINT_ATUAL.md
          grep -Fq '# 14. PRÓXIMO BLOCO PERMITIDO — MODA E OFERTAS, NÃO INICIADO' CHECKPOINT_ATUAL.md
          python -c "import os,base64,zlib,pathlib; p=pathlib.Path('CHECKPOINT_ATUAL.md'); s=p.read_text(encoding='utf-8'); marker='# LAB E2E VALIDATION — CASA PRÁTICA LAB — 2026-11-02'; block=zlib.decompress(base64.b64decode(os.environ['LAB_CHECKPOINT_ZB64'])).decode('utf-8'); p.write_text(s.rstrip()+(('\n'+block+'\n') if marker not in s else '\n'),encoding='utf-8')"
          grep -Fq '# LAB E2E VALIDATION — CASA PRÁTICA LAB — 2026-11-02' CHECKPOINT_ATUAL.md
          grep -Fq 'Produção permanece 14/18. Próximo bloco de produção: Moda e Ofertas, ainda não iniciado.' CHECKPOINT_ATUAL.md
          echo 'CASA_PRATICA_LAB_CHECKPOINT_PASS: prova E2E registrada; produção permanece 14/18; próximo Moda e Ofertas.'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHECKPOINT_ATUAL.md
          if git diff --cached --quiet; then echo 'Checkpoint já continha a validação.'; exit 0; fi
          git commit -m "checkpoint: registrar validacao E2E Casa Pratica Lab sem alterar producao"
          git pull --rebase origin main
          git push origin HEAD:main
