name: Casa Prática Lab — Registrar checkpoint E2E — uso único

on:
  push:
    paths:
      - ".github/workflows/casa_pratica_lab_checkpoint_once.yml"

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Registrar validação E2E sem alterar produção
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'O Blogger Policy Guard está integrado em **14 pipelines modernos**' CHECKPOINT_ATUAL.md
          grep -Fq '# 13. FILA RESTANTE — 4 BLOGS' CHECKPOINT_ATUAL.md
          grep -Fq '# 14. PRÓXIMO BLOCO PERMITIDO — MODA E OFERTAS, NÃO INICIADO' CHECKPOINT_ATUAL.md
          if ! grep -Fq '# LAB E2E VALIDATION — CASA PRÁTICA LAB — 2026-11-02' CHECKPOINT_ATUAL.md; then
            cat >> CHECKPOINT_ATUAL.md <<'EOF_CHECKPOINT'

