name: Achados que Valem — Proteger schedule final no auditor — uso único

on:
  push:
    paths:
      - ".github/workflows/achados_que_valem_auditor_patch_once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Proteger schedule e navegação do Achados que Valem
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/blogger_policy_repo_audit.py')
          s=p.read_text(encoding='utf-8')
          if 'def audit_achados_que_valem_schedule()' not in s:
              anchor='\ndef audit_legacy_writers_manual_only() -> None:\n'
              fn='''\ndef audit_achados_que_valem_schedule() -> None:\n    rel = ".github/workflows/achados_que_valem_store_autonomous.yml"\n    text = read(rel)\n    required = [\n        "workflow_dispatch:",\n        'cron: "50 9 * * *"',\n        'timezone: "America/Recife"',\n        "SCHEDULE_ENABLED_AFTER_VALIDATION_2026_11_02",\n        '<a class="bls-btn bls-btn-main" href="#bls-cozinha-utilidades">Ver cozinha</a>',\n        '<a class="bls-btn bls-btn-soft" href="#bls-ferramentas">Ver ferramentas</a>',\n        '<a class="bls-btn bls-btn-main" href="#bls-tecnologia-conectividade">Ver tecnologia</a>',\n        '<a class="bls-btn bls-btn-soft" href="#bls-audio-lazer">Ver áudio</a>',\n    ]\n    missing = [x for x in required if x not in text]\n    if missing:\n        fail(f"Achados que Valem sem schedule/gate de navegação canônico: {missing}")\n    if re.search(r"(?m)^\\s*push\\s*:", text):\n        fail("Achados que Valem voltou a ter gatilho push após promoção final")\n\n'''
              if anchor not in s: raise SystemExit('AQV_AUDIT_FINAL_FAIL: anchor função legado ausente')
              s=s.replace(anchor,'\n'+fn+'def audit_legacy_writers_manual_only() -> None:\n',1)
          if '    audit_achados_que_valem_schedule()\n' not in s:
              anchor='    audit_escolha_schedule()\n'
              if anchor not in s: raise SystemExit('AQV_AUDIT_FINAL_FAIL: chamada escolha ausente')
              s=s.replace(anchor,anchor+'    audit_achados_que_valem_schedule()\n',1)
          old='SAFE/LIVE 13/13 protegidos; Casa em Ordem schedule 08:05 e Escolha Certa Online schedule 08:20 protegidos; writers legados manual-only; sem ocultação/desativação detectada do aviso nativo de cookies.'
          new='SAFE/LIVE 13/13 protegidos; Casa em Ordem 08:05, Escolha Certa Online 08:20 e Achados que Valem 09:50 protegidos; writers legados manual-only; sem ocultação/desativação detectada do aviso nativo de cookies.'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('AQV_AUDIT_FINAL_FAIL: summary esperado ausente')
          p.write_text(s,encoding='utf-8',newline='\n')
          print('ACHADOS_QUE_VALEM_AUDITOR_SCHEDULE_PASS')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/blogger_policy_repo_audit.py
          git commit -m "auditor: proteger schedule 09:50 do Achados que Valem"
          git pull --rebase origin main
          git push origin HEAD:main
