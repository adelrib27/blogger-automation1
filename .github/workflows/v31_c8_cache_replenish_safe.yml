name: V31 C8 - Preconverter cache Shopee R2 (opt-in, nunca publica)

on:
  workflow_dispatch:
    inputs:
      site_key:
        description: "Blog em shadow.d ou all (rotacao multi-site)"
        required: true
        type: string
        default: all
      budget:
        description: "Maximo global de mutations Shopee nesta execucao (1-3)"
        required: true
        type: choice
        default: '1'
        options: ['1', '2', '3']
      confirm_conversion:
        description: "Confirmo que serão criados links afiliados, sem publicação"
        required: true
        type: boolean
        default: false
  schedule:
    # 08:27 America/Recife; SEM efeito sem a flag no Environment.
    - cron: '27 11 * * *'

permissions:
  contents: read

concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false

jobs:
  abastecer-cache-sem-publicar:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.confirm_conversion == true) ||
        (github.event_name == 'schedule' && vars.V31_EDITORIAL_CACHE_WARMUP_ENABLED == 'true')
      )
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar S3 client
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Executar regressao offline sem credenciais
        run: |
          python -m compileall -q affiliate_hub_v31
          python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Verificar elegibilidade e orcamento sem mutacoes (R2 read-only)
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          V31_SITE: ${{ github.event_name == 'schedule' && 'all' || inputs.site_key }}
          V31_BUDGET: ${{ github.event_name == 'schedule' && '3' || inputs.budget }}
        run: python -m affiliate_hub_v31.cache_replenish --site "$V31_SITE" --budget "$V31_BUDGET"
      - name: Converter somente links com limite global e salvar em R2
        env:
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          V31_SITE: ${{ github.event_name == 'schedule' && 'all' || inputs.site_key }}
          V31_BUDGET: ${{ github.event_name == 'schedule' && '3' || inputs.budget }}
        run: python -m affiliate_hub_v31.cache_replenish --site "$V31_SITE" --budget "$V31_BUDGET" --execute
      - name: Auditoria posterior somente leitura
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: python -m affiliate_hub_v31.shadow_audit --site all
