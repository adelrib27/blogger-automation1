name: V31 LAB - Validar credencial Shopee compartilhada
on:
  push:
    branches: [lab/v31-shopee-credenciais-exclusivas]
    paths: [.github/workflows/v31_shopee_shared_credential_probe.yml]
permissions:
  contents: read
concurrency:
  group: shopee-shared-credential-test
  cancel-in-progress: false
jobs:
  authenticate:
    if: github.repository == 'adelrib27/blogger-automation1' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fazer uma unica leitura de ofertas da Shopee
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          PYTHONPATH=v31_master python -u - <<'PY'
          import json
          import os
          import re
          from lab_shopee_graphql_diagnostic import send_query

          app_id = os.environ.get("SHOPEE_APP_ID", "").strip()
          secret = os.environ.get("SHOPEE_SECRET", "").strip()
          if not re.fullmatch(r"[0-9]+", app_id) or not secret:
              print("SHARED_CREDENTIALS_NOT_CONFIGURED")
              raise SystemExit(1)
          query = ('query V31Probe { productOfferV2(keyword: "cadeira ergonomica", page: 1, limit: 5) '
                   '{ nodes { itemId productName offerLink imageUrl commissionRate } } }')
          result = send_query("shared_credential", query, app_id, secret)
          print("SHARED_SHOPEE_RESULT=" + json.dumps(result, sort_keys=True))
          if result["status"] != "GRAPHQL_OK" or not result.get("offers_count"):
              raise SystemExit(1)
          PY
