name: Vida Pet Prática — Persistence Lab SAFE V3

on:
  workflow_dispatch:
  push:
    paths:
      - "vida_pet_pratica/persistence_kickoff.txt"

permissions:
  contents: read

concurrency:
  group: vida-pet-pratica-persistence-lab
  cancel-in-progress: false

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: "b1515400afe32581994c4d3f038f835f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.VIDAPET_D1_API_TOKEN }}
      VIDAPET_GROQ_MODEL: "openai/gpt-oss-120b"
      VIDAPET_CANDIDATE_BUFFER_TARGET: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SAFE preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          test -n "$FIRECRAWL_API_KEY"
          test -n "$GROQ_API_KEY"
          test -n "$CLOUDFLARE_API_TOKEN"
          test ! -f vida_pet_pratica/wordpress_write.flag
          python -m py_compile \
            vida_pet_pratica/src/evidence_engine.py \
            vida_pet_pratica/src/evidence_engine_persistent_v13.py \
            vida_pet_pratica/src/evidence_cache_hydrator.py \
            vida_pet_pratica/src/evidence_reuse_self_test.py \
            vida_pet_pratica/src/automation_core_v1.py \
            vida_pet_pratica/src/automation_core_persistent_v2.py \
            vida_pet_pratica/src/automation_core_persistent_v3.py \
            vida_pet_pratica/src/article_builder_v1.py \
            vida_pet_pratica/src/article_builder_safe_v5.py \
            vida_pet_pratica/src/article_builder_evergreen_v6.py \
            vida_pet_pratica/src/article_builder_evergreen_v7.py \
            vida_pet_pratica/src/article_builder_evergreen_v8.py \
            vida_pet_pratica/src/article_builder_evergreen_v9.py \
            vida_pet_pratica/src/article_builder_evergreen_v10.py \
            vida_pet_pratica/src/article_builder_evergreen_v11.py \
            vida_pet_pratica/src/article_builder_evergreen_v12.py \
            vida_pet_pratica/src/article_builder_evergreen_v13.py \
            vida_pet_pratica/src/article_builder_evergreen_v14.py \
            vida_pet_pratica/src/article_builder_evergreen_v14_1.py \
            vida_pet_pratica/src/article_builder_evergreen_v14_2.py \
            vida_pet_pratica/src/article_builder_evergreen_v14_3.py \
            vida_pet_pratica/src/article_builder_evergreen_v14_4.py \
            vida_pet_pratica/src/article_builder_evergreen_v14_5.py \
            vida_pet_pratica/src/article_builder_persistent_v2.py \
            vida_pet_pratica/src/d1_persistence.py \
            vida_pet_pratica/src/d1_persistence_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path("vida_pet_pratica/config/automation_policy.json").read_text(encoding="utf-8"))
          d1 = json.loads(Path("vida_pet_pratica/config/d1_state.json").read_text(encoding="utf-8"))
          reuse = json.loads(Path("vida_pet_pratica/config/evidence_reuse_policy.json").read_text(encoding="utf-8"))
          assert policy["wordpress"]["writes_enabled"] is False
          assert policy["rotation"]["new_products_first"] is True
          assert policy["rotation"]["evergreen_enabled"] is True
          assert int(policy["min_ready"]) == 3
          assert int(policy["rotation"]["product_cooldown_days"]) == 30
          assert d1["persistence_enabled"] is True
          assert d1["lab_only"] is True
          assert d1["account_id"] == "b1515400afe32581994c4d3f038f835f"
          assert reuse["enabled"] is True
          assert reuse["lab_only"] is True
          assert 1 <= int(reuse["ttl_days"]) <= 30
          assert int(reuse["min_external_authorized_sources"]) >= 1
          assert int(reuse["require_exact_evidence_count"]) >= 2
          assert reuse["refresh_does_not_extend_ttl"] is True
          assert reuse["fallback"] == "FIRECRAWL"
          assert reuse["fail_closed_when_fallback_unavailable"] is True
          print("Persistence SAFE V3 preflight OK")
          PY

      - name: Resolve lab mode
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "MODE=EVERGREEN" vida_pet_pratica/persistence_kickoff.txt; then
            echo "VIDAPET_FORCE_EVERGREEN=1" >> "$GITHUB_ENV"
            echo "Persistence mode: EVERGREEN"
          else
            echo "VIDAPET_FORCE_EVERGREEN=0" >> "$GITHUB_ENV"
            echo "Persistence mode: NORMAL"
          fi

      - name: Verify D1 connection and schema
        run: python vida_pet_pratica/src/d1_persistence_v2.py verify

      - name: Hydrate persistent editorial history
        run: python vida_pet_pratica/src/d1_persistence_v2.py hydrate

      - name: Hydrate persisted evidence cache
        run: python vida_pet_pratica/src/evidence_cache_hydrator.py

      - name: Validate evidence reuse fail-closed policy
        run: python vida_pet_pratica/src/evidence_reuse_self_test.py

      - name: Consume hydrated READY for independent LAB rotation
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "CONSUME_READY_LAB=1" vida_pet_pratica/persistence_kickoff.txt; then
            python vida_pet_pratica/src/d1_persistence_v2.py consume-ready-lab
            python vida_pet_pratica/src/d1_persistence_v2.py verify
          else
            echo "Hydrated READY retained for this LAB round"
          fi

      - name: Clean ephemeral generation output
        shell: bash
        run: |
          rm -rf vida_pet_pratica/data/architecture_lab vida_pet_pratica/data/shopee_oportunidades
          mkdir -p vida_pet_pratica/data/architecture_lab vida_pet_pratica/data/shopee_oportunidades

      - name: Build persistent candidate buffer with evidence reuse
        run: python vida_pet_pratica/src/automation_core_persistent_v3.py

      - name: Build grounded post buffer with SAFE persistent guard
        run: python vida_pet_pratica/src/article_builder_persistent_v2.py

      - name: Persist VERIFIED_READY posts to D1
        run: python vida_pet_pratica/src/d1_persistence_v2.py persist

      - name: Verify persistent state after run
        run: python vida_pet_pratica/src/d1_persistence_v2.py verify

      - name: Verify no WordPress writer exists
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E "wp-json|wp-admin|WORDPRESS_APP_PASSWORD|status.?=.?(publish|draft)" \
            vida_pet_pratica/src vida_pet_pratica/config vida_pet_pratica/state

      - name: Upload persistence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vida-pet-pratica-persistence-lab
          path: |
            vida_pet_pratica/data/architecture_lab/
            vida_pet_pratica/data/shopee_oportunidades/
            vida_pet_pratica/state/persistence_snapshot.json
            vida_pet_pratica/state/article_history.json
            vida_pet_pratica/state/evidence_cache.json
          if-no-files-found: warn
          retention-days: 14
