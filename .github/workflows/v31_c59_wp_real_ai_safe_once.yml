name: V31 C59 TEMP main - Workers AI real plano HTML CTA WP sem POST
on:
  push:
    branches: [main]
    paths:
      - affiliate_hub_v31/C59_WP_AI_REAL_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  casa-ai-quality-no-post:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Testar interface IA comum e regressões Casa Oficina
        run: |
          set -euo pipefail
          python -m unittest affiliate_hub_v31.tests.test_wordpress_ai -q
          python casa_decoracao/src/self_test.py
          python oficina_garagem/src/self_test.py
      - name: Casa piloto - geração REAL com catálogo e validação, zero WordPress mutations
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          CASA_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CASA_CLOUDFLARE_ACCOUNT_ID }}
          CASA_CLOUDFLARE_API_TOKEN: ${{ secrets.CASA_CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys,tempfile
          from pathlib import Path
          from affiliate_hub_v31.catalog import Catalog,host_allowed
          from affiliate_hub_v31.r2_state import R2State,verify_database
          from affiliate_hub_v31.routing import sites
          from affiliate_hub_v31.article_commerce import valid_product_photo
          sys.path.insert(0,str(Path.cwd()/'casa_decoracao'/'src'))
          from generate_articles import make_plan,generate_article,MODEL
          from quality_gate import quality
          if MODEL!='@cf/meta/llama-3.3-70b-instruct-fp8-fast':
              raise SystemExit('V31_C59_MODEL_NOT_UPDATED')
          route=sites()['wordpress_casa_decoracao']
          mapping={
           ('casa','decoracao'):'Decoração',
           ('casa','organizacao'):'Organização',
           ('cozinha','organizacao_utensilios'):'Cozinha',
           ('limpeza','equipamentos'):'Organização',
           ('jardim','horta_jardinagem'):'Área Externa',
           ('climatizacao','ventilacao'):'Área Externa',
          }
          with tempfile.TemporaryDirectory(prefix='v31-c59-ai-') as td:
            file=Path(td)/'catalog.sqlite3'
            if not R2State.from_env().restore_to(file):
              raise SystemExit('V31_C59_R2_NOT_RESTORED')
            verify_database(file)
            with Catalog(file) as catalog:
              rows=catalog.db.execute("""
               SELECT p.product_key,p.shop_id,p.item_id,p.title,
                      p.image_url,p.origin_url,t.category,t.niche
               FROM products p JOIN product_taxonomy t
                 ON t.product_key=p.product_key
               JOIN affiliate_links a ON a.product_key=p.product_key
               WHERE a.campaign=? AND p.moderation='eligible'
               ORDER BY p.title LIMIT 300
              """,(route['campaign'],)).fetchall()
              chosen=None
              for key,shop,item,title,image,origin,category,niche in rows:
                if ((category,niche) not in mapping or
                    not valid_product_photo(image) or
                    not host_allowed(origin) or
                    catalog.for_conversion(key) is None):
                  continue
                link=catalog.cached_link(key,route['campaign'])
                if link and host_allowed(link,allow_short=True):
                  chosen=(key,item,title,image,link,mapping[(category,niche)])
                  break
              if chosen is None:
                raise SystemExit('V31_C59_NO_SAFE_WP_CASA_PRODUCT')
              key,item,title,image,link,category=chosen
              import re,unicodedata
              normalized=' '.join(
               re.findall(r'[a-z0-9]+',
                ''.join(c for c in unicodedata.normalize('NFKD',title.lower())
                        if not unicodedata.combining(c))))
              keyword=' '.join(normalized.split()[:4])
              record={
                'id':9999,'shopee_item_id':str(item),'product':title,
                'affiliate_link':link,'image_url':image,
                'category':category,'source_keyword':keyword,
                'shop_name':'Shopee','status':'PENDING'}
              plan=make_plan(record)
              article=generate_article(record,plan)
              gate=quality(article)
              html=article.get('content_html') or ''
              if (gate['status']!='DRAFT_READY' or
                  article['generation_model']!=MODEL or
                  'data-v31-related="1"' not in html or
                  html.count('<li>')<2 or
                  not image in html or
                  not link in html or
                  'nofollow sponsored' not in html):
                raise SystemExit('V31_C59_WP_ARTICLE_QUALITY_FAILED')
              print('V31_C59_REAL_WP_AI_ARTICLE_VALIDATED_PASS '+json.dumps({
                'site':'wordpress_casa_decoracao',
                'ai_model_supported':True,
                'plan_structured':True,
                'body_html_quality_gate':gate['status'],
                'word_count':article['word_count'],
                'internal_article_links':2,
                'real_csv_image':True,'exact_campaign_link':True,
                'wordpress_posts_created':0,'r2_writes':0,
                'shopee_mutations':0},sort_keys=True))
          PY
