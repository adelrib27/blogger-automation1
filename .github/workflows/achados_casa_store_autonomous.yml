name: Achados para Casa — Loja Shopee LIVE Controlada

on:
  workflow_dispatch:
  push:
    paths:
      - "blogger_stores/achados_casa_live_kickoff.txt"

permissions:
  contents: write

concurrency:
  group: achados-casa-store-live
  cancel-in-progress: false

jobs:
  atualizar-loja:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      BLOGGER_BLOG_ID: "1426630233929943394"
      BLOGGER_STORE_POST_ID: "854861801599328533"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      ACHADOS_STORE_DRY_RUN: "false"
      ACHADOS_STORE_RECENT_DAYS: "14"
      SHOPEE_TOP_N: "180"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar código e Policy Guard
        run: |
          set -euo pipefail
          python -m py_compile \
            src/blogger_policy_guard.py \
            src/blogger_policy_guard_self_test.py \
            src/criar_rascunho.py \
            blogger_stores/src/achados_casa_safe_scan_v2.py \
            blogger_stores/src/achados_casa_safe_scan_v3.py \
            blogger_stores/src/achados_casa_safe_scan_v6.py \
            blogger_stores/src/achados_casa_publish_post.py \
            blogger_stores/src/achados_casa_hero_sync_post.py \
            blogger_stores/src/achados_casa_layout_patch.py \
            blogger_stores/src/achados_casa_persist_rotation.py
          PYTHONPATH=src python src/blogger_policy_guard_self_test.py

      - name: Confirmar secrets e alvo
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          test -n "$BLOGGER_CLIENT_ID"
          test -n "$BLOGGER_CLIENT_SECRET"
          test -n "$BLOGGER_REFRESH_TOKEN"
          test "$BLOGGER_BLOG_ID" = "1426630233929943394"
          test "$BLOGGER_STORE_POST_ID" = "854861801599328533"

      - name: Gerar seleção SAFE v6 fresca
        run: PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/achados_casa_safe_scan_v6.py

      - name: Validar Policy Guard pré-LIVE
        run: |
          set -euo pipefail
          PYTHONPATH=src:blogger_stores/src python - <<'PY'
          import json
          from pathlib import Path
          from blogger_policy_guard import require_product_allowed
          from achados_casa_publish_post import validate_selection

          data=json.loads(Path('blogger_stores/data/achados_casa_selection.json').read_text(encoding='utf-8'))
          products=validate_selection(data)
          if len(products) != 20:
              raise SystemExit(f'Policy Guard: quantidade inválida {len(products)}/20')
          for product in products:
              require_product_allowed(product)
          print('BLOGGER_POLICY_GUARD_PRELIVE_PASS: 20/20 produtos permitidos')
          print('ACHADOS_SEMANTIC_PRELIVE_PASS: schema v6, 5 categorias x 4 produtos')
          PY

      - name: Simular Store, hero e identidade antes da publicação
        run: |
          set -euo pipefail
          ACHADOS_STORE_DRY_RUN=true PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/achados_casa_publish_post.py
          ACHADOS_STORE_DRY_RUN=true PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/achados_casa_hero_sync_post.py
          ACHADOS_STORE_DRY_RUN=true PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/achados_casa_layout_patch.py

      - name: Atualizar vitrine no Store Post
        run: PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/achados_casa_publish_post.py

      - name: Sincronizar 12 mini-cards do hero
        run: PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/achados_casa_hero_sync_post.py

      - name: Aplicar identidade do Achados para Casa
        run: PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/achados_casa_layout_patch.py

      - name: Verificar renderização pública + Policy Guard central
        run: |
          set -euo pipefail
          ok=0
          url="https://achadosparacasa2026.blogspot.com/2026/10/loja.html"
          for attempt in 1 2 3 4 5 6; do
            if ! curl -L -fsS --max-time 40 "${url}?store_verify=${GITHUB_RUN_ID}-${attempt}" > /tmp/achados-casa-loja.html; then
              sleep 5
              continue
            fi
            store_count=$(python -c "print(open('/tmp/achados-casa-loja.html', encoding='utf-8', errors='ignore').read().count('data-item-id='))")
            hero_count=$(python -c "print(open('/tmp/achados-casa-loja.html', encoding='utf-8', errors='ignore').read().count('data-hero-item-id='))")
            if grep -q "bls-store-grid" /tmp/achados-casa-loja.html \
              && grep -q "blh-grid" /tmp/achados-casa-loja.html \
              && grep -q "blogger-liq-layout-wide-css" /tmp/achados-casa-loja.html \
              && grep -q "https://achadosparacasa2026.blogspot.com/p/loja.html" /tmp/achados-casa-loja.html \
              && grep -q "bls-organizacao-armazenamento" /tmp/achados-casa-loja.html \
              && grep -q "bls-limpeza-lavanderia" /tmp/achados-casa-loja.html \
              && grep -q "bls-decoracao-conforto" /tmp/achados-casa-loja.html \
              && grep -q "bls-clima-bem-estar" /tmp/achados-casa-loja.html \
              && ! grep -q "https://vitrine-pratica.blogspot.com/p/loja.html" /tmp/achados-casa-loja.html \
              && ! grep -q "https://liquidificadores-em-foco.blogspot.com/p/loja.html" /tmp/achados-casa-loja.html \
              && [ "$store_count" -eq 20 ] && [ "$hero_count" -eq 12 ]; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          PYTHONPATH=src python - <<'PY'
          from blogger_policy_guard import require_store_html_allowed

          raw=open('/tmp/achados-casa-loja.html', encoding='utf-8', errors='ignore').read()
          require_store_html_allowed(raw, expected_products=20, expected_hero=12)
          required=[
              'https://achadosparacasa2026.blogspot.com/p/loja.html',
              'bls-organizacao-armazenamento',
              'bls-limpeza-lavanderia',
              'bls-decoracao-conforto',
              'bls-clima-bem-estar',
          ]
          missing=[x for x in required if x not in raw]
          if missing:
              raise SystemExit(f'Achados identity: marcadores ausentes {missing}')
          forbidden=[
              'https://vitrine-pratica.blogspot.com/p/loja.html',
              'https://liquidificadores-em-foco.blogspot.com/p/loja.html',
              'href="#bls-tecnologia"',
              'href="#bls-beleza"',
              'href="#bls-dia-a-dia"',
          ]
          bad=[x for x in forbidden if x in raw]
          if bad:
              raise SystemExit(f'Achados identity: referências indevidas {bad}')
          print('BLOGGER_POLICY_GUARD_PUBLIC_PASS: 20 products + 12 hero')
          print('ACHADOS_CASA_IDENTITY_PUBLIC_PASS: nicho casa + Page LOJA corretos')
          PY

      - name: Persistir rotação somente após PASS público
        run: |
          set -euo pipefail
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/achados_casa_persist_rotation.py
          if [ -z "$(git status --porcelain -- blogger_stores/data/achados_casa_selection.json blogger_stores/data/achados_casa_rotation.json)" ]; then
            echo "Sem mudanças de estado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogger_stores/data/achados_casa_selection.json blogger_stores/data/achados_casa_rotation.json
          git commit -m "Atualizar rotação automática da Loja Achados para Casa"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: achados-casa-store-live-${{ github.run_number }}
          path: |
            blogger_stores/data/achados_casa_selection.json
            blogger_stores/data/achados_casa_rotation.json
            blogger_stores/data/achados_casa_scan/
            /tmp/achados-casa-loja.html
          if-no-files-found: warn
          retention-days: 14

# POLICY_GUARD_CENTRAL_ACHADOS_CASA_2026_11_01
