name: V20 — Migração segura do enquadramento Page-target (promoção Vida Pet)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v20_theme_frame_page_migration.yml"

permissions:
  contents: read

concurrency:
  group: v20-theme-frame-page-migration
  cancel-in-progress: false

jobs:
  migrate-vida-pet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLOGGER_BLOG_ID: "8052455848487624244"
      BLOGGER_STORE_PAGE_ID: "8624646966938350648"
      BLOGGER_STORE_POST_ID: "7332800716046515902"
      BLOGGER_STORE_PAGE_URL: "https://vida-pet-pratica.blogspot.com/p/loja.html"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Guardas de código e alvo exato
        run: |
          set -euo pipefail
          python -m py_compile \
            src/blogger_policy_guard.py src/criar_rascunho.py \
            blogger_stores/src/blogger_store_share_card.py \
            blogger_stores/src/blogger_new_blog_store_page_target.py \
            blogger_stores/src/vida_pet_pratica_public_acceptance.py
          test "$BLOGGER_BLOG_ID" = "8052455848487624244"
          test "$BLOGGER_STORE_PAGE_ID" = "8624646966938350648"
          test "$BLOGGER_STORE_POST_ID" = "7332800716046515902"
          test "$BLOGGER_STORE_PAGE_URL" = "https://vida-pet-pratica.blogspot.com/p/loja.html"
          grep -q 'BLOGGER_NEW_STORE_PAGE_THEME_FRAME_PRESERVED' blogger_stores/src/blogger_new_blog_store_page_target.py
          grep -q 'strip_legacy_layout_patch' blogger_stores/src/blogger_new_blog_store_page_target.py
          grep -q 'Page LOJA contém BLOGGER_LIQ_LAYOUT_PATCH' blogger_stores/src/blogger_new_blog_store_page_target.py
          grep -q 'BLOGGER_MODELO_V20_BLS_STORE_NATIVE' blogger_stores/src/vida_pet_pratica_public_acceptance.py
          ! grep -q 'PAGE_SURFACE_FIX =' blogger_stores/src/blogger_new_blog_store_page_target.py

      - name: Dry-run 20+12 removendo patch legado somente em memória
        run: PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py sync-dry-run

      - name: Sincronizar Page sem patch e limpar staging DRAFT
        run: |
          set -euo pipefail
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py sync-live
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py ensure-staging-draft
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py verify-page

      - name: Aceitação pública completa do Vida Pet
        run: PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/vida_pet_pratica_public_acceptance.py

# TEMPORARY_PUSH_TRIGGER_FOR_VALIDATED_PROMOTION
# CASA_LAB_RUN_41569092489_SUCCESS_REQUIRED
# THEME_RUNTIME_BA571F8_NATIVE_BLS_STORE_REQUIRED
# ONE_TARGET_AT_A_TIME
# NO_SHOPEE_SELECTION_CHANGE
# NO_ROTATION_PERSIST
