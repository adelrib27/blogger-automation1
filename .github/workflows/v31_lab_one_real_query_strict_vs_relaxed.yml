name: V31 LAB - Shopee uma consulta real comparacao filtros

on:
  push:
    branches:
      - lab/v31-shopee-filtros-flex-safe-20261112
    paths:
      - ".github/workflows/v31_lab_one_real_query_strict_vs_relaxed.yml"

permissions:
  contents: read

concurrency:
  group: v31-lab-shopee-one-real-comparison
  cancel-in-progress: false

jobs:
  one-query-comparison:
    if: github.repository == 'adelrib27/blogger-automation1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar sintaxe e regressao offline
        run: |
          set -euo pipefail
          python -m py_compile v31_master/lab_shopee_real_offer_count.py v31_master/shopee_r2_safe.py
          python -m unittest discover -s v31_master/tests -p 'test_r57_relaxed_product_filters.py' -v
      - name: Uma consulta de 20 ofertas maximo e contagem local
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          set -euo pipefail
          python -u v31_master/lab_shopee_real_offer_count.py
          echo "BloggerWrites=0; ShopeeMutations=0; NoProductDataPersisted=1"
