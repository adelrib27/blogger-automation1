name: V31 — publicação LIVE INDIVIDUAL com aprovação imutável
on:
  workflow_dispatch:
    inputs:
      site_key:
        description: 'Rota REAL Blogger/WordPress já registrada no V31'
        required: true
        type: string
      post_id:
        description: 'ID numérico do DRAFT revisado, NUNCA múltiplos IDs'
        required: true
        type: string
      execute_live:
        description: 'Permitir 1 LIVE após manifesto aprovado + confirmação exata'
        required: true
        type: boolean
        default: false
      confirm_exact_post:
        description: 'Para LIVE: digite PUBLISH:<site_key>:<post_id>'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  manual-reviewed-release:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar clientes oficiais (nenhuma mutação nesta etapa)
        run: python -m pip install 'boto3>=1.35,<2' requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: CI seguro do gate de aprovação LIVE antes de qualquer interação remota
        run: python -m unittest affiliate_hub_v31.tests.test_c65_manual_live_release affiliate_hub_v31.tests.test_automatic_wordpress_drafts affiliate_hub_v31.tests.test_automatic_blogger_drafts -q
      - name: Revisar hash, campanha, status DRAFT e confirmar um único post
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          V31_WORDPRESS_SITE_CREDENTIALS_JSON: ${{ secrets.V31_WORDPRESS_SITE_CREDENTIALS_JSON }}
          CASA_WORDPRESS_USERNAME: ${{ secrets.CASA_WORDPRESS_USERNAME }}
          CASA_WORDPRESS_APP_PASSWORD: ${{ secrets.CASA_WORDPRESS_APP_PASSWORD }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          V31_LIVE_SITE_KEY: ${{ inputs.site_key }}
          V31_LIVE_POST_ID: ${{ inputs.post_id }}
          V31_LIVE_EXECUTE: ${{ inputs.execute_live }}
          V31_LIVE_ONE_POST_CONFIRM: ${{ inputs.confirm_exact_post }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--site-key "$V31_LIVE_SITE_KEY" --post-id "$V31_LIVE_POST_ID")
          if [[ "$V31_LIVE_EXECUTE" == 'true' ]]; then args+=(--execute); fi
          python -m affiliate_hub_v31.manual_live_release "${args[@]}"
          echo 'V31_MANUAL_LIVE_RELEASE_EXACT_REVIEW_GATE_CHECKED'
