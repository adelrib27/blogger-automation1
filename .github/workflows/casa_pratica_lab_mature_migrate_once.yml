name: Casa Prática Lab — MIGRAÇÃO final Page madura

on:
  push:
    paths:
      - ".github/workflows/casa_pratica_lab_mature_migrate_once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casa-pratica-lab-store-live
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLOGGER_BLOG_ID: "8930870316690519385"
      BLOGGER_STORE_PAGE_ID: "7110845449177208439"
      BLOGGER_STORE_POST_ID: "7691087355641688975"
      BLOGGER_STORE_PAGE_URL: "https://casa-pratica-lab-20261102.blogspot.com/p/loja.html"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Compilar contrato Page madura
        run: |
          set -euo pipefail
          python -m py_compile \
            blogger_stores/src/blogger_new_blog_store_page_target.py \
            blogger_stores/src/casa_pratica_lab_public_acceptance.py

      - name: Validar staging maduro antes da escrita
        run: |
          set -euo pipefail
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py sync-dry-run

      - name: Sincronizar Page madura e retirar Store Post da home
        run: |
          set -euo pipefail
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py sync-live
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py ensure-staging-draft
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py verify-page

      - name: Aceitação pública estrita
        run: PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_public_acceptance.py

      - name: Prova visual em navegador real
        run: |
          set -euo pipefail
          pip install selenium
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          url='https://casa-pratica-lab-20261102.blogspot.com/p/loja.html?visual_e2e=1'
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1200')
          driver=webdriver.Chrome(options=opts)
          try:
              driver.get(url)
              time.sleep(3)
              page=driver.find_element(By.CSS_SELECTOR,'.bls-page')
              slider=driver.find_element(By.ID,'blsSlider')
              prev=driver.find_element(By.CSS_SELECTOR,'.bls-prev')
              nxt=driver.find_element(By.CSS_SELECTOR,'.bls-next')
              dots=driver.find_elements(By.CSS_SELECTOR,'#blsDots button')
              slides=driver.find_elements(By.CSS_SELECTOR,'.bls-slide')
              visible=[s for s in slides if s.is_displayed()]
              width=driver.execute_script('return arguments[0].getBoundingClientRect().width',page)
              viewport=driver.execute_script('return window.innerWidth')
              titles=driver.find_elements(By.CSS_SELECTOR,'.post-title-container,.post-title,.entry-title')
              visible_loja_titles=[t for t in titles if t.is_displayed() and 'LOJA' in (t.text or '').upper()]
              if width < 1200:
                  raise SystemExit(f'Page estreita: width={width} viewport={viewport}')
              if len(slides) != 3 or len(visible) != 1:
                  raise SystemExit(f'Carousel inválido: slides={len(slides)} visible={len(visible)}')
              if len(dots) != 3 or not prev.is_displayed() or not nxt.is_displayed():
                  raise SystemExit('Controles do carousel ausentes/invisíveis')
              if visible_loja_titles:
                  raise SystemExit('Título externo LOJA continua visível')
              active_before=driver.execute_script("return [...document.querySelectorAll('.bls-slide')].findIndex(x=>x.classList.contains('is-active'))")
              nxt.click(); time.sleep(.5)
              active_after=driver.execute_script("return [...document.querySelectorAll('.bls-slide')].findIndex(x=>x.classList.contains('is-active'))")
              if active_after == active_before:
                  raise SystemExit('Botão próximo não alterou slide ativo')
              print(f'CASA_PRATICA_LAB_BROWSER_VISUAL_PASS: width={width:.0f}/{viewport}; slides=3 visible=1; dots=3; next={active_before}->{active_after}; title_hidden=PASS')
          finally:
              driver.quit()
          PY

