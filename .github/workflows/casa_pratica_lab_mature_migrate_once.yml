name: Casa Prática Lab — PROVA final visual Page madura

on:
  push:
    paths:
      - ".github/workflows/casa_pratica_lab_mature_migrate_once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revalidar contrato público sem nova escrita
        run: PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_public_acceptance.py

      - name: Prova visual em Chrome real sem referências obsoletas
        run: |
          set -euo pipefail
          pip install selenium
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          base='https://casa-pratica-lab-20261102.blogspot.com/p/loja.html'
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1200')
          opts.add_argument('--user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36')
          driver=webdriver.Chrome(options=opts)
          try:
              last=None
              for attempt in range(1,6):
                  driver.get(f'{base}?visual_e2e=3-{attempt}-{int(time.time())}')
                  time.sleep(4)
                  state=driver.execute_script(r'''
                    const vis = el => {
                      if (!el) return false;
                      const s=getComputedStyle(el), r=el.getBoundingClientRect();
                      return s.display!=='none' && s.visibility!=='hidden' && Number(s.opacity)!==0 && r.width>0 && r.height>0;
                    };
                    const pages=[...document.querySelectorAll('.bls-page')];
                    const ranked=pages.map((p,i)=>({p,i,r:p.getBoundingClientRect()})).sort((a,b)=>b.r.width-a.r.width);
                    const chosen=ranked.length ? ranked[0].p : null;
                    const slides=chosen ? [...chosen.querySelectorAll('.bls-slide')] : [];
                    const dots=chosen ? [...chosen.querySelectorAll('#blsDots button')] : [];
                    const prev=chosen ? chosen.querySelector('.bls-prev') : null;
                    const next=chosen ? chosen.querySelector('.bls-next') : null;
                    const titles=[...document.querySelectorAll('.post-title-container,.post-title,.entry-title')];
                    return {
                      href: location.href,
                      title: document.title,
                      pageCount: pages.length,
                      pageWidths: ranked.map(x=>Math.round(x.r.width)),
                      chosenIndex: ranked.length ? ranked[0].i : -1,
                      width: chosen ? chosen.getBoundingClientRect().width : 0,
                      viewport: innerWidth,
                      slides: slides.length,
                      visibleSlides: slides.filter(vis).length,
                      dots: dots.length,
                      prevVisible: vis(prev),
                      nextVisible: vis(next),
                      visibleLojaTitles: titles.filter(x=>vis(x)&&/LOJA/i.test(x.textContent||'')).length,
                      active: slides.findIndex(x=>x.classList.contains('is-active')),
                      bodyClass: document.body ? document.body.className : ''
                    };
                  ''')
                  print(f'VISUAL_ATTEMPT_{attempt}: {state}')
                  last=state
                  if state['width'] >= 1200 and state['slides'] == 3 and state['visibleSlides'] == 1 and state['dots'] == 3 and state['prevVisible'] and state['nextVisible'] and state['visibleLojaTitles'] == 0:
                      break
                  time.sleep(5)
              else:
                  raise SystemExit(f'Estado visual não estabilizou: {last}')

              before=state['active']
              driver.execute_script(r'''
                const pages=[...document.querySelectorAll('.bls-page')];
                pages.sort((a,b)=>b.getBoundingClientRect().width-a.getBoundingClientRect().width);
                pages[0].querySelector('.bls-next').click();
              ''')
              time.sleep(.8)
              after=driver.execute_script(r'''
                const pages=[...document.querySelectorAll('.bls-page')];
                pages.sort((a,b)=>b.getBoundingClientRect().width-a.getBoundingClientRect().width);
                const slides=[...pages[0].querySelectorAll('.bls-slide')];
                const vis=x=>{const s=getComputedStyle(x),r=x.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
                return {active:slides.findIndex(x=>x.classList.contains('is-active')),visible:slides.filter(vis).length};
              ''')
              if after['active'] == before or after['visible'] != 1:
                  raise SystemExit(f"Carousel não avançou corretamente: before={before} after={after}")
              print(f"CASA_PRATICA_LAB_BROWSER_VISUAL_PASS: width={state['width']:.0f}/{state['viewport']}; pages={state['pageCount']}; slides=3 visible=1; dots=3; next={before}->{after['active']}; title_hidden=PASS")
          finally:
              driver.quit()
          PY

# DELETE_AFTER_PASS
# VISUAL_ONLY_FINAL_PROOF_NO_BLOGGER_WRITES
