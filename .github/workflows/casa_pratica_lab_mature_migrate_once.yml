name: Casa Prática Lab — MIGRAÇÃO final Page madura

on:
  push:
    paths:
      - ".github/workflows/casa_pratica_lab_mature_migrate_once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casa-pratica-lab-store-live
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLOGGER_BLOG_ID: "8930870316690519385"
      BLOGGER_STORE_PAGE_ID: "7110845449177208439"
      BLOGGER_STORE_POST_ID: "7691087355641688975"
      BLOGGER_STORE_PAGE_URL: "https://casa-pratica-lab-20261102.blogspot.com/p/loja.html"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Compilar contrato Page madura
        run: |
          set -euo pipefail
          python -m py_compile \
            blogger_stores/src/blogger_new_blog_store_page_target.py \
            blogger_stores/src/casa_pratica_lab_public_acceptance.py

      - name: Validar staging maduro antes da escrita
        run: |
          set -euo pipefail
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py sync-dry-run

      - name: Sincronizar Page madura e retirar Store Post da home
        run: |
          set -euo pipefail
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py sync-live
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py ensure-staging-draft
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py verify-page

      - name: Aceitação pública estrita
        run: PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_public_acceptance.py

      - name: Prova visual em navegador real
        run: |
          set -euo pipefail
          pip install selenium
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          url='https://casa-pratica-lab-20261102.blogspot.com/p/loja.html?visual_e2e=2'
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1200')
          driver=webdriver.Chrome(options=opts)
          try:
              driver.get(url)
              time.sleep(4)
              state=driver.execute_script(r'''
                const vis = el => {
                  if (!el) return false;
                  const s=getComputedStyle(el), r=el.getBoundingClientRect();
                  return s.display!=='none' && s.visibility!=='hidden' && Number(s.opacity)!==0 && r.width>0 && r.height>0;
                };
                const page=document.querySelector('.bls-page');
                const slides=[...document.querySelectorAll('.bls-slide')];
                const dots=[...document.querySelectorAll('#blsDots button')];
                const prev=document.querySelector('.bls-prev');
                const next=document.querySelector('.bls-next');
                const titles=[...document.querySelectorAll('.post-title-container,.post-title,.entry-title')];
                return {
                  pageExists: !!page,
                  width: page ? page.getBoundingClientRect().width : 0,
                  viewport: innerWidth,
                  slides: slides.length,
                  visibleSlides: slides.filter(vis).length,
                  dots: dots.length,
                  prevVisible: vis(prev),
                  nextVisible: vis(next),
                  visibleLojaTitles: titles.filter(x => vis(x) && /LOJA/i.test(x.textContent||'')).length,
                  active: slides.findIndex(x=>x.classList.contains('is-active'))
                };
              ''')
              if not state['pageExists']:
                  raise SystemExit('bls-page ausente')
              if state['width'] < 1200:
                  raise SystemExit(f"Page estreita: width={state['width']} viewport={state['viewport']}")
              if state['slides'] != 3 or state['visibleSlides'] != 1:
                  raise SystemExit(f"Carousel inválido: slides={state['slides']} visible={state['visibleSlides']}")
              if state['dots'] != 3 or not state['prevVisible'] or not state['nextVisible']:
                  raise SystemExit('Controles do carousel ausentes/invisíveis')
              if state['visibleLojaTitles']:
                  raise SystemExit('Título externo LOJA continua visível')
              before=state['active']
              driver.execute_script("document.querySelector('.bls-next').click()")
              time.sleep(.7)
              after=driver.execute_script("return [...document.querySelectorAll('.bls-slide')].findIndex(x=>x.classList.contains('is-active'))")
              visible_after=driver.execute_script("return [...document.querySelectorAll('.bls-slide')].filter(x=>{const s=getComputedStyle(x),r=x.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0}).length")
              if after == before or visible_after != 1:
                  raise SystemExit(f'Carousel não avançou corretamente: before={before} after={after} visible={visible_after}')
              print(f"CASA_PRATICA_LAB_BROWSER_VISUAL_PASS: width={state['width']:.0f}/{state['viewport']}; slides=3 visible=1; dots=3; next={before}->{after}; title_hidden=PASS")
          finally:
              driver.quit()
          PY

