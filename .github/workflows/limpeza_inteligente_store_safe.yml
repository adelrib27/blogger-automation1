name: Limpeza Inteligente — Loja Shopee SAFE

on:
  workflow_dispatch:
  push:
    paths:
      - "limpeza_inteligente_store/config/**"
      - "limpeza_inteligente_store/src/**"
      - "!limpeza_inteligente_store/src/**/__pycache__/**"
      - "!limpeza_inteligente_store/src/**/*.pyc"
      - "src/blogger_policy_guard.py"
      - "src/blogger_policy_guard_self_test.py"
      - "config/blogger_policy_guard.json"
      - ".github/workflows/limpeza_inteligente_store_safe.yml"

permissions:
  contents: read

concurrency:
  group: limpeza-inteligente-store-safe
  cancel-in-progress: true

jobs:
  validar-loja:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      BLOGGER_BLOG_ID: "7757953554206491487"
      BLOGGER_STORE_POST_ID: "6383277011247909539"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      BLOGGER_STORE_DRY_RUN: "true"
      BLOGGER_STORE_ITEMS_PER_CATEGORY: "4"
      BLOGGER_STORE_RECENT_DAYS: "1"
      SHOPEE_TOP_N: "70"
      SHOPEE_OPPORTUNITIES_CONFIG: limpeza_inteligente_store/config/shopee_oportunidades.json
      SHOPEE_INTENT_RULES: limpeza_inteligente_store/config/shopee_intent_rules.json
      SHOPEE_OUTPUT_DIR: limpeza_inteligente_store/data/store_shopee_scan
      SHOPEE_CATEGORY: all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validar código, Policy Guard e self-test
        run: |
          set -euo pipefail
          python -m py_compile src/blogger_policy_guard.py src/blogger_policy_guard_self_test.py \
            limpeza_inteligente_store/src/shopee_oportunidades_limpeza.py \
            limpeza_inteligente_store/src/store_auto.py limpeza_inteligente_store/src/store_auto_post.py \
            limpeza_inteligente_store/src/store_layout_patch.py limpeza_inteligente_store/src/store_auto_self_test.py \
            limpeza_inteligente_store/src/store_hero_sync.py limpeza_inteligente_store/src/store_hero_sync_post.py \
            limpeza_inteligente_store/src/post_target_proxy.py
          PYTHONPATH=src python src/blogger_policy_guard_self_test.py
          BLOGGER_STORE_DRY_RUN=true PYTHONPATH=src:limpeza_inteligente_store/src python limpeza_inteligente_store/src/store_auto_self_test.py
      - name: Confirmar secrets obrigatórios
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"; test -n "$SHOPEE_SECRET"; test -n "$BLOGGER_CLIENT_ID"; test -n "$BLOGGER_CLIENT_SECRET"; test -n "$BLOGGER_REFRESH_TOKEN"
      - name: Executar SAFE real sem publicar
        run: PYTHONPATH=src:limpeza_inteligente_store/src python -u limpeza_inteligente_store/src/store_auto_post.py
      - name: Policy Guard — validar 20 produtos SAFE
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from blogger_policy_guard import require_product_allowed
          data=json.loads(Path('limpeza_inteligente_store/data/store_last_selection.json').read_text(encoding='utf-8'))
          products=[p for items in (data.get('categories') or {}).values() for p in items]
          if len(products)!=20: raise SystemExit(f'Policy Guard: quantidade inválida {len(products)}/20')
          for p in products: require_product_allowed(p)
          print('BLOGGER_POLICY_GUARD_SAFE_PASS: 20/20')
          PY
      - name: Guardar diagnóstico SAFE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limpeza-inteligente-store-safe-${{ github.run_number }}
          path: |
            limpeza_inteligente_store/data/store_last_selection.json
            limpeza_inteligente_store/data/store_shopee_scan/
          if-no-files-found: warn
          retention-days: 14
