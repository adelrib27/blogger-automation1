name: V31 Editorial - Importar 2 Feeds SAFE no R2 privado (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm_private_storage:
        description: "CONFIRMO: R2 privado exclusivo, backups e acesso protegido configurados; sem publicacao"
        required: true
        default: false
        type: boolean
      initialize_new_catalog:
        description: "CONFIRMO: primeira importacao em bucket privado NOVO e sem estado antigo"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Compartilhar este grupo em TODOS os futuros writers R2 do hub.
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false

jobs:
  importar-catalogo-sem-publicar:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_private_storage == true
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar cliente S3 para R2 (somente runtime)
        run: python -m pip install 'boto3>=1.35,<2' 'cryptography>=42'
      - name: Validar estrutura e testes offline
        run: |
          python -m compileall -q affiliate_hub_v31
          python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Baixar feeds com secrets, importar e salvar snapshot privado no R2
        env:
          V31_EDITORIAL_DATAFEED_URL_1: ${{ secrets.V31_EDITORIAL_DATAFEED_URL_1 }}
          V31_EDITORIAL_DATAFEED_URL_2: ${{ secrets.V31_EDITORIAL_DATAFEED_URL_2 }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          V31_EDITORIAL_R2_ALLOW_INIT: ${{ inputs.initialize_new_catalog && 'CONFIRM_NEW_PRIVATE_CATALOG' || 'DENY' }}
        run: python -m affiliate_hub_v31.ingest_cli --mode cloud
