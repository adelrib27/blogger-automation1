name: Moda e Ofertas Anchor Fix Once

on:
  push:
    paths:
      - blogger_stores/moda_ofertas_anchor_fix_kickoff.txt

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch pontual
        run: python scripts/moda_ofertas_anchor_fix_once.py

      - name: Validar fonte
        run: |
          python -m py_compile blogger_stores/src/moda_ofertas_store.py
          grep -q "href=\"#bls-beleza\"" blogger_stores/src/moda_ofertas_store.py
          grep -q "#bls-acessorios-cuidados" blogger_stores/src/moda_ofertas_store.py

      - name: Commitar patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogger_stores/src/moda_ofertas_store.py
          git commit -m "moda ofertas: corrigir colisao de prefixo nas ancoras"
          git pull --rebase origin main
          git push origin HEAD:main
