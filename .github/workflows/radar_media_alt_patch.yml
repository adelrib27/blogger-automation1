name: Radar Tech BR — Patch ALT da Imagem Destacada

on:
  push:
    paths:
      - "radar_tech_br/media_alt_patch_kickoff.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar e validar ALT automático
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('radar_tech_br/src/publish_generated.py')
          s = p.read_text(encoding='utf-8')
          marker = '''def category_id(name):\n'''
          helper = '''def media_alt_text(article):\n    value = re.sub(r"\\s+", " ", str(article.get("product") or article.get("seo_title") or "Produto relacionado")).strip()\n    return value[:180].rstrip()\n\n\n'''
          if 'def media_alt_text(article):' not in s:
              if marker not in s:
                  raise SystemExit('Ponto para helper ALT não encontrado')
              s = s.replace(marker, helper + marker, 1)

          old = '''    media_id = int(media.get("id") or 0)\n    if not media_id:\n        raise RuntimeError("WordPress não confirmou o upload da imagem destacada")\n    updated = request("POST", f"/wp/v2/posts/{int(post_id)}", {"featured_media": media_id})\n'''
          new = '''    media_id = int(media.get("id") or 0)\n    if not media_id:\n        raise RuntimeError("WordPress não confirmou o upload da imagem destacada")\n    alt_text = media_alt_text(article)\n    media_meta = request("POST", f"/wp/v2/media/{media_id}", {"alt_text": alt_text})\n    if alt_text and str(media_meta.get("alt_text") or "").strip() != alt_text:\n        raise RuntimeError("WordPress não confirmou o texto alternativo da imagem destacada")\n    updated = request("POST", f"/wp/v2/posts/{int(post_id)}", {"featured_media": media_id})\n'''
          if 'WordPress não confirmou o texto alternativo da imagem destacada' not in s:
              if old not in s:
                  raise SystemExit('Bloco de upload de mídia não encontrado')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('radar_tech_br/src/self_test.py')
          s = t.read_text(encoding='utf-8')
          if 'from publish_generated import media_alt_text' not in s:
              anchor = 'from generate_articles import build, make_plan, meta_description, slug_category  # noqa: E402\n'
              s = s.replace(anchor, anchor + 'from publish_generated import media_alt_text  # noqa: E402\n', 1)
              anchor2 = '    assert slug_category("Moda & Beleza") == "moda-beleza"\n\n'
              test = '    alt = media_alt_text(item(product="Produto demonstrativo para imagem destacada"))\n    assert alt == "Produto demonstrativo para imagem destacada" and len(alt) <= 180\n\n'
              s = s.replace(anchor2, anchor2 + test, 1)
              s = s.replace('Self-test Radar Tech BR vNext: 14/14 OK', 'Self-test Radar Tech BR vNext: 15/15 OK')
          t.write_text(s, encoding='utf-8')
          PY
          python -m py_compile radar_tech_br/src/*.py
          PYTHONPATH=radar_tech_br/src:src python radar_tech_br/src/self_test.py
          PYTHONPATH=radar_tech_br/src:src python radar_tech_br/src/cta_card_self_test.py
          PYTHONPATH=radar_tech_br/src:src python radar_tech_br/src/semantic_self_test.py
      - name: Commitar patch validado
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_tech_br/src/publish_generated.py radar_tech_br/src/self_test.py
          git commit -m "fix(radar): definir ALT na imagem destacada automática"
          git pull --rebase origin main
          git push origin HEAD:main
