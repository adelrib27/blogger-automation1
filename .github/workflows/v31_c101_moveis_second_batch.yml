name: "V31 C101 - Moveis API segunda faixa sem repeticao READ ONLY"
on:
  push:
    branches: [main]
    paths: [".github/workflows/v31_c101_moveis_second_batch.yml"]
permissions:
  contents: read
concurrency:
  group: v31-c101-shopee-readonly
  cancel-in-progress: false
jobs:
  second-batch:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Instalar R2 client e validar codigo
        run: |
          python -m pip install "boto3>=1.36,<2"
          python -m py_compile affiliate_hub_v31/c100_r2_exact_readonly.py
      - name: Consultar candidatos R2 61 ate 160 de Moveis, sem converter ou publicar
        env:
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
          V31_C101_CANDIDATE_OFFSET: "60"
          V31_C100_OUTPUT: c101_moveis_second_verified.json
        run: python -m affiliate_hub_v31.c100_r2_exact_readonly --sites moveis | tee c101_second.log
      - name: Guardar evidencias 7 dias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-c101-moveis-second-batch
          path: |
            c101_moveis_second_verified.json
            c101_second.log
          if-no-files-found: ignore
          retention-days: 7
