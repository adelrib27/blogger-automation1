name: Vida Pet Prática — Loja Page 20+12

on:
  workflow_dispatch:
  schedule:
    - cron: "35 11 * * *"
      timezone: "America/Recife"

permissions:
  contents: write

concurrency:
  group: vida-pet-pratica-store-live
  cancel-in-progress: false

jobs:
  atualizar-loja:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      BLOGGER_BLOG_ID: "8052455848487624244"
      BLOGGER_STORE_PAGE_ID: "8624646966938350648"
      BLOGGER_STORE_POST_ID: "7332800716046515902"
      BLOGGER_STORE_PAGE_URL: "https://vida-pet-pratica.blogspot.com/p/loja.html"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      SHOPEE_TOP_N: "180"
      VIDA_PET_PRATICA_STORE_RECENT_DAYS: "14"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar código, Policy Guard e alvo
        run: |
          set -euo pipefail
          python -m py_compile \
            src/shopee_oportunidades.py src/shopee_oportunidades_v22.py src/shopee_oportunidades_v23.py \
            src/blogger_policy_guard.py src/blogger_policy_guard_self_test.py src/criar_rascunho.py \
            radar_tech_br/src/refresh_blogger_offer_links.py \
            blogger_stores/src/conecta_achados_store.py \
            blogger_stores/src/vida_pet_pratica_store.py \
            blogger_stores/src/vida_pet_pratica_store_page.py \
            blogger_stores/src/blogger_new_blog_store_page_target.py \
            blogger_stores/src/blogger_store_share_card.py \
            blogger_stores/src/vida_pet_pratica_public_acceptance.py
          PYTHONPATH=src python src/blogger_policy_guard_self_test.py
          test -n "$SHOPEE_APP_ID" && test -n "$SHOPEE_SECRET"
          test -n "$BLOGGER_CLIENT_ID" && test -n "$BLOGGER_CLIENT_SECRET" && test -n "$BLOGGER_REFRESH_TOKEN"
          test "$SHOPEE_APP_ID" = "18352820579"
          test "$BLOGGER_BLOG_ID" = "8052455848487624244"
          test "$BLOGGER_STORE_PAGE_ID" = "8624646966938350648"
          test "$BLOGGER_STORE_POST_ID" = "7332800716046515902"
          test "$BLOGGER_STORE_PAGE_URL" = "https://vida-pet-pratica.blogspot.com/p/loja.html"

      - name: SAFE Shopee fresco + seleção semântica + Policy Guard
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/vida_pet_pratica_store_page.py safe
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/vida_pet_pratica_store_page.py validate
          PYTHONPATH=src:blogger_stores/src python - <<'PY'
          import json
          from pathlib import Path
          from blogger_policy_guard import require_product_allowed
          data=json.loads(Path('blogger_stores/data/vida_pet_pratica_selection.json').read_text(encoding='utf-8'))
          products=[p for values in (data.get('categories') or {}).values() for p in values]
          if len(products) != 20: raise SystemExit(f'Policy Guard: {len(products)}/20')
          for product in products: require_product_allowed(product)
          semantic=data.get('semanticValidation') or {}
          if not semantic.get('regulatedPetHealthExcluded'):
              raise SystemExit('Gate pet-health ausente')
          print('BLOGGER_POLICY_GUARD_PRELIVE_PASS: 20/20 produtos pet permitidos')
          PY

      - name: Dry-runs do staging técnico
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/vida_pet_pratica_store_page.py identity-dry-run
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/vida_pet_pratica_store_page.py store-dry-run
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/vida_pet_pratica_store_page.py hero-dry-run

      - name: Preparar staging DRAFT 20+12 e validar Page em memória
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/vida_pet_pratica_store_page.py store-live
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/vida_pet_pratica_store_page.py hero-live
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/vida_pet_pratica_store_page.py identity-live
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py ensure-staging-draft
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py sync-dry-run

      - name: Sincronizar Page pública somente após dry-run maduro
        run: |
          set -euo pipefail
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py sync-live
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py ensure-staging-draft
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_new_blog_store_page_target.py verify-page
          PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_store_share_card.py verify

      - name: Aceitação pública Page + home + artigos
        run: PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/vida_pet_pratica_public_acceptance.py

      - name: Persistir rotação somente após PASS público completo
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/vida_pet_pratica_store_page.py persist
          if [ -z "$(git status --porcelain -- blogger_stores/data/vida_pet_pratica_selection.json blogger_stores/data/vida_pet_pratica_rotation.json)" ]; then
            echo "Sem mudanças de estado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogger_stores/data/vida_pet_pratica_selection.json blogger_stores/data/vida_pet_pratica_rotation.json
          git commit -m "Atualizar estado validado Vida Pet Prática"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vida-pet-pratica-page-${{ github.run_number }}
          path: |
            blogger_stores/data/vida_pet_pratica_selection.json
            blogger_stores/data/vida_pet_pratica_rotation.json
            blogger_stores/data/vida_pet_pratica_scan/
          if-no-files-found: warn
          retention-days: 14

# SCHEDULE_ENABLED_AFTER_VALIDATION_2026_11_02
# FIRST_PUBLISH_STAGING_DRAFT_BEFORE_PAGE_DRY_RUN_2026_11_02
# FIRST_PUBLISH_SHARE_VALIDATED_INSIDE_PAGE_SYNC_DRY_RUN_2026_11_02
# STORE_POST_TECHNICAL_STAGING_MUST_REMAIN_DRAFT
# PUBLIC_PAGE_MUST_PASS_20X12_POLICY_GUARD_HOME_EDITORIAL
# FINAL_WRITER_NO_PUSH_2026_11_02
