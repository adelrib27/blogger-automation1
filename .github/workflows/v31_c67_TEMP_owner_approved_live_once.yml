name: V31 C67 TEMP — despachar UMA publicacao LIVE aprovada #305
on:
  push:
    paths:
      - 'affiliate_hub_v31/C67_LIVE_TRIGGER.txt'
permissions:
  contents: read
  actions: write
jobs:
  dispatch-exact-owner-approved-release:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir gatilho unico, manifesto real e despacho workflow permanente LIVE
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(cat affiliate_hub_v31/C67_LIVE_TRIGGER.txt)" == 'C67_OWNER_APPROVED_WP_CASA_305_ONCE' ]] || exit 3
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('affiliate_hub_v31/live_approvals.d/wordpress_casa_decoracao__305.json').read_text())
          assert set(x)=={'site_key','platform','post_id','content_sha256','approved_utc','owner_authorized','editorial_reviewed','commercial_reviewed'}
          assert x['site_key']=='wordpress_casa_decoracao' and x['platform']=='wordpress' and x['post_id']=='305'
          assert x['content_sha256']=='ccc848b143a51235dba21b89be4b5dad92c538300678b9b8854347a5297d9b63'
          assert x['owner_authorized'] is True and x['editorial_reviewed'] is True and x['commercial_reviewed'] is True
          print('V31_C67_OWNER_APPROVAL_EXACT_MANIFEST_MATCH')
          PY
          payload='{"ref":"main","inputs":{"site_key":"wordpress_casa_decoracao","post_id":"305","execute_live":"true","confirm_exact_post":"PUBLISH:wordpress_casa_decoracao:305"}}'
          code=$(curl -sS --max-time 25 -o /tmp/v31-c67-commit-response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "https://api.github.com/repos/adelrib27/blogger-automation1/actions/workflows/v31_manual_live_release.yml/dispatches")
          echo "V31_C67_EXACT_LIVE_WORKFLOW_DISPATCH_HTTP_$code"
          [[ "$code" == '204' ]] || exit 4
          echo 'V31_C67_ONE_DISPATCH_SENT_NO_RETRY; inspect permanent workflow and remote CMS'
