name: Achados que Valem — Endurecer semântica v2 — uso único

on:
  push:
    paths:
      - ".github/workflows/achados_que_valem_semantic_patch_once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Endurecer intents ambíguos detectados no artifact SAFE
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cfgp=Path('config/shopee_achados_que_valem.json')
          cfg=json.loads(cfgp.read_text(encoding='utf-8'))
          cfg['version']=2
          cfg['semantic_rules_version']=2
          cats=cfg['categories']
          cats['Cozinha & Utilidades']=[('mixer eletrico portatil' if x=='mixer eletrico' else x) for x in cats['Cozinha & Utilidades']]
          cats['Audio & Lazer']=[('mini projetor wifi' if x=='mini projetor' else x) for x in cats['Audio & Lazer']]
          cfgp.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          rp=Path('config/shopee_achados_que_valem_intent_rules.json')
          rules=json.loads(rp.read_text(encoding='utf-8'))
          rules['version']=2
          rd=rules['rules']
          rd['mixer eletrico portatil']=rd.pop('mixer eletrico')
          rd['mixer eletrico portatil']['require_groups']=[["mixer"],["eletrico","elétrico"],["portatil","portátil","mao","mão"]]
          rd['mixer eletrico portatil']['block_phrases'] += ["processador","picador","moedor","3l","3 litros"]
          rd['microfone sem fio karaoke']['block_phrases'] += ["caixa de som","caixa som","speaker","karaoke bluetooth com 2 microfones"]
          rd['mini projetor wifi']=rd.pop('mini projetor')
          rd['mini projetor wifi']['require_groups']=[["projetor"],["mini","portatil","portátil"],["wifi","wi-fi","hdmi","android","full hd","1080p"]]
          rd['mini projetor wifi']['block_phrases'] += ["luz noturna","ondas oceanicas","ondas oceânicas","lampada dinamica","lâmpada dinâmica","decoracao","decoração","abajur"]
          rp.write_text(json.dumps(rules,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          sp=Path('blogger_stores/src/achados_que_valem_store.py')
          s=sp.read_text(encoding='utf-8')
          reps={
            '"mixer eletrico": ["lamina avulsa", "copo avulso", "haste avulsa", "peca reposicao", "acessorio", "brinquedo", "miniatura"]': '"mixer eletrico portatil": ["lamina avulsa", "copo avulso", "haste avulsa", "peca reposicao", "acessorio", "brinquedo", "miniatura", "processador", "picador", "moedor", "3l", "3 litros"]',
            '"microfone sem fio karaoke": ["cabo", "suporte", "espuma", "capa", "case", "receptor avulso", "placa reposicao", "brinquedo"]': '"microfone sem fio karaoke": ["cabo", "suporte", "espuma", "capa", "case", "receptor avulso", "placa reposicao", "brinquedo", "caixa de som", "caixa som", "speaker", "karaoke bluetooth com 2 microfones"]',
            '"mini projetor": ["suporte", "tela", "cabo", "controle remoto avulso", "lampada reposicao", "peca reposicao", "brinquedo"]': '"mini projetor wifi": ["suporte", "tela", "cabo", "controle remoto avulso", "lampada reposicao", "peca reposicao", "brinquedo", "luz noturna", "ondas oceanicas", "lampada dinamica", "decoracao", "abajur"]',
            '"mixer eletrico": lambda: "mixer" in title and "eletric" in title': '"mixer eletrico portatil": lambda: "mixer" in title and "eletric" in title and any(x in title for x in ["portatil", "mao"])',
            '"microfone sem fio karaoke": lambda: "microfone" in title and any(x in title for x in ["sem fio", "wireless"])': '"microfone sem fio karaoke": lambda: "microfone" in title and any(x in title for x in ["sem fio", "wireless"]) and not any(x in title for x in ["caixa de som", "caixa som", "speaker"])',
            '"mini projetor": lambda: "projetor" in title and any(x in title for x in ["mini", "portatil"])': '"mini projetor wifi": lambda: "projetor" in title and any(x in title for x in ["mini", "portatil"]) and any(x in title for x in ["wifi", "wi-fi", "hdmi", "android", "full hd", "1080p"])',
            '("Lâmina Avulsa para Mixer Elétrico", "mixer eletrico", False)': '("Processador Picador 3L Mixer Elétrico", "mixer eletrico portatil", False)',
            '("Mixer Elétrico Portátil 2 em 1", "mixer eletrico", True)': '("Mixer Elétrico Portátil de Mão 2 em 1", "mixer eletrico portatil", True)',
            '("Tela para Mini Projetor", "mini projetor", False)': '("Mini Projetor de Luz Noturna WiFi Ondas Oceânicas", "mini projetor wifi", False)',
            '("Mini Projetor Portátil Full HD", "mini projetor", True)': '("Mini Projetor Portátil WiFi Full HD HDMI", "mini projetor wifi", True)',
            'semantic["profileVersion"] = 1': 'semantic["profileVersion"] = 2',
          }
          for old,new in reps.items():
              if old not in s:
                  raise SystemExit('PATCH_FAIL trecho ausente: '+old)
              s=s.replace(old,new,1)
          sp.write_text(s,encoding='utf-8',newline='\n')
          print('ACHADOS_QUE_VALEM_SEMANTIC_PATCH_V2_PASS')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/shopee_achados_que_valem.json config/shopee_achados_que_valem_intent_rules.json blogger_stores/src/achados_que_valem_store.py
          git commit -m "achados que valem: endurecer mixer microfone e projetor"
          git pull --rebase origin main
          git push origin HEAD:main
