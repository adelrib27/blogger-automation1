name: Casa em Ordem — Habilitar schedule final

on:
  push:
    paths:
      - "blogger_stores/casa_em_ordem_schedule_once.txt"

permissions:
  contents: write

jobs:
  habilitar-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Habilitar 08:05 e reforçar gate público de navegação
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/casa_em_ordem_store_autonomous.yml')
          raw=p.read_text(encoding='utf-8')
          old='''on:\n  workflow_dispatch:\n  push:\n'''
          new='''on:\n  workflow_dispatch:\n  schedule:\n    - cron: "5 8 * * *"\n      timezone: "America/Recife"\n  push:\n'''
          if 'cron: "5 8 * * *"' not in raw:
              if old not in raw:
                  raise SystemExit('CASA_ORDEM_SCHEDULE_FAIL: bloco on esperado ausente')
              raw=raw.replace(old,new,1)
          raw=raw.replace('# SCHEDULE_DISABLED_UNTIL_VALIDATION','# SCHEDULE_ENABLED_AFTER_VALIDATION_2026_11_02')
          marker="              'Organização, limpeza e conforto para uma casa em ordem',\n"
          extra='''              '<a class="bls-btn bls-btn-main" href="#bls-organizacao">Ver organização</a>',\n              '<a class="bls-btn bls-btn-soft" href="#bls-quarto">Ver quarto</a>',\n              '<a class="bls-btn bls-btn-main" href="#bls-banheiro">Ver banheiro</a>',\n              '<a class="bls-btn bls-btn-soft" href="#bls-lavanderia">Ver lavanderia</a>',\n'''
          if extra not in raw:
              if marker not in raw:
                  raise SystemExit('CASA_ORDEM_SCHEDULE_FAIL: marcador do gate público ausente')
              raw=raw.replace(marker,marker+extra,1)
          p.write_text(raw,encoding='utf-8')
          print('CASA_ORDEM_SCHEDULE_PATCH_PASS')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/casa_em_ordem_store_autonomous.yml
          git commit -m "casa em ordem: habilitar schedule diario 08:05"
          git pull --rebase origin main
          git push origin HEAD:main
