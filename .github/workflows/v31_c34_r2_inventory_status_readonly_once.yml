name: V31 C34 TEMP - inspect R2 pointer inventory read-only
on:
  push:
    branches:
      - main
    paths:
      - affiliate_hub_v31/C34_R2_STATUS_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  inspect-current:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Restore current state and read count only
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: |
          python - <<'PY'
          import sqlite3,tempfile
          from pathlib import Path
          from affiliate_hub_v31.r2_state import R2State,verify_database,StorageError
          with tempfile.TemporaryDirectory() as tmp:
              f=Path(tmp)/'catalog.sqlite3'
              try:
                  ok=R2State.from_env().restore_to(f)
                  if not ok: raise ValueError('no_current')
                  verify_database(f)
                  con=sqlite3.connect(f"file:{f.resolve()}?mode=ro",uri=True)
                  exists=con.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='v31_universal_inventory'").fetchone()
                  count=con.execute("SELECT count(*) FROM v31_universal_inventory").fetchone()[0] if exists else -1
                  products=con.execute("SELECT count(*) FROM products").fetchone()[0]
                  links=con.execute("SELECT count(*) FROM affiliate_links").fetchone()[0]
                  initial_bytes=f.stat().st_size
                  pages=con.execute("PRAGMA page_count").fetchone()[0]
                  page_size=con.execute("PRAGMA page_size").fetchone()[0]
                  con.close()
                  print('V31_C34_R2_CURRENT_STATE_READONLY_PASS products=%d links=%d inventory_count=%d bytes=%d page_count=%d page_size=%d'%(products,links,count,initial_bytes,pages,page_size))
              except StorageError as exc:
                  safe={'r2_snapshot_download_failed','snapshot_sha256_mismatch','r2_pointer_read_failed','invalid_manifest','r2_catalog_missing','sqlite_corruption'}
                  code=str(exc)
                  print('V31_C34_R2_STATUS_FAILED_'+(code if code in safe else 'StorageError'))
                  raise SystemExit(3)
          PY
