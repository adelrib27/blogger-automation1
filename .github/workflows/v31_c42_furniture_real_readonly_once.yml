name: V31 C42 TEMP MAIN - avaliar novas rotas no R2 real sem alteracoes
on:
  push:
    branches:
      - main
    paths:
      - affiliate_hub_v31/C42_FURNITURE_REAL_READONLY_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  real-furniture-reclassification-preview:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cliente R2
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Suite regressiva antes da consulta
        run: python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Analisar todos os SKUs em revisao no catalogo R2 sem promover
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m affiliate_hub_v31.safe_reclassification --limit 10
          echo 'V31_C42_FURNITURE_REAL_R2_REVIEW_ONLY_PASS'
