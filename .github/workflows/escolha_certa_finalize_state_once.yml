name: Escolha Certa Online — Consolidar estado final

on:
  push:
    paths:
      - "blogger_stores/escolha_certa_finalize_state_once.txt"

permissions:
  contents: write

jobs:
  consolidar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidar inventário, rollout e checkpoint com asserts
        run: |
          set -euo pipefail
          python tools/escolha_certa_finalize_state_v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            blogger_multi_store/data/NETWORK_STORE_INVENTORY_2026-11-01.json \
            blogger_multi_store/config/network_store_rollout_2026-11-01.json \
            CHECKPOINT_ATUAL.md
          git commit -m "checkpoint: concluir Escolha Certa Online como pipeline 12 de 12"
          git pull --rebase origin main
          git push origin HEAD:main
