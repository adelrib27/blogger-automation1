name: V31 C65 TEMP — validar WordPress Casa com pedido contínuo real
on:
  push:
    paths:
      - 'affiliate_hub_v31/C65_WP_TEST_MODE.txt'
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  casa-wp-draft-guarded:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2' requests
      - name: Regressões multissite, Writer e gates LIVE antes do CMS
        run: |
          set -euo pipefail
          python -m unittest affiliate_hub_v31.tests.test_automatic_wordpress_drafts affiliate_hub_v31.tests.test_c65_two_platform_enrollment affiliate_hub_v31.tests.test_c65_manual_live_release -q
      - name: Conectar ao WordPress Casa em modo PREVIEW ou DRAFT 1x, nunca LIVE
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          V31_WORDPRESS_SITE_CREDENTIALS_JSON: ${{ secrets.V31_WORDPRESS_SITE_CREDENTIALS_JSON }}
          CASA_WORDPRESS_USERNAME: ${{ secrets.CASA_WORDPRESS_USERNAME }}
          CASA_WORDPRESS_APP_PASSWORD: ${{ secrets.CASA_WORDPRESS_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mode=$(cat affiliate_hub_v31/C65_WP_TEST_MODE.txt)
          if [[ "$mode" == "preview" ]]; then
            echo 'V31_C65_CASA_WP_CONTINUOUS_PREVIEW_START_NO_POST'
            python -m affiliate_hub_v31.automatic_wordpress_drafts --site-key wordpress_casa_decoracao
            echo 'V31_C65_CASA_WP_CONTINUOUS_PREVIEW_PASS_NO_POST'
          elif [[ "$mode" == "draft_once" ]]; then
            echo 'V31_C65_CASA_WP_SINGLE_DRAFT_START_NO_LIVE'
            python -m affiliate_hub_v31.automatic_wordpress_drafts --site-key wordpress_casa_decoracao --execute-draft
            echo 'V31_C65_CASA_WP_SINGLE_DRAFT_COMPLETE_NO_LIVE'
          elif [[ "$mode" == "live_preview_305" ]]; then
            echo 'V31_C65_LIVE_RELEASE_REAL_WP_DRAFT_READ_ONLY_START'
            python -m affiliate_hub_v31.manual_live_release --site-key wordpress_casa_decoracao --post-id 305
            echo 'V31_C65_LIVE_RELEASE_REAL_WP_DRAFT_READ_ONLY_COMPLETE_ZERO_PUBLICATIONS'
          elif [[ "$mode" == "diagnose_readonly" ]]; then
            echo 'V31_C65_WP_DIAGNOSTIC_READ_ONLY_START'
            python - <<'PY'
          import os,re,sys,tempfile
          from pathlib import Path
          from affiliate_hub_v31.automatic_wordpress_drafts import (
              credentials_for, WordPressRestClient,site_route,select_next,
              generate_original_paragraphs,compose_article,WordPressAutoDraftError)
          from affiliate_hub_v31.r2_state import R2State,verify_database
          from affiliate_hub_v31.catalog import Catalog
          from affiliate_hub_v31.site_request_queue import load_requests
          site="wordpress_casa_decoracao"
          try:
              route=site_route(site)
              username,password=credentials_for(site)
              print("V31_C65_CREDENTIALS_FOR_REGISTERED_WP_OK")
              client=WordPressRestClient(base_url=route["identifier"],
                                         username=username,application_password=password)
              identity=client.site_settings()
              print("V31_C65_WP_IDENTITY_AUTH_OK")
              history=client.list_posts(include_unpublished=True)
              print("V31_C65_WP_HISTORY_OK "+str(len(history)))
              request=next(r for r in load_requests() if r["site_key"]==site)
              with tempfile.TemporaryDirectory() as td:
                  dest=Path(td)/"catalog.sqlite3"
                  if not R2State.from_env().restore_to(dest):
                      raise WordPressAutoDraftError("r2_missing")
                  verify_database(dest)
                  with Catalog(dest) as cat:
                      plan=select_next(cat,site_key=site,topic=request["topic"],
                                       posts=history,requested_total=request["articles"])
                      print("V31_C65_WP_PLAN_"+plan["status"])
                      if plan["status"]=="READY_FOR_DRAFT_REVIEW":
                          paragraphs=generate_original_paragraphs(
                              product_name=plan["title"],topic=request["topic"],
                              account_id=os.getenv("CLOUDFLARE_ACCOUNT_ID",""),
                              api_token=os.getenv("CLOUDFLARE_API_TOKEN",""))
                          print("V31_C65_WP_WORKERS_AI_GENERATED_"+str(len(paragraphs)))
                          content=compose_article(plan,paragraphs,site_url=route["identifier"])
                          print("V31_C65_WP_ARTICLE_VALIDATED_"+str(len(content)))
              print("V31_C65_WP_DIAG_PASS_NO_POST")
          except Exception as err:
              code=str(err)
              if not re.fullmatch(r"[a-z0-9_]{3,100}",code):
                  code=type(err).__name__
              print("V31_C65_WP_DIAG_FAILED_"+code)
              sys.exit(3)
          PY
          else
            echo 'V31_C65_UNAUTHORIZED_MODE_NO_WRITES'
            exit 3
          fi
