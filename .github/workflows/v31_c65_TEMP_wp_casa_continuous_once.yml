name: V31 C65 TEMP — validar WordPress Casa com pedido contínuo real
on:
  push:
    paths:
      - 'affiliate_hub_v31/C65_WP_TEST_MODE.txt'
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  casa-wp-draft-guarded:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2' requests
      - name: Regressões multissite, Writer e gates LIVE antes do CMS
        run: |
          set -euo pipefail
          python -m unittest affiliate_hub_v31.tests.test_automatic_wordpress_drafts affiliate_hub_v31.tests.test_c65_two_platform_enrollment affiliate_hub_v31.tests.test_c65_manual_live_release -q
      - name: Conectar ao WordPress Casa em modo PREVIEW ou DRAFT 1x, nunca LIVE
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          V31_WORDPRESS_SITE_CREDENTIALS_JSON: ${{ secrets.V31_WORDPRESS_SITE_CREDENTIALS_JSON }}
          CASA_WORDPRESS_USERNAME: ${{ secrets.CASA_WORDPRESS_USERNAME }}
          CASA_WORDPRESS_APP_PASSWORD: ${{ secrets.CASA_WORDPRESS_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mode=$(cat affiliate_hub_v31/C65_WP_TEST_MODE.txt)
          if [[ "$mode" == "preview" ]]; then
            echo 'V31_C65_CASA_WP_CONTINUOUS_PREVIEW_START_NO_POST'
            python -m affiliate_hub_v31.automatic_wordpress_drafts --site-key wordpress_casa_decoracao
            echo 'V31_C65_CASA_WP_CONTINUOUS_PREVIEW_PASS_NO_POST'
          elif [[ "$mode" == "draft_once" ]]; then
            echo 'V31_C65_CASA_WP_SINGLE_DRAFT_START_NO_LIVE'
            python -m affiliate_hub_v31.automatic_wordpress_drafts --site-key wordpress_casa_decoracao --execute-draft
            echo 'V31_C65_CASA_WP_SINGLE_DRAFT_COMPLETE_NO_LIVE'
          else
            echo 'V31_C65_UNAUTHORIZED_MODE_NO_WRITES'
            exit 3
          fi
