name: Achadinhos de Beleza — Loja Shopee LIVE controlado

on:
  workflow_dispatch:
  push:
    paths:
      - "blogger_stores/achadinhos_beleza_live_kickoff.txt"

permissions:
  contents: write

concurrency:
  group: achadinhos-beleza-store-live
  cancel-in-progress: false

jobs:
  atualizar-loja:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      BLOGGER_BLOG_ID: "2562496977098748229"
      BLOGGER_STORE_POST_ID: "7650631557624373238"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      SHOPEE_TOP_N: "500"
      ACHADINHOS_BELEZA_STORE_RECENT_DAYS: "14"
      ACHADINHOS_BELEZA_SHOPEE_SYSTEM_RETRIES: "4"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar código e Policy Guard
        run: |
          set -euo pipefail
          python -m py_compile \
            src/shopee_oportunidades.py \
            src/shopee_oportunidades_v22.py \
            src/shopee_oportunidades_v23.py \
            src/blogger_policy_guard.py \
            src/blogger_policy_guard_self_test.py \
            src/criar_rascunho.py \
            radar_tech_br/src/refresh_blogger_offer_links.py \
            blogger_stores/src/conecta_achados_store.py \
            blogger_stores/src/achadinhos_beleza_store.py
          PYTHONPATH=src python src/blogger_policy_guard_self_test.py

      - name: Confirmar secrets e alvo
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          test -n "$BLOGGER_CLIENT_ID"
          test -n "$BLOGGER_CLIENT_SECRET"
          test -n "$BLOGGER_REFRESH_TOKEN"
          test "$SHOPEE_APP_ID" = "18352820579"
          test "$BLOGGER_BLOG_ID" = "2562496977098748229"
          test "$BLOGGER_STORE_POST_ID" = "7650631557624373238"

      - name: Gerar seleção SAFE fresca
        run: PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/achadinhos_beleza_store.py safe

      - name: Validar Policy Guard pré-LIVE
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/achadinhos_beleza_store.py validate
          PYTHONPATH=src:blogger_stores/src python - <<'PY'
          import json
          from pathlib import Path
          from blogger_policy_guard import require_product_allowed
          data=json.loads(Path('blogger_stores/data/achadinhos_beleza_selection.json').read_text(encoding='utf-8'))
          products=[p for values in (data.get('categories') or {}).values() for p in values]
          if len(products) != 20:
              raise SystemExit(f'Policy Guard: quantidade inválida {len(products)}/20')
          for product in products:
              require_product_allowed(product)
          bad_phrases=[
              'cortador de biscoit', 'massinha', 'biscuit beleza',
              'pancake branco + batom', 'halloween maquiagem',
              'capa térmica para chapinha', 'capa termica para chapinha',
          ]
          for product in products:
              title=(product.get('productName') or '').lower()
              hits=[x for x in bad_phrases if x in title]
              if hits:
                  raise SystemExit(f'Falso positivo conhecido detectado pré-LIVE: {hits}: {title}')
          print('BLOGGER_POLICY_GUARD_PRELIVE_PASS: 20/20 produtos permitidos')
          print('ACHADINHOS_BELEZA_SEMANTIC_PRELIVE_PASS: 5 categorias x 4 intenções')
          PY

      - name: Dry-run de identidade, Store e hero
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/achadinhos_beleza_store.py identity-dry-run
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/achadinhos_beleza_store.py store-dry-run
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/achadinhos_beleza_store.py hero-dry-run

      - name: Atualizar Store Post 20/20
        run: PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/achadinhos_beleza_store.py store-live

      - name: Sincronizar hero 12/12
        run: PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/achadinhos_beleza_store.py hero-live

      - name: Aplicar e confirmar identidade
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/achadinhos_beleza_store.py identity-live
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/achadinhos_beleza_store.py identity

      - name: Verificar renderização pública + Policy Guard central
        run: |
          set -euo pipefail
          ok=0
          url="https://canal-attitude.blogspot.com/2026/10/loja.html"
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36"
          for attempt in $(seq 1 12); do
            code=$(curl -L -sS --max-time 40 \
              -A "$ua" \
              -H "Accept-Language: pt-BR,pt;q=0.9,en;q=0.7" \
              -H "Cache-Control: no-cache" \
              -o /tmp/achadinhos-beleza-loja.html \
              -w "%{http_code}" \
              "${url}?m=1&store_verify=${GITHUB_RUN_ID}-${attempt}" || true)
            echo "PUBLIC_HTTP_ATTEMPT_${attempt}: ${code}"
            if [ "$code" = "429" ]; then
              sleep 15
              continue
            fi
            if [ "$code" != "200" ]; then
              sleep 10
              continue
            fi
            store_count=$(python -c "print(open('/tmp/achadinhos-beleza-loja.html', encoding='utf-8', errors='ignore').read().count('data-item-id='))")
            hero_count=$(python -c "print(open('/tmp/achadinhos-beleza-loja.html', encoding='utf-8', errors='ignore').read().count('data-hero-item-id='))")
            echo "PUBLIC_COUNTS_ATTEMPT_${attempt}: store=${store_count} hero=${hero_count}"
            if [ "$store_count" -ne 20 ] || [ "$hero_count" -ne 12 ]; then
              sleep 10
              continue
            fi
            if PYTHONPATH=src python - <<'PY'
          from blogger_policy_guard import require_store_html_allowed
          raw=open('/tmp/achadinhos-beleza-loja.html', encoding='utf-8', errors='ignore').read()
          require_store_html_allowed(raw, expected_products=20, expected_hero=12)
          required=[
              'https://canal-attitude.blogspot.com/p/loja.html',
              'bls-cabelos',
              'bls-skincare',
              'bls-maquiagem',
              'bls-unhas',
              'bls-cuidados-pessoais',
              'Beleza, autocuidado e achadinhos para sua rotina',
              '<h3>Cuidados Pessoais</h3>',
              'href="#bls-skincare">Ver skincare</a>',
              'href="#bls-maquiagem">Ver maquiagem</a>',
              'href="#bls-cabelos">Ver cabelos</a>',
              'href="#bls-cuidados-pessoais">Ver cuidados pessoais</a>',
          ]
          missing=[x for x in required if x not in raw]
          if missing:
              raise SystemExit(f'Achadinhos de Beleza identity: marcadores ausentes {missing}')
          forbidden=[
              'https://conectaachados.blogspot.com/p/loja.html',
              'https://achadosparacasa2026.blogspot.com/p/loja.html',
              'https://vitrine-pratica.blogspot.com/p/loja.html',
              'https://moda-ofertas.blogspot.com/p/loja.html',
              'Cortador de Biscoitis / Massinha / Biscuit',
              'Kit Pancake Branco + Batom  Preto Halloween',
              'Capa Térmica para Chapinha',
          ]
          bad=[x for x in forbidden if x in raw]
          if bad:
              raise SystemExit(f'Achadinhos de Beleza: conteúdo proibido detectado {bad}')
          print('BLOGGER_POLICY_GUARD_PUBLIC_PASS: 20 products + 12 hero')
          print('ACHADINHOS_BELEZA_IDENTITY_PUBLIC_PASS: domínio, Page LOJA, cinco categorias e CTAs corretos')
          PY
            then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1

      - name: Persistir rotação somente após PASS público
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/achadinhos_beleza_store.py persist
          if [ -z "$(git status --porcelain -- blogger_stores/data/achadinhos_beleza_selection.json blogger_stores/data/achadinhos_beleza_rotation.json)" ]; then
            echo "Sem mudanças de estado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogger_stores/data/achadinhos_beleza_selection.json blogger_stores/data/achadinhos_beleza_rotation.json
          git commit -m "Atualizar rotação automática da Loja Achadinhos de Beleza"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: achadinhos-beleza-store-live-${{ github.run_number }}
          path: |
            blogger_stores/data/achadinhos_beleza_selection.json
            blogger_stores/data/achadinhos_beleza_rotation.json
            blogger_stores/data/achadinhos_beleza_scan/
            /tmp/achadinhos-beleza-loja.html
          if-no-files-found: warn
          retention-days: 14

# POLICY_GUARD_CENTRAL_ACHADINHOS_BELEZA_2026_11_02
# CONTROLLED_LIVE_BEFORE_SCHEDULE_2026_11_02
# PUBLIC_RATE_LIMIT_RETRY_2026_11_02
