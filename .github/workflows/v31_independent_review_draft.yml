name: V31 - verificação autônoma e DRAFT
on:
  workflow_call:
    inputs:
      site_key:
        required: true
        type: string
      pilot:
        default: false
        type: boolean
      pilot_sku:
        default: ''
        type: string
    outputs:
      verified_draft:
        description: "DRAFT confirmado por leitura autenticada e replay"
        value: ${{ jobs.deliver-draft.outputs.verified_draft }}
      verification_receipt:
        description: "Resultado do verificador mesmo quando NO_NEW_OFFER cancela entrega"
        value: ${{ jobs.independent-verifier.outputs.result }}
permissions:
  contents: read
concurrency:
  # Serializa o writer novo com os writers universais legados no mesmo repo.
  # O controle de site/campanha segue em D1; esta trava evita colisão de workflows.
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false

jobs:
  authenticated-history:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 5
    outputs:
      history: ${{ steps.read.outputs.history }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: C140 — 50 simulações universais antes da leitura e geração de DRAFT
        run: python -m affiliate_hub_v31.editorial_scope_validation --cases 50 --cycle-index ${{ github.run_number }}
      - id: read
        env:
          SITE: ${{ inputs.site_key }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          V31_WORDPRESS_SITE_CREDENTIALS_JSON: ${{ secrets.V31_WORDPRESS_SITE_CREDENTIALS_JSON }}
          CASA_WORDPRESS_USERNAME: ${{ secrets.CASA_WORDPRESS_USERNAME }}
          CASA_WORDPRESS_APP_PASSWORD: ${{ secrets.CASA_WORDPRESS_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from affiliate_hub_v31.autonomous_review import PROFILE
          from affiliate_hub_v31.reviewed_draft_delivery import read_draft_history
          from affiliate_hub_v31.site_request_queue import load_requests
          selected = os.environ["SITE"]
          profiles = json.loads(PROFILE.read_text(encoding="utf-8"))
          if selected not in profiles or not any(r["site_key"] == selected for r in load_requests()):
              raise SystemExit("no_enabled_autonomous_site")
          try:
              history = read_draft_history(selected)
          except Exception:
              raise SystemExit("authenticated_cms_history_failed_closed") from None
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print("history=" + json.dumps(history), file=output)
          print("AUTHENTICATED_CMS_HISTORY_READ")
          PY

  independent-verifier:
    needs: authenticated-history

    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 10
    outputs:
      result: ${{ steps.verify.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.36,<2' 'cryptography>=42'
      - name: Conferir o par de assinatura sem publicar valores
        id: material
        env:
          RECEIPT_KEY: ${{ secrets.V31_AUTONOMOUS_REVIEW_HMAC_KEY }}
          RELEASE_SEED: ${{ secrets.V31_AUTONOMOUS_RELEASE_PRIVATE_KEY_HEX }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from affiliate_hub_v31.review_signatures import configured_signing_keys
          try:
              _, _, public = configured_signing_keys(
                  private_key=os.environ["RELEASE_SEED"], receipt_key=os.environ["RECEIPT_KEY"])
          except ValueError:
              raise SystemExit("autonomous_signing_configuration_invalid") from None
          print("::add-mask::" + public)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print("public=" + public, file=output)
          PY
      - name: Bloquear configuração incoerente
        if: vars.V31_AUTONOMOUS_RELEASE_PUBLIC_KEY_HEX == '' || steps.material.outputs.public != vars.V31_AUTONOMOUS_RELEASE_PUBLIC_KEY_HEX
        run: |
          echo independent_public_key_configuration_mismatch
          exit 1
      - id: verify
        env:
          SITE: ${{ inputs.site_key }}
          PILOT: ${{ inputs.pilot && 'true' || 'false' }}
          PILOT_SKU: ${{ inputs.pilot_sku }}
          CMS_HISTORY: ${{ needs.authenticated-history.outputs.history }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
          V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
          V31_D1_SAFE_WRITES_ENABLED: V31_D1_SAFE_SQL_ONLY
          # C147: somente neste verifier SAFE, depois do GET CMS e antes
          # do DRAFT. Sem conversão em probe/pilot; limite global é do D1.
          V31_ON_DEMAND_CONVERSION: 'true'
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          V31_READY_REVIEW_HMAC_KEY: ${{ secrets.V31_AUTONOMOUS_REVIEW_HMAC_KEY }}
          V31_REVIEW_RELEASE_PRIVATE_KEY_HEX: ${{ secrets.V31_AUTONOMOUS_RELEASE_PRIVATE_KEY_HEX }}
          V31_REVIEW_RELEASE_PUBLIC_KEY_HEX: ${{ steps.material.outputs.public }}
        run: |
          set -euo pipefail
          history="$(mktemp)"
          trap 'rm -f "$history"' EXIT
          printf '%s' "$CMS_HISTORY" > "$history"
          args=(--site-key "$SITE" --history "$history")
          if [[ "$PILOT" == true ]]; then args+=(--pilot --pilot-sku "$PILOT_SKU"); fi
          if ! result="$(python -m affiliate_hub_v31.autonomous_review "${args[@]}")"; then
            echo "$result"
            exit 1
          fi
          echo "$result"
          printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"

  deliver-draft:
    needs: independent-verifier
    if: needs.independent-verifier.outputs.result != '' && fromJSON(needs.independent-verifier.outputs.result).status != 'NO_NEW_OFFER'
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    concurrency:
      group: v31-editorial-catalog-single-writer
      cancel-in-progress: false
    timeout-minutes: 10
    outputs:
      verified_draft: ${{ steps.deliver.outputs.verified_draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.36,<2' 'cryptography>=42' requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Confirmar DRAFT e repetição sem duplicata
        id: deliver
        env:
          SITE: ${{ inputs.site_key }}
          RECEIPT: ${{ needs.independent-verifier.outputs.result }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
          V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
          V31_D1_SAFE_WRITES_ENABLED: V31_D1_SAFE_SQL_ONLY
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          V31_WORDPRESS_SITE_CREDENTIALS_JSON: ${{ secrets.V31_WORDPRESS_SITE_CREDENTIALS_JSON }}
          CASA_WORDPRESS_USERNAME: ${{ secrets.CASA_WORDPRESS_USERNAME }}
          CASA_WORDPRESS_APP_PASSWORD: ${{ secrets.CASA_WORDPRESS_APP_PASSWORD }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, sys, time
          from pathlib import Path
          result = json.loads(os.environ["RECEIPT"])
          os.environ["V31_REVIEW_RELEASE_PUBLIC_KEY_SHA256"] = result["public_key_sha256"]
          args = [sys.executable, "-m", "affiliate_hub_v31.reviewed_draft_delivery",
                  "--site-key", result["site_key"], "--fingerprint", result["fingerprint"],
                  "--execute-draft", "--autonomous"]
          recoverable = {"reviewed_draft_delivery_unverified",
                         "reviewed_draft_lease_release_failed",
                         '{"status": "LEASE_BUSY"}',
                         '{"status": "DRAFT_RECONCILIATION_REQUIRED"}'}
          def confirm_draft():
              for delay in (0, 2, 5):
                  time.sleep(delay)
                  attempt = subprocess.run(args, capture_output=True, text=True, check=False)
                  output = attempt.stdout.strip()
                  print(output)
                  if attempt.returncode == 0:
                      return json.loads(output)
                  if output not in recoverable:
                      break
              raise SystemExit("autonomous_draft_delivery_failed_closed")
          verified = [confirm_draft(), confirm_draft()]
          if verified[0] != verified[1]:
              raise SystemExit("draft_reconciliation_mismatch")
          proof = dict(verified[0], fingerprint=result["fingerprint"], site_key=result["site_key"])
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print("verified_draft=" + json.dumps(proof), file=output)
          print("DRAFT_HTML_AND_REPLAY_VERIFIED")
          PY
