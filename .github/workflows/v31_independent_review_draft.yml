name: V31 - verificação autônoma e DRAFT
on:
  workflow_call:
    inputs:
      site_key:
        required: true
        type: string
      pilot:
        default: false
        type: boolean
permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.select.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: select
        env:
          SITE: ${{ inputs.site_key }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from affiliate_hub_v31.autonomous_review import PROFILE
          from affiliate_hub_v31.site_request_queue import load_requests
          selected = os.environ.get("SITE")
          profiles = json.loads(PROFILE.read_text(encoding="utf-8"))
          sites = [item["site_key"] for item in load_requests()
                   if item["site_key"] in profiles and (not selected or item["site_key"] == selected)]
          if not sites:
              raise SystemExit("no_enabled_autonomous_site")
          print("sites=" + json.dumps(sites))
          PY

  independent-verifier:
    needs: plan

    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 10
    outputs:
      result: ${{ steps.verify.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.36,<2' 'cryptography>=42'
      - id: verify
        env:
          SITE: ${{ inputs.site_key }}
          PILOT: ${{ inputs.pilot && 'true' || 'false' }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
          V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
          V31_D1_SAFE_WRITES_ENABLED: V31_D1_SAFE_SQL_ONLY
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          V31_READY_REVIEW_HMAC_KEY: ${{ secrets.V31_AUTONOMOUS_REVIEW_HMAC_KEY }}
          V31_REVIEW_RELEASE_PRIVATE_KEY_HEX: ${{ secrets.V31_AUTONOMOUS_RELEASE_PRIVATE_KEY_HEX }}
          V31_REVIEW_RELEASE_PUBLIC_KEY_HEX: ${{ vars.V31_AUTONOMOUS_RELEASE_PUBLIC_KEY_HEX }}
        run: |
          set -euo pipefail
          args=(--site-key "$SITE")
          if [[ "$PILOT" == true ]]; then args+=(--pilot); fi
          if ! result="$(python -m affiliate_hub_v31.autonomous_review "${args[@]}")"; then
            echo "$result"
            exit 1
          fi
          echo "$result"
          printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"

  deliver-draft:
    needs: independent-verifier
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    concurrency:
      group: v31-editorial-catalog-single-writer
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.36,<2' 'cryptography>=42' requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Confirmar DRAFT e repetição sem duplicata
        env:
          SITE: ${{ inputs.site_key }}
          RECEIPT: ${{ needs.independent-verifier.outputs.result }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
          V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
          V31_D1_SAFE_WRITES_ENABLED: V31_D1_SAFE_SQL_ONLY
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          V31_WORDPRESS_SITE_CREDENTIALS_JSON: ${{ secrets.V31_WORDPRESS_SITE_CREDENTIALS_JSON }}
          CASA_WORDPRESS_USERNAME: ${{ secrets.CASA_WORDPRESS_USERNAME }}
          CASA_WORDPRESS_APP_PASSWORD: ${{ secrets.CASA_WORDPRESS_APP_PASSWORD }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, sys
          result = json.loads(os.environ["RECEIPT"])
          os.environ["V31_REVIEW_RELEASE_PUBLIC_KEY_HEX"] = result["public_key"]
          args = [sys.executable, "-m", "affiliate_hub_v31.reviewed_draft_delivery",
                  "--site-key", result["site_key"], "--fingerprint", result["fingerprint"],
                  "--execute-draft", "--autonomous"]
          first = subprocess.check_output(args, text=True)
          second = subprocess.check_output(args, text=True)
          if json.loads(first) != json.loads(second):
              raise SystemExit("draft_reconciliation_mismatch")
          print(first.strip())
          print("DRAFT_HTML_AND_REPLAY_VERIFIED")
          PY
