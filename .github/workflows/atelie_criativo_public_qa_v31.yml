name: V31 Atelie Criativo - QA publico visual SAFE (desktop/mobile)
on:
  pull_request:
    paths:
      - "atelie_criativo/verify_public_v31.py"
      - ".github/workflows/atelie_criativo_public_qa_v31.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-publico:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador de teste
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verificar sintaxe
        run: python -m py_compile atelie_criativo/verify_public_v31.py
      - name: QA publico desktop e mobile sem escrita
        run: python -u atelie_criativo/verify_public_v31.py
      - name: Arquivar screenshots e relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelie-v31-public-qa
          path: atelie_criativo/public_qa/
          if-no-files-found: warn
          retention-days: 7
