name: C81 - revisão assinada do link interno Casa 321
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v31_c81_revisao_321.yml']
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 10
    env:
      V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
      V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
      V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
      V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
      V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
      V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
      V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
      V31_D1_SAFE_WRITES_ENABLED: V31_D1_SAFE_SQL_ONLY
      V31_AUTONOMOUS_RELEASE_PUBLIC_KEY_HEX: ${{ vars.V31_AUTONOMOUS_RELEASE_PUBLIC_KEY_HEX }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      V31_REVIEW_RELEASE_PRIVATE_KEY_HEX: ${{ secrets.V31_AUTONOMOUS_RELEASE_PRIVATE_KEY_HEX }}
      V31_READY_REVIEW_HMAC_KEY: ${{ secrets.V31_AUTONOMOUS_REVIEW_HMAC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=42' 'boto3>=1.36,<2' requests
      - run: python -m unittest discover -s affiliate_hub_v31/tests -q
      - run: python -m affiliate_hub_v31.c81_revision_casa_321 review
  deliver:
    needs: review
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 10
    env:
      V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
      V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
      V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
      V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
      V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
      V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
      V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
      V31_D1_SAFE_WRITES_ENABLED: V31_D1_SAFE_SQL_ONLY
      V31_AUTONOMOUS_RELEASE_PUBLIC_KEY_HEX: ${{ vars.V31_AUTONOMOUS_RELEASE_PUBLIC_KEY_HEX }}
      CASA_WORDPRESS_USERNAME: ${{ secrets.CASA_WORDPRESS_USERNAME }}
      CASA_WORDPRESS_APP_PASSWORD: ${{ secrets.CASA_WORDPRESS_APP_PASSWORD }}
      V31_WORDPRESS_SITE_CREDENTIALS_JSON: ${{ secrets.V31_WORDPRESS_SITE_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=42' 'boto3>=1.36,<2' requests
      - run: python -m affiliate_hub_v31.c81_revision_casa_321 deliver
