name: Setup Ventiladores em Foco Store Once

on:
  push:
    paths:
      - '.github/workflows/setup_ventiladores_em_foco_store_once.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar instalação isolada
        run: python tools/setup_ventiladores_em_foco_store.py
      - name: Validar Python gerado
        run: python -m py_compile ventiladores_em_foco_store/src/*.py
      - name: Persistir instalação
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ventiladores_em_foco_store .github/workflows/ventiladores_em_foco_store_safe.yml .github/workflows/ventiladores_em_foco_store_autonomous.yml
          git commit -m 'feat: criar Loja SAFE de Ventiladores em Foco'
          git pull --rebase origin main
          git push origin HEAD:main
