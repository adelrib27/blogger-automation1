name: Casa Prática Lab — Preparar motor independente — uso único

on:
  push:
    paths:
      - ".github/workflows/casa_pratica_lab_prepare_engine_once.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Criar motor, config, regras e histórico isolados
        run: |
          set -euo pipefail
          cp blogger_stores/src/guia_achados_ofertas_store.py blogger_stores/src/casa_pratica_lab_store.py
          cp config/shopee_guia_achados_ofertas.json config/shopee_casa_pratica_lab.json
          cp config/shopee_guia_achados_ofertas_intent_rules.json config/shopee_casa_pratica_lab_intent_rules.json
          python - <<'PY'
          from pathlib import Path
          p=Path('blogger_stores/src/casa_pratica_lab_store.py')
          s=p.read_text(encoding='utf-8')
          reps={
            'guia_achados_ofertas':'casa_pratica_lab',
            'GUIA_ACHADOS_OFERTAS':'CASA_PRATICA_LAB',
            'Guia de Achados & Ofertas':'Casa Prática Lab',
            '1453188702831337099':'8930870316690519385',
            '3858461075334539445':'7691087355641688975',
            'https://guia-de-achados-e-ofertas.blogspot.com/p/loja.html':'https://casa-pratica-lab-20261102.blogspot.com/p/loja.html',
            'https://guia-de-achados-e-ofertas.blogspot.com/2026/11/loja.html':'https://casa-pratica-lab-20261102.blogspot.com/2026/11/loja.html',
            'guia-achados-ofertas-store-auto-css':'casa-pratica-lab-store-auto-css',
            'guia-achados-ofertas-hero-auto-css':'casa-pratica-lab-hero-auto-css',
          }
          for a,b in reps.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          for fp in [Path('config/shopee_casa_pratica_lab.json'),Path('config/shopee_casa_pratica_lab_intent_rules.json')]:
            t=fp.read_text(encoding='utf-8').replace('Guia de Achados & Ofertas','Casa Prática Lab').replace('Guia de Achados e Ofertas','Casa Prática Lab')
            fp.write_text(t,encoding='utf-8')
          Path('blogger_stores/data/casa_pratica_lab_rotation.json').write_text('{\n  "version": 1,\n  "blogId": "8930870316690519385",\n  "runs": []\n}\n',encoding='utf-8')
          print('CASA_PRATICA_LAB_ENGINE_PREP_PASS')
          PY
          python -m py_compile blogger_stores/src/casa_pratica_lab_store.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogger_stores/src/casa_pratica_lab_store.py config/shopee_casa_pratica_lab.json config/shopee_casa_pratica_lab_intent_rules.json blogger_stores/data/casa_pratica_lab_rotation.json
          git commit -m "lab: instalar motor isolado Casa Pratica Lab"
          git pull --rebase origin main
          git push origin HEAD:main
