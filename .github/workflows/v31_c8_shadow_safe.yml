name: V31 C8 - Shadow CSV R2 (somente leitura, desligado por padrao)

on:
  workflow_dispatch:
    inputs:
      site_key:
        description: "Blog cadastrado em shadow.d ou all"
        required: true
        type: string
        default: all
  schedule:
    # 07:47 America/Recife, agendamento NAO executa sem variable de habilitacao.
    - cron: '47 10 * * *'

permissions:
  contents: read

concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false

jobs:
  auditar-cache-sem-publicar:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && vars.V31_EDITORIAL_SHADOW_ENABLED == 'true')
      )
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar somente cliente de armazenamento R2
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Compilar e testar auditor SAFE sem credenciais de publicacao
        run: |
          python -m compileall -q affiliate_hub_v31
          python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Ler o catalogo R2 e auditar disponibilidade por blog
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          V31_C8_SITE: ${{ github.event_name == 'schedule' && 'all' || inputs.site_key }}
        run: python -m affiliate_hub_v31.shadow_audit --site "$V31_C8_SITE"
