name: Moda e Ofertas — Loja Shopee LIVE Controlada

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moda-ofertas-store-live
  cancel-in-progress: false

jobs:
  atualizar-loja:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      BLOGGER_BLOG_ID: "2858597309582499028"
      BLOGGER_STORE_POST_ID: "4871366557503134389"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      SHOPEE_TOP_N: "500"
      MODA_OFERTAS_STORE_RECENT_DAYS: "14"
      MODA_OFERTAS_SHOPEE_SYSTEM_RETRIES: "4"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar código e Policy Guard
        run: |
          set -euo pipefail
          python -m py_compile \
            src/shopee_oportunidades.py \
            src/shopee_oportunidades_v22.py \
            src/shopee_oportunidades_v23.py \
            src/blogger_policy_guard.py \
            src/blogger_policy_guard_self_test.py \
            src/criar_rascunho.py \
            radar_tech_br/src/refresh_blogger_offer_links.py \
            blogger_stores/src/conecta_achados_store.py \
            blogger_stores/src/moda_ofertas_store.py
          PYTHONPATH=src python src/blogger_policy_guard_self_test.py

      - name: Confirmar secrets e alvo
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          test -n "$BLOGGER_CLIENT_ID"
          test -n "$BLOGGER_CLIENT_SECRET"
          test -n "$BLOGGER_REFRESH_TOKEN"
          test "$SHOPEE_APP_ID" = "18352820579"
          test "$BLOGGER_BLOG_ID" = "2858597309582499028"
          test "$BLOGGER_STORE_POST_ID" = "4871366557503134389"

      - name: Gerar seleção SAFE fresca
        run: PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/moda_ofertas_store.py safe

      - name: Validar Policy Guard pré-LIVE
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/moda_ofertas_store.py validate
          PYTHONPATH=src:blogger_stores/src python - <<'PY'
          import json
          from pathlib import Path
          from blogger_policy_guard import require_product_allowed
          data=json.loads(Path('blogger_stores/data/moda_ofertas_selection.json').read_text(encoding='utf-8'))
          products=[p for values in (data.get('categories') or {}).values() for p in values]
          if len(products) != 20:
              raise SystemExit(f'Policy Guard: quantidade inválida {len(products)}/20')
          for product in products:
              require_product_allowed(product)
          print('BLOGGER_POLICY_GUARD_PRELIVE_PASS: 20/20 produtos permitidos')
          print('MODA_OFERTAS_SEMANTIC_PRELIVE_PASS: 5 categorias x 4 intenções')
          PY

      - name: Simular identidade antes da escrita
        run: PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/moda_ofertas_store.py identity-dry-run

      - name: Simular Store e hero antes da publicação
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/moda_ofertas_store.py store-dry-run
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/moda_ofertas_store.py hero-dry-run

      - name: Atualizar vitrine no Store Post
        run: PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/moda_ofertas_store.py store-live

      - name: Sincronizar 12 mini-cards do hero
        run: PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/moda_ofertas_store.py hero-live

      - name: Aplicar identidade Moda e Ofertas no scaffold existente
        run: PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/moda_ofertas_store.py identity-live

      - name: Confirmar identidade depois da escrita
        run: PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/moda_ofertas_store.py identity

      - name: Verificar renderização pública + Policy Guard central
        run: |
          set -euo pipefail
          ok=0
          url="https://moda-ofertas.blogspot.com/2026/10/loja.html"
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36"
          for attempt in $(seq 1 12); do
            code=$(curl -L -sS --max-time 40 \
              -A "$ua" \
              -H "Accept-Language: pt-BR,pt;q=0.9,en;q=0.7" \
              -H "Cache-Control: no-cache" \
              -o /tmp/moda-ofertas-loja.html \
              -w "%{http_code}" \
              "${url}?m=1&store_verify=${GITHUB_RUN_ID}-${attempt}" || true)
            echo "PUBLIC_HTTP_ATTEMPT_${attempt}: ${code}"
            if [ "$code" = "429" ]; then
              sleep 15
              continue
            fi
            if [ "$code" != "200" ]; then
              sleep 10
              continue
            fi
            store_count=$(python -c "print(open('/tmp/moda-ofertas-loja.html', encoding='utf-8', errors='ignore').read().count('data-item-id='))")
            hero_count=$(python -c "print(open('/tmp/moda-ofertas-loja.html', encoding='utf-8', errors='ignore').read().count('data-hero-item-id='))")
            echo "PUBLIC_COUNTS_ATTEMPT_${attempt}: store=${store_count} hero=${hero_count}"
            if grep -q "bls-store-grid" /tmp/moda-ofertas-loja.html \
              && grep -q "blh-grid" /tmp/moda-ofertas-loja.html \
              && grep -q "blogger-liq-layout-wide-css" /tmp/moda-ofertas-loja.html \
              && grep -q "https://moda-ofertas.blogspot.com/p/loja.html" /tmp/moda-ofertas-loja.html \
              && grep -q "bls-moda-feminina" /tmp/moda-ofertas-loja.html \
              && grep -q "bls-moda-masculina" /tmp/moda-ofertas-loja.html \
              && grep -q "bls-calcados-bolsas" /tmp/moda-ofertas-loja.html \
              && grep -q "bls-acessorios" /tmp/moda-ofertas-loja.html \
              && grep -q "bls-beleza-cuidados" /tmp/moda-ofertas-loja.html \
              && grep -q "Moda, beleza e ofertas para renovar o dia a dia" /tmp/moda-ofertas-loja.html \
              && ! grep -q "https://conectaachados.blogspot.com/p/loja.html" /tmp/moda-ofertas-loja.html \
              && ! grep -q "https://achadosparacasa2026.blogspot.com/p/loja.html" /tmp/moda-ofertas-loja.html \
              && ! grep -q "https://vitrine-pratica.blogspot.com/p/loja.html" /tmp/moda-ofertas-loja.html \
              && ! grep -q "https://liquidificadores-em-foco.blogspot.com/p/loja.html" /tmp/moda-ofertas-loja.html \
              && ! grep -q "https://estilo-no-dia-a-dia-0071220800-2.blogspot.com/p/loja.html" /tmp/moda-ofertas-loja.html \
              && [ "$store_count" -eq 20 ] && [ "$hero_count" -eq 12 ]; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
          PYTHONPATH=src python - <<'PY'
          from blogger_policy_guard import require_store_html_allowed
          raw=open('/tmp/moda-ofertas-loja.html', encoding='utf-8', errors='ignore').read()
          require_store_html_allowed(raw, expected_products=20, expected_hero=12)
          required=[
              'https://moda-ofertas.blogspot.com/p/loja.html',
              'bls-moda-feminina',
              'bls-moda-masculina',
              'bls-calcados-bolsas',
              'bls-acessorios',
              'bls-beleza-cuidados',
              'Moda, beleza e ofertas para renovar o dia a dia',
          ]
          missing=[x for x in required if x not in raw]
          if missing:
              raise SystemExit(f'Moda e Ofertas identity: marcadores ausentes {missing}')
          forbidden=[
              'https://conectaachados.blogspot.com/p/loja.html',
              'https://achadosparacasa2026.blogspot.com/p/loja.html',
              'https://vitrine-pratica.blogspot.com/p/loja.html',
              'https://liquidificadores-em-foco.blogspot.com/p/loja.html',
              'https://estilo-no-dia-a-dia-0071220800-2.blogspot.com/p/loja.html',
          ]
          bad=[x for x in forbidden if x in raw]
          if bad:
              raise SystemExit(f'Moda e Ofertas identity: referências indevidas {bad}')
          print('BLOGGER_POLICY_GUARD_PUBLIC_PASS: 20 products + 12 hero')
          print('MODA_OFERTAS_IDENTITY_PUBLIC_PASS: domínio, Page LOJA e cinco categorias de moda/beleza corretos')
          PY

      - name: Persistir rotação somente após PASS público
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/moda_ofertas_store.py persist
          if [ -z "$(git status --porcelain -- blogger_stores/data/moda_ofertas_selection.json blogger_stores/data/moda_ofertas_rotation.json)" ]; then
            echo "Sem mudanças de estado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogger_stores/data/moda_ofertas_selection.json blogger_stores/data/moda_ofertas_rotation.json
          git commit -m "Atualizar rotação automática da Loja Moda e Ofertas"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moda-ofertas-store-live-${{ github.run_number }}
          path: |
            blogger_stores/data/moda_ofertas_selection.json
            blogger_stores/data/moda_ofertas_rotation.json
            blogger_stores/data/moda_ofertas_scan/
            /tmp/moda-ofertas-loja.html
          if-no-files-found: warn
          retention-days: 14

# POLICY_GUARD_CENTRAL_MODA_OFERTAS_2026_11_02
# MANUAL_ONLY_BEFORE_FIRST_LIVE_2026_11_02
# PUBLIC_RATE_LIMIT_RETRY_2026_11_02
