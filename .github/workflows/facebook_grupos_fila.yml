name: Facebook Grupos — Preparar Fila

on:
  workflow_dispatch:
  schedule:
    - cron: "20 12 * * *"
    - cron: "20 21 * * *"

permissions:
  contents: write

concurrency:
  group: facebook-groups-assisted-queue
  cancel-in-progress: false

jobs:
  preparar-fila:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar fila assistida de grupos
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python src/preparar_fila_grupos.py

      - name: Gerar painel da fila
        run: python src/gerar_painel_grupos.py

      - name: Registrar alterações da fila
        run: |
          if git diff --quiet -- data/facebook_fila_grupos.json data/facebook_grupos_publicados.json; then
            echo "Nenhuma alteração persistente na fila."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/facebook_fila_grupos.json data/facebook_grupos_publicados.json
          git commit -m "Atualizar fila assistida de grupos do Facebook"
          git push

      - name: Salvar painel e resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-grupos-fila
          path: |
            artifacts/facebook_grupos_painel.html
            artifacts/facebook_grupos_queue_result.json
            data/facebook_fila_grupos.json
          if-no-files-found: warn
