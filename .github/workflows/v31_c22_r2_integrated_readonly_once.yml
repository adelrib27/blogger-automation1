name: V31 C22 - E2E Catalogo R2 Intencao Blog SAFE TEMP
on:
  push:
    branches:
      - feature/v31-affiliate-hub-c1-safe-20261115
    paths:
      - affiliate_hub_v31/C22_REAL_CANARY_TRIGGER_2026-11-17.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  c22-real-r2-readonly:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/feature/v31-affiliate-hub-c1-safe-20261115'
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Validacao completa offline
        run: |
          python -m compileall -q affiliate_hub_v31
          python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Canario real triagem propostas planejador e bloqueio de fontes
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: |
          python - <<'PY'
          import json,tempfile
          from pathlib import Path
          from affiliate_hub_v31.catalog import Catalog
          from affiliate_hub_v31.review_proposals import propose_review_batch,summarize_review_batch
          from affiliate_hub_v31.site_launch_plan import preview_site_launch,summarize_site_launch
          from affiliate_hub_v31.curation_triage import triage_backlog
          from affiliate_hub_v31.source_policy_gate import source_safe_for_use
          from affiliate_hub_v31.r2_state import R2State,verify_database
          with tempfile.TemporaryDirectory(prefix='v31-c22-r2-readonly-') as folder:
              local=Path(folder)/'catalog.sqlite3'
              assert R2State.from_env().restore_to(local), 'r2_catalog_missing'
              verify_database(local)
              with Catalog(local) as c:
                  before=c.stats()
                  assert before=={'products':203649,'eligible':8685,'review':194964,
                                 'cached_affiliate_links':17}, 'catalog_baseline_changed'
                  triage=triage_backlog(c,max_categories=12)
                  assert triage['prior_approvals_with_protected_or_conflicting_source']==282
                  for l1,l2 in (('home living','kitchenware'),
                                ('home living','tools home improvement'),
                                ('home living','furniture'),
                                ('spare parts and accessories for vehicles',
                                 'internal accessories for automobiles')):
                      proposals=summarize_review_batch(propose_review_batch(
                          c,category_l1=l1,category_l2=l2,limit=16,max_per_shop=1))
                      assert not proposals['can_publish'] and proposals['r2_writes']==0
                      print('V31_C22_REAL_REVIEW_PROPOSAL_PASS',json.dumps(proposals,sort_keys=True))
                  for topic,platform,site in (
                      ('Air Fryer','blogger','blogger_air_fryers'),
                      ('Air Fryer','wordpress','wordpress_radartechbr'),
                      ('Organizador de Cozinha','wordpress','wordpress_casa_decoracao'),
                      ('Air Fryer','blogger',None),
                  ):
                      launch=summarize_site_launch(preview_site_launch(
                          c,topic=topic,platform=platform,site_key=site))
                      assert launch['publication_calls']==0 and launch['r2_writes']==0
                      assert launch['affiliate_conversion_calls']==0
                      assert not launch['can_publish']
                      print('V31_C22_REAL_SITE_PLAN_PASS',json.dumps(launch,sort_keys=True))
                  # Conversor/planejamento universal nunca devem receber um dos
                  # 282 historicamente elegiveis barrados pelo gate de origem.
                  selected_keys=set()
                  for campaign in ('airfryers','radarwp','casaedecoracaowp'):
                      for key,*_ in c.candidates(campaign,limit=100):
                          assert source_safe_for_use(c,key)
                      for key,*_ in c.select_products(campaign,limit=100):
                          assert source_safe_for_use(c,key)
                          selected_keys.add(key)
                  assert c.stats()==before, 'catalog_mutated'
                  print('V31_C22_R2_INTEGRATED_FINAL_PASS',json.dumps({
                      'products':before['products'],'review':before['review'],
                      'previously_editorially_eligible':before['eligible'],
                      'source_policy_blocked_from_legacy':282,
                      'previously_eligible_not_source_blocked':8685-282,
                      'affiliate_links_preserved':before['cached_affiliate_links'],
                      'source_safe_plan_samples':len(selected_keys),
                      'shopee_api_calls':0,'r2_writes':0,'new_posts':0
                  },sort_keys=True))
          PY
