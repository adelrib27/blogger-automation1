name: Achados que Valem — Habilitar kickoff LIVE temporário — uso único

on:
  push:
    paths:
      - ".github/workflows/achados_que_valem_live_kickoff_patch_once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Adicionar push temporário ao LIVE
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/achados_que_valem_store_autonomous.yml')
          s=p.read_text(encoding='utf-8')
          old='on:\n  workflow_dispatch:\n\npermissions:'
          new='on:\n  workflow_dispatch:\n  push:\n    paths:\n      - "blogger_stores/achados_que_valem_live_kickoff.txt"\n\npermissions:'
          if old not in s: raise SystemExit('LIVE_KICKOFF_PATCH_FAIL: on esperado ausente')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='\n')
          print('ACHADOS_QUE_VALEM_LIVE_KICKOFF_PATCH_PASS')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/achados_que_valem_store_autonomous.yml
          git commit -m "achados que valem: habilitar kickoff LIVE temporario"
          git pull --rebase origin main
          git push origin HEAD:main
