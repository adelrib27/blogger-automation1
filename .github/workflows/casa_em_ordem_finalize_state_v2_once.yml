name: Casa em Ordem — Consolidar estado final v2

on:
  push:
    paths:
      - "blogger_stores/casa_em_ordem_finalize_state_v2_once.txt"

permissions:
  contents: write

jobs:
  consolidar-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidar e validar estado canônico
        run: |
          set -euo pipefail
          python tools/casa_em_ordem_finalize_state_v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            blogger_multi_store/data/NETWORK_STORE_INVENTORY_2026-11-01.json \
            blogger_multi_store/config/network_store_rollout_2026-11-01.json \
            CHECKPOINT_ATUAL.md
          git commit -m "checkpoint: concluir Casa em Ordem como pipeline 11 de 11"
          git pull --rebase origin main
          git push origin HEAD:main
