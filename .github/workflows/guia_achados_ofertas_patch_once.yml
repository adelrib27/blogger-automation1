name: Guia de Achados & Ofertas — Patch semântico pontual — uso único

on:
  push:
    paths:
      - ".github/workflows/guia_achados_ofertas_patch_once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Endurecer ventiladores e climatizador após inspeção manual
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('blogger_stores/src/guia_achados_ofertas_store.py')
          s=p.read_text(encoding='utf-8')
          replacements={
            '"climatizador ar": ["filtro avulso", "filtro reposicao", "filtro de reposicao", "refil", "peca", "acessorio", "automotivo", "limpeza", "higienizador"],':
            '"climatizador ar": ["filtro avulso", "filtro reposicao", "filtro de reposicao", "refil", "peca", "acessorio", "automotivo", "limpeza", "higienizador", "mini refrigerador", "mini ventilador", "usb", "ar condicionado"],',
            '"ventilador parede": lambda: "ventilador" in title and "parede" in title,':
            '"ventilador parede": lambda: any(x in title for x in ["ventilador de parede", "ventilador parede"]),',
            '"ventilador mesa": lambda: "ventilador" in title and "mesa" in title,':
            '"ventilador mesa": lambda: any(x in title for x in ["ventilador de mesa", "ventilador mesa"]),',
            '("Hélice Avulsa para Ventilador de Parede", "ventilador parede", False),':
            '("Suporte De Parede Porta Controle Remoto Ar Ventilador", "ventilador parede", False),',
            '("Grade Avulsa para Ventilador de Mesa", "ventilador mesa", False),':
            '("Ventilador Mini Portátil USB de Mão Suporte Mesa", "ventilador mesa", False),',
            '("Filtro de Reposição para Climatizador de Ar", "climatizador ar", False),':
            '("MINI Refrigerador De Ar Ventilador Umidificador Climatizador Ar USB", "climatizador ar", False),',
            'semantic["profileVersion"] = 1': 'semantic["profileVersion"] = 2',
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit('GUIA_CLIMA_PATCH_FAIL script: '+old)
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='\n')

          p=Path('config/shopee_guia_achados_ofertas_intent_rules.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['version']=2
          d['description']='Regras semânticas v2 específicas do Guia de Achados & Ofertas; revisão manual endureceu ventiladores de parede/mesa por frase de produto e bloqueou mini pseudo-climatizadores, além de peças e acessórios.'
          d['rules']['ventilador parede']['require_groups']=[["ventilador de parede","ventilador parede"]]
          d['rules']['ventilador mesa']['require_groups']=[["ventilador de mesa","ventilador mesa"]]
          for term in ['mini refrigerador','mini ventilador','usb','ar condicionado']:
              if term not in d['rules']['climatizador ar']['block_phrases']:
                  d['rules']['climatizador ar']['block_phrases'].append(term)
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=Path('config/shopee_guia_achados_ofertas.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['version']=2
          d['semantic_rules_version']=2
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('GUIA_SEMANTIC_CLIMA_V2_PATCH_PASS')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogger_stores/src/guia_achados_ofertas_store.py config/shopee_guia_achados_ofertas_intent_rules.json config/shopee_guia_achados_ofertas.json
          git commit -m "guia: endurecer perfil semantico v2 de clima"
          git pull --rebase origin main
          git push origin HEAD:main
