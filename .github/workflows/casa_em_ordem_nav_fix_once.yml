name: Casa em Ordem — Correção pontual navegação Loja

on:
  push:
    paths:
      - "blogger_stores/casa_em_ordem_nav_fix_once.txt"

permissions:
  contents: write

concurrency:
  group: casa-em-ordem-store-live
  cancel-in-progress: false

jobs:
  corrigir-navegacao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Corrigir motor e validar sintaxe
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('blogger_stores/src/casa_em_ordem_store.py')
          raw=p.read_text(encoding='utf-8')
          old='''def transform_identity(raw: str) -> str:\n    out = raw\n    for old, new in IDENTITY_REPLACEMENTS:\n        out = out.replace(old, new)\n    return out\n'''
          new='''NAV_REPLACEMENTS = [\n    ('<a class="bls-btn bls-btn-main" href="#bls-quarto">Ver organização</a>', '<a class="bls-btn bls-btn-main" href="#bls-organizacao">Ver organização</a>'),\n    ('<a class="bls-btn bls-btn-soft" href="#bls-banheiro">Ver quarto</a>', '<a class="bls-btn bls-btn-soft" href="#bls-quarto">Ver quarto</a>'),\n    ('<a class="bls-btn bls-btn-main" href="#bls-lavanderia">Ver banheiro</a>', '<a class="bls-btn bls-btn-main" href="#bls-banheiro">Ver banheiro</a>'),\n    ('<a class="bls-btn bls-btn-soft" href="#bls-decoracao">Ver lavanderia</a>', '<a class="bls-btn bls-btn-soft" href="#bls-lavanderia">Ver lavanderia</a>'),\n]\n\n\ndef transform_identity(raw: str) -> str:\n    out = raw\n    for old, new in IDENTITY_REPLACEMENTS:\n        out = out.replace(old, new)\n    for old, new in NAV_REPLACEMENTS:\n        out = out.replace(old, new)\n    return out\n'''
          if old not in raw:
              if 'NAV_REPLACEMENTS = [' not in raw:
                  raise SystemExit('CASA_ORDEM_NAV_ENGINE_FAIL: bloco transform_identity não encontrado')
          else:
              raw=raw.replace(old,new,1)
          marker='        "blogger-liq-layout-wide-css",\n'
          extra='''        '<a class="bls-btn bls-btn-main" href="#bls-organizacao">Ver organização</a>',\n        '<a class="bls-btn bls-btn-soft" href="#bls-quarto">Ver quarto</a>',\n        '<a class="bls-btn bls-btn-main" href="#bls-banheiro">Ver banheiro</a>',\n        '<a class="bls-btn bls-btn-soft" href="#bls-lavanderia">Ver lavanderia</a>',\n'''
          if extra not in raw:
              if marker not in raw:
                  raise SystemExit('CASA_ORDEM_NAV_ENGINE_FAIL: marcador verify_identity ausente')
              raw=raw.replace(marker, marker+extra, 1)
          p.write_text(raw,encoding='utf-8')
          print('CASA_ORDEM_NAV_ENGINE_PATCH_PASS')
          PY
          python -m py_compile blogger_stores/src/casa_em_ordem_store.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- blogger_stores/src/casa_em_ordem_store.py)" ]; then
            git add blogger_stores/src/casa_em_ordem_store.py
            git commit -m "casa em ordem: corrigir ancoras dos botoes do hero"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Corrigir somente identidade/navegação no Blogger
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/casa_em_ordem_store.py identity-live
      - name: Validar 20+12 e quatro âncoras após correção
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import os
          import google.oauth2.credentials
          import googleapiclient.discovery
          from blogger_policy_guard import require_store_html_allowed
          creds=google.oauth2.credentials.Credentials(None,refresh_token=os.environ['BLOGGER_REFRESH_TOKEN'],token_uri='https://oauth2.googleapis.com/token',client_id=os.environ['BLOGGER_CLIENT_ID'],client_secret=os.environ['BLOGGER_CLIENT_SECRET'])
          service=googleapiclient.discovery.build('blogger','v3',credentials=creds,cache_discovery=False)
          post=service.posts().get(blogId='4177382081459143374',postId='5566188787681469799').execute()
          raw=str(post.get('content') or '')
          require_store_html_allowed(raw, expected_products=20, expected_hero=12)
          required=[
            '<a class="bls-btn bls-btn-main" href="#bls-organizacao">Ver organização</a>',
            '<a class="bls-btn bls-btn-soft" href="#bls-quarto">Ver quarto</a>',
            '<a class="bls-btn bls-btn-main" href="#bls-banheiro">Ver banheiro</a>',
            '<a class="bls-btn bls-btn-soft" href="#bls-lavanderia">Ver lavanderia</a>',
          ]
          missing=[x for x in required if x not in raw]
          if missing:
              raise SystemExit(f'CASA_ORDEM_NAV_FIX_FAIL: {missing}')
          if raw.count('data-item-id=') != 20 or raw.count('data-hero-item-id=') != 12:
              raise SystemExit('CASA_ORDEM_NAV_FIX_FAIL: contrato 20+12 alterado')
          print('CASA_ORDEM_NAV_FIX_PASS: 4/4 âncoras corretas; 20+12 preservado')
          PY
