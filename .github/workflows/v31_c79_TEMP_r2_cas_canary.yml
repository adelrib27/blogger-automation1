name: V31 C79 TEMP canario R2 S3 CAS SAFE
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v31_c79_TEMP_r2_cas_canary.yml'
permissions:
  contents: read
concurrency:
  group: v31-c79-r2-private-only
  cancel-in-progress: false
jobs:
  cas-synthetic-private:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
      V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
      V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
      V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing S3 SDK
        run: python -m pip install 'boto3>=1.35,<2'
      - name: One synthetic CAS write, readback, 412 and scoped cleanup
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, hmac, json, os, secrets, sys
          from unittest.mock import patch
          from botocore.exceptions import ClientError
          from affiliate_hub_v31.r2_state import R2State
          from affiliate_hub_v31.r2_private_ready_backend import R2PrivateReadyBackend, ACCOUNT_ID, BUCKET
          from affiliate_hub_v31.private_ready_envelope import ImmutablePrivateReadyEnvelope, PrivateEnvelopeError, object_key
          from affiliate_hub_v31.reviewed_ready_promotion import review_payload
          
          def run():
              if os.environ.get("V31_EDITORIAL_R2_ACCOUNT_ID") != ACCOUNT_ID or os.environ.get("V31_EDITORIAL_R2_BUCKET") != BUCKET:
                  raise RuntimeError("C79_CANARY_ACCOUNT_BUCKET_MISMATCH")
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "")
              if not run_id.isdecimal() or not attempt.isdecimal():
                  raise RuntimeError("C79_CANARY_RUN_CONTEXT_INVALID")
              nonce = run_id + "_" + attempt + "_" + secrets.token_hex(10)
              site, campaign = "v31_c79_canary", "c79canary"
              route = {"site_key": site, "campaign": campaign, "platform": "blogger", "publish_enabled": False}
              html = "<article><h2>Canario R2 de integridade</h2><p>Teste sintetico de escrita condicional e leitura privada, sem oferta, produto, chamada CMS ou publicacao. Nonce " + nonce + ".</p></article>"
              sha = hashlib.sha256(html.encode("utf-8")).hexdigest()
              signing_key = secrets.token_bytes(48)
              payload = review_payload(
                  site_key=site, campaign=campaign, product_key="shopee:999999:888888",
                  site_url="https://c79-synthetic.invalid/",
                  article_url="https://c79-synthetic.invalid/teste/",
                  article_title="Teste sintetico de integridade",
                  primary_query="teste de integridade", angle="testar condicao atomica",
                  html_sha256=sha, evidence_sha256="0" * 64, seo_context_sha256="1" * 64,
                  reviewed_text_hashes=[],
              )
              canonical = json.dumps(payload, sort_keys=True, ensure_ascii=False,
                                     separators=(",", ":")).encode("utf-8")
              signature = hmac.new(signing_key, canonical, hashlib.sha256).hexdigest()
              attestation = {"payload": payload, "signature": signature}
              storage = R2State.from_env()
              backend = R2PrivateReadyBackend(storage)
              envelope = ImmutablePrivateReadyEnvelope(backend=backend)
              test_key, clean = None, False
              with patch("affiliate_hub_v31.private_ready_envelope.sites", return_value={site: route}):
                  test_key = object_key(site, campaign, sha)
                  try:
                      if backend.get(test_key) is not None:
                          raise RuntimeError("C79_CANARY_COLLISION")
                      first = envelope.save(
                          site_key=site, campaign=campaign, product_key="shopee:999999:888888",
                          content_html=html, attestation=attestation,
                          independent_review_key=signing_key,
                      )
                      if first["status"] != "PRIVATE_ENVELOPE_CREATED" or first["object_key"] != test_key:
                          raise RuntimeError("C79_CANARY_CREATE_UNCONFIRMED")
                      second = envelope.save(
                          site_key=site, campaign=campaign, product_key="shopee:999999:888888",
                          content_html=html, attestation=attestation,
                          independent_review_key=signing_key,
                      )
                      if second["status"] != "PRIVATE_ENVELOPE_ALREADY_VALID":
                          raise RuntimeError("C79_CANARY_REPLAY_FAILED")
                      loaded = envelope.load(
                          site_key=site, campaign=campaign, html_sha256=sha,
                          independent_review_key=signing_key,
                      )
                      if loaded["html_content"] != html or loaded["html_sha256"] != sha:
                          raise RuntimeError("C79_CANARY_READBACK_MISMATCH")
                      try:
                          storage.s3.put_object(
                              Bucket=BUCKET, Key=test_key, Body=b"attempted-unsafe-overwrite",
                              IfNoneMatch="*", ContentType="text/plain",
                          )
                      except ClientError as exc:
                          response = exc.response
                          if (response.get("Error", {}).get("Code") != "PreconditionFailed"
                                  or response.get("ResponseMetadata", {}).get("HTTPStatusCode") != 412):
                              raise RuntimeError("C79_CANARY_WRONG_CONDITION_FAILURE") from None
                      else:
                          raise RuntimeError("C79_CANARY_CONDITIONAL_OVERWRITE_ACCEPTED")
                      if backend.get(test_key) is None:
                          raise RuntimeError("C79_CANARY_OBJECT_DISAPPEARED")
                      print("V31_C79_R2_CAS_REAL_PASS")
                      print("V31_C79_R2_IMMUTABLE_ENVELOPE_REAL_PASS")
                  finally:
                      # A unique, unregistered canary tenant. Delete ONLY if signature
                      # and exact HTML content prove it is the canary object.
                      try:
                          verified = envelope.load(
                              site_key=site, campaign=campaign, html_sha256=sha,
                              independent_review_key=signing_key,
                          )
                          if verified["html_content"] == html:
                              storage.s3.delete_object(Bucket=BUCKET, Key=test_key)
                              clean = backend.get(test_key) is None
                      except PrivateEnvelopeError:
                          clean = backend.get(test_key) is None
                      print("V31_C79_R2_CANARY_CLEANUP_ZERO=" + str(clean).lower())
                      if not clean:
                          raise RuntimeError("C79_CANARY_CLEANUP_NOT_CONFIRMED")
              return 0
          
          try:
              sys.exit(run())
          except Exception as exc:
              # No identifiers or data in log, only sanitized exception class.
              print("V31_C79_R2_CANARY_BLOCKED_" + type(exc).__name__)
              sys.exit(3)
          PY
