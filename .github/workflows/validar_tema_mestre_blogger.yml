name: Validar Temas Blogger

on:
  push:
    paths:
      - "blogger_themes/**"
      - "src/validar_tema_blogger.py"
      - "src/validar_tema_editorial_blogger.py"
      - "src/validar_tema_editorial_achados_blogger.py"
      - ".github/workflows/validar_tema_mestre_blogger.yml"
  pull_request:
    paths:
      - "blogger_themes/**"
      - "src/validar_tema_blogger.py"
      - "src/validar_tema_editorial_blogger.py"
      - "src/validar_tema_editorial_achados_blogger.py"
      - ".github/workflows/validar_tema_mestre_blogger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-temas:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar tema de produto V3.0
        run: python src/validar_tema_blogger.py
      - name: Validar tema editorial independente V1.0 (histórico)
        run: python src/validar_tema_editorial_blogger.py
      - name: Validar tema editorial baseado no Achados para Casa V1.0
        run: python src/validar_tema_editorial_achados_blogger.py
