name: V31 Pedal Leve - Shopee Catalog SAFE
on:
  pull_request:
    paths:
      - "pedal_leve/shopee_catalog_safe.py"
      - ".github/workflows/pedal_leve_shopee_safe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogo-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validacao offline sem publicacao
        run: |
          python -m py_compile pedal_leve/shopee_catalog_safe.py src/blogger_policy_guard.py
          python pedal_leve/shopee_catalog_safe.py --self-test
      - name: Consultar catalogo real e aplicar filtros SAFE
        run: |
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          python -u pedal_leve/shopee_catalog_safe.py
