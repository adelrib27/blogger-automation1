name: V31 C24 TEMP Verificar SHOPEE_SECRET legado so leitura
on:
  push:
    branches:
      - feature/v31-affiliate-hub-c1-safe-20261115
    paths:
      - affiliate_hub_v31/C24_LEGACY_SHOPEE_SECRET_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-c24-legacy-shopee-secret-once
  cancel-in-progress: false
jobs:
  verify-legacy-credential:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/feature/v31-affiliate-hub-c1-safe-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SHOPEE_APP_ID + SHOPEE_SECRET - uma consulta productOfferV2 somente leitura
        env:
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          python -m affiliate_hub_v31.shopee_probe
          echo 'V31_C24_LEGACY_SECRET_AUTH_READONLY_SUCCESS'
