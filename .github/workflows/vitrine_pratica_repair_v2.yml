name: Vitrine Prática — Finalizar post Loja

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/vitrine_pratica_repair_v2.yml"

permissions:
  contents: write

concurrency:
  group: vitrine-pratica-repair-v2
  cancel-in-progress: false

jobs:
  reparar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BLOGGER_BLOG_ID: "9144338307944682868"
      BLOGGER_STORE_POST_ID: "115613719594316807"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restaurar arquitetura mais recente e acrescentar CTA/click
        run: |
          set -euo pipefail
          git checkout 5e655896818064dbf52ac033ee882a365e4e485a -- vitrine_pratica_store/src vitrine_pratica_store/config
          rm -rf vitrine_pratica_store/src/__pycache__
          python - <<'PY'
          from pathlib import Path

          p=Path('vitrine_pratica_store/src/store_auto.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import os\nimport sys\n','import os\nimport re\nimport sys\n',1)
          needle='''def main() -> None:\n    apply_runtime_patches()'''
          helper='''def enhance_store_block(block: str) -> str:\n    old_css = ".bls-product{display:block;min-width:0;text-decoration:none;color:#17212b}"\n    new_css = ".bls-product{display:block;min-width:0;text-decoration:none;color:#17212b;position:relative;z-index:2;pointer-events:auto!important;cursor:pointer!important}\\n.bls-product>*{pointer-events:none!important}\\n.bls-product-cta{display:flex;align-items:center;justify-content:center;margin-top:9px;padding:9px 10px;border-radius:8px;background:#ee4d2d;color:#fff;font-size:11px;font-weight:900;line-height:1.15;text-align:center}"\n    if old_css not in block:\n        raise RuntimeError("CSS base dos cards não encontrado.")\n    block = block.replace(old_css, new_css, 1)\n\n    def add_cta(match):\n        card = match.group(0)\n        if 'bls-product-cta' in card:\n            return card\n        return card[:-4] + '\\n  <span class="bls-product-cta">Ver oferta na Shopee</span>\\n</a>'\n\n    block, count = re.subn(r'<a class="bls-product"[^>]*>.*?</a>', add_cta, block, flags=re.S)\n    expected = len(CATEGORY_SPECS) * ITEMS_PER_CATEGORY\n    if count != expected or block.count('bls-product-cta') < expected:\n        raise RuntimeError(f"CTA dos cards inválido: encontrados={count}, esperado={expected}.")\n    return block\n\n\ndef main() -> None:\n    apply_runtime_patches()'''
          if needle not in s:
              raise SystemExit('Ponto de inserção main não encontrado')
          s=s.replace(needle,helper,1)
          old='    block = base.render_store_block(chosen)\n'
          new='    block = enhance_store_block(base.render_store_block(chosen))\n'
          if old not in s:
              raise SystemExit('Renderização da vitrine não encontrada')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('vitrine_pratica_store/src/store_layout_patch.py')
          s=p.read_text(encoding='utf-8')
          old='.bls-page{{width:min(1440px,calc(100vw - 48px))!important;max-width:none!important;position:relative!important;left:50%!important;transform:translateX(-50%)!important;margin-top:32px!important;margin-bottom:0!important}}\n'
          new=old + '.bls-product,.blh-product{{position:relative!important;z-index:5!important;pointer-events:auto!important;cursor:pointer!important}}\n.bls-product>*,.blh-product>*{{pointer-events:none!important}}\n.bls-product-cta{{display:flex!important;align-items:center!important;justify-content:center!important;margin-top:9px!important;padding:9px 10px!important;border-radius:8px!important;background:#ee4d2d!important;color:#fff!important;font-size:11px!important;font-weight:900!important;line-height:1.15!important;text-align:center!important}}\n'
          if old not in s:
              raise SystemExit('Patch de largura não encontrado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile vitrine_pratica_store/src/*.py
      - name: Persistir motor corrigido sem perder filtros recentes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitrine_pratica_store/src vitrine_pratica_store/config
          git rm -r --cached --ignore-unmatch vitrine_pratica_store/src/__pycache__ || true
          if git diff --cached --quiet; then
            echo "Sem alterações de motor."
          else
            git commit -m "Finalizar cards clicáveis e layout amplo da Loja Vitrine Prática"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Atualizar patch de layout no post Loja
        run: PYTHONPATH=src:vitrine_pratica_store/src python -u vitrine_pratica_store/src/store_layout_patch.py
      - name: Acrescentar CTA aos 20 cards atuais sem trocar produtos
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import re
          from pathlib import Path
          from criar_rascunho import criar_servico_blogger

          BLOG_ID='9144338307944682868'
          POST_ID='115613719594316807'
          blogger=criar_servico_blogger()
          post=blogger.posts().get(blogId=BLOG_ID,postId=POST_ID).execute()
          raw=str(post.get('content') or '')
          Path('/tmp/vitrine-pratica-post-before.html').write_text(raw,encoding='utf-8')

          def add_cta(m):
              card=m.group(0)
              if 'bls-product-cta' in card:
                  return card
              return card[:-4]+'\n  <span class="bls-product-cta">Ver oferta na Shopee</span>\n</a>'

          raw,count=re.subn(r'<a class="bls-product"[^>]*>.*?</a>',add_cta,raw,flags=re.S)
          if count != 20:
              raise SystemExit(f'Cards principais encontrados={count}; esperado=20')
          if raw.count('bls-product-cta') < 20:
              raise SystemExit('CTA não foi inserido nos 20 cards')
          if raw.count('href="https://s.shopee.com.br/') < 32:
              raise SystemExit('Links Shopee insuficientes')
          if 'https://liquidificador-philips-walita-ri2242.blogspot.com/p/loja.html' in raw:
              raise SystemExit('Link incorreto do Liquidificador ainda presente no post Vitrine')
          if 'https://vitrine-pratica.blogspot.com/p/loja.html' not in raw:
              raise SystemExit('Link do menu Vitrine não encontrado no patch')

          body={'title':post.get('title') or 'Loja','content':raw}
          if post.get('labels') is not None:
              body['labels']=post.get('labels')
          blogger.posts().update(blogId=BLOG_ID,postId=POST_ID,body=body).execute()
          verify=blogger.posts().get(blogId=BLOG_ID,postId=POST_ID).execute()
          vr=str(verify.get('content') or '')
          Path('/tmp/vitrine-pratica-post-after.html').write_text(vr,encoding='utf-8')
          assert vr.count('data-item-id=') == 20
          assert vr.count('data-hero-item-id=') == 12
          assert vr.count('bls-product-cta') >= 20
          assert vr.count('href="https://s.shopee.com.br/') >= 32
          assert 'blogger-liq-layout-wide-css' in vr
          print('BLOGGER_POST_OK cards=20 hero=12 ctas=20 links>=32 layout=wide')
          PY
      - name: Validar post público
        run: |
          set -euo pipefail
          ok=0
          url="https://vitrine-pratica.blogspot.com/2026/11/loja.html"
          for attempt in 1 2 3 4 5 6; do
            curl -L -fsS --max-time 40 "${url}?repair_v2=${GITHUB_RUN_ID}-${attempt}" > /tmp/vitrine-pratica-public.html || true
            if python - <<'PY'
          from pathlib import Path
          t=Path('/tmp/vitrine-pratica-public.html').read_text(encoding='utf-8',errors='ignore')
          assert 'blogger-liq-layout-wide-css' in t
          assert t.count('data-item-id=') == 20
          assert t.count('data-hero-item-id=') == 12
          assert t.count('bls-product-cta') >= 20
          assert t.count('href="https://s.shopee.com.br/') >= 32
          print('PUBLIC_POST_OK cards=20 hero=12 ctas=20 links>=32 layout=wide')
          PY
            then ok=1; break; fi
            sleep 5
          done
          test "$ok" -eq 1
      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitrine-pratica-repair-v2-${{ github.run_number }}
          path: |
            /tmp/vitrine-pratica-post-before.html
            /tmp/vitrine-pratica-post-after.html
            /tmp/vitrine-pratica-public.html
          if-no-files-found: warn
          retention-days: 14
