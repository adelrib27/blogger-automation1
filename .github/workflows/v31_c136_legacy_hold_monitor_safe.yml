name: V31 C136 — Monitor SAFE dos crons legados e DRAFTs
# C136: janela de runs limitada a 5 após erro github_response_too_large; sem ampliar permissões.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v31_c136_legacy_hold_monitor_safe.yml'
      - 'affiliate_hub_v31/audit_draft_pilots.py'
      - 'affiliate_hub_v31/tests/test_c145_audit_draft_pilots.py'
  schedule:
    # 20:47 Recife, após o cron 19:17 Casa e 18:07 Oficina.
    - cron: '47 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v31-c136-draft-and-hold-readonly
  cancel-in-progress: false

jobs:
  audit-legacy-crons:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regressões sem rede
        run: python -m unittest affiliate_hub_v31.tests.test_c136_legacy_live_hold_monitor -q
      - name: Confirmar policy e jobs legados na main
        run: python -m affiliate_hub_v31.legacy_live_hold_monitor --offline-static
      - name: Verificar runs agendados após o LIVE HOLD sem disparar nenhum run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m affiliate_hub_v31.legacy_live_hold_monitor

  audit-existing-draft-pilots:
    needs: audit-legacy-crons
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências GET/SELECT CMS
        run: python -m pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Testar offline contrato D1 USED + CMS antes de qualquer GET
        run: python -m unittest affiliate_hub_v31.tests.test_c145_audit_draft_pilots -q
      - name: Conferir D1 USED e rascunhos reais por GET sem escrever
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          V31_WORDPRESS_SITE_CREDENTIALS_JSON: ${{ secrets.V31_WORDPRESS_SITE_CREDENTIALS_JSON }}
          CASA_WORDPRESS_USERNAME: ${{ secrets.CASA_WORDPRESS_USERNAME }}
          CASA_WORDPRESS_APP_PASSWORD: ${{ secrets.CASA_WORDPRESS_APP_PASSWORD }}
          # Same site-scoped, DRAFT-only bridge used by the authenticated reviewer.
          V31_RADAR_LEGACY_CMS_BRIDGE_ENABLED: 'true'
          V31_RADAR_LEGACY_WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          V31_RADAR_LEGACY_WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
          V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          python -m affiliate_hub_v31.audit_draft_pilots
          echo 'C145: D1 USED != DRAFT. Apenas GET CMS + SELECT D1. Resultado de verificacao no log; nenhum POST ou LIVE.' >> "$GITHUB_STEP_SUMMARY"
