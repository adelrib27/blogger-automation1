name: "V31 C112 - Radar Tech ar condicionado 3 SKUs API AUDIT SAFE"
on:
  push:
    branches: [main]
    paths: [".github/workflows/v31_c112_radartech_arcond_offer_audit_once.yml"]
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  verify-offers-readonly:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: "Consultar somente ofertas Shopee e cotas D1 - sem mutações"
        env:
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
          V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
          V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,time,re,urllib.request
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from affiliate_hub_v31.shopee_probe import authorization,ENDPOINT
          from affiliate_hub_v31.converter import valid_campaign
          from affiliate_hub_v31.d1_http_runner import CloudflareD1HTTPRunner
          campaign="radarwp"
          valid_campaign(campaign)
          app=os.getenv("V31_EDITORIAL_SHOPEE_APP_ID","")
          secret=os.getenv("V31_EDITORIAL_SHOPEE_APP_SECRET","")
          if not app or not secret:raise SystemExit("C112_SHOPEE_CREDENTIALS_MISSING")
          products=[
              ("midea9","1736335904","58267891881",("midea","inverter","9000")),
              ("midea12","889973435","18398298625",("midea","inverter","12000")),
              ("lg12","822103155","58265302556",("lg","inverter","12000"))]
          # query individual, com itemId literal de escalar Long; não usar Int32
          results=[]
          for label,shop,item,words in products:
              query=f"query V31RadarOfferAudit {{ productOfferV2(itemId:{item},page:1,limit:5) {{ nodes {{ itemId shopId productName productLink imageUrl priceMin periodEndTime }} }} }}"
              body=json.dumps({"query":query,"operationName":"V31RadarOfferAudit"},separators=(',',':'))
              req=urllib.request.Request(ENDPOINT,data=body.encode(),method="POST",headers={"Authorization":authorization(app,secret,body,int(time.time())),"Content-Type":"application/json","Accept":"application/json","User-Agent":"V31-C112-Radar-Audit/1.0"})
              try:
                  with urllib.request.urlopen(req,timeout=25) as resp:
                      raw=resp.read(131073)
                      if resp.status!=200 or len(raw)>131072:raise ValueError("bad_response")
                  response=json.loads(raw)
                  if response.get("errors"):raise ValueError("graphql_error")
                  nodes=((response.get("data")or{}).get("productOfferV2")or{}).get("nodes")or[]
                  hits=[n for n in nodes if str(n.get("itemId"))==item and str(n.get("shopId"))==shop]
                  ok=len(hits)==1
                  n=hits[0] if ok else {}
                  normalized=re.sub(r"[^a-z0-9]","",str(n.get("productName")or"").lower())
                  expected=f"https://shopee.com.br/product/{shop}/{item}"
                  try:price=float(n.get("priceMin") or 0)
                  except (ValueError,TypeError):price=0
                  img=str(n.get("imageUrl")or"")
                  end=n.get("periodEndTime")
                  ok=bool(ok and n.get("productLink")==expected and all(word in normalized for word in words) and price>0 and urlsplit(img).scheme=="https" and urlsplit(img).hostname in ("cf.shopee.com.br","down-br.img.susercontent.com") and (not end or int(end)>int(time.time())))
                  results.append({"sku":label,"product_key":f"shopee:{shop}:{item}","eligible":ok,"image_verified":img if ok else None,"reason":"API_EXACT_ID_NAME_IMAGE_PRICE_PASS" if ok else "OFFER_UNAVAILABLE_OR_IDENTITY_NOT_VERIFIED"})
              except Exception:
                  results.append({"sku":label,"product_key":f"shopee:{shop}:{item}","eligible":False,"reason":"API_QUERY_FAILED_CLOSED"})
          print("V31_C112_API_READONLY "+json.dumps(results,ensure_ascii=False,separators=(',',':')))
          try:
              db=CloudflareD1HTTPRunner.from_environment(allow_mutations=False)
              day=datetime.now(timezone.utc).date().isoformat()
              rows=db("SELECT day_utc,slot,campaign,product_key FROM v31_shopee_conversion_attempts WHERE day_utc=? ORDER BY slot",(day,))
              historical=db("SELECT day_utc,slot,campaign,product_key FROM v31_shopee_conversion_attempts WHERE campaign=?",(campaign,))
              print("V31_C112_D1_READONLY "+json.dumps({"day":day,"global_slots_used":len(rows),"radarwp_attempts":historical,"today":rows},ensure_ascii=False,separators=(',',':')))
          except Exception:
              print("V31_C112_D1_READONLY_UNAVAILABLE")
          if not any(x["eligible"] for x in results): raise SystemExit("V31_C112_NO_VERIFIED_PRODUCTS")
          print("V31_C112_AUDIT_PASS_ZERO_MUTATIONS")
          PY
