name: V31 Pedal Leve - Rotacao Shopee diaria isolada
on:
  pull_request:
    paths:
      - "pedal_leve/rotation_v31.py"
      - "pedal_leve/shopee_catalog_safe.py"
      - ".github/workflows/pedal_leve_rotation_v31.yml"
  push:
    branches: [main]
    paths:
      - "pedal_leve/rotation_v31.py"
      - ".github/workflows/pedal_leve_rotation_v31.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
permissions:
  contents: read
concurrency:
  group: v31-pedal-leve-4073458513010284301-store
  cancel-in-progress: false
jobs:
  rotacao-loja:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      PEDAL_STORE_DRY_RUN: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar cliente Blogger
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth-httplib2
      - name: Dependencias e credenciais presentes, sem exibir valores
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          test -n "$BLOGGER_CLIENT_ID"
          test -n "$BLOGGER_CLIENT_SECRET"
          test -n "$BLOGGER_REFRESH_TOKEN"
          python -m py_compile pedal_leve/rotation_v31.py pedal_leve/shopee_catalog_safe.py src/blogger_policy_guard.py src/criar_rascunho.py
      - name: Testar renderer e filtros offline
        run: python pedal_leve/rotation_v31.py --self-test
      - name: Shopee LIVE consulta, Blogger SAFE no PR ou LIVE em main
        run: python -u pedal_leve/rotation_v31.py
      - name: Salvar recibo sem credenciais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pedal-v31-rotation-${{ github.run_number }}
          path: pedal_leve/rotacao_ultimo_resultado.json
          if-no-files-found: warn
          retention-days: 7
