name: Cozinha Sem Complicação — Loja Shopee diária

on:
  workflow_dispatch:
  schedule:
    - cron: "5 11 * * *"
      timezone: "America/Recife"

permissions:
  contents: write

concurrency:
  group: cozinha-sem-complicacao-store-live
  cancel-in-progress: false

jobs:
  atualizar-loja:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      BLOGGER_BLOG_ID: "3552757910439359679"
      BLOGGER_STORE_POST_ID: "7888042807715084117"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      SHOPEE_TOP_N: "500"
      COZINHA_SEM_COMPLICACAO_STORE_RECENT_DAYS: "14"
      COZINHA_SEM_COMPLICACAO_SHOPEE_SYSTEM_RETRIES: "4"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar código e Policy Guard
        run: |
          set -euo pipefail
          python -m py_compile \
            src/shopee_oportunidades.py \
            src/shopee_oportunidades_v22.py \
            src/shopee_oportunidades_v23.py \
            src/blogger_policy_guard.py \
            src/blogger_policy_guard_self_test.py \
            radar_tech_br/src/refresh_blogger_offer_links.py \
            blogger_stores/src/conecta_achados_store.py \
            blogger_stores/src/cozinha_sem_complicacao_store.py
          PYTHONPATH=src python src/blogger_policy_guard_self_test.py

      - name: Confirmar secrets e alvo
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          test -n "$BLOGGER_CLIENT_ID"
          test -n "$BLOGGER_CLIENT_SECRET"
          test -n "$BLOGGER_REFRESH_TOKEN"
          test "$SHOPEE_APP_ID" = "18352820579"
          test "$BLOGGER_BLOG_ID" = "3552757910439359679"
          test "$BLOGGER_STORE_POST_ID" = "7888042807715084117"

      - name: Gerar seleção SAFE fresca
        run: PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/cozinha_sem_complicacao_store.py safe

      - name: Validar Policy Guard e semântica pré-LIVE
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/cozinha_sem_complicacao_store.py validate
          PYTHONPATH=src:blogger_stores/src python - <<'PY'
          import json
          from pathlib import Path
          from blogger_policy_guard import require_product_allowed
          data=json.loads(Path('blogger_stores/data/cozinha_sem_complicacao_selection.json').read_text(encoding='utf-8'))
          products=[p for values in (data.get('categories') or {}).values() for p in values]
          if len(products) != 20:
              raise SystemExit(f'Policy Guard: quantidade inválida {len(products)}/20')
          for product in products:
              require_product_allowed(product)
          bad_phrases=[
              'Escova de Limpeza Multifuncional Flexível Para Garrafas Mamadeiras Liquidificador De Silicone',
              'Interruptor Forno Eletrico Fischer Gourmet Grill 44L',
              'Cafeteira De Prensa Francesa 600ml Manual Premium Filtro Inox Café Chá Espumador de Leite',
              'Oleo Mineral Grau Usp para Selar e hidratar Tabua De corte Carne Churrasco 500 ml',
              'Processador Picador De Alimentos Alça 3L Moedor De Carne Mixer Elétrico',
              'Kit 5 Suporte Organizador de Vassoura Rodo Mop',
              'Tomada De Parede Dupla USB E USB-C Carregador Rápido',
              'Capa Térmica para Chapinha',
          ]
          for product in products:
              title=product.get('productName') or ''
              hits=[x for x in bad_phrases if x.lower() in title.lower()]
              if hits:
                  raise SystemExit(f'Falso positivo conhecido detectado pré-LIVE: {hits}: {title}')
          print('BLOGGER_POLICY_GUARD_PRELIVE_PASS: 20/20 produtos permitidos')
          print('COZINHA_SEM_COMPLICACAO_SEMANTIC_PRELIVE_PASS: 5 categorias x 4 intenções')
          PY

      - name: Dry-run de identidade, Store e hero
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/cozinha_sem_complicacao_store.py identity-dry-run
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/cozinha_sem_complicacao_store.py store-dry-run
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/cozinha_sem_complicacao_store.py hero-dry-run

      - name: Atualizar Store Post 20/20
        run: PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/cozinha_sem_complicacao_store.py store-live

      - name: Sincronizar hero 12/12
        run: PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/cozinha_sem_complicacao_store.py hero-live

      - name: Aplicar e confirmar identidade
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/cozinha_sem_complicacao_store.py identity-live
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/cozinha_sem_complicacao_store.py identity

      - name: Verificar renderização pública + Policy Guard central
        run: |
          set -euo pipefail
          ok=0
          url="https://cozinha-sem-complicacao.blogspot.com/2026/10/loja.html"
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36"
          for attempt in $(seq 1 12); do
            code=$(curl -L -sS --max-time 40 \
              -A "$ua" \
              -H "Accept-Language: pt-BR,pt;q=0.9,en;q=0.7" \
              -H "Cache-Control: no-cache" \
              -o /tmp/cozinha-sem-complicacao-loja.html \
              -w "%{http_code}" \
              "${url}?m=1&store_verify=${GITHUB_RUN_ID}-${attempt}" || true)
            echo "PUBLIC_HTTP_ATTEMPT_${attempt}: ${code}"
            if [ "$code" = "429" ]; then
              sleep 15
              continue
            fi
            if [ "$code" != "200" ]; then
              sleep 10
              continue
            fi
            store_count=$(python -c "print(open('/tmp/cozinha-sem-complicacao-loja.html', encoding='utf-8', errors='ignore').read().count('data-item-id='))")
            hero_count=$(python -c "print(open('/tmp/cozinha-sem-complicacao-loja.html', encoding='utf-8', errors='ignore').read().count('data-hero-item-id='))")
            echo "PUBLIC_COUNTS_ATTEMPT_${attempt}: store=${store_count} hero=${hero_count}"
            if [ "$store_count" -ne 20 ] || [ "$hero_count" -ne 12 ]; then
              sleep 10
              continue
            fi
            if PYTHONPATH=src python - <<'PY'
          import html
          from blogger_policy_guard import require_store_html_allowed
          raw=open('/tmp/cozinha-sem-complicacao-loja.html', encoding='utf-8', errors='ignore').read()
          require_store_html_allowed(raw, expected_products=20, expected_hero=12)
          normalized=html.unescape(raw)
          required_raw=[
              'https://cozinha-sem-complicacao.blogspot.com/p/loja.html',
              'bls-eletroportateis',
              'bls-panelas',
              'bls-organizacao-cozinha',
              'bls-cafe-bebidas',
              'bls-utensilios',
              '<h3>Eletroportáteis</h3>',
              '<h3>Panelas &amp; Cocção</h3>',
              '<h3>Organização &amp; Pia</h3>',
              '<h3>Café &amp; Bebidas</h3>',
              '<h3>Utensílios &amp; Preparo</h3>',
          ]
          required_text=[
              'Cozinha Sem Complicação — utensílios, eletroportáteis e soluções práticas',
              'Achados para cozinhar melhor e simplificar a rotina',
          ]
          missing=[x for x in required_raw if x not in raw]
          missing += [x for x in required_text if x not in normalized]
          if missing:
              raise SystemExit(f'Cozinha Sem Complicação identity: marcadores ausentes {missing}')
          forbidden=[
              'https://conectaachados.blogspot.com/p/loja.html',
              'https://portalradartechbr.blogspot.com/p/loja.html',
              'https://achadosparacasa2026.blogspot.com/p/loja.html',
              'https://vitrine-pratica.blogspot.com/p/loja.html',
              'https://moda-ofertas.blogspot.com/p/loja.html',
              'https://canal-attitude.blogspot.com/p/loja.html',
              'Casa & Organização',
              'Tecnologia & Acessórios',
              'Beleza & Cuidados',
              'Dia a Dia & Praticidade',
              'Escova de Limpeza Multifuncional Flexível Para Garrafas Mamadeiras Liquidificador De Silicone',
              'Interruptor Forno Eletrico Fischer Gourmet Grill 44L',
              'Cafeteira De Prensa Francesa 600ml Manual Premium Filtro Inox Café Chá Espumador de Leite',
              'Oleo Mineral Grau Usp para Selar e hidratar Tabua De corte Carne Churrasco 500 ml',
          ]
          bad=[x for x in forbidden if x.lower() in normalized.lower()]
          if bad:
              raise SystemExit(f'Cozinha Sem Complicação: conteúdo proibido detectado {bad}')
          print('BLOGGER_POLICY_GUARD_PUBLIC_PASS: 20 products + 12 hero')
          print('COZINHA_SEM_COMPLICACAO_IDENTITY_PUBLIC_PASS: domínio, Page Loja, cinco categorias e identidade corretos')
          PY
            then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1

      - name: Persistir rotação somente após PASS público
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/cozinha_sem_complicacao_store.py persist
          if [ -z "$(git status --porcelain -- blogger_stores/data/cozinha_sem_complicacao_selection.json blogger_stores/data/cozinha_sem_complicacao_rotation.json)" ]; then
            echo "Sem mudanças de estado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogger_stores/data/cozinha_sem_complicacao_selection.json blogger_stores/data/cozinha_sem_complicacao_rotation.json
          git commit -m "Atualizar rotação automática da Loja Cozinha Sem Complicação"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cozinha-sem-complicacao-store-live-${{ github.run_number }}
          path: |
            blogger_stores/data/cozinha_sem_complicacao_selection.json
            blogger_stores/data/cozinha_sem_complicacao_rotation.json
            blogger_stores/data/cozinha_sem_complicacao_scan/
            /tmp/cozinha-sem-complicacao-loja.html
          if-no-files-found: warn
          retention-days: 14

# POLICY_GUARD_CENTRAL_COZINHA_SEM_COMPLICACAO_2026_11_02
# SCHEDULE_ENABLED_AFTER_VALIDATION_2026_11_02
# PUBLIC_RATE_LIMIT_RETRY_2026_11_02
# PUBLIC_HTML_ENTITY_NORMALIZATION_2026_11_02
