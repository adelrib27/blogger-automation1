name: V31 C21 - Auditoria R2 real backlog SAFE temporaria
on:
  push:
    branches:
      - feature/v31-affiliate-hub-c1-safe-20261115
    paths:
      - affiliate_hub_v31/C21_REAL_CANARY_TRIGGER_2026-11-17.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  c21-curation-readonly:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/feature/v31-affiliate-hub-c1-safe-20261115'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Biblioteca R2 privada
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Validar codigo e regressao isolada
        run: |
          python -m compileall -q affiliate_hub_v31
          python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Auditoria C21 R2 real somente leitura, sem conversao e publicacao
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from affiliate_hub_v31.catalog import Catalog
          from affiliate_hub_v31.curation_triage import triage_backlog
          from affiliate_hub_v31.future_site_intake import preview_future_site,summarize_preview
          from affiliate_hub_v31.r2_state import R2State,verify_database
          from affiliate_hub_v31.title_index import has_index

          with tempfile.TemporaryDirectory(prefix='v31-c21-audit-') as td:
              path=Path(td)/'catalog.sqlite3'
              assert R2State.from_env().restore_to(path), 'catalog_missing'
              verify_database(path)
              with Catalog(path) as catalog:
                  assert has_index(catalog), 'fts_index_missing'
                  report=triage_backlog(catalog,max_categories=12)
                  assert report['products']==203649, 'unexpected_products'
                  assert report['previously_approved']==8685, 'unexpected_approved'
                  assert report['pending_review']==194964, 'unexpected_pending'
                  assert report['existing_affiliate_links']==17, 'unexpected_affiliate_count'
                  assert report['sum_review_lanes']==194964
                  assert report['new_approvals']==0 and report['r2_writes']==0
                  assert report['publication_calls']==0 and not report['can_publish']
                  print('V31_C21_REAL_TRIAGE_PASS',json.dumps(report,sort_keys=True))
                  x=preview_future_site(catalog,topic='Air Fryer',platform='blogger')
                  summary=summarize_preview(x)
                  assert not summary['can_publish'] and summary['r2_writes']==0
                  print('V31_C21_FUTURE_SITE_SAFE_PASS',json.dumps(summary,sort_keys=True))
                  count=catalog.db.execute('SELECT COUNT(*) FROM v31_catalog_fts').fetchone()[0]
                  assert count == 203649
                  print('V31_C21_R2_READONLY_FINAL_PASS',json.dumps({
                    'products':report['products'],
                    'fts_rows':count,
                    'links_preserved':report['existing_affiliate_links'],
                    'pending_review':report['pending_review'],
                    'r2_writes':0,'conversion_calls':0,'posts':0
                  },sort_keys=True))
          PY
