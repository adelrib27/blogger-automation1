name: Empacotar Loja Blogger Shopee Validada

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/package_blogger_store_replica.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLOGGER_BLOG_ID: "5271798990390532475"
      BLOGGER_STORE_POST_ID: "8867555367475283866"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Montar pacote portátil
        shell: bash
        run: |
          set -euo pipefail
          PKG="/tmp/BLOGGER_STORE_SHOPEE_VALIDADA_V1"
          rm -rf "$PKG"
          mkdir -p "$PKG/src" "$PKG/blogger_product_store/src" "$PKG/blogger_product_store/config" "$PKG/blogger_product_store/data" "$PKG/.github/workflows" "$PKG/templates"

          cp requirements.txt "$PKG/"
          cp src/criar_rascunho.py "$PKG/src/"
          cp src/shopee_oportunidades.py "$PKG/src/"
          cp src/shopee_oportunidades_v22.py "$PKG/src/"
          cp src/shopee_oportunidades_v23.py "$PKG/src/"
          cp blogger_product_store/src/*.py "$PKG/blogger_product_store/src/"
          cp blogger_product_store/config/*.json "$PKG/blogger_product_store/config/"
          cp .github/workflows/blogger_liquidificador_store_safe.yml "$PKG/.github/workflows/SAFE_REFERENCIA.yml"
          cp .github/workflows/blogger_liquidificador_store_autonomous.yml "$PKG/.github/workflows/LIVE_AUTONOMO_REFERENCIA.yml"
          cp .github/workflows/blogger_liquidificador_store_bootstrap_post.yml "$PKG/.github/workflows/BOOTSTRAP_POST_REFERENCIA.yml"
          cp .github/workflows/blogger_liquidificador_public_diag.yml "$PKG/.github/workflows/DIAGNOSTICO_PUBLICO_REFERENCIA.yml"

          printf '{\n  "version": 1,\n  "runs": []\n}\n' > "$PKG/blogger_product_store/data/store_rotation.json"
          printf '{\n  "version": 1,\n  "status": "EMPTY",\n  "categories": {}\n}\n' > "$PKG/blogger_product_store/data/store_last_selection.json"

      - name: Capturar HTML validado e criar esqueleto sanitizado
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json, os, re
          from pathlib import Path
          from criar_rascunho import criar_servico_blogger

          pkg = Path('/tmp/BLOGGER_STORE_SHOPEE_VALIDADA_V1')
          service = criar_servico_blogger()
          post = service.posts().get(
              blogId=os.environ['BLOGGER_BLOG_ID'],
              postId=os.environ['BLOGGER_STORE_POST_ID'],
          ).execute()
          content = str(post.get('content') or '')
          if 'BLOGGER_LIQ_STORE_AUTO_START' not in content or 'BLOGGER_LIQ_HERO_AUTO_1_START' not in content:
              raise SystemExit('HTML validado sem marcadores esperados')

          (pkg/'templates'/'REFERENCE_VALIDATED_LIVE.html').write_text(content, encoding='utf-8')
          meta = {
              'source_blog_id': os.environ['BLOGGER_BLOG_ID'],
              'source_post_id': os.environ['BLOGGER_STORE_POST_ID'],
              'title': post.get('title'),
              'url': post.get('url'),
              'updated': post.get('updated'),
              'note': 'Arquivo de referência. Não usar links/produtos vivos como estado inicial de outro blog.'
          }
          (pkg/'templates'/'REFERENCE_VALIDATED_META.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')

          skeleton = content
          pairs = [
              ('<!-- BLOGGER_LIQ_STORE_AUTO_START -->','<!-- BLOGGER_LIQ_STORE_AUTO_END -->','<div class="bls-placeholder"><strong>Vitrine automática aguardando SAFE/LIVE</strong></div>'),
              ('<!-- BLOGGER_LIQ_HERO_AUTO_1_START -->','<!-- BLOGGER_LIQ_HERO_AUTO_1_END -->','<div class="bls-placeholder"><strong>Hero automático 1</strong></div>'),
              ('<!-- BLOGGER_LIQ_HERO_AUTO_2_START -->','<!-- BLOGGER_LIQ_HERO_AUTO_2_END -->','<div class="bls-placeholder"><strong>Hero automático 2</strong></div>'),
              ('<!-- BLOGGER_LIQ_HERO_AUTO_3_START -->','<!-- BLOGGER_LIQ_HERO_AUTO_3_END -->','<div class="bls-placeholder"><strong>Hero automático 3</strong></div>'),
          ]
          for start, end, placeholder in pairs:
              a = skeleton.find(start)
              b = skeleton.find(end)
              if a < 0 or b <= a:
                  raise SystemExit(f'marcador ausente: {start}')
              skeleton = skeleton[:a] + start + placeholder + end + skeleton[b+len(end):]

          (pkg/'templates'/'STORE_TEMPLATE_VALIDATED_SKELETON.html').write_text(skeleton, encoding='utf-8')
          PY

      - name: Criar manual de replicação
        shell: bash
        run: |
          set -euo pipefail
          PKG="/tmp/BLOGGER_STORE_SHOPEE_VALIDADA_V1"
          cat > "$PKG/LEIA_PRIMEIRO_REPLICAR_EM_NOVO_BLOG.md" <<'MD'
          # LOJA BLOGGER + SHOPEE — PACOTE VALIDADO V1

          Este pacote contém o código real usado na implantação validada da Loja Shopee no Blogger do Liquidificador Philips Walita RI2242.

          ## O que deve permanecer igual
          - 5 categorias x 4 produtos = 20 cards únicos por rodada.
          - Hero/carrossel com 12 mini-cards únicos.
          - Filtro semântico antes da seleção final.
          - Ranking/diversidade por loja, palavra-chave e categoria.
          - Rotação/anti-repetição com janela recente de 1 dia.
          - Fail-closed: se qualquer categoria não completar 4 produtos, NÃO publicar vitrine incompleta.
          - Leitura do destino antes da escrita e validação dos marcadores.
          - Releitura pela Blogger API depois da escrita.
          - Validação pública: exatamente 20 `data-item-id=` e 12 `data-hero-item-id=`.
          - Persistir `store_rotation.json` e `store_last_selection.json` somente depois da validação pública.
          - Links afiliados com `nofollow sponsored noopener`.
          - Preço variável como `A partir de R$ ...` quando necessário.

          ## Segredos necessários no GitHub
          - `SHOPEE_APP_ID`
          - `SHOPEE_SECRET`
          - `BLOGGER_CLIENT_ID`
          - `BLOGGER_CLIENT_SECRET`
          - `BLOGGER_REFRESH_TOKEN`

          ## Campos que OBRIGATORIAMENTE mudam em cada novo blog
          1. `BLOGGER_BLOG_ID`
          2. `BLOGGER_STORE_POST_ID` (ou Page ID se o tema realmente renderizar páginas estáticas)
          3. URL pública usada no gate do workflow LIVE
          4. `blogger_product_store/config/shopee_oportunidades.json`
          5. `blogger_product_store/config/shopee_intent_rules.json`
          6. Casos de regressão de `shopee_oportunidades_liquidificador.py` — renomear/adaptar para o novo nicho
          7. Rótulos/títulos do hero e `CATEGORY_SPECS`
          8. Link da Loja em `store_layout_patch.py`

          ## Regra crítica sobre o destino Blogger
          No baseline validado, o tema escondia páginas estáticas (`data:view.isPage`) e só renderizava corretamente posts. Por isso a Loja final validada é um **post especial chamado Loja**. Em outro blog, teste primeiro a renderização pública. Se a página estática não renderizar os cards, use o mesmo padrão de post especial com `store_auto_post.py`, `store_hero_sync_post.py` e `post_target_proxy.py`.

          ## Ordem obrigatória em um novo chat
          1. Ler este arquivo e inspecionar todo o pacote antes de alterar qualquer coisa.
          2. Identificar Blog ID, URL e se o destino será post ou página.
          3. Criar o destino com `templates/STORE_TEMPLATE_VALIDATED_SKELETON.html`.
          4. Adaptar SOMENTE nicho/categorias/regras/IDs/URL. Não simplificar os gates.
          5. Rodar `store_auto_self_test.py`.
          6. Rodar workflow SAFE com `BLOGGER_STORE_DRY_RUN=true`.
          7. Inspecionar manualmente a seleção do SAFE. Se houver acessórios/falsos positivos, endurecer regras e regressões; NÃO publicar.
          8. Quando o SAFE estiver semanticamente limpo, executar uma LIVE controlada.
          9. Sincronizar hero.
          10. Exigir no HTML público 20 cards de vitrine + 12 do hero.
          11. Somente depois persistir rotação e ativar schedule.

          ## Arquivos centrais
          - `blogger_product_store/src/store_auto.py`: seleção, rotação, renderização, fail-closed e snapshots.
          - `blogger_product_store/src/store_auto_post.py`: adapter do alvo validado como post e guarda final de intenção.
          - `blogger_product_store/src/store_hero_sync.py`: composição/validação dos 12 cards do hero.
          - `blogger_product_store/src/store_hero_sync_post.py`: adapter do hero para post.
          - `blogger_product_store/src/post_target_proxy.py`: faz scripts validados como pages operarem sobre posts.
          - `blogger_product_store/src/store_layout_patch.py`: largura total e integração visual da Loja.
          - `blogger_product_store/src/store_auto_self_test.py`: regressões estruturais básicas.
          - `src/shopee_oportunidades.py`, `v22`, `v23`: scanner/ranking/diversidade/filtro semântico.
          - `src/criar_rascunho.py`: OAuth e Blogger API.

          ## Estados
          Os arquivos `data/store_rotation.json` e `data/store_last_selection.json` deste pacote estão deliberadamente VAZIOS. Nunca copie o histórico vivo de outro blog para uma nova instalação.

          ## Baseline visual/funcional validado
          - fonte: blog Liquidificador Philips Walita RI2242
          - Blog ID: 5271798990390532475
          - Post Loja validado: 8867555367475283866
          - vitrine: 20 cards
          - hero: 12 mini-cards
          - modo: Blogger API + Shopee Affiliate API + GitHub Actions
          - TinyFish/Work: não são necessários para a atualização diária

          ## Instrução para um novo ChatGPT
          Ao receber este ZIP, trate-o como **fonte de verdade da Loja Blogger validada**. Não recrie a arquitetura do zero e não substitua os mecanismos de rotação, filtros, fail-closed ou validação pública por versões mais simples. Primeiro adapte o pacote ao nicho e ao Blog ID do novo destino, execute SAFE, corrija falsos positivos e só então LIVE.
          MD

          cat > "$PKG/ENV_EXEMPLO.txt" <<'ENV'
          SHOPEE_APP_ID=<GitHub Secret>
          SHOPEE_SECRET=<GitHub Secret>
          BLOGGER_CLIENT_ID=<GitHub Secret>
          BLOGGER_CLIENT_SECRET=<GitHub Secret>
          BLOGGER_REFRESH_TOKEN=<GitHub Secret>
          BLOGGER_BLOG_ID=<ID_DO_NOVO_BLOG>
          BLOGGER_STORE_POST_ID=<ID_DO_POST_LOJA>
          BLOGGER_STORE_DRY_RUN=true
          BLOGGER_STORE_ITEMS_PER_CATEGORY=4
          BLOGGER_STORE_RECENT_DAYS=1
          SHOPEE_TOP_N=50
          ENV

          (cd "$PKG" && find . -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256)
          (cd /tmp && zip -qr BLOGGER_STORE_SHOPEE_VALIDADA_V1.zip BLOGGER_STORE_SHOPEE_VALIDADA_V1)

      - name: Publicar pacote
        uses: actions/upload-artifact@v4
        with:
          name: BLOGGER_STORE_SHOPEE_VALIDADA_V1
          path: /tmp/BLOGGER_STORE_SHOPEE_VALIDADA_V1.zip
          if-no-files-found: error
          retention-days: 30
