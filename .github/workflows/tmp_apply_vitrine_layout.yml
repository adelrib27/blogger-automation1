name: TEMP — Aplicar layout final Vitrine Prática

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/tmp_apply_vitrine_layout.yml"

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BLOGGER_BLOG_ID: "9144338307944682868"
      BLOGGER_STORE_POST_ID: "115613719594316807"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Aplicar patch final de layout
        run: PYTHONPATH=src python -u vitrine_pratica_store/src/store_layout_patch.py
      - name: Validar post salvo
        run: |
          PYTHONPATH=src python - <<'PY'
          import os
          from criar_rascunho import criar_servico_blogger
          b=criar_servico_blogger()
          p=b.posts().get(blogId=os.environ['BLOGGER_BLOG_ID'],postId=os.environ['BLOGGER_STORE_POST_ID']).execute()
          h=str(p.get('content') or '')
          assert h.count('data-item-id=')==20
          assert h.count('data-hero-item-id=')==12
          assert 'grid-template-columns:minmax(0,1fr)!important' in h
          assert 'body.ga-post-page:has(.bls-page) .centered-bottom' in h
          assert 'https://vitrine-pratica.blogspot.com/p/loja.html' in h
          assert 'liquidificador-philips-walita-ri2242.blogspot.com' not in h
          print('VITRINE_LAYOUT_SOURCE_PASS')
          PY
