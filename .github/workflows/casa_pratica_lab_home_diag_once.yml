name: Casa Prática Lab — diagnóstico único da home

on:
  push:
    paths:
      - ".github/workflows/casa_pratica_lab_home_diag_once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar home pública com retry
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36'
          ok=0
          for attempt in $(seq 1 8); do
            code=$(curl -L -sS --max-time 40 -A "$ua" -H 'Cache-Control: no-cache' -o /tmp/home.html -w '%{http_code}' "https://casa-pratica-lab-20261102.blogspot.com/?m=1&home_diag=${GITHUB_RUN_ID}-${attempt}" || true)
            echo "HOME_DIAG_HTTP_${attempt}: ${code}"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 12
          done
          test "$ok" -eq 1

      - name: Inspecionar referências da Loja na home
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          raw=Path('/tmp/home.html').read_text(encoding='utf-8',errors='ignore')
          needle='/2026/11/loja.html'
          positions=[m.start() for m in re.finditer(re.escape(needle),raw)]
          print(f'HOME_STORE_PATH_COUNT={len(positions)}')
          for idx,pos in enumerate(positions,1):
              a=max(0,pos-1800); b=min(len(raw),pos+2200)
              print(f'\n===== OCCURRENCE {idx} @ {pos} =====')
              print(raw[a:b])
              print('===== END OCCURRENCE =====\n')
          print('HOME_BLS_PAGE_COUNT=', raw.count('bls-page'))
          print('HOME_STORE_DATA_ITEM_COUNT=', raw.count('data-item-id='))
          print('HOME_HERO_ITEM_COUNT=', raw.count('data-hero-item-id='))
          print('HOME_TITLE_LOJA_COUNT=', len(re.findall(r'>\s*Loja\s*<', raw, re.I)))
          for token in ['post-outer-container','post-outer','post-body','post-title','entry-title','blog-posts']:
              print(f'HOME_{token.upper().replace("-","_")}_COUNT=',raw.count(token))
          PY

# DELETE_AFTER_DIAG
