name: V31 C70 TEMP — validar handoff real R2 somente leitura
on:
  push:
    paths:
      - '.github/workflows/v31_c70_TEMP_handoff_preview_readonly.yml'
permissions:
  contents: read
concurrency:
  group: v31-c70-readonly-handoff
  cancel-in-progress: false
jobs:
  handoff-r2-readonly-once:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'test(v31-c70): rodar UMA previa handoff somente leitura no R2'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar cliente de leitura R2
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Validar somente o teste C70 offline
        run: python -m unittest affiliate_hub_v31.tests.test_c70_handoff_continuous -v
      - name: Ler catalogo real e planejar handoffs SEM EXECUTE, sem posts ou R2 writes
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          python -m affiliate_hub_v31.handoff_dispatch
          echo 'V31_C70_REAL_R2_HANDOFF_PREVIEW_ONLY_NO_POSTS'
