name: V31 LAB - Atomic prewrite claim and If-Match policy SAFE sandbox

on:
  push:
    branches:
      - lab/v31r1-shopee-safe-20261103
    paths:
      - .github/workflows/v31_lab_prewrite_claim_remote_sandbox_safe.yml
      - blogger_stores/v31_core/v31_prewrite_claim_sandbox_safe.py
      - blogger_stores/v31_core/v31_blogger_etag_policy_safe.py
      - blogger_stores/tests/v31_prewrite_claim/**

permissions:
  contents: read
  actions: read

concurrency:
  group: v31-lab-prewrite-claim-sandbox-safe
  cancel-in-progress: false

jobs:
  validar-somente-sandbox-sem-put:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/lab/v31r1-shopee-safe-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout LAB sem credenciais persistidas
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar HEAD e estado PLAN reservado
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'adelrib27/blogger-automation1'
          test "$GITHUB_REF" = 'refs/heads/lab/v31r1-shopee-safe-20261103'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 801381b4e0d2d23fa60f478da67b6dca6ec3df32 "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/lab/v31r1-shopee-safe-20261103 | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'blogger_stores/v31_core')
          from v31_second_publish_gate_safe import gitblob, LEDGER_BLOB, HISTORY_BLOB
          from v31_second_resume_safe import validate_persisted_pair
          b=Path('blogger_stores/v31_lab/state')
          ledger=(b/'v31_rotation_ledger.json').read_bytes()
          history=(b/'v31_rotation_history.json').read_bytes()
          assert gitblob(ledger)==LEDGER_BLOB
          assert gitblob(history)==HISTORY_BLOB
          led=json.loads(ledger);his=json.loads(history)
          assert [x['status'] for x in led['operations']]==['PERSISTED','PLAN']
          assert all('prewriteClaim' not in x for x in led['operations'])
          assert len(his['runs'])==2
          validate_persisted_pair(led,his)
          print('V31_PREWRITE_GIT_OPERATIONAL_STILL_UNCLAIMED_PASS')
          PY
      - name: Recuperar HTML original imutavel com permissao READ
        uses: actions/download-artifact@v4
        with:
          name: v31-lab-second-preflight-readonly-1
          run-id: 41841058542
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v31_original
      - name: Validar SHA real do backup (antes de qualquer sandbox commit)
        shell: bash
        run: |
          set -euo pipefail
          echo "6f3810a364fe2114865b96fa5f118c10495bfe39943406624710ac9aaf25f450  ${RUNNER_TEMP}/v31_original/LOJA_ORIGINAL_BACKUP.html" | sha256sum -c -
          echo "d33070c001281ed795489a032a504accfcab2b593010c1a9e8cf5bb86b8109b8  ${RUNNER_TEMP}/v31_original/LOJA_CANDIDATA_NAO_PUBLICAR.html" | sha256sum -c -
      - name: Testar claim remoto local, concorrencia real e If-Match nao comprovado
        shell: bash
        env:
          V31_REAL_ORIGINAL_HTML: ${{ runner.temp }}/v31_original/LOJA_ORIGINAL_BACKUP.html
          V31_REAL_LEDGER: blogger_stores/v31_lab/state/v31_rotation_ledger.json
          V31_REAL_HISTORY: blogger_stores/v31_lab/state/v31_rotation_history.json
          V31_TEST_REAL_HTML_DIR: ${{ runner.temp }}/v31_original
        run: |
          set -euo pipefail
          python -m py_compile blogger_stores/v31_core/v31_prewrite_claim_sandbox_safe.py \
            blogger_stores/v31_core/v31_blogger_etag_policy_safe.py \
            blogger_stores/tests/v31_prewrite_claim/test_v31_prewrite_claim_sandbox_safe.py
          python -m unittest discover -s blogger_stores/tests/v31_prewrite_claim -v
          python -m unittest discover -s blogger_stores/tests/v31_second_once -v
          python -m unittest discover -s blogger_stores/tests/v31_second_publish -v
          python -m unittest discover -s blogger_stores/tests/v31_git_write_gate -v
          python -m unittest discover -s blogger_stores/tests/v31_git_executor -v
          python -m unittest discover -s blogger_stores/tests/v31_transaction -v
          python -m unittest discover -s blogger_stores/tests/v31_second_recovery -v
          python -m unittest discover -s blogger_stores/tests/v31_ledger -v
          python -m unittest discover -s blogger_stores/tests/v31_atomic -v
      - name: Confirmar que o claim REAL nao aconteceu e que nao ha upload de artefatos
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- blogger_stores/v31_lab/state
          test -z "$(git status --porcelain -- blogger_stores/v31_lab/state)"
          git merge-base --is-ancestor 801381b4e0d2d23fa60f478da67b6dca6ec3df32 "$GITHUB_SHA"
          echo 'V31_PREWRITE_REMOTE_SANDBOX_CAS_PASS; local_bare_git=true; github_remote_write=false; blogger_put=false; real_etag_proof=false; cron=false; artifact_upload=false'
