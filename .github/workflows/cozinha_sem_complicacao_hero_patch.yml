name: Cozinha Sem Complicação — corrigir hero pré-LIVE

on:
  push:
    paths:
      - "blogger_stores/cozinha_hero_patch_kickoff.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar patch hero fail-closed
        run: python scripts/cozinha_sem_complicacao_hero_patch.py

      - name: Compilar motor
        run: python -m py_compile blogger_stores/src/cozinha_sem_complicacao_store.py

      - name: Persistir somente motor
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogger_stores/src/cozinha_sem_complicacao_store.py
          git diff --cached --check
          git commit -m "Adaptar hero 12 às categorias da Cozinha Sem Complicação"
          git pull --rebase origin main
          git push origin HEAD:main

