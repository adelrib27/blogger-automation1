name: V31 C28 TEMP MAIN - R2 shadow somente leitura
on:
  push:
    branches:
      - main
    paths:
      - affiliate_hub_v31/C28_MAIN_SHADOW_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  read-only-shadow:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: boto3 R2
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Shadow real R2; sem mutation, link novo, escrita ou publicacao
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: |
          python -m affiliate_hub_v31.shadow_audit --site all
          python -m affiliate_hub_v31.cache_replenish --site all --budget 1
          echo 'V31_C28_MAIN_R2_SHADOW_READONLY_PASS'
