name: Achados para Casa — Shopee SAFE

on:
  workflow_dispatch:
  push:
    paths:
      - "blogger_stores/achados_casa_kickoff.txt"
      - "blogger_stores/src/achados_casa_*.py"
      - "config/shopee_achados_casa.json"
      - "config/shopee_achados_casa_intent_rules.json"
      - ".github/workflows/achados_casa_store_safe.yml"
      - "src/blogger_policy_guard.py"
      - "src/blogger_policy_guard_self_test.py"
      - "config/blogger_policy_guard.json"

permissions:
  contents: read

concurrency:
  group: achados-casa-store-safe
  cancel-in-progress: false

jobs:
  safe-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      SHOPEE_TOP_N: "180"
      ACHADOS_STORE_RECENT_DAYS: "14"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar código e Policy Guard
        run: |
          set -euo pipefail
          python -m py_compile \
            src/shopee_oportunidades.py \
            src/shopee_oportunidades_v22.py \
            src/shopee_oportunidades_v23.py \
            src/blogger_policy_guard.py \
            src/blogger_policy_guard_self_test.py \
            radar_tech_br/src/refresh_blogger_offer_links.py \
            blogger_stores/src/achados_casa_safe_scan_v2.py \
            blogger_stores/src/achados_casa_safe_scan_v3.py \
            blogger_stores/src/achados_casa_safe_scan_v6.py \
            blogger_stores/src/achados_casa_publish_post.py \
            blogger_stores/src/achados_casa_hero_sync_post.py \
            blogger_stores/src/achados_casa_layout_patch.py \
            blogger_stores/src/achados_casa_persist_rotation.py
          PYTHONPATH=src python src/blogger_policy_guard_self_test.py

      - name: Confirmar AppID Shopee
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          if [ "$SHOPEE_APP_ID" != "18352820579" ]; then
            echo "::error::SHOPEE_APP_ID não corresponde ao AppID autorizado do Achados para Casa."
            exit 1
          fi
          echo "AppID Shopee do Achados para Casa validado."

      - name: Executar varredura SAFE v6
        run: |
          set -euo pipefail
          PYTHONPATH=src:radar_tech_br/src:blogger_stores/src python -u blogger_stores/src/achados_casa_safe_scan_v6.py

      - name: Validar seleção SAFE + Policy Guard central
        run: |
          set -euo pipefail
          PYTHONPATH=src:blogger_stores/src python - <<'PY'
          import json
          from pathlib import Path
          from blogger_policy_guard import require_product_allowed
          from achados_casa_publish_post import validate_selection

          data=json.loads(Path('blogger_stores/data/achados_casa_selection.json').read_text(encoding='utf-8'))
          products=validate_selection(data)
          if len(products)!=20:
              raise SystemExit(f'Policy Guard: quantidade inválida {len(products)}/20')
          for product in products:
              require_product_allowed(product)
          print('ACHADOS_SAFE_V6_VALIDADO: 5 categorias x 4 produtos; diversidade semântica e 20/20 links resolvidos.')
          print('BLOGGER_POLICY_GUARD_SAFE_PASS: 20/20 produtos permitidos')
          print('ACHADOS_SAFE_READ_ONLY_PASS: nenhum writer Blogger executado')
          PY

      - name: Guardar diagnóstico SAFE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: achados-casa-store-safe-${{ github.run_number }}
          path: |
            blogger_stores/data/achados_casa_selection.json
            blogger_stores/data/achados_casa_rotation.json
            blogger_stores/data/achados_casa_scan/
          if-no-files-found: warn
          retention-days: 14

# ACHADOS_CASA_SAFE_POLICY_GUARD_CANONICO_2026_11_01
