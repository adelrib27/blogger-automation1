name: Cozinha Sem Complicação — promover schedule final

on:
  push:
    paths:
      - "blogger_stores/cozinha_final_schedule_patch_kickoff.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar schedule final e auditor
        run: python scripts/cozinha_sem_complicacao_final_schedule_patch.py

      - name: Validar auditor final 18/18
        run: |
          set -euo pipefail
          python -m py_compile src/blogger_policy_repo_audit.py blogger_stores/src/cozinha_sem_complicacao_store.py
          python src/blogger_policy_repo_audit.py

      - name: Persistir workflow e auditor canônicos
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cozinha_sem_complicacao_store_autonomous.yml src/blogger_policy_repo_audit.py
          git diff --cached --check
          git commit -m "Promover Cozinha Sem Complicação para schedule diário 11:05"
          git pull --rebase origin main
          git push origin HEAD:main

