name: V31 LAB - Authenticated Blogger backup and Git read-only preflight

on:
  push:
    branches: [lab/v31r1-shopee-safe-20261103]
    paths:
      - .github/workflows/v31_lab_authenticated_backup_git_readonly_safe.yml
      - blogger_stores/src/v31_second_live_backup_git_readonly_safe.py
      - blogger_stores/tests/v31_live_backup/**

permissions:
  contents: read
  actions: read

concurrency:
  group: v31-lab-authenticated-backup-git-readonly-safe
  cancel-in-progress: false

jobs:
  provar-get-autenticado-e-head-remoto:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/lab/v31r1-shopee-safe-20261103' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: v31-lab
    timeout-minutes: 8
    env:
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/v31_pycache
    steps:
      - name: Checkout LAB com branch explicita, somente leitura
        uses: actions/checkout@v4
        with:
          ref: lab/v31r1-shopee-safe-20261103
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recuperar HTMLs ja aprovados, fora do checkout
        uses: actions/download-artifact@v4
        with:
          name: v31-lab-second-preflight-readonly-1
          run-id: 41841058542
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v31_original
      - name: Validar HEAD, artefatos e dez testes direcionados
        shell: bash
        env:
          V31_TEST_REAL_HTML_DIR: ${{ runner.temp }}/v31_original
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'adelrib27/blogger-automation1'
          test "$GITHUB_REF" = 'refs/heads/lab/v31r1-shopee-safe-20261103'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = 'lab/v31r1-shopee-safe-20261103'
          git merge-base --is-ancestor 801381b4e0d2d23fa60f478da67b6dca6ec3df32 "$GITHUB_SHA"
          echo "6f3810a364fe2114865b96fa5f118c10495bfe39943406624710ac9aaf25f450  ${RUNNER_TEMP}/v31_original/LOJA_ORIGINAL_BACKUP.html" | sha256sum -c -
          echo "d33070c001281ed795489a032a504accfcab2b593010c1a9e8cf5bb86b8109b8  ${RUNNER_TEMP}/v31_original/LOJA_CANDIDATA_NAO_PUBLICAR.html" | sha256sum -c -
          python -m py_compile blogger_stores/src/v31_second_live_backup_git_readonly_safe.py
          python -m unittest discover -s blogger_stores/tests/v31_live_backup -v
      - name: Provar Blogger GET autenticado e Git imutavel — sem escrita
        shell: bash
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          V31_ARCHIVED_ORIGINAL: ${{ runner.temp }}/v31_original/LOJA_ORIGINAL_BACKUP.html
          V31_ARCHIVED_CANDIDATE: ${{ runner.temp }}/v31_original/LOJA_CANDIDATA_NAO_PUBLICAR.html
        run: |
          set -euo pipefail
          test -n "$BLOGGER_CLIENT_ID"
          test -n "$BLOGGER_CLIENT_SECRET"
          test -n "$BLOGGER_REFRESH_TOKEN"
          python blogger_stores/src/v31_second_live_backup_git_readonly_safe.py
          git diff --exit-code -- blogger_stores/v31_lab/state
          test -z "$(git status --porcelain -- blogger_stores/v31_lab/state)"
          echo 'V31_LIVE_AUTHENTICATED_BACKUP_GIT_REMOTE_READONLY_SAFE_PASS; only_targeted_tests=true; git_write=false; blogger_put=false; cron=false; artifacts_uploaded=0'
