name: V31 C39 TEMP MAIN — reclassificação histórica real R2 sem alterações
on:
  push:
    branches:
      - main
    paths:
      - affiliate_hub_v31/C39_REAL_R2_RECLASS_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  audit-historical-backlog:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Testes antes do inventario real
        run: python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Reexaminar TODO historico em REVIEW com regras atuais, zero escritas
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          python -m affiliate_hub_v31.safe_reclassification --limit 100
          echo 'V31_C39_REAL_R2_ALL_REVIEW_ONLY_PASS'
