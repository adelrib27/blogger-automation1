name: Shopee GraphQL - consulta minima SAFE V31
on:
  pull_request:
    paths:
      - "diagnostics/shopee_graphql_minimal_safe_v31.py"
      - "diagnostics/shopee_graphql_matrix_safe_v31.py"
      - "diagnostics/shopee_editorial_retry_scan_v31.py"
      - ".github/workflows/shopee_graphql_minimal_safe_v31.yml"

permissions:
  contents: read

concurrency:
  group: shopee-graphql-minimal-v31-readonly
  cancel-in-progress: false

jobs:
  diagnostico-shopee-readonly:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar sintaxe e regras offline
        run: |
          python -m py_compile diagnostics/shopee_graphql_minimal_safe_v31.py
          python diagnostics/shopee_graphql_minimal_safe_v31.py --self-test
      - name: Executar uma consulta GraphQL autenticada (sem escrita)
        run: python -u diagnostics/shopee_graphql_minimal_safe_v31.py


      - name: Scan SAFE das 27 pautas (sem publicacao)
        env:
          EDITORIAL_SAFE_SCAN_COUNT: "27"
        run: |
          python -m py_compile diagnostics/shopee_editorial_retry_scan_v31.py
          python diagnostics/shopee_editorial_retry_scan_v31.py --self-test
          python -u diagnostics/shopee_editorial_retry_scan_v31.py
      - name: Arquivar candidatos SAFE (sem segredos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-v31-shopee-candidates-safe-${{ github.run_number }}
          path: diagnostics/data/editorial_v31_shopee_candidates_safe.json
          if-no-files-found: warn
          retention-days: 7
