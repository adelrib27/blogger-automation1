name: V31 Pedal Leve - Loja publica SAFE
on:
  pull_request:
    paths:
      - ".github/workflows/pedal_leve_store_public_check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ler Loja e verificar cards e marcador no HTML publico
        shell: bash
        run: |
          python - <<'PY'
          import time, urllib.request, urllib.error
          url = 'https://pedal-leve-mobilidade-urbana.blogspot.com/p/loja.html'
          expected = '2026-11-08 07:05 UTC'
          for i in range(12):
              try:
                  req = urllib.request.Request(url+'?pedal_public_safe='+str(i),
                      headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=18) as resp:
                      html=resp.read().decode('utf8','replace'); code=resp.status
                  checks={
                    'http200':code==200,
                    'title':'Loja Pedal Leve' in html,
                    '16_cards':html.count('class="ub-product-card"')==16,
                    '3_slides':html.count('class="pl-store-slide"')==3,
                    '19_images':html.count('<img ')>=19,
                    'affiliate_links':html.count('rel="nofollow sponsored noopener"')>=19,
                    'selection_stamp':expected in html,
                    'disclosure':'Transparência sobre esta vitrine' in html
                  }
                  print('PEDAL_STORE_PUBLIC_SAFE',i+1,len(html),checks,flush=True)
                  if all(checks.values()):
                      print('PEDAL_STORE_PUBLIC_PASS',flush=True)
                      break
              except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError) as err:
                  print('PEDAL_STORE_PUBLIC_RETRY',i+1,type(err).__name__,getattr(err,'code',''),flush=True)
              if i==11:raise SystemExit('FAIL_CLOSED: loja publica nao comprovada')
              time.sleep(8)
          PY
