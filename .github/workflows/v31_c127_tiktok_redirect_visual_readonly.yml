name: "V31 C127 Radar - links TikTok + fotos READ ONLY"
on:
  push:
    branches: [main]
    paths: [".github/workflows/v31_c127_tiktok_redirect_visual_readonly.yml"]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  audit:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Baixar somente candidatos recentes C123
        uses: actions/download-artifact@v4
        with:
          name: c123-radar-four-shopee-search-candidates
          run-id: 45245633827
          repository: adelrib27/blogger-automation1
          github-token: ${{ github.token }}
          path: c123_artifact
      - run: |
          python -m pip install "Pillow>=11,<13"
          python -m py_compile affiliate_hub_v31/c127_tiktok_redirect_visual_probe.py
      - name: Auditar destinos e comparar fotografias sem escrever CMS ou R2
        run: python -m affiliate_hub_v31.c127_tiktok_redirect_visual_probe
      - name: Salvar imagens apenas como evidência temporária
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-c127-tiktok-origin-visual-audit
          path: |
            c127_tiktok_visual_audit.json
            c127_comparacao_3_artigos.png
          if-no-files-found: ignore
          retention-days: 7
