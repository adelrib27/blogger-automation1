name: "V31 C83 - Shopee Cadeira Certa convert exact once"
on:
  push:
    branches: [main]
    paths: [".github/workflows/v31_c83_cadeira_convert_once.yml"]
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  convert-office-arco:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar SKU exato, reservar slot global D1, gerar link por campanha
        env:
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
          V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
          V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
          V31_D1_SAFE_WRITES_ENABLED: V31_D1_SAFE_SQL_ONLY
        shell: bash
        run: |
          python - <<'PY'
          import json,os,time,urllib.request,urllib.error
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from affiliate_hub_v31.shopee_probe import authorization,ENDPOINT
          from affiliate_hub_v31.converter import generate_shortlink,valid_campaign
          from affiliate_hub_v31.d1_http_runner import CloudflareD1HTTPRunner

          app=os.environ.get("V31_EDITORIAL_SHOPEE_APP_ID","")
          secret=os.environ.get("V31_EDITORIAL_SHOPEE_APP_SECRET","")
          if not app or not secret:
              raise SystemExit("C83_ABORT_NO_SHOPEE_CREDENTIALS")
          campaign="cadeiracertahomeoffice"
          product="shopee:1231183958:58216389111"
          valid_campaign(campaign)
          query='query C83OfficeArcoAgain { productOfferV2(itemId: 58216389111, page: 1, limit: 5) { nodes { itemId shopId productName productLink imageUrl offerLink } } }'
          body=json.dumps({"query":query,"operationName":"C83OfficeArcoAgain"},separators=(",",":"))
          req=urllib.request.Request(ENDPOINT,data=body.encode(),method="POST",headers={
              "Authorization":authorization(app,secret,body,int(time.time())),
              "Content-Type":"application/json",
              "Accept":"application/json",
              "User-Agent":"V31-C83-Exact-Converter/1.0"
          })
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  raw=response.read(131073)
                  if response.status!=200 or len(raw)>131072:
                      raise ValueError("invalid_http_or_size")
              doc=json.loads(raw)
          except Exception:
              raise SystemExit("C83_ABORT_SHOPEE_READ_FAILED_CLOSED") from None
          if doc.get("errors"):
              raise SystemExit("C83_ABORT_GRAPHQL_READ_FAILED_CLOSED")
          offers=((doc.get("data") or {}).get("productOfferV2") or {}).get("nodes") or []
          exact=[x for x in offers if str(x.get("itemId"))=="58216389111" and
              str(x.get("shopId"))=="1231183958" and
              "cadeira" in str(x.get("productName","")).lower() and
              "arco" in str(x.get("productName","")).lower() and
              "mesh" in str(x.get("productName","")).lower()]
          if len(exact)!=1: raise SystemExit("C83_ABORT_EXACT_OFFER_MISMATCH")
          offer=exact[0]
          product_link=offer.get("productLink","")
          if product_link!="https://shopee.com.br/product/1231183958/58216389111":
              raise SystemExit("C83_ABORT_ORIGIN_URL_UNEXPECTED")
          image=offer.get("imageUrl","")
          if urlsplit(image).scheme!="https" or urlsplit(image).hostname not in (
              "cf.shopee.com.br","down-br.img.susercontent.com"):
              raise SystemExit("C83_ABORT_IMAGE_SOURCE_UNEXPECTED")
          print("C83_SHOPEE_PRODUCT_IDENTITY_PASS")
          # Shared quota: <=3 attempts globally in UTC day; insert includes
          # permanent same campaign+SKU replay guard, across previous days.
          try:
              q=CloudflareD1HTTPRunner.from_environment(allow_mutations=True)
              day=datetime.now(timezone.utc).date().isoformat()
              existing=q("SELECT day_utc,slot FROM v31_shopee_conversion_attempts WHERE campaign=? AND product_key=? LIMIT 1",(campaign,product))
              if existing: raise SystemExit("C83_ABORT_ALREADY_RESERVED_NO_REPLAY")
              reserved=q("""
                INSERT INTO v31_shopee_conversion_attempts (day_utc,slot,campaign,product_key)
                SELECT ?, COALESCE(MAX(slot),0)+1,?,?
                FROM v31_shopee_conversion_attempts WHERE day_utc=?
                HAVING COALESCE(MAX(slot),0)<3
                AND NOT EXISTS (SELECT 1 FROM v31_shopee_conversion_attempts
                                WHERE campaign=? AND product_key=?)
                ON CONFLICT DO NOTHING
                RETURNING slot
              """,(day,campaign,product,day,campaign,product))
          except SystemExit:
              raise
          except Exception:
              raise SystemExit("C83_ABORT_D1_RESERVATION_FAILED_CLOSED") from None
          if len(reserved)!=1:
              raise SystemExit("C83_ABORT_QUOTA_OR_DEDUP_DENIED")
          print("C83_D1_SLOT_RESERVED="+str(reserved[0]["slot"]))
          # ONE mutation. Never retry on timeout or uncertain success.
          try:
              url=generate_shortlink(product_link,campaign,app,secret)
          except Exception:
              raise SystemExit("C83_MUTATION_UNCERTAIN_OR_FAILED_NO_RETRY") from None
          if urlsplit(url).scheme!="https" or urlsplit(url).hostname not in ("s.shopee.com.br","shope.ee"):
              raise SystemExit("C83_ABORT_SHORTLINK_HOST_UNEXPECTED")
          print("C83_SHORTLINK="+url)
          print("C83_CAMPAIGN="+campaign)
          print("C83_IMAGE_URL="+image)
          print("C83_PRODUCT_KEY="+product)
          print("C83_COMPLETE_VERIFIED")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as summary:
              summary.write("### C83 Shopee Office Arco exact campaign conversion\n")
              summary.write("- Identidade: `"+product+"` verificada na API oficial\n")
              summary.write("- Campanha: `"+campaign+"`\n")
              summary.write("- Link oficial: `"+url+"`\n")
              summary.write("- Blogger publica somente por gate separado\n")
          PY
