name: V31 C72 TEMP — saldo Firecrawl chave GitHub GET ONLY
on:
  push:
    paths:
      - '.github/workflows/v31_c72_TEMP_firecrawl_github_credit_get_only.yml'
permissions:
  contents: read
concurrency:
  group: v31-c72-firecrawl-credit-readonly
  cancel-in-progress: false
jobs:
  github-key-credit-readonly:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'test(v31-c72): conferir quota Firecrawl GitHub SOMENTE GET uma vez'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar API Firecrawl uso de creditos SEM PESQUISA nem mutacao
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          key = os.getenv("FIRECRAWL_API_KEY", "")
          if not key:
              print("C72_FIRECRAWL_GITHUB_CREDIT_PREFLIGHT=CONFIG_MISSING")
              sys.exit(3)
          url = "https://api.firecrawl.dev/v2/team/credit-usage"
          req = urllib.request.Request(url, method="GET", headers={
              "Authorization": "Bearer " + key,
              "Accept": "application/json",
              "User-Agent": "v31-credit-audit-readonly",
          })
          try:
              with urllib.request.urlopen(req, timeout=12) as response:
                  code = response.status
                  body = response.read(50000)
              if code != 200:
                  print("C72_FIRECRAWL_GITHUB_CREDIT_PREFLIGHT=NON_200")
                  sys.exit(3)
              payload = json.loads(body)
          except urllib.error.HTTPError as exc:
              print("C72_FIRECRAWL_GITHUB_CREDIT_PREFLIGHT_HTTP=" + str(exc.code))
              sys.exit(3)
          except (urllib.error.URLError, TimeoutError, OSError, ValueError):
              print("C72_FIRECRAWL_GITHUB_CREDIT_PREFLIGHT=UNAVAILABLE")
              sys.exit(3)
          if not isinstance(payload, dict) or payload.get("success") is not True:
              print("C72_FIRECRAWL_GITHUB_CREDIT_PREFLIGHT=NO_VERIFIED_RESPONSE")
              sys.exit(3)
          detail = payload.get("data")
          if not isinstance(detail, dict):
              detail = payload
          value = detail.get("remainingCredits")
          if type(value) not in (int, float) or value < 0 or value > 1000000000:
              print("C72_FIRECRAWL_GITHUB_CREDIT_PREFLIGHT=UNKNOWN_BALANCE")
              sys.exit(3)
          status = "POSITIVE" if value > 5 else "LOW" if value > 0 else "ZERO"
          print("C72_FIRECRAWL_GITHUB_CREDIT_PREFLIGHT=" + status)
          print(json.dumps({"remaining_credits": value,
                            "credential_source": "GITHUB_REPO_SECRET",
                            "requests_to_firecrawl": 1,
                            "method": "GET_CREDIT_USAGE_ONLY",
                            "search_calls": 0,
                            "scrape_calls": 0,
                            "publication_calls": 0,
                            "d1_mutations": 0,
                            "r2_mutations": 0}, sort_keys=True))
          PY
