name: Blogger — Migração visual do painel informativo das Lojas V20

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/blogger_store_info_panel_v20_migration.yml"
      - "blogger_stores/src/blogger_store_info_panel_v20_migration.py"

permissions:
  contents: read

concurrency:
  group: blogger-store-info-panel-v20-migration
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STORE_INFO_PANEL_SCOPE: "lab"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Guardas de código
        run: |
          set -euo pipefail
          python -m py_compile \
            src/blogger_policy_guard.py src/criar_rascunho.py \
            blogger_stores/src/blogger_new_blog_store_page_target.py \
            blogger_stores/src/blogger_store_info_panel_v20_migration.py
          grep -q 'BLOGGER_STORE_INFO_PANEL_V20_START' blogger_stores/src/blogger_store_info_panel_v20_migration.py
          grep -q 'Casa Prática Lab' blogger_stores/src/blogger_store_info_panel_v20_migration.py
      - name: LAB — corrigir painel da Loja sem trocar produtos
        run: PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_store_info_panel_v20_migration.py

# TEMPORARY_PUSH_TRIGGER_FOR_LAB
# ONE_TARGET_AT_A_TIME
# NO_SHOPEE_SELECTION_CHANGE
# NO_ROTATION_PERSIST
