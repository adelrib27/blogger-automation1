name: Blogger — Migração visual do painel informativo das Lojas V20 (recovery manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blogger-store-info-panel-v20-migration
  cancel-in-progress: false

jobs:
  network-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STORE_INFO_PANEL_SCOPE: "network"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Guardas de código e evidência do LAB
        run: |
          set -euo pipefail
          python -m py_compile \
            src/blogger_policy_guard.py src/criar_rascunho.py \
            blogger_stores/src/blogger_new_blog_store_page_target.py \
            blogger_stores/src/blogger_store_info_panel_v20_migration.py
          grep -q 'BLOGGER_STORE_INFO_PANEL_V20_START' blogger_stores/src/blogger_store_info_panel_v20_migration.py
          grep -q 'Vida Pet Prática' blogger_stores/src/blogger_store_info_panel_v20_migration.py
          grep -q 'NETWORK_STORE_INVENTORY_2026-11-02.json' blogger_stores/src/blogger_store_info_panel_v20_migration.py
      - name: Recovery manual — reaplicar Vida Pet + 18 legados sequencialmente
        run: PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/blogger_store_info_panel_v20_migration.py

# RECOVERY_ONLY_MANUAL
# NO_PUSH_NO_SCHEDULE
# LAB_RUN_41566709262_SUCCESS
# NETWORK_RUN_41566818411_SUCCESS
# ONE_BLOG_AT_A_TIME_SEQUENTIAL
# NO_SHOPEE_SELECTION_CHANGE
# NO_ROTATION_PERSIST
