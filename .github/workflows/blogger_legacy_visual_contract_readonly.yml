name: Blogger — Pente-fino visual read-only da rede legada 18/18

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blogger-legacy-visual-contract-readonly
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Auditar 18 Pages públicas + 18 Store Posts via API, sem escrever
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          from urllib.request import Request, urlopen

          from blogger_policy_guard import require_store_html_allowed
          from criar_rascunho import criar_servico_blogger

          inventory=json.loads(Path('blogger_multi_store/data/NETWORK_STORE_INVENTORY_2026-11-02.json').read_text(encoding='utf-8'))
          blogs=inventory.get('blogs') or []
          if len(blogs)!=18:
              raise SystemExit(f'Inventário legado inesperado: {len(blogs)} blogs')

          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36'
          forbidden_page=[
              'id="blogger-new-store-page-surface-fix"',
              '.bg-photo-container{display:none!important',
              '.bg-photo{display:none!important',
              'BLOGGER_NEW_STORE_PAGE_THEME_FRAME_PRESERVED',
          ]

          def fetch(url, label):
              last=''
              for attempt in range(1,8):
                  p=urlsplit(url)
                  q=dict(parse_qsl(p.query,keep_blank_values=True)); q['legacy_visual_probe']=f'{int(time.time())}-{attempt}'
                  target=urlunsplit((p.scheme,p.netloc,p.path,urlencode(q),p.fragment))
                  req=Request(target,headers={'User-Agent':ua,'Cache-Control':'no-cache','Accept-Language':'pt-BR,pt;q=0.9'})
                  try:
                      with urlopen(req,timeout=35) as r:
                          code=int(r.status); raw=r.read().decode('utf-8',errors='ignore')
                      if code==200: return raw
                      last=f'HTTP {code}'
                  except HTTPError as exc:
                      last=f'HTTP {exc.code}'
                      if exc.code not in (429,500,502,503,504): raise
                  except URLError as exc:
                      last=f'URL {exc.reason}'
                  if attempt<7: time.sleep(10 if '429' in last else 3)
              raise RuntimeError(f'{label}: sem HTTP 200 ({last})')

          def live_post_ids(service, blog_id):
              ids=set(); token=None
              while True:
                  kwargs={'blogId':blog_id,'status':'LIVE','fetchBodies':False,'maxResults':100}
                  if token: kwargs['pageToken']=token
                  response=service.posts().list(**kwargs).execute()
                  ids.update(str(x.get('id') or '') for x in (response.get('items') or []))
                  token=response.get('nextPageToken')
                  if not token: return ids

          service=criar_servico_blogger()
          rows=[]; failures=[]
          for idx,b in enumerate(blogs,1):
              title=str(b.get('title') or '')
              blog_id=str(b.get('blog_id') or '')
              page_url=str(b.get('store_page_url') or '')
              post_id=str(b.get('store_post_id') or '')
              reasons=[]

              page_raw=fetch(page_url,f'{idx:02d}-{title}-page')
              theme='emporio-revisao-visual-20-modelo-final' in page_raw
              bad=[x for x in forbidden_page if x in page_raw]
              if not theme: reasons.append('page_theme_v20_marker_absent')
              if bad: reasons.append('page_forbidden='+','.join(bad))

              live_ids=live_post_ids(service,blog_id)
              is_live=post_id in live_ids
              if not is_live: reasons.append('store_post_id_absent_from_live_list')
              post=service.posts().get(blogId=blog_id,postId=post_id).execute()
              post_title=str(post.get('title') or '').strip()
              post_raw=str(post.get('content') or '')
              store=post_raw.count('data-item-id=')
              hero=post_raw.count('data-hero-item-id=')
              rels=post_raw.count('rel="nofollow sponsored noopener"')
              if post_title.casefold()!='loja': reasons.append(f'post_title={post_title!r}')
              if store!=20: reasons.append(f'post_store={store}')
              if hero!=12: reasons.append(f'post_hero={hero}')
              if rels<32: reasons.append(f'post_rels={rels}')
              try:
                  require_store_html_allowed(post_raw,expected_products=20,expected_hero=12)
              except Exception as exc:
                  reasons.append('policy_guard='+str(exc)[:180])

              row={'title':title,'page_theme_v20':theme,'page_forbidden':bad,'post_live':is_live,'store':store,'hero':hero,'rels':rels}
              rows.append(row)
              if reasons: failures.append((title,reasons))
              print(f'LEGACY_VISUAL_AUDIT {idx:02d}/18 | {title} | page_theme={theme} page_forbidden={len(bad)} | post_live={is_live} store={store} hero={hero} rels={rels}')

          print(json.dumps({'blogs':rows},ensure_ascii=False,indent=2))
          if failures:
              raise SystemExit('LEGACY_VISUAL_CONTRACT_FAIL: '+json.dumps(failures,ensure_ascii=False))
          print('LEGACY_VISUAL_CONTRACT_PASS_18_18: 18 Pages HTTP 200 com Tema V20 e zero surface-fix novo; 18 Store Post IDs confirmados em LIVE, 20x12 + Policy Guard + links patrocinados.')
          PY

# READ_ONLY
# MANUAL_ONLY
# NO_PUSH_NO_SCHEDULE
# NO_BLOGGER_WRITE
# NO_GIT_WRITE
# LEGACY_PAGE_IS_THEME_SURFACE_STORE_POST_IS_20X12_CANONICAL
# LIVE_PROVED_BY_POSTS_LIST_NOT_GET_STATUS
# LAST_VALIDATED_RUN_41564539089_PASS_18_18
