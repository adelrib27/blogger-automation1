name: Casa e Decoração — Gerar Fila Editorial

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: casa-decoracao-geracao-editorial
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.RADAR_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.RADAR_CLOUDFLARE_API_TOKEN }}
      CASA_GENERATION_BATCH_SIZE: "10"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar sintaxe
        run: |
          python -m py_compile casa_decoracao/src/build_editorial_queue.py
          python -m py_compile casa_decoracao/src/generate_articles.py

      - name: Preparar fila de 100 pautas
        run: |
          if [ ! -f casa_decoracao/data/editorial_queue_100.json ]; then
            python -u casa_decoracao/src/build_editorial_queue.py
          fi

      - name: Gerar próximo lote editorial
        run: python -u casa_decoracao/src/generate_articles.py

      - name: Salvar somente estado do Casa e Decoração
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- casa_decoracao/data)" ]; then
            echo "Sem mudanças no lote."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casa_decoracao/data
          git commit -m "Gerar lote editorial Casa e Decoração"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar lote como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casa-editorial-${{ github.run_number }}
          path: casa_decoracao/data/
          if-no-files-found: warn
          retention-days: 14
