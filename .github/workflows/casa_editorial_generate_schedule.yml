name: Casa e Decoração — Fluxo Editorial Autônomo

on:
  workflow_dispatch:
  push:
    paths:
      - "casa_decoracao/kickoff.txt"
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: casa-decoracao-fluxo-editorial
  cancel-in-progress: false

jobs:
  avancar-fluxo:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.RADAR_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.RADAR_CLOUDFLARE_API_TOKEN }}
      CASA_WORDPRESS_USERNAME: ${{ secrets.CASA_WORDPRESS_USERNAME }}
      CASA_WORDPRESS_APP_PASSWORD: ${{ secrets.CASA_WORDPRESS_APP_PASSWORD }}
      CASA_WORDPRESS_STATUS: draft
      CASA_GENERATION_BATCH_SIZE: "10"
      CASA_PUBLISH_LIMIT: "5"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar sintaxe
        run: |
          python -m py_compile casa_decoracao/src/build_editorial_queue.py
          python -m py_compile casa_decoracao/src/generate_articles.py
          python -m py_compile casa_decoracao/src/publish_generated.py

      - name: Preparar fila de 100 pautas
        run: |
          if [ ! -f casa_decoracao/data/editorial_queue_100.json ]; then
            python -u casa_decoracao/src/build_editorial_queue.py
          fi

      - name: Gerar e recuperar próximo lote editorial
        run: python -u casa_decoracao/src/generate_articles.py

      - name: Publicar artigos aprovados no novo blog
        if: env.CASA_WORDPRESS_USERNAME != '' && env.CASA_WORDPRESS_APP_PASSWORD != ''
        run: python -u casa_decoracao/src/publish_generated.py

      - name: Verificar saúde pública do novo blog
        if: always()
        run: |
          mkdir -p casa_decoracao/data
          if curl -fsS --max-time 30 https://casaedecoracao.radartechbr.com.br/ >/dev/null; then
            echo "ok $(date -u +%Y-%m-%dT%H:%M:%SZ)" > casa_decoracao/data/site_health.txt
          else
            echo "falha $(date -u +%Y-%m-%dT%H:%M:%SZ)" > casa_decoracao/data/site_health.txt
          fi

      - name: Salvar somente estado do Casa e Decoração
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- casa_decoracao/data)" ]; then
            echo "Sem mudanças no lote."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casa_decoracao/data
          git commit -m "Atualizar fluxo autônomo Casa e Decoração"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar diagnóstico como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casa-fluxo-${{ github.run_number }}
          path: casa_decoracao/data/
          if-no-files-found: warn
          retention-days: 14
