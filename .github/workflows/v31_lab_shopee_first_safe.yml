name: V31 R1 LAB — Shopee V23 SAFE (sem publicação)

on:
  workflow_dispatch:
  push:
    branches:
      - lab/v31r1-shopee-safe-20261103
    paths:
      - blogger_stores/lab/v31_shopee_safe_trigger.txt

permissions:
  contents: read

concurrency:
  group: v31-lab-shopee-safe
  cancel-in-progress: false

jobs:
  shopee-v23-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências do motor já validado
        run: |
          python -m pip install -r requirements.txt
      - name: Gate somente leitura — alvo, semântica e guardas
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID" && test -n "$SHOPEE_SECRET"
          test "$SHOPEE_APP_ID" = '18352820579'
          python -m py_compile blogger_stores/src/v31_shopee_safe_scan.py
          python -m unittest discover -s blogger_stores/tests/v31_safe -q
      - name: Executar seleção REAL Shopee V23 em SAFE
        run: |
          set -euo pipefail
          python blogger_stores/src/v31_shopee_safe_scan.py \
            --repo-root . \
            --profile blogger_stores/v31_lab/perfil_v31_lab.json \
            --config config/shopee_v31_lab.json \
            --rules config/shopee_v31_lab_intent_rules.json \
            --rotation blogger_stores/v31_lab/v31_lab_rotation_seed.json \
            --out blogger_stores/v31_lab/output/selecao_shopee_v23_REAL_SAFE.json
      - name: Arquivo SAFE e diagnóstico (somente se passou)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v31-lab-shopee-safe-${{ github.run_number }}
          path: |
            blogger_stores/v31_lab/output/selecao_shopee_v23_REAL_SAFE.json
            blogger_stores/v31_lab/output/scan_v23/
          if-no-files-found: error
          retention-days: 3