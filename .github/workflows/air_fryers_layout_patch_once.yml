name: Air Fryers — Patch final de navegação

on:
  push:
    paths:
      - ".github/workflows/air_fryers_layout_patch_once.yml"

permissions:
  contents: read

jobs:
  aplicar-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLOGGER_BLOG_ID: "9113728635217260884"
      BLOGGER_STORE_POST_ID: "5189023277801568424"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Aplicar apenas patch de layout/navegação
        run: PYTHONPATH=src:air_fryers_store/src python -u air_fryers_store/src/store_layout_patch.py
      - name: Validar POST sem trocar seleção
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import os
          from criar_rascunho import criar_servico_blogger
          b=criar_servico_blogger()
          p=b.posts().get(blogId=os.environ['BLOGGER_BLOG_ID'],postId=os.environ['BLOGGER_STORE_POST_ID']).execute()
          raw=str(p.get('content') or '')
          assert raw.count('data-item-id=') == 20
          assert raw.count('data-hero-item-id=') == 12
          assert 'href="#bls-formas-revestimentos"><b>Formas &amp; Revestimentos</b>' in raw
          assert 'grid-template-columns:minmax(0,1fr)!important' in raw
          assert '[id^="PopularPosts"]' in raw
          assert 'https://air-fryers-em-foco.blogspot.com/p/loja.html' in raw
          assert 'liquidificador-philips-walita-ri2242.blogspot.com' not in raw
          print('API_PATCH_PASS: 20+12, anchor, layout, domain OK')
          PY
      - name: Validar público com backoff para 429
        run: |
          set -euo pipefail
          base="https://air-fryers-em-foco.blogspot.com/2026/11/loja.html?patch_verify=${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5 6; do
            code=$(curl -L -sS -A 'Mozilla/5.0 AirFryersPublicValidator/1.0' --max-time 40 -o /tmp/loja.html -w '%{http_code}' "${base}-${i}" || echo 000)
            if [ "$code" = "200" ]; then
              read cards hero anchor < <(python - <<'PY'
          raw=open('/tmp/loja.html',encoding='utf-8',errors='ignore').read()
          print(raw.count('data-item-id='), raw.count('data-hero-item-id='), int('href="#bls-formas-revestimentos"' in raw))
          PY
              )
              if [ "$cards" -eq 20 ] && [ "$hero" -eq 12 ] && [ "$anchor" -eq 1 ]; then
                echo "PUBLIC_PATCH_PASS: HTTP 200, 20+12 e âncora correta"; exit 0
              fi
            fi
            echo "Tentativa $i ainda sem PASS público (HTTP $code); aplicando backoff."
            sleep $((i * 6))
          done
          echo 'Validação pública não confirmou após backoff.'
          exit 1
