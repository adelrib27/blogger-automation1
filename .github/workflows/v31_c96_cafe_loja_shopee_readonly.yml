name: "V31 C96 - Café na Medida Loja 24+ Shopee READ ONLY"
# Consulta única por push deste workflow; sem publicação nem geração de shortlinks.
on:
  push:
    branches: [main]
    paths: [".github/workflows/v31_c96_cafe_loja_shopee_readonly.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v31-c96-cafe-loja-readonly
  cancel-in-progress: false
jobs:
  shopee-cafe-curation:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checar script sem consumir API
        run: python -m py_compile affiliate_hub_v31/cafe_loja_readonly.py
      - name: Consultar API Shopee e ranquear ofertas com comissão
        env:
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
        run: python -m affiliate_hub_v31.cafe_loja_readonly | tee c96_cafe_candidates.log
      - name: Manter evidência da curadoria por 3 dias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-c96-cafe-loja-readonly-candidates
          path: c96_cafe_candidates.log
          if-no-files-found: ignore
          retention-days: 3
