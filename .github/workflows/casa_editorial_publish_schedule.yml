name: Casa e Decoração — Publicação Manual v3

on:
  workflow_dispatch:
    inputs:
      publish_limit:
        description: "Máximo nesta execução (1-3; limite diário rígido = 3)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: casa-decoracao-editorial-v3
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CASA_WORDPRESS_USERNAME: ${{ secrets.CASA_WORDPRESS_USERNAME }}
      CASA_WORDPRESS_APP_PASSWORD: ${{ secrets.CASA_WORDPRESS_APP_PASSWORD }}
      CASA_WORDPRESS_STATUS: publish
      CASA_LIVE_PUBLISH_ENABLED: "true"
      CASA_PUBLISH_LIMIT: ${{ inputs.publish_limit }}
      CASA_DAILY_PUBLISH_CAP: "3"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar base
        run: |
          python casa_decoracao/src/category_rotation.py
          python casa_decoracao/src/self_test.py
          python casa_decoracao/src/cta_card_self_test.py
      - name: Publicar apenas itens já gerados e aprovados
        run: python -u casa_decoracao/src/publish_generated.py
      - name: Auditar
        if: always()
        run: python -u casa_decoracao/src/audit_release_candidates.py || true
      - name: Persistir estado
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- casa_decoracao/data)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casa_decoracao/data
          git commit -m "Atualizar publicação Casa e Decoração v3"
          git pull --rebase origin main
          git push origin HEAD:main
