name: V31 C42 TEMP MAIN — integridade biblioteca universal e handoff
on:
  push:
    branches:
      - main
    paths:
      - affiliate_hub_v31/C42_FINAL_READONLY_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  final-audit:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Regressões universais após merge C41
        run: |
          python -m unittest discover -s affiliate_hub_v31/tests -q
          python casa_decoracao/src/self_test.py
          python oficina_garagem/src/self_test.py
          python src/editorial_cross_blog_guard_self_test.py
      - name: Verificar R2 203649 e links afiliados reais + envelope seguro + índice universal
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: |
          python - <<'PY'
          import sqlite3,tempfile
          from pathlib import Path
          from affiliate_hub_v31.catalog import Catalog
          from affiliate_hub_v31.r2_state import R2State,verify_database
          from affiliate_hub_v31.universal_index_storage import UniversalIndexStorage
          from affiliate_hub_v31.handoff_storage import read_private_handoff
          from affiliate_hub_v31.routing import sites
          storage=R2State.from_env()
          with tempfile.TemporaryDirectory(prefix='v31-c42-readonly-') as d:
              path=Path(d)/'catalog.sqlite3'
              assert storage.restore_to(path)
              verify_database(path)
              with Catalog(path) as cat:
                  stats=cat.stats()
                  assert stats['products']==203649
                  assert stats['cached_affiliate_links']>=33
                  print('V31_C42_CORE_R2_PRODUCTS=%d VERIFIED_LINKS=%d'%(stats['products'],stats['cached_affiliate_links']))
              sidecar=Path(d)/'universal.sqlite3'
              assert UniversalIndexStorage.from_env().restore_to(sidecar,expected_product_count=stats['products'])
              with sqlite3.connect(f'file:{sidecar.resolve()}?mode=ro',uri=True) as db:
                  count=db.execute('SELECT COUNT(*) FROM v31_universal_inventory').fetchone()[0]
                  terms=db.execute('SELECT COUNT(*) FROM v31_universal_title_lexicon').fetchone()[0]
                  assert count==203649 and terms>=1399
              print('V31_C42_UNIVERSAL_INDEX_PRODUCTS=%d TERMS=%d'%(count,terms))
              envelope=read_private_handoff(storage,site_key='blogger_air_fryers')
              jobs=envelope['jobs']
              assert envelope['campaign']==sites()['blogger_air_fryers']['campaign']
              assert envelope['status']=='REVIEW_REQUIRED' and envelope['publication_allowed'] is False
              assert len(jobs)>=3 and all(j['publication_allowed'] is False for j in jobs)
              print('V31_C42_PRIVATE_BLOGGER_REVIEW_JOBS=%d PUBLICATION_CALLS=0'%len(jobs))
              assert not list(Path('affiliate_hub_v31/site_requests.d').glob('*.json'))
          print('V31_C42_FINAL_UNIVERSAL_R2_SAFE_INTEGRITY_PASS')
          PY
