name: V31 Universal — conversor diario por pedidos reais sem posts
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.pilot_site_key != '' && format('V31 | conversão isolada {0}', inputs.pilot_site_key) || 'V31 | conversão regular' }}
on:
  schedule:
    # Diariamente 08:47 America/Recife. Só converte quando há pedido real.
    - cron: '47 11 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Teto global de mutações Shopee (1-3)'
        required: true
        type: choice
        default: '1'
        options: ['1','2','3']
      confirm_real_conversion:
        description: 'Permitir converter URLs oficiais no cache R2, sem publicar'
        required: true
        type: boolean
        default: false
      pilot_site_key:
        description: 'Site piloto registrado, com orçamento 1. Vazio mantém a fila normal.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  process-real-site-requests:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.confirm_real_conversion == true))
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar cliente R2 e dependência dos testes de assinatura
        run: python -m pip install 'boto3>=1.35,<2' 'cryptography>=42'
      - name: Testes offline e integridade da fila antes de converter
        run: |
          python -m compileall -q affiliate_hub_v31
          python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Calcular candidatos por tema/campanha, sem mutations
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          V31_BUDGET: ${{ github.event_name == 'schedule' && '3' || inputs.budget }}
          V31_PILOT_SITE: ${{ inputs.pilot_site_key }}
          V31_AUTODRAFT_ACTIVE: ${{ vars.V31_AUTODRAFT_ACTIVE }}
          V31_AUTODRAFT_ROLLOUT_SITE: ${{ vars.V31_AUTODRAFT_ROLLOUT_SITE }}
          V31_AUTODRAFT_FULL_ROLLOUT_APPROVED: ${{ vars.V31_AUTODRAFT_FULL_ROLLOUT_APPROVED }}
        run: |
          args=(--budget "$V31_BUDGET")
          if [[ -n "$V31_PILOT_SITE" ]]; then args+=(--pilot-site-key "$V31_PILOT_SITE"); fi
          python -m affiliate_hub_v31.site_request_queue "${args[@]}"
      - name: Converter ate 3 links, somente campanhas reais, sem publicacao
        env:
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          V31_BUDGET: ${{ github.event_name == 'schedule' && '3' || inputs.budget }}
          V31_PILOT_SITE: ${{ inputs.pilot_site_key }}
          V31_AUTODRAFT_ACTIVE: ${{ vars.V31_AUTODRAFT_ACTIVE }}
          V31_AUTODRAFT_ROLLOUT_SITE: ${{ vars.V31_AUTODRAFT_ROLLOUT_SITE }}
          V31_AUTODRAFT_FULL_ROLLOUT_APPROVED: ${{ vars.V31_AUTODRAFT_FULL_ROLLOUT_APPROVED }}
          V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
          V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
          V31_D1_SAFE_WRITES_ENABLED: V31_D1_SAFE_SQL_ONLY
        run: |
          args=(--budget "$V31_BUDGET" --execute)
          if [[ -n "$V31_PILOT_SITE" ]]; then args+=(--pilot-site-key "$V31_PILOT_SITE"); fi
          python -m affiliate_hub_v31.site_request_queue "${args[@]}"
      - name: Materializar envelopes editoriais privados no R2; apenas REVIEW_REQUIRED
        if: inputs.pilot_site_key == ''
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: |
          python -m affiliate_hub_v31.handoff_dispatch
          python -m affiliate_hub_v31.handoff_dispatch --execute
