name: Conecta Achados — Shopee extract once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/conecta_achados_run_once.yml"

permissions:
  contents: write

concurrency:
  group: conecta-achados-shopee
  cancel-in-progress: false

jobs:
  extrair-um-produto:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests cloudinary pillow

      - name: Extrair produto Shopee e preparar imagem
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from conecta_achados.src.automation import load_json, choose_product, prepare_product_image, CONFIG_PATH, STATE_PATH

          config = load_json(CONFIG_PATH, {})
          state = load_json(STATE_PATH, {"keyword_cursor": 0, "used_item_ids": [], "history": []})
          product, query = choose_product(config, state)
          image = prepare_product_image(product)
          out = {
              "product": product,
              "query": query,
              "prepared_image": image,
          }
          path = Path("conecta_achados/data/selected_once.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(out, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "itemId": product.get("itemId"),
              "productName": product.get("productName"),
              "category": query.get("label"),
              "keyword": query.get("keyword"),
              "image_source": image.get("source"),
          }, ensure_ascii=False))
          PY

      - name: Salvar seleção de hoje
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+adelrib27@users.noreply.github.com"
          git add conecta_achados/data/selected_once.json
          git commit -m "Conecta Achados: extrair produto Shopee para post único"
          git pull --rebase origin main
          git push origin HEAD:main
