name: V31 C23 TEMP Nova chave Shopee - apenas 1 leitura
on:
  push:
    branches:
      - feature/v31-affiliate-hub-c1-safe-20261115
    paths:
      - affiliate_hub_v31/C23_ROTATED_SECRET_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-shopee-api-probe-safe
  cancel-in-progress: false
jobs:
  verify-new-secret:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/feature/v31-affiliate-hub-c1-safe-20261115'
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar contrato e testes offline sem imprimir segredo
        run: |
          python -m affiliate_hub_v31.credentials --profile manifest
          python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Chave atual Shopee API autenticada - uma unica productOfferV2 de leitura
        env:
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
        run: |
          python -m affiliate_hub_v31.shopee_probe
          echo 'V31_C23_ROTATED_SECRET_AUTH_READONLY_SUCCESS'
