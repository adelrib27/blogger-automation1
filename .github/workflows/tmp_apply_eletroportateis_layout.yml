name: TEMP — Aplicar layout final Eletroportáteis

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/tmp_apply_eletroportateis_layout.yml"

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BLOGGER_BLOG_ID: "8658632621591002634"
      BLOGGER_STORE_POST_ID: "2599179962359747947"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Aplicar patch de identidade/layout
        run: PYTHONPATH=src python -u eletroportateis_store/src/store_layout_patch.py
      - name: Validar POST salvo e copy nichada
        run: |
          PYTHONPATH=src python - <<'PY'
          import os
          from criar_rascunho import criar_servico_blogger
          b=criar_servico_blogger()
          p=b.posts().get(blogId=os.environ['BLOGGER_BLOG_ID'],postId=os.environ['BLOGGER_STORE_POST_ID']).execute()
          h=str(p.get('content') or '')
          assert h.count('data-item-id=')==20
          assert h.count('data-hero-item-id=')==12
          assert 'grid-template-columns:minmax(0,1fr)!important' in h
          assert 'https://eletroportateis-na-cozinha.blogspot.com/p/loja.html' in h
          assert 'href="#bls-air-fryers"' in h
          assert 'href="#bls-liquidificadores-mixers"' in h
          assert 'href="#bls-processadores"' in h
          assert 'href="#bls-batedeiras"' in h
          assert 'href="#bls-cafeteiras-outros"' in h
          assert 'Vitrine de eletroportáteis para cozinha' in h
          assert 'Batedeiras, cafeteiras e outros eletros para a cozinha' in h
          assert 'liquidificadores-em-foco.blogspot.com' not in h
          assert 'href="#bls-casa-organizacao"' not in h
          assert 'Achados reais para cuidados pessoais e rotina' not in h
          print('ELETROPORTATEIS_LAYOUT_COPY_PASS')
          PY
