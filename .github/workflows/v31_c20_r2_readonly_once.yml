name: V31 C20 - Canario R2 REAL intake futuro SAFE (temporario)
on:
  push:
    branches:
      - feature/v31-affiliate-hub-c1-safe-20261115
    paths:
      - affiliate_hub_v31/C20_REAL_CANARY_TRIGGER_2026-11-17.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  c20-future-site-readonly:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/feature/v31-affiliate-hub-c1-safe-20261115'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencia privada R2
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Regressao offline
        run: |
          python -m compileall -q affiliate_hub_v31
          python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Consultar acervo R2 REAL sem gravar, converter ou publicar
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: {{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: {{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: {{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: {{ vars.V31_EDITORIAL_R2_BUCKET }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from affiliate_hub_v31.catalog import Catalog
          from affiliate_hub_v31.future_site_intake import preview_future_site, summarize_preview
          from affiliate_hub_v31.r2_state import R2State, verify_database
          from affiliate_hub_v31.title_index import has_index

          with tempfile.TemporaryDirectory(prefix='v31-c20-r2-readonly-') as td:
              db=Path(td)/'catalog.sqlite3'
              assert R2State.from_env().restore_to(db), 'catalog_absent'
              verify_database(db)
              with Catalog(db) as catalog:
                  stats=catalog.stats()
                  assert stats['products'] >= 203649, 'unexpected_product_regression'
                  assert stats['cached_affiliate_links'] >= 17, 'unexpected_link_regression'
                  assert has_index(catalog), 'index_not_installed'
                  index_rows=catalog.db.execute('SELECT COUNT(*) FROM v31_catalog_fts').fetchone()[0]
                  assert index_rows == stats['products'], 'fts_out_of_sync'
                  for topic, platform in (
                      ('Air Fryer','blogger'),
                      ('Guarda Roupa','wordpress'),
                      ('Freio','unspecified'),
                  ):
                      result=preview_future_site(catalog,topic=topic,platform=platform)
                      assert not result['can_publish'] and result['r2_writes']==0
                      assert not result['affiliate_conversion_calls'] and not result['publication_calls']
                      assert all(x['affiliate_url'] is None for x in result['approved_candidates']+result['review_queue'])
                      print('V31_C20_TOPIC_PASS',json.dumps(summarize_preview(result),sort_keys=True))
                  print('V31_C20_R2_READONLY_PASS',json.dumps({
                      'catalog_products': stats['products'],
                      'fts_index_rows': index_rows,
                      'cached_affiliate_links':stats['cached_affiliate_links'],
                      'publication_calls':0,'conversion_calls':0,'r2_writes':0
                  },sort_keys=True))
          PY
