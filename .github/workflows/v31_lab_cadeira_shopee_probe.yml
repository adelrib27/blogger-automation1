name: V31 LAB - Catalogo SAFE Shopee Cadeira Certa

on:
  push:
    branches: [lab/v31-shopee-cadeira-probe-20261114]
    paths: [.github/workflows/v31_lab_cadeira_shopee_probe.yml]

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'adelrib27/blogger-automation1' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar o perfil e buscar o catalogo real
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          set -euo pipefail
          if [[ "$SHOPEE_APP_ID" != "18352820579" || -z "$SHOPEE_SECRET" ]]; then
            echo 'CREDENTIALS_MISSING_OR_APP_ID_MISMATCH'
            exit 1
          fi
          python -W ignore - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "v31_master")
          import shopee_r2_safe as store

          path = Path("v31_master/profiles/cadeira_certa_commercial_safe.json")
          profile = store.load_commercial_profile(path)
          assert profile["target"]["blog_id"] == "7163624325768776034"
          assert profile["store"]["page_id"] == "5014986967420563988"
          assert sum(len(c["terms"]) for c in profile["store"]["categories"]) == 4
          output = Path(os.environ["RUNNER_TEMP"]) / "cadeira-safe"
          sys.argv = [store.__file__, "--commercial-profile", str(path), "--out-dir", str(output)]
          try:
              store.main()
          except store.GateError as error:
              reason = str(error)
              allowed = {
                  "Falha ao consultar Shopee; nenhum dado publicado",
                  "Resposta Shopee inválida",
                  "GraphQL retornou erro; não usar resposta parcial",
                  "Nodes da Shopee ausentes",
                  "Categoria sem quatro ofertas verificadas",
                  "Oferta Shopee inválida",
              }
              print("CATALOG_SAFE_BLOCKED=" + (reason if reason in allowed else "VALIDATION_FAILED"))
              raise SystemExit(1) from None
          catalog = json.loads((output / "v31_r2_products.json").read_text())
          products = catalog["products"]
          assert len({p["item_id"] for p in products}) == 16
          assert all(store.trusted(p["offer_link"], affiliate=True) and
                     store.trusted(p["image"], affiliate=False) for p in products)
          assert (output / "v31_r2_store.html").read_text().count('rel="nofollow sponsored noopener"') == 32
          # Only the public-facing fields and destination IDs of the approved catalog.
          fields = ("item_id", "title", "offer_link", "image", "price", "category", "rating")
          catalog["products"] = [{k: p[k] for k in fields} for p in products]
          print("CATALOG_APPROVED_JSON=" + json.dumps(catalog, ensure_ascii=True, separators=(",", ":")))
          PY
