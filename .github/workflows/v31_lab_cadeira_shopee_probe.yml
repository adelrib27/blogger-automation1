name: V31 LAB - Artigo piloto Cadeira Certa - uma busca Shopee

on:
  push:
    branches: [lab/v31-shopee-cadeira-probe-20261114]
    paths: [.github/workflows/v31_lab_cadeira_shopee_probe.yml]

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'adelrib27/blogger-automation1' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d63363bd8f4b14292852030691969e6cb99e842b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Selecionar uma oferta real sem retentar
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          PYTHONPATH=v31_master python - <<'PY'
          import json
          import os
          from shopee_r2_safe import GateError, ShopeeGraphQLError, fold_title, match_any, normalize, signed_query
          from store_stock_commission_safe import commission_eligible

          app = os.environ.get("SHOPEE_APP_ID", "").strip()
          secret = os.environ.get("SHOPEE_SECRET", "").strip()
          if app != "18352820579" or not secret:
              print("ARTICLE_STATUS=CREDENTIALS_MISSING_OR_APP_ID_MISMATCH")
              raise SystemExit(1)
          try:
              nodes = signed_query("cadeira mesh", app, secret)
          except ShopeeGraphQLError as error:
              print("ARTICLE_GRAPHQL_CODES=" + json.dumps(error.codes))
              raise SystemExit(1) from None
          except GateError:
              print("ARTICLE_STATUS=INVALID_OR_UNAVAILABLE_SHOPEE_RESPONSE")
              raise SystemExit(1) from None
          criteria = {"include": ["cadeira"], "exclude": ["capa para", "kit rodizio", "peca de reposicao", "almofada para"]}
          offers = []
          for row in nodes:
              if not commission_eligible(row, verified_affiliate_response=True):
                  continue
              item = normalize(row, "Cadeiras de escritório mesh", criteria=criteria)
              if item and match_any(fold_title(item["title"]), ["mesh"]):
                  offers.append(item)
          print("ARTICLE_COUNTS=" + json.dumps({"nodes": len(nodes), "eligible": len(offers)}))
          if not offers:
              raise SystemExit(1)
          chosen = max(offers, key=lambda item: item["sales"])
          print("ARTICLE_PRODUCT=" + json.dumps({k: chosen[k] for k in ("item_id", "title", "offer_link", "image")}, ensure_ascii=True))
          PY
