name: V31 LAB - Comparar consulta Blogger e formato Radar

on:
  push:
    branches: [lab/v31-shopee-cadeira-probe-20261114]
    paths: [.github/workflows/v31_lab_cadeira_shopee_probe.yml]

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'adelrib27/blogger-automation1' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d63363bd8f4b14292852030691969e6cb99e842b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comparar duas consultas Shopee sem publicar
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          PYTHONPATH=v31_master python - <<'PY'
          import json
          import os
          import time
          from lab_shopee_graphql_diagnostic import send_query

          app = os.environ.get("SHOPEE_APP_ID", "").strip()
          secret = os.environ.get("SHOPEE_SECRET", "").strip()
          if app != "18352820579" or not secret:
              print("COMPARE_NO_CALL=CREDENTIALS_MISSING_OR_APP_ID_MISMATCH")
              raise SystemExit(1)
          fields = "itemId productName offerLink imageUrl priceMin shopId ratingStar sales commissionRate"
          for index, (mode, args) in enumerate((
              ("blogger", ""),
              ("radar_search", ", listType: 1, sortType: 1, isAMSOffer: false"),
          )):
              if index:
                  time.sleep(8)
              query = ('query V31Probe { productOfferV2(keyword: "cadeira ergonomica"' +
                       args + ', page: 1, limit: 5) { nodes { ' + fields + ' } } }')
              result = send_query(mode, query, app, secret)
              print("COMPARE_RESULT=" + json.dumps(result, sort_keys=True), flush=True)
              if result.get("http_status") in (401, 403, 429) or any(
                  code in (10020, 10030, 10035) for code in result.get("graphql_error_codes", [])
              ):
                  break
          PY
