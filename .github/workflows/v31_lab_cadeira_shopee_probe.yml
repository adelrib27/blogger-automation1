name: V31 LAB - Catalogo SAFE Shopee Cadeira Certa

on:
  push:
    branches: [lab/v31-shopee-cadeira-probe-20261114]
    paths: [.github/workflows/v31_lab_cadeira_shopee_probe.yml]

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'adelrib27/blogger-automation1' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar o perfil e buscar o catalogo real
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          set -euo pipefail
          if [[ "$SHOPEE_APP_ID" != "18352820579" || -z "$SHOPEE_SECRET" ]]; then
            echo 'CREDENTIALS_MISSING_OR_APP_ID_MISMATCH'
            exit 1
          fi
          PYTHONPATH=v31_master python - <<'PY'
          import json
          import os
          import time
          from lab_shopee_graphql_diagnostic import send_query

          for keyword in ("cadeira ergonomica", "cadeira mesh", "cadeira estofada", "cadeira gamer"):
              query = ('query V31Probe { productOfferV2(keyword: ' + json.dumps(keyword) +
                       ', page: 1, limit: 5) { nodes { itemId productName offerLink imageUrl '
                       'priceMin shopId ratingStar sales commissionRate } } }')
              result = send_query(keyword, query, os.environ["SHOPEE_APP_ID"].strip(), os.environ["SHOPEE_SECRET"].strip())
              print("CATEGORY_PROBE=" + json.dumps(result, sort_keys=True), flush=True)
              time.sleep(2)
          PY
