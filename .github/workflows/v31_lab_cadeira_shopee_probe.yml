name: V31 LAB - V31 LAB - Uma busca Shopee por palavra-chave

on:
  push:
    branches: [lab/v31-shopee-cadeira-probe-20261114]
    paths: [.github/workflows/v31_lab_cadeira_shopee_probe.yml]

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'adelrib27/blogger-automation1' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d63363bd8f4b14292852030691969e6cb99e842b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar cadeira sem filtros opcionais
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          PYTHONPATH=v31_master python - <<'PY'
          import json
          import os
          from lab_shopee_graphql_diagnostic import send_query

          app = os.environ.get("SHOPEE_APP_ID", "").strip()
          secret = os.environ.get("SHOPEE_SECRET", "").strip()
          if app != "18352820579" or not secret:
              print("KEYWORD_PROBE_NO_CALL=CREDENTIALS_MISSING_OR_APP_ID_MISMATCH")
              raise SystemExit(1)
          query = ('query V31Probe { productOfferV2(keyword: "cadeira", page: 1, limit: 5) '
                   '{ nodes { itemId productName } } }')
          result = send_query("cadeira", query, app, secret)
          print("KEYWORD_PROBE_RESULT=" + json.dumps(result, sort_keys=True))
          raise SystemExit(0 if result["status"] == "GRAPHQL_OK" and result.get("offers_count") is not None else 1)
          PY
