name: V31 C40 TEMP MAIN — pedido Blogger real, link e handoff R2
on:
  push:
    branches:
      - main
    paths:
      - affiliate_hub_v31/C40_QUEUE_HANDOFF_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  once:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Testar 279 contratos antes de Shopee
        run: python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Pedido real de Blogger — plano sem mutations
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: |
          python -m affiliate_hub_v31.site_request_queue --budget 1
          python -m affiliate_hub_v31.handoff_dispatch
      - name: Converter no maximo 1 URL da campanha real; sem publicar
        env:
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: python -m affiliate_hub_v31.site_request_queue --budget 1 --execute
      - name: Persistir envelope privado do Blogger para gerador posterior, status REVIEW_REQUIRED
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: |
          python -m affiliate_hub_v31.handoff_dispatch --execute
          python - <<'PY'
          from affiliate_hub_v31.handoff_storage import read_private_handoff
          from affiliate_hub_v31.r2_state import R2State
          from affiliate_hub_v31.routing import sites
          doc=read_private_handoff(R2State.from_env(),
                                  site_key='blogger_air_fryers')
          expected=sites()['blogger_air_fryers']['campaign']
          jobs=doc['jobs']
          assert doc['campaign']==expected
          assert doc['publication_allowed'] is False
          assert doc['status']=='REVIEW_REQUIRED'
          assert all(j['campaign']==expected and j['publication_allowed'] is False
                     for j in jobs)
          assert len(jobs)>=2
          print('V31_C40_PRIVATE_HANDOFF_R2_VERIFIED_PASS')
          print({'private_review_jobs':len(jobs),
                 'publication_calls':0,'campaign_isolation':True})
          PY
          echo 'V31_C40_AUTONOMOUS_REQUEST_TO_CAMPAIGN_LINK_TO_PRIVATE_HANDOFF_PASS'
