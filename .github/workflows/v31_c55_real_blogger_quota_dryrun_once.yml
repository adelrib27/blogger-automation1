name: V31 C55 TEMP - validar quota dos 3 artigos Blogger e R2 SEM criar post
on:
  push:
    branches: [main]
    paths:
      - affiliate_hub_v31/C55_REAL_BLOGGER_QUOTA_CHECK_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  blogger-readonly-quota-check:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2' google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Ler Blogger real e catálogo R2, sem criação ou publicação
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from affiliate_hub_v31.automatic_blogger_drafts import draft_next
          r=draft_next(site_key='blogger_moveis_para_cada_canto',execute=False)
          if (r.get('mode')!='C55_DRY_RUN' or
              r.get('status')!='OWNER_QUOTA_REACHED' or
              r.get('publication_calls')!=0 or
              r.get('draft_creation_calls')!=0):
              raise SystemExit('V31_C55_REAL_OWNER_QUOTA_GATE_FAILED')
          print('V31_C55_REAL_BLOGGER_3_OF_3_QUOTA_NO_NEW_POSTS_PASS')
          PY
