name: V31 C44 TEMP MAIN - drain evidence-safe furniture backlog in bounded batches
on:
  push:
    branches:
      - main
    paths:
      - affiliate_hub_v31/C44_FURNITURE_BOUNDED_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  bounded-classification:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar cliente R2
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Testes C42 e regressão integral antes de escrever
        run: |
          python -m unittest discover -s affiliate_hub_v31/tests -q
          python casa_decoracao/src/self_test.py
          python oficina_garagem/src/self_test.py
          python src/editorial_cross_blog_guard_self_test.py
      - name: Seis lotes MAX100; reprovar qualquer excesso; salvar e sincronizar R2 em cada lote
        shell: bash
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: |
          set -euo pipefail
          total=0
          for cycle in 1 2 3 4 5 6; do
            python -m affiliate_hub_v31.safe_reclassification --limit 100 --execute | tee /tmp/v31-c44-last.txt
            count="$(python - <<'PY'
          import json
          from pathlib import Path
          lines=Path('/tmp/v31-c44-last.txt').read_text().splitlines()
          doc=json.loads(lines[-1])
          n=doc['approved_this_batch']
          if (doc['mode']!='C39_RECLASSIFICATION_APPLY' or
              type(n)is not int or not 0<=n<=100 or
              doc['publication_calls']!=0 or
              doc['shopee_api_calls']!=0 or
              doc['old_affiliate_links_preserved'] is not True or
              bool(doc['snapshot_verified']) != (n>0)):
              raise SystemExit('V31_C44_CATALOG_MUTATION_GATE_FAILED')
          print(n)
          PY
            )"
            total="$((total+count))"
            if (( total > 594 )); then
              echo 'V31_C44_APPROVAL_CAP_EXCEEDED'
              exit 4
            fi
            if (( count == 0 )); then
              echo "V31_C44_NO_MORE_SAFE_CANDIDATES cycle=$cycle total=$total"
              break
            fi
            python -m affiliate_hub_v31.universal_inventory --execute
            echo "V31_C44_PERSISTED_SYNCED_BATCH_PASS cycle=$cycle approved=$count aggregate=$total"
          done
          echo "V31_C44_SAFE_R2_CLASSIFICATION_CYCLES_COMPLETE approved_total=$total"
