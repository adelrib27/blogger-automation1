name: V31 C56 TEMP - verificar Workers AI editorial sem Blogger POST
on:
  push:
    branches: [main]
    paths:
      - affiliate_hub_v31/C56_AI_EDITORIAL_NO_POST_ONCE_TRIGGER.txt
permissions:
  contents: read
jobs:
  verify-original-article-generator:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cliente IA
        run: python -m pip install requests
      - name: Verificar credenciais e geração original via Workers AI, sem posts/links
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from affiliate_hub_v31.automatic_blogger_drafts import generate_original_paragraphs
          aid=os.getenv("CLOUDFLARE_ACCOUNT_ID","")
          token=os.getenv("CLOUDFLARE_API_TOKEN","")
          if not aid or not token:
              print("V31_C56_GENERIC_WORKERS_AI_SECRETS_MISSING")
              raise SystemExit(4)
          paragraphs=generate_original_paragraphs(
              product_name="Mesa de Escritório Lume em MDP Demóbile",
              topic="mesa de escritório",
              account_id=aid,api_token=token)
          words=sum(len(p.split()) for p in paragraphs)
          if not 6<=len(paragraphs)<=10 or words<420:
              raise SystemExit("V31_C56_GENERATION_QUALITY_GATE_FAILED")
          print("V31_C56_REAL_WORKERS_AI_ORIGINAL_PARAGRAPHS_PASS")
          print(f"paragraphs={len(paragraphs)} words={words} posts_created=0 shopee_calls=0")
          PY
