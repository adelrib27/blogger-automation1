name: V31 Universal — qualidade de categorias REVIEW, sem posts
on:
  schedule:
    # Quinta-feira ~09:31 America/Recife; depois da manutenção de quarta.
    - cron: '31 12 * * 4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  reportar-curadoria-universal:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Ler somente indicadores agregados R2 (nenhum SKU/título/link publicado)
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m affiliate_hub_v31.unclassified_review_hints --limit 20
          echo 'V31_C47_UNIVERSAL_QUALITY_REPORT_READONLY_PASS'
