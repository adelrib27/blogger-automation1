name: Moda e Ofertas Accessory Fix Once

on:
  push:
    paths:
      - blogger_stores/moda_ofertas_accessory_fix_kickoff.txt

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch semantico de acessorios
        run: python scripts/moda_ofertas_accessory_fix_once.py

      - name: Validar fonte e JSON
        run: |
          python -m py_compile blogger_stores/src/moda_ofertas_store.py
          python -m json.tool config/shopee_moda_ofertas_intent_rules.json >/dev/null
          grep -q 'SHOTH FEMININO' blogger_stores/src/moda_ofertas_store.py
          grep -q 'Bolsa Feminina Kit Sacola' blogger_stores/src/moda_ofertas_store.py

      - name: Commitar patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogger_stores/src/moda_ofertas_store.py config/shopee_moda_ofertas_intent_rules.json
          git commit -m "moda ofertas: bloquear falsos positivos de carteira e cinto"
          git pull --rebase origin main
          git push origin HEAD:main
