name: V31 C7 - Radar slot R2 SAFE (temporario)

on:
  push:
    branches:
      - feature/v31-affiliate-hub-c1-safe-20261115
    paths:
      - '.github/workflows/v31_c7_radar_once.yml'

permissions:
  contents: read

concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false

jobs:
  radar-slot-probe-no-post:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/feature/v31-affiliate-hub-c1-safe-20261115' &&
      github.event_name == 'push'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar cliente R2
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Compilar e executar testes offline
        run: |
          python -m compileall -q affiliate_hub_v31
          python -m unittest discover -s affiliate_hub_v31/tests -q
      - name: Radar verificar produtos e links privados no R2
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: python -m affiliate_hub_v31.link_warmup --site wordpress_radartechbr --config config/shopee_oportunidades.json --rules config/shopee_intent_rules.json --limit 3 --dry-run
      - name: Radar converter 1 link para a campanha própria
        env:
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: python -m affiliate_hub_v31.link_warmup --site wordpress_radartechbr --config config/shopee_oportunidades.json --rules config/shopee_intent_rules.json --limit 1
      - name: Radar validar apenas 1 slot com prepare_slot original (SEM publicar)
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        run: python -m affiliate_hub_v31.c7_radar_slot_probe
