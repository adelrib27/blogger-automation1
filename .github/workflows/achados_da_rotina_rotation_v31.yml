name: V31 Achados da Rotina - Shopee Loja 20min (isolado)
on:
  pull_request:
    paths:
      - "achados_da_rotina/rotation_v31.py"
      - ".github/workflows/achados_da_rotina_rotation_v31.yml"
  push:
    branches: [main]
    paths:
      - "achados_da_rotina/rotation_v31.py"
      - ".github/workflows/achados_da_rotina_rotation_v31.yml"
  workflow_dispatch:
  schedule:
    # Frequência de teste: 20 minutos; horários GitHub Actions podem sofrer atrasos.
    - cron: "*/20 * * * *"

permissions:
  contents: read

concurrency:
  group: v31-achados-rotina-1637047917126642592-store
  cancel-in-progress: false

jobs:
  rotacao-loja:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      # Em PR/manual somente SAFE. LIVE apenas push main ou schedule main.
      ACHADOS_STORE_DRY_RUN: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'false' || 'true' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar Google Blogger API
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth-httplib2
      - name: Confirmar dependências sem expor credenciais
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          test -n "$BLOGGER_CLIENT_ID"
          test -n "$BLOGGER_CLIENT_SECRET"
          test -n "$BLOGGER_REFRESH_TOKEN"
          python -m py_compile achados_da_rotina/rotation_v31.py src/criar_rascunho.py src/blogger_policy_guard.py
      - name: Teste unitário offline
        run: python achados_da_rotina/rotation_v31.py --self-test
      - name: Shopee LIVE consulta / Blogger SAFE ou LIVE com guarda de alvo
        run: python -u achados_da_rotina/rotation_v31.py
      - name: Arquivar diagnóstico sem segredos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: achados-v31-rotation-${{ github.run_number }}
          path: achados_da_rotina/rotacao_ultimo_resultado.json
          if-no-files-found: warn
          retention-days: 7
