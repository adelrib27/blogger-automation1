# V31 C143: owner deleted this Blogger; cron removed and job disabled. DO NOT reenable.
name: V31 Achados da Rotina - Shopee Loja mensal (isolado)
on:
  pull_request:
    paths:
      - ".github/workflows/achados_da_rotina_rotation_v31.yml"
      - "achados_da_rotina/rotation_v31.py"
  push:
    branches: [main]
    paths:
      - "achados_da_rotina/rotation_v31.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v31-achados-rotina-1637047917126642592-store
  cancel-in-progress: false

jobs:
  rotacao-loja:
    if: false # V31_C143_OWNER_DELETED_JOB_DISABLED
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      # PR, push e manual: SAFE. Somente schedule mensal executa LIVE.
      ACHADOS_STORE_DRY_RUN: ${{ (github.event_name == 'schedule') && 'false' || 'true' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar Google Blogger API
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth-httplib2
      - name: Confirmar dependências sem expor credenciais
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          test -n "$BLOGGER_CLIENT_ID"
          test -n "$BLOGGER_CLIENT_SECRET"
          test -n "$BLOGGER_REFRESH_TOKEN"
          python -m py_compile achados_da_rotina/rotation_v31.py src/criar_rascunho.py src/blogger_policy_guard.py
      - name: Teste unitário offline
        run: python achados_da_rotina/rotation_v31.py --self-test
      - name: Shopee LIVE consulta / Blogger SAFE ou LIVE com guarda de alvo
        run: python -u achados_da_rotina/rotation_v31.py
      - name: Arquivar diagnóstico sem segredos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: achados-v31-rotation-${{ github.run_number }}
          path: achados_da_rotina/rotacao_ultimo_resultado.json
          if-no-files-found: warn
          retention-days: 7
