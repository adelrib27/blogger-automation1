name: Blogger Multi Store — Bootstrap de Lojas Ausentes

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/blogger_multi_store_bootstrap.yml"
      - "blogger_multi_store/src/bootstrap_missing_stores.py"
      - "blogger_multi_store/config/bootstrap_missing_stores.json"
      - "blogger_multi_store/bootstrap_kickoff.txt"

permissions:
  contents: write

concurrency:
  group: blogger-multi-store-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar bootstrap antes da escrita
        run: |
          set -euo pipefail
          python -m py_compile blogger_multi_store/src/bootstrap_missing_stores.py
          python -m json.tool blogger_multi_store/config/bootstrap_missing_stores.json > /dev/null
          test -n "$BLOGGER_CLIENT_ID"
          test -n "$BLOGGER_CLIENT_SECRET"
          test -n "$BLOGGER_REFRESH_TOKEN"

      - name: Criar ou localizar Loja em cada blog
        run: |
          PYTHONPATH=src python -u blogger_multi_store/src/bootstrap_missing_stores.py

      - name: Persistir resultado do bootstrap
        if: success()
        run: |
          set -euo pipefail
          if [ ! -f blogger_multi_store/data/bootstrap_result.json ]; then
            echo "Resultado não foi criado." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogger_multi_store/data/bootstrap_result.json
          if git diff --cached --quiet; then
            echo "Sem mudança no resultado."
            exit 0
          fi
          git commit -m "Registrar bootstrap das lojas Blogger"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-multi-store-bootstrap-${{ github.run_number }}
          path: blogger_multi_store/data/bootstrap_result.json
          if-no-files-found: warn
          retention-days: 14
