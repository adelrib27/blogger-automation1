name: "V31 C88 - Ar Condicionado converter ID exato uma vez"
on:
  push:
    branches: [main]
    paths: [".github/workflows/v31_c88_arcond_convert_exact_once.yml"]
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  convert-lg-arcond-exact:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: v31-editorial-safe
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revalidar Shopee, reservar cota D1 e gerar subID exclusivo
        env:
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
          V31_D1_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_D1_DATABASE_ID: 9bfce7a4-6167-4bfc-a65e-a74c1a34f064
          V31_D1_API_TOKEN: ${{ secrets.V31_D1_API_TOKEN }}
          V31_D1_SAFE_WRITES_ENABLED: V31_D1_SAFE_SQL_ONLY
        shell: bash
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from affiliate_hub_v31.shopee_probe import authorization,ENDPOINT
          from affiliate_hub_v31.converter import generate_shortlink,valid_campaign
          from affiliate_hub_v31.d1_http_runner import CloudflareD1HTTPRunner
          app=os.environ.get("V31_EDITORIAL_SHOPEE_APP_ID","")
          secret=os.environ.get("V31_EDITORIAL_SHOPEE_APP_SECRET","")
          if not app or not secret:raise SystemExit("C88_ABORT_NO_CREDENTIALS")
          campaign="arcondicionadosemduvidas"
          product="shopee:822103155:58265302556"
          valid_campaign(campaign)
          query='query C88AirConfirm { productOfferV2(itemId: 58265302556, page: 1, limit: 5) { nodes { itemId shopId productName productLink imageUrl offerLink } } }'
          body=json.dumps({"query":query,"operationName":"C88AirConfirm"},separators=(",",":"))
          req=urllib.request.Request(ENDPOINT,data=body.encode(),method="POST",headers={
              "Authorization":authorization(app,secret,body,int(time.time())),
              "Content-Type":"application/json","Accept":"application/json","User-Agent":"V31-C88-Air-Convert-Once/1.0"})
          try:
              with urllib.request.urlopen(req,timeout=22) as resp:
                  raw=resp.read(131073)
                  if resp.status!=200 or len(raw)>131072:raise ValueError("bad_status_or_size")
              doc=json.loads(raw)
          except Exception:
              raise SystemExit("C88_ABORT_SHOPEE_READ_ERROR") from None
          if doc.get("errors"):raise SystemExit("C88_ABORT_SHOPEE_GRAPHQL_READ_ERROR")
          nodes=((doc.get("data")or{}).get("productOfferV2")or{}).get("nodes")or[]
          exact=[n for n in nodes if str(n.get("itemId"))=="58265302556" and str(n.get("shopId"))=="822103155" and all(s in str(n.get("productName","")).lower() for s in ("lg","12000","inverter"))]
          if len(exact)!=1:raise SystemExit("C88_ABORT_PRODUCT_IDENTITY_MISMATCH")
          n=exact[0]
          expected="https://shopee.com.br/product/822103155/58265302556"
          if n.get("productLink")!=expected:raise SystemExit("C88_ABORT_ORIGIN_URL_CHANGED")
          photo=str(n.get("imageUrl")or"")
          if urlsplit(photo).scheme!="https" or urlsplit(photo).hostname not in ("cf.shopee.com.br","down-br.img.susercontent.com"):raise SystemExit("C88_ABORT_IMAGE_INVALID")
          print("C88_EXACT_PRODUCT_PASS")
          # Reserve one global daily slot, enforce immutable campaign/SKU dedupe.
          try:
              db=CloudflareD1HTTPRunner.from_environment(allow_mutations=True)
              day=datetime.now(timezone.utc).date().isoformat()
              previous=db("SELECT day_utc,slot FROM v31_shopee_conversion_attempts WHERE campaign=? AND product_key=? LIMIT 1",(campaign,product))
              if previous:raise SystemExit("C88_ABORT_ALREADY_ATTEMPTED")
              reserved=db("""
                INSERT INTO v31_shopee_conversion_attempts(day_utc,slot,campaign,product_key)
                SELECT ?,COALESCE(MAX(slot),0)+1,?,?
                FROM v31_shopee_conversion_attempts WHERE day_utc=?
                HAVING COALESCE(MAX(slot),0)<3
                AND NOT EXISTS (SELECT 1 FROM v31_shopee_conversion_attempts
                               WHERE campaign=? AND product_key=?)
                ON CONFLICT DO NOTHING
                RETURNING slot
              """,(day,campaign,product,day,campaign,product))
          except SystemExit:raise
          except Exception:
              raise SystemExit("C88_ABORT_D1_RESERVATION_FAILURE") from None
          if len(reserved)!=1:raise SystemExit("C88_ABORT_QUOTA_OR_DUPLICATION")
          print("C88_D1_SLOT="+str(reserved[0]["slot"]))
          # One attempt only, even on timeout: no auto retry.
          try:
              shortlink=generate_shortlink(expected,campaign,app,secret)
          except Exception:
              raise SystemExit("C88_MUTATION_UNCERTAIN_DO_NOT_RETRY") from None
          if urlsplit(shortlink).scheme!="https" or urlsplit(shortlink).hostname not in ("s.shopee.com.br","shope.ee"):raise SystemExit("C88_ABORT_SHORTLINK_HOST")
          print("C88_AFFILIATE_SHORTLINK="+shortlink)
          print("C88_CAMPAIGN="+campaign)
          print("C88_PRODUCT_KEY="+product)
          print("C88_API_IMAGE="+photo)
          print("C88_CONVERSION_VERIFIED")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as s:
              s.write("### C88 Ar Condicionado LG — conversão segura\n")
              s.write("- Produto: `"+product+"`\n")
              s.write("- Campanha: `"+campaign+"`\n")
              s.write("- Link Shopee convertido: `"+shortlink+"`\n")
              s.write("- Blog publica somente após gate editorial separado\n")
          PY
