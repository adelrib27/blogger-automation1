name: V31 C64 TEMP — homologar agora C55 Blogger e C60 WordPress
on:
  push:
    paths:
      - 'affiliate_hub_v31/C64_TEST_MODE.txt'
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  immediate-safe-canary:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências oficiais sem criar posts
        run: python -m pip install 'boto3>=1.35,<2' requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Regressão C55/C60, gates comerciais e segurança de conteúdo C63
        run: |
          set -euo pipefail
          python -m unittest affiliate_hub_v31.tests.test_automatic_blogger_drafts affiliate_hub_v31.tests.test_automatic_wordpress_drafts affiliate_hub_v31.tests.test_article_commerce affiliate_hub_v31.tests.test_site_request_queue -q
      - name: TESTE REAL C64 modo estritamente controlado, WordPress somente preview
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          mode=$(cat affiliate_hub_v31/C64_TEST_MODE.txt)
          if [[ "$mode" != "preview" && "$mode" != "blogger_draft_once" && "$mode" != "queue_preview" && "$mode" != "queue_execute" ]]; then
            echo 'V31_C64_MODE_NOT_AUTHORIZED_NO_WRITES'
            exit 3
          fi
          if [[ "$mode" == "queue_preview" || "$mode" == "queue_execute" ]]; then
            echo 'V31_C64_UNIVERSAL_REAL_REQUEST_QUEUE_CANDIDATE_DIAGNOSTIC'
            python -m affiliate_hub_v31.site_request_queue --budget 3
            if [[ "$mode" == "queue_execute" ]]; then
              echo 'V31_C64_UNIVERSAL_REAL_REQUEST_QUEUE_CONVERSION_START_NO_POST'
              python -m affiliate_hub_v31.site_request_queue --budget 3 --execute
              echo 'V31_C64_UNIVERSAL_REAL_REQUEST_QUEUE_CONVERSION_END_NO_POST'
            fi
            echo 'V31_C64_QUEUE_MODE_COMPLETE_NO_PUBLICATION'
            exit 0
          fi
          if [[ "$mode" == "preview" ]]; then
            echo 'V31_C64_BLOGGER_REAL_PREVIEW_START_NO_POST'
            python -m affiliate_hub_v31.automatic_blogger_drafts --site-key blogger_moveis_para_cada_canto
            echo 'V31_C64_BLOGGER_REAL_PREVIEW_COMPLETE_NO_POST'
          else
            echo 'V31_C64_BLOGGER_SINGLE_DRAFT_ATTEMPT_START_NOT_LIVE'
            python -m affiliate_hub_v31.automatic_blogger_drafts --site-key blogger_moveis_para_cada_canto --execute-draft
            echo 'V31_C64_BLOGGER_SINGLE_DRAFT_ATTEMPT_COMPLETE'
          fi
          echo 'V31_C64_WORDPRESS_REAL_PREVIEW_START_NO_POST'
          python -m affiliate_hub_v31.automatic_wordpress_drafts --site-key wordpress_casa_decoracao --topic 'organização da cozinha'
          echo 'V31_C64_WORDPRESS_REAL_PREVIEW_COMPLETE_NO_POST'
          echo 'V31_C64_TEST_PASS_NO_LIVE_PUBLICATION'
