name: V31 LAB - Atomic claim bridge targeted SAFE (no remote write)

on:
  push:
    branches: [lab/v31r1-shopee-safe-20261103]
    paths:
      - .github/workflows/v31_lab_atomic_claim_bridge_targeted_safe.yml
      - blogger_stores/v31_core/v31_atomic_git_claim_bridge_lab.py
      - blogger_stores/tests/v31_atomic_claim_bridge/**

permissions:
  contents: read
  actions: read

concurrency:
  group: v31-lab-atomic-claim-bridge-targeted-safe
  cancel-in-progress: false

jobs:
  testar-integracao-direcionada:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/lab/v31r1-shopee-safe-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout LAB sem credenciais persistidas
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir reserva existente e ledger imutavel
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'adelrib27/blogger-automation1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 801381b4e0d2d23fa60f478da67b6dca6ec3df32 "$GITHUB_SHA"
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'blogger_stores/v31_core')
          from v31_atomic_git_claim_bridge_lab import git_blob, BASE_LEDGER_BLOB, BASE_HISTORY_BLOB
          root=Path('blogger_stores/v31_lab/state')
          l=(root/'v31_rotation_ledger.json').read_bytes()
          h=(root/'v31_rotation_history.json').read_bytes()
          assert git_blob(l)==BASE_LEDGER_BLOB and git_blob(h)==BASE_HISTORY_BLOB
          ledger=json.loads(l);history=json.loads(h)
          assert [x['status'] for x in ledger['operations']]==['PERSISTED','PLAN']
          assert 'prewriteClaim' not in ledger['operations'][1]
          assert len(history['runs'])==2
          print('V31_LAB_PREWRITE_CLAIM_STILL_UNARMED_BASELINE_PASS')
          PY
      - name: Recuperar HTML original previamente aprovado, somente leitura
        uses: actions/download-artifact@v4
        with:
          name: v31-lab-second-preflight-readonly-1
          run-id: 41841058542
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v31_archived
      - name: Executar apenas os testes novos do adaptador
        shell: bash
        env:
          V31_TEST_REAL_HTML_DIR: ${{ runner.temp }}/v31_archived
        run: |
          set -euo pipefail
          echo "6f3810a364fe2114865b96fa5f118c10495bfe39943406624710ac9aaf25f450  ${RUNNER_TEMP}/v31_archived/LOJA_ORIGINAL_BACKUP.html" | sha256sum -c -
          python -m py_compile blogger_stores/v31_core/v31_atomic_git_claim_bridge_lab.py \
            blogger_stores/tests/v31_atomic_claim_bridge/test_v31_atomic_git_claim_bridge_lab.py
          python -m unittest discover -s blogger_stores/tests/v31_atomic_claim_bridge -v
          git diff --exit-code -- blogger_stores/v31_lab/state
          test -z "$(git status --porcelain -- blogger_stores/v31_lab/state)"
          echo 'V31_ATOMIC_CLAIM_BRIDGE_TARGETED_SAFE_PASS; only_new_tests=true; remote_write=false; blogger_put=false; cron=false; artifacts_uploaded=0'
