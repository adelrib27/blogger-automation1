name: V31 Atelie Criativo - Shopee Loja diaria (isolado)
on:
  pull_request:
    paths:
      - "atelie_criativo/rotation_v31.py"
      - ".github/workflows/atelie_criativo_rotation_v31.yml"
  push:
    branches: [main]
    paths:
      - "atelie_criativo/rotation_v31.py"
      - ".github/workflows/atelie_criativo_rotation_v31.yml"
  workflow_dispatch:
  schedule:
    # 09:00 UTC = 06:00 America/Recife; GitHub pode atrasar a execução.
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: v31-atelie-criativo-8888519348129960729-loja-diaria
  cancel-in-progress: false

jobs:
  rotacao-loja:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      ATELIE_STORE_DRY_RUN: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'false' || 'true' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar Google Blogger API
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth-httplib2
      - name: Dependencias e credenciais presentes sem revelar valores
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          test -n "$BLOGGER_CLIENT_ID"
          test -n "$BLOGGER_CLIENT_SECRET"
          test -n "$BLOGGER_REFRESH_TOKEN"
          python -m py_compile atelie_criativo/rotation_v31.py src/criar_rascunho.py src/blogger_policy_guard.py
      - name: Testes unitarios SAFE sem rede
        run: python atelie_criativo/rotation_v31.py --self-test
      - name: Consultar Shopee e aplicar Blogger SAFE ou LIVE sob guardas
        run: python -u atelie_criativo/rotation_v31.py
      - name: Arquivar diagnostico sem secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelie-v31-rotation-${{ github.run_number }}
          path: atelie_criativo/rotacao_ultimo_resultado.json
          if-no-files-found: warn
          retention-days: 7
