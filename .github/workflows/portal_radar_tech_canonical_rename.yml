name: Portal Radar Tech — Auditar nome canônico

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-radar-tech-canonical-audit
  cancel-in-progress: true

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar referências canônicas sem escrever
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          inv_path=Path('blogger_multi_store/data/NETWORK_STORE_INVENTORY_2026-11-02.json')
          inv=json.loads(inv_path.read_text(encoding='utf-8'))
          target=[b for b in inv.get('blogs',[]) if str(b.get('blog_id')) == '7487888217273188851']
          if len(target) != 1:
              raise SystemExit(f'Inventário: esperado 1 alvo, encontrado {len(target)}')
          blog=target[0]
          if blog.get('title') != 'Portal Radar Tech':
              raise SystemExit(f"Inventário: título inesperado {blog.get('title')!r}")
          if blog.get('renamed_from') != 'Radar Tech BR':
              raise SystemExit('Inventário: renamed_from ausente/incorreto')
          if blog.get('url') != 'https://portalradartechbr.blogspot.com/':
              raise SystemExit('Inventário: URL Blogger alterada')

          checkpoint=Path('CHECKPOINT_ATUAL.md').read_text(encoding='utf-8')
          required_checkpoint=[
              'Portal Radar Tech',
              'Rename canônico — Radar Tech BR → Portal Radar Tech',
              'Radar Tech BR** passa a designar exclusivamente o sistema WordPress separado',
              'Cozinha Sem Complicação',
          ]
          missing=[x for x in required_checkpoint if x not in checkpoint]
          if missing:
              raise SystemExit(f'Checkpoint: referências canônicas ausentes: {missing}')

          rollout=json.loads(Path('blogger_multi_store/config/network_store_rollout_2026-11-01.json').read_text(encoding='utf-8'))
          rt=[t for t in rollout.get('targets',[]) if str(t.get('blog_id')) == '7487888217273188851']
          if len(rt) != 1 or rt[0].get('title') != 'Portal Radar Tech' or rt[0].get('renamed_from') != 'Radar Tech BR':
              raise SystemExit('Rollout: identidade canônica Portal Radar Tech não consolidada')

          print('PORTAL_RADAR_TECH_CANONICAL_AUDIT_PASS')
          print('Blogger=Portal Radar Tech; WordPress Radar Tech BR=separado/fora deste projeto; nenhum arquivo alterado.')
          PY

# MANUAL_READ_ONLY_AFTER_VALIDATED_RENAME_2026_11_02
# EXACT_BLOG_ID_7487888217273188851
# WORDPRESS_RADAR_TECH_BR_OUTSIDE_BLOGGER_PROJECT
