name: Testar Cloudflare Imagem

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests cloudinary

      - name: Testar geração de imagem no Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python src/testar_cloudflare_imagem.py

      - name: Salvar imagem de teste
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: imagem-teste-cloudflare
          path: data/imagens/teste-cloudflare-flux.*
          if-no-files-found: error
