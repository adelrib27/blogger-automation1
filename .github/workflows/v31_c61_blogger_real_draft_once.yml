name: V31 C61 TEMP — prova Blogger real, PREVIEW ou 1 DRAFT

on:
  push:
    paths:
      - 'affiliate_hub_v31/C61_REAL_BLOGGER_TEST_MODE.txt'

permissions:
  contents: read

concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false

jobs:
  teste-blogger-real:
    if: >-
      github.repository == 'adelrib27/blogger-automation1' &&
      github.ref == 'refs/heads/main'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas verificadas
        run: python -m pip install 'boto3>=1.35,<2' requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Testes Blogger contínuo e fila sem teto
        run: |
          set -euo pipefail
          python -m unittest affiliate_hub_v31.tests.test_automatic_blogger_drafts affiliate_hub_v31.tests.test_site_request_queue affiliate_hub_v31.tests.test_c48_real_furniture_blogger -q
      - name: Inspecionar R2 e Blogger sem LIVE
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          V31_EDITORIAL_SHOPEE_APP_ID: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_ID }}
          V31_EDITORIAL_SHOPEE_APP_SECRET: ${{ secrets.V31_EDITORIAL_SHOPEE_APP_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          mode="$(cat affiliate_hub_v31/C61_REAL_BLOGGER_TEST_MODE.txt)"
          case "$mode" in
            preview)
              python -m affiliate_hub_v31.automatic_blogger_drafts --site-key blogger_moveis_para_cada_canto
              echo 'V31_C61_BLOGGER_PREVIEW_REAL_PASS_NO_POST'
              ;;
            cache_preview)
              python -m affiliate_hub_v31.site_request_queue --budget 1
              echo 'V31_C61_CACHE_PREVIEW_NO_MUTATION'
              ;;
            cache_execute)
              python -m affiliate_hub_v31.site_request_queue --budget 1 --execute
              echo 'V31_C61_CACHE_CONVERSION_ATTEMPTED_NO_POST'
              ;;
            execute_draft)
              # Somente uma criação de DRAFT, após seleção de SKU R2 real.
              python -m affiliate_hub_v31.automatic_blogger_drafts --site-key blogger_moveis_para_cada_canto --execute-draft
              echo 'V31_C61_BLOGGER_DRAFT_TEST_PASS_NEVER_LIVE'
              ;;
            *)
              echo 'V31_C61_INVALID_TEST_MODE'
              exit 5
              ;;
          esac
