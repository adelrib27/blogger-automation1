name: Conecta Achados — Publicar 10 produtos iniciais

on:
  push:
    branches: [main]
    paths:
      - "conecta_achados/src/publish_batch10.py"
      - ".github/workflows/conecta_achados_batch10_publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conecta-achados-batch10-publish
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests cloudinary pillow

      - name: Validar sintaxe
        run: python -m compileall -q conecta_achados/src

      - name: Publicar os 10 produtos no Conecta Achados
        env:
          BLOGGER_BLOG_ID: "1719259388907013414"
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: python conecta_achados/src/publish_batch10.py

      - name: Salvar estado e resultado do lote
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+adelrib27@users.noreply.github.com"
          git add conecta_achados/data/state.json conecta_achados/data/batch_10_publish_result.json || true
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi
          git commit -m "Conecta Achados: registrar resultado do lote inicial"
          git pull --rebase origin main
          git push origin HEAD:main
