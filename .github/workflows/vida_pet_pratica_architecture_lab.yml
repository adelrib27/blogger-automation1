name: Vida Pet Prática — Architecture Lab SAFE

on:
  workflow_dispatch:
  push:
    paths:
      - "vida_pet_pratica/architecture_kickoff.txt"

permissions:
  contents: read

concurrency:
  group: vida-pet-pratica-architecture-lab
  cancel-in-progress: false

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      VIDAPET_GROQ_MODEL: "openai/gpt-oss-120b"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SAFE preflight and local guards
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          test -n "$FIRECRAWL_API_KEY"
          test -n "$GROQ_API_KEY"
          test ! -f vida_pet_pratica/wordpress_write.flag
          python -m py_compile \
            vida_pet_pratica/src/evidence_engine.py \
            vida_pet_pratica/src/automation_core_v1.py \
            vida_pet_pratica/src/article_builder_v1.py
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "vida_pet_pratica/src")
          import evidence_engine as ev
          import automation_core_v1 as core

          policy = json.loads(Path("vida_pet_pratica/config/automation_policy.json").read_text(encoding="utf-8"))
          assert policy["wordpress"]["writes_enabled"] is False
          assert policy["evidence"]["allow_keyless_firecrawl_lab"] is False
          assert int(policy["min_ready"]) == 3
          assert core.source_guard({"productName": "Recipiente Porta Ração Pet"})[0] is True
          assert core.source_guard({"productName": "Ração Seca Premium para Gatos"})[0] is False
          assert ev.similarity("organização do cantinho do gato", "organização do espaço do gato") > 0
          print("SAFE guards OK")
          PY

      - name: Build verified candidate buffer from Shopee and Firecrawl
        run: python vida_pet_pratica/src/automation_core_v1.py

      - name: Build grounded post buffer with Groq Fact Gate
        shell: bash
        run: |
          python - <<'PY'
          import re
          import sys
          import time

          sys.path.insert(0, "vida_pet_pratica/src")
          import article_builder_v1 as builder
          import evidence_engine as evidence

          original_call = builder.groq_call
          original_prompt = builder.prompt_for
          original_gate = builder.gate
          last_call = [0.0]
          current_candidate = [{}]

          TITLE_FALLBACKS = {
              "Higiene": "Higiene pet: como organizar uma rotina mais prática",
              "Diversao e Enriquecimento": "Brincadeiras para pets: rotina com mais variedade",
              "Transporte e Passeio": "Passeios com pets: cuidados para uma rotina prática",
              "Organizacao": "Organização pet: como simplificar a rotina diária",
              "Alimentacao e Hidratacao": "Rotina do pet: organização para alimentação e água",
              "Conforto": "Conforto do pet: critérios para a rotina diária",
          }

          SAFE_BLOCKS = {
              "Higiene": [
                  ("Adaptação sem pressa", "Ao incluir um acessório na rotina de higiene, vale observar como o animal reage ao novo elemento e fazer a adaptação gradualmente. Mantenha o espaço previsível, evite mudanças demais de uma só vez e acompanhe o uso nos primeiros dias. A ideia é tornar a rotina mais simples para a casa sem criar desconforto para o pet. Se houver resistência, reposicione o item, reveja a organização do ambiente e dê tempo para o animal se acostumar antes de concluir se aquela solução combina com a rotina."),
                  ("Limpeza do espaço como hábito", "Uma rotina de higiene funciona melhor quando a limpeza do ambiente tem frequência definida. Remova resíduos visíveis, mantenha os utensílios usados na limpeza separados e siga as orientações do fabricante para qualquer acessório. Também é útil observar pontos onde a sujeira costuma se acumular e ajustar a organização do espaço. Pequenas correções de posicionamento e frequência podem facilitar a manutenção diária sem depender de promessas específicas sobre um único produto."),
                  ("O que observar ao longo do uso", "Depois de incorporar o acessório, acompanhe se ele continua adequado ao espaço e à rotina do pet. Observe desgaste, estabilidade, facilidade de higienização e qualquer mudança no comportamento do animal ao redor do item. Se houver dano, peças soltas ou dificuldade de limpeza, interrompa o uso até avaliar a situação. Essa revisão periódica ajuda a manter uma rotina organizada e evita transformar a escolha inicial em algo automático, sem reavaliar se ainda faz sentido."),
              ],
              "Diversao e Enriquecimento": [
                  ("Variedade com supervisão", "Brincadeiras podem ser alternadas ao longo da semana para evitar que toda a rotina dependa de um único estímulo. Sessões curtas, acompanhadas e adequadas ao comportamento do animal ajudam a perceber quais atividades despertam interesse. A supervisão também permite interromper o uso se surgir desgaste, peça solta ou uma interação inadequada. O objetivo não é manter o pet ocupado o tempo todo, mas oferecer variedade de forma compatível com o espaço, a idade e o perfil de cada animal."),
                  ("Como encaixar a brincadeira no dia", "É mais fácil manter consistência quando a atividade entra em horários previsíveis da rotina. Reserve alguns minutos, observe o nível de interesse e alterne momentos de interação com períodos de descanso. Nem todo pet responde da mesma forma ao mesmo tipo de brinquedo, por isso a observação prática é mais útil do que expectativas rígidas. Quando o interesse diminuir, mudar o contexto, o local ou o momento da brincadeira pode ser suficiente antes de buscar outro acessório."),
                  ("Revisão do acessório", "Antes e depois das brincadeiras, verifique o estado geral do acessório e retire de uso qualquer item danificado. Partes desgastadas, pontas expostas ou componentes soltos merecem atenção imediata. A limpeza e a conservação devem seguir as instruções do fabricante. Esse cuidado simples ajuda a transformar a escolha do brinquedo em parte de uma rotina responsável, na qual diversão, supervisão e manutenção caminham juntas."),
              ],
              "Transporte e Passeio": [
                  ("Ajuste antes de sair", "Antes de usar qualquer acessório de passeio, confira se o ajuste é adequado ao animal e se os pontos de fechamento estão bem posicionados. Faça essa verificação em um ambiente tranquilo antes de sair de casa. O pet deve conseguir se movimentar normalmente, e qualquer sinal de incômodo merece uma nova checagem. A compatibilidade real depende do porte, das medidas, do comportamento e das orientações do fabricante, por isso não deve ser presumida apenas pelo nome comercial do produto."),
                  ("Supervisão durante o passeio", "No passeio, observe continuamente o comportamento do animal e as condições do ambiente. Trânsito, outros animais, calor, piso e nível de movimento podem mudar rapidamente. Um acessório é apenas parte da preparação; a condução atenta continua sendo essencial. Se o equipamento apresentar folga, dano ou comportamento inesperado, interrompa o uso e faça uma nova avaliação antes de continuar. Essa rotina de checagem reduz improvisos e ajuda a tornar as saídas mais previsíveis."),
                  ("Checklist depois do uso", "Ao voltar, reserve um momento para inspecionar o acessório e guardar tudo de forma organizada. Verifique sujeira, desgaste e partes que precisem de limpeza, sempre seguindo as instruções do fabricante. Manter guia, itens de identificação e outros objetos de passeio em um local fixo também reduz esquecimentos na próxima saída. Com esse hábito, a preparação deixa de depender da pressa e passa a fazer parte de uma rotina simples e repetível."),
              ],
          }

          COMMON_BLOCKS = [
              ("Como avaliar se a escolha continua adequada", "A escolha de um acessório não termina no primeiro uso. Depois de alguns dias, observe se ele realmente se encaixa no espaço, no ritmo da casa e no comportamento do animal. Compare facilidade de uso, manutenção e adaptação sem transformar expectativas em certezas. Quando alguma característica técnica for importante para a decisão, confirme a informação no anúncio e, quando disponível, nas orientações do fabricante. Essa revisão periódica ajuda a manter decisões práticas baseadas no que funciona na rotina real."),
              ("Organização para facilitar a rotina", "Definir um local fixo para guardar e usar os acessórios do pet reduz improvisos e facilita a manutenção. Separe itens de limpeza, passeio, alimentação ou brincadeira conforme a finalidade e evite acumular objetos que já não são utilizados. Uma organização simples também torna mais fácil perceber quando algo precisa ser higienizado, substituído ou revisado. O foco é criar uma rotina sustentável, com poucos passos e atenção ao comportamento do animal, em vez de depender de soluções que prometem resolver tudo sozinhas."),
              ("Antes de decidir pela compra", "Use o conteúdo editorial como ponto de partida, não como substituto das informações do anúncio. Confira medidas, materiais, compatibilidade, instruções de uso e condições atuais diretamente na página do produto. Quando algum dado não estiver claro, trate a informação como não confirmada. Essa postura evita decisões baseadas em suposições e ajuda a comparar opções de forma mais objetiva, levando em conta o espaço disponível, a rotina da casa e as necessidades práticas do pet."),
          ]

          def safe_title(candidate):
              category = str(candidate.get("category") or "")
              keyword = str(candidate.get("keyword") or "").lower()
              if "tapete coletor" in keyword:
                  return "Tapete coletor de areia: rotina prática com gatos"
              if "brinquedo interativo" in keyword:
                  return "Brinquedo interativo: como variar a rotina do pet"
              if "guia cachorro" in keyword:
                  return "Guia para cachorro: ajuste e rotina de passeio"
              if "caixa areia" in keyword:
                  return "Caixa de areia para gatos: rotina mais organizada"
              if "cama pet" in keyword:
                  return "Cama pet: critérios para uma rotina de conforto"
              if "comedouro" in keyword:
                  return "Comedouro pet: organização para a rotina diária"
              return TITLE_FALLBACKS.get(category, "Rotina pet: critérios práticos para escolher acessórios")

          def clip_text(text, limit):
              text = re.sub(r"\s+", " ", str(text or "")).strip()
              if len(text) <= limit:
                  return text
              words = text.split()
              out = []
              for word in words:
                  candidate = " ".join(out + [word])
                  if len(candidate) > limit - 1:
                      break
                  out.append(word)
              return (" ".join(out).rstrip(".,;:") + ".") if out else text[:limit].rstrip()

          def normalize_structure(doc, candidate):
              if not isinstance(doc, dict):
                  return doc
              title = re.sub(r"\s+", " ", str(doc.get("title") or "")).strip()
              if not 35 <= len(title) <= 65:
                  doc["title"] = safe_title(candidate)

              meta = re.sub(r"\s+", " ", str(doc.get("meta_description") or "")).strip()
              if len(meta) > 155:
                  doc["meta_description"] = clip_text(meta, 150)
              elif not meta:
                  doc["meta_description"] = "Veja critérios práticos para integrar o acessório à rotina do pet e confira no anúncio os detalhes confirmados antes de escolher."

              html = str(doc.get("article_html") or "").strip()
              category = str(candidate.get("category") or "")
              blocks = list(SAFE_BLOCKS.get(category, [])) + list(COMMON_BLOCKS)
              used = set(re.findall(r"<h2[^>]*>(.*?)</h2>", html, flags=re.I | re.S))
              index = 0
              while (builder.word_count(html) < 680 or len(re.findall(r"<h2\b", html, flags=re.I)) < 6) and index < len(blocks):
                  heading, paragraph = blocks[index]
                  index += 1
                  if heading in used:
                      continue
                  html += f"<h2>{heading}</h2><p>{paragraph}</p>"
                  used.add(heading)
              doc["article_html"] = html
              return doc

          def strict_prompt(candidate, package):
              current_candidate[0] = candidate
              return original_prompt(candidate, package) + """

          VALIDACAO FINAL OBRIGATORIA:
          - titulo entre 35 e 60 caracteres;
          - meta description com no maximo 150 caracteres;
          - article_html entre 680 e 820 palavras;
          - pelo menos 6 H2;
          - cada claim_evidence deve corresponder a uma frase realmente presente no article_html;
          - se faltar extensao, amplie apenas orientacoes gerais do angulo, nunca especificacoes do produto;
          - nao use nenhuma caracteristica do produto sem evidencia autorizada.
          """

          def throttled_call(prompt):
              for attempt in range(1, 5):
                  elapsed = time.monotonic() - last_call[0]
                  if last_call[0] and elapsed < 18.0:
                      time.sleep(18.0 - elapsed)
                  try:
                      last_call[0] = time.monotonic()
                      doc, usage = original_call(prompt)
                      return normalize_structure(doc, current_candidate[0]), usage
                  except builder.ProviderFatalError as exc:
                      text = str(exc)
                      if "HTTP 429" not in text or attempt >= 4:
                          raise
                      match = re.search(r"try again in\s+([0-9.]+)s", text, flags=re.I)
                      retry_after = float(match.group(1)) if match else 6.0
                      time.sleep(max(6.0, retry_after + 2.0))

          def fuzzy_present(claim, article_plain):
              claim_norm = evidence.normalize(claim)
              article_norm = evidence.normalize(article_plain)
              if claim_norm and claim_norm in article_norm:
                  return True
              claim_tokens = evidence.tokens(claim)
              if not claim_tokens:
                  return False
              for chunk in re.split(r"(?<=[.!?;:])\s+", article_plain):
                  chunk_tokens = evidence.tokens(chunk)
                  if not chunk_tokens:
                      continue
                  containment = len(claim_tokens & chunk_tokens) / max(1, len(claim_tokens))
                  if containment >= 0.80:
                      return True
              return False

          def strict_gate(doc, package, history, max_similarity):
              result = original_gate(doc, package, history, max_similarity)
              reasons = list(result.get("reasons") or [])
              article_plain = builder.html_text(doc.get("article_html") or "")
              claims = doc.get("claim_evidence") or []
              kept = []
              for reason in reasons:
                  match = re.fullmatch(r"claim_(\d+)_not_in_article", reason)
                  if not match:
                      kept.append(reason)
                      continue
                  index = int(match.group(1))
                  if index >= len(claims):
                      kept.append(reason)
                      continue
                  claim = str((claims[index] or {}).get("claim") or "")
                  if not fuzzy_present(claim, article_plain):
                      kept.append(reason)
              result["reasons"] = kept
              result["status"] = "PASS" if not kept else "REJECTED"
              result["claim_presence_mode"] = "exact_or_80pct_token_containment"
              result["structural_normalization"] = "safe_generic_blocks_only"
              return result

          builder.prompt_for = strict_prompt
          builder.groq_call = throttled_call
          builder.gate = strict_gate
          builder.main()
          PY

      - name: Verify no WordPress writer exists
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E "wp-json|wp-admin|WORDPRESS_APP_PASSWORD|status.?=.?(publish|draft)" \
            vida_pet_pratica/src vida_pet_pratica/config vida_pet_pratica/state

      - name: Upload architecture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vida-pet-pratica-architecture-lab
          path: |
            vida_pet_pratica/data/architecture_lab/
            vida_pet_pratica/data/shopee_oportunidades/
          if-no-files-found: warn
          retention-days: 14
