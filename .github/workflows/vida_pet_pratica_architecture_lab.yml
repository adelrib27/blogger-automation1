name: Vida Pet Prática — Architecture Lab SAFE

on:
  workflow_dispatch:
  push:
    paths:
      - "vida_pet_pratica/architecture_kickoff.txt"

permissions:
  contents: read

concurrency:
  group: vida-pet-pratica-architecture-lab
  cancel-in-progress: false

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      VIDAPET_GROQ_MODEL: "openai/gpt-oss-120b"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SAFE preflight and local guards
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SHOPEE_APP_ID"
          test -n "$SHOPEE_SECRET"
          test -n "$FIRECRAWL_API_KEY"
          test -n "$GROQ_API_KEY"
          test ! -f vida_pet_pratica/wordpress_write.flag
          python -m py_compile \
            vida_pet_pratica/src/evidence_engine.py \
            vida_pet_pratica/src/automation_core_v1.py \
            vida_pet_pratica/src/article_builder_v1.py
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "vida_pet_pratica/src")
          import evidence_engine as ev
          import automation_core_v1 as core
          policy = json.loads(Path("vida_pet_pratica/config/automation_policy.json").read_text(encoding="utf-8"))
          assert policy["wordpress"]["writes_enabled"] is False
          assert policy["evidence"]["allow_keyless_firecrawl_lab"] is False
          assert int(policy["min_ready"]) == 3
          assert core.source_guard({"productName": "Recipiente Porta Ração Pet"})[0] is True
          assert core.source_guard({"productName": "Ração Seca Premium para Gatos"})[0] is False
          assert ev.similarity("organização do cantinho do gato", "organização do espaço do gato") > 0
          print("SAFE guards OK")
          PY

      - name: Build verified candidate buffer from Shopee and Firecrawl
        run: python vida_pet_pratica/src/automation_core_v1.py

      - name: Build grounded post buffer with separated evidence facts
        shell: bash
        run: |
          python - <<'PY'
          import re
          import sys
          import time

          sys.path.insert(0, "vida_pet_pratica/src")
          import article_builder_v1 as builder
          import evidence_engine as evidence

          original_call = builder.groq_call
          original_gate = builder.gate
          last_call = [0.0]
          current_candidate = [{}]
          current_package = [{}]

          TITLE_FALLBACKS = {
              "Higiene": "Higiene pet: como organizar uma rotina mais prática",
              "Diversao e Enriquecimento": "Brincadeiras para pets: rotina com mais variedade",
              "Transporte e Passeio": "Passeios com pets: cuidados para uma rotina prática",
              "Organizacao": "Organização pet: como simplificar a rotina diária",
              "Alimentacao e Hidratacao": "Rotina do pet: organização para alimentação e água",
              "Conforto": "Conforto do pet: critérios para a rotina diária",
          }

          SAFE_BLOCKS = [
              ("Adaptação à rotina", "Ao incluir um novo acessório na rotina do pet, observe como o animal reage e evite mudar vários elementos do ambiente ao mesmo tempo. O objetivo é perceber se a organização escolhida funciona na prática para a casa e para o animal. Se houver resistência ou dificuldade de uso, reveja o posicionamento e a forma de introdução antes de concluir que aquela solução é adequada. A observação do dia a dia é mais útil do que presumir resultados a partir do nome comercial de um produto."),
              ("Manutenção e observação", "Crie o hábito de observar o estado geral dos acessórios e do espaço onde eles são usados. Quando houver sujeira, desgaste, peça solta ou qualquer condição que gere dúvida, interrompa o uso até conferir as orientações do fabricante ou do anúncio. Evite receitas improvisadas de limpeza e não presuma que um material aceita determinado produto químico. Uma rotina simples de inspeção ajuda a tomar decisões com base no estado real do item, sem depender de promessas não verificadas."),
              ("Critérios antes de escolher", "Antes de comprar, compare o espaço disponível, a rotina da casa e a forma como o pet utiliza aquele tipo de acessório. Medidas, materiais, capacidade, compatibilidade e instruções de uso devem ser confirmados diretamente no anúncio ou nas orientações do fabricante. Quando algum dado não estiver claro, trate a informação como não confirmada. Esse cuidado reduz decisões baseadas em suposições e torna a comparação entre opções mais objetiva."),
              ("Revisão ao longo do tempo", "Mesmo depois de incorporar um acessório à rotina, vale reavaliar periodicamente se ele continua adequado. Mudanças no ambiente, no comportamento do animal ou no estado do próprio item podem alterar a experiência de uso. Faça essa revisão sem transformar observações pessoais em garantias universais. Se surgir uma dúvida relacionada à saúde ou ao bem-estar do animal, procure orientação profissional em vez de atribuir ao acessório uma função terapêutica que não esteja comprovada."),
          ]

          def safe_title(candidate):
              keyword = str(candidate.get("keyword") or "").lower()
              category = str(candidate.get("category") or "")
              if "tapete coletor" in keyword:
                  return "Tapete coletor de areia: rotina prática com gatos"
              if "brinquedo interativo" in keyword:
                  return "Brinquedo interativo: como variar a rotina do pet"
              if "guia cachorro" in keyword:
                  return "Guia para cachorro: ajuste e rotina de passeio"
              if "caixa areia" in keyword:
                  return "Caixa de areia para gatos: rotina mais organizada"
              if "cama pet" in keyword:
                  return "Cama pet: critérios para uma rotina de conforto"
              if "comedouro" in keyword:
                  return "Comedouro pet: organização para a rotina diária"
              return TITLE_FALLBACKS.get(category, "Rotina pet: critérios práticos para escolher acessórios")

          def clip_text(text, limit=150):
              text = re.sub(r"\s+", " ", str(text or "")).strip()
              if len(text) <= limit:
                  return text
              out = []
              for word in text.split():
                  if len(" ".join(out + [word])) > limit - 1:
                      break
                  out.append(word)
              return " ".join(out).rstrip(".,;:") + "."

          def exact_evidence_ids(package):
              return [
                  s.get("evidence_id") for s in package.get("sources") or []
                  if s.get("allowed_in_article") and s.get("identity_level") == "EXACT_PRODUCT" and s.get("evidence_id")
              ]

          def general_prompt(candidate, package):
              current_candidate[0] = candidate
              current_package[0] = package
              return f"""Você é editor do blog Vida Pet Prática.
          Escreva um guia editorial GERAL sobre o tema abaixo. Você NÃO recebeu especificações de nenhum produto e não deve inventá-las.

          CATEGORIA: {candidate.get('category')}
          PALAVRA-CHAVE/TEMA: {candidate.get('keyword')}
          ÂNGULO: {candidate.get('angle')}

          Retorne SOMENTE JSON válido com as chaves:
          title, focus_keyword, meta_description, article_html, cta_text, claim_evidence.

          Regras:
          - Português do Brasil.
          - 500 a 620 palavras e pelo menos 5 H2; sem H1.
          - HTML permitido: <p>, <h2>, <h3>, <ul>, <li>, <strong>, <em>.
          - NÃO mencione marca, modelo, preço, medida, material, capacidade ou característica específica de um produto.
          - NÃO explique que um produto possui determinada camada, componente, mecanismo, resistência, absorção, aderência ou desempenho.
          - Foque em organização da rotina, critérios de escolha, observação, supervisão e confirmação de dados no anúncio/fabricante.
          - Sem receitas químicas de limpeza, tempos/frequências fixas, recomendações de alimento, petisco ou medicamento.
          - Sem diagnóstico, tratamento, promessa de saúde, redução de estresse, prevenção de comportamento, cura ou garantia de segurança.
          - claim_evidence deve ser uma lista vazia; os fatos do produto serão inseridos posteriormente pelo Evidence Engine.
          - CTA neutro, sem urgência ou escassez.
          """

          def normalize_doc(doc, candidate, package):
              if not isinstance(doc, dict):
                  return doc

              title = re.sub(r"\s+", " ", str(doc.get("title") or "")).strip()
              if not 35 <= len(title) <= 65:
                  doc["title"] = safe_title(candidate)

              meta = re.sub(r"\s+", " ", str(doc.get("meta_description") or "")).strip()
              if not meta:
                  meta = "Veja critérios práticos para organizar a rotina do pet e confira no anúncio os detalhes confirmados antes de escolher."
              doc["meta_description"] = clip_text(meta, 150)

              html = str(doc.get("article_html") or "").strip()
              product_name = re.sub(r"\s+", " ", str(candidate.get("productName") or "")).strip()
              ids = exact_evidence_ids(package)
              verified_section = (
                  "<h2>O que foi confirmado sobre este item</h2>"
                  "<p>Na identificação consultada do anúncio, o item aparece como <strong>" + product_name + "</strong>. "
                  "Essa é a informação factual autorizada nesta etapa. Medidas, materiais, compatibilidade e demais detalhes devem ser conferidos na página atual do produto antes da decisão.</p>"
              )
              html += verified_section

              used = set(re.findall(r"<h2[^>]*>(.*?)</h2>", html, flags=re.I | re.S))
              for heading, paragraph in SAFE_BLOCKS:
                  if builder.word_count(html) >= 680 and len(re.findall(r"<h2\b", html, flags=re.I)) >= 6:
                      break
                  if heading in used:
                      continue
                  html += f"<h2>{heading}</h2><p>{paragraph}</p>"
                  used.add(heading)

              doc["article_html"] = html
              doc["claim_evidence"] = [{"claim": product_name, "evidence_ids": ids[:2]}]
              if not str(doc.get("cta_text") or "").strip():
                  doc["cta_text"] = "Confira no anúncio os detalhes e condições atuais do item antes de decidir."
              return doc

          def throttled_call(prompt):
              for attempt in range(1, 5):
                  elapsed = time.monotonic() - last_call[0]
                  if last_call[0] and elapsed < 18.0:
                      time.sleep(18.0 - elapsed)
                  try:
                      last_call[0] = time.monotonic()
                      doc, usage = original_call(prompt)
                      return normalize_doc(doc, current_candidate[0], current_package[0]), usage
                  except builder.ProviderFatalError as exc:
                      text = str(exc)
                      if "HTTP 429" not in text or attempt >= 4:
                          raise
                      match = re.search(r"try again in\s+([0-9.]+)s", text, flags=re.I)
                      retry_after = float(match.group(1)) if match else 6.0
                      time.sleep(max(6.0, retry_after + 2.0))

          def strict_gate(doc, package, history, max_similarity):
              result = original_gate(doc, package, history, max_similarity)
              article_norm = evidence.normalize(builder.html_text(doc.get("article_html") or ""))
              extra_patterns = [
                  "agua e vinagre", "lubrifique", "reduz o estresse", "reduzir o estresse",
                  "previne comportamento", "prevenir comportamento", "garante seguranca",
                  "garantir a seguranca", "resultado garantido", "petisco", "laser"
              ]
              hits = [p for p in extra_patterns if evidence.normalize(p) in article_norm]
              if hits:
                  result["reasons"] = list(result.get("reasons") or []) + ["unsafe_general_claim:" + ",".join(hits)]
                  result["status"] = "REJECTED"
              result["product_fact_mode"] = "deterministic_evidence_section_only"
              return result

          builder.prompt_for = general_prompt
          builder.groq_call = throttled_call
          builder.gate = strict_gate
          builder.main()
          PY

      - name: Verify no WordPress writer exists
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E "wp-json|wp-admin|WORDPRESS_APP_PASSWORD|status.?=.?(publish|draft)" \
            vida_pet_pratica/src vida_pet_pratica/config vida_pet_pratica/state

      - name: Upload architecture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vida-pet-pratica-architecture-lab
          path: |
            vida_pet_pratica/data/architecture_lab/
            vida_pet_pratica/data/shopee_oportunidades/
          if-no-files-found: warn
          retention-days: 14
