name: V31 C92 - estoque de ofertas novas sem duplicar CMS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v31_c92_readonly_restock_inventory.yml']
permissions:
  contents: read
concurrency:
  group: v31-c92-catalog-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main'
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
      V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
      V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
      V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias de leitura Blogger e R2
        run: python -m pip install 'boto3>=1.36,<2' requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Calcular candidatos novos sem qualquer conversao
        run: |
          python - <<'PY'
          import hashlib, json, tempfile
          from pathlib import Path
          from affiliate_hub_v31.routing import sites
          from affiliate_hub_v31.r2_state import R2State, verify_database
          from affiliate_hub_v31.catalog import Catalog
          from affiliate_hub_v31.verified_supply import supply_profiles
          from affiliate_hub_v31.autonomous_review import PROFILE
          from affiliate_hub_v31.reviewed_draft_delivery import read_draft_history

          site='blogger_moveis_para_cada_canto'
          route=sites()[site]
          history=read_draft_history(site)
          used=set(history['keys'])
          policy=json.loads(PROFILE.read_text(encoding='utf-8'))[site]
          result={'site':site,'cms_count':history['count'], 'profiled_total':0,
                  'already_in_cms':0,'new_with_campaign_link':0,
                  'new_pending_conversion':0,'needs_external_fact_verification':True,
                  'shopee_api_calls':0,'firecrawl_api_calls':0,'cms_mutations':0,
                  'r2_mutations':0}
          new_candidates=[]
          with tempfile.TemporaryDirectory() as tmp:
              file=Path(tmp)/'catalog.sqlite3'
              if not R2State.from_env().restore_to(file):
                  raise SystemExit('catalog_missing')
              verify_database(file)
              with Catalog(file) as catalog:
                  for sku,profile in supply_profiles(catalog,route,policy):
                      result['profiled_total']+=1
                      if hashlib.sha256(sku.encode()).hexdigest() in used:
                          result['already_in_cms']+=1
                          continue
                      ready=bool(catalog.cached_link(sku,route['campaign']))
                      result['new_with_campaign_link' if ready else 'new_pending_conversion']+=1
                      if len(new_candidates)<8:
                          identity=profile.get('manufacturer_identity',{})
                          new_candidates.append({
                             'sku':sku, 'brand':identity.get('brand',''),
                             'model':identity.get('model',''),
                             'kind':identity.get('kind',''),
                             'affiliate_link_ready':ready,
                             'verification_profile':'manufacturer' if identity else
                                                    'registered_static_or_gtin'
                          })
          print('V31_C92_DEDUP_CATALOG_READONLY_PASS')
          print(json.dumps(result,ensure_ascii=False,sort_keys=True))
          print('CANDIDATES_PUBLIC_SKU_ONLY '+json.dumps(new_candidates,ensure_ascii=False))
          PY
