name: V31 C9 - Verificar contrato reusable no PR SAFE (temporario)

on:
  push:
    branches:
      - feature/v31-affiliate-hub-c1-safe-20261115
    paths:
      - '.github/workflows/v31_c9_reusable_contract_once.yml'

permissions:
  contents: read

jobs:
  validar-contrato-sem-executar-api:
    uses: ./.github/workflows/v31_c9_discovery_reusable.yml
    with:
      site_key: wordpress_casa_decoracao
      scanner: casa_decoracao/src/shopee_oportunidades_casa.py
      config: casa_decoracao/config/shopee_oportunidades.json
      rules: casa_decoracao/config/shopee_intent_rules.json
      output: casa_decoracao/data/shopee_oportunidades
      artifact_name: v31-c9-parse-${{ github.run_id }}
      limit: 32
      min_fallback: 3
