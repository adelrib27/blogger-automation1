name: Testar Geração de Imagem

on:
  workflow_dispatch:

jobs:
  testar-imagem:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxe
        run: python -m py_compile src/gerar_imagem.py

      - name: Testar geração de imagem
        timeout-minutes: 5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u src/gerar_imagem.py

      - name: Mostrar imagem gerada
        if: always()
        run: |
          echo "=== ARQUIVOS GERADOS ==="
          find data/imagens -maxdepth 1 -type f -print 2>/dev/null || true

      - name: Salvar imagem como artefato do teste
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: imagem-destacada-teste
          path: data/imagens/
          if-no-files-found: warn
