name: V31 C36 TEMP MAIN — handoff universal real R2 3 temas
on:
  push:
    branches:
      - main
    paths:
      - affiliate_hub_v31/C36_REAL_R2_ONCE_TRIGGER.txt
permissions:
  contents: read
concurrency:
  group: v31-editorial-catalog-single-writer
  cancel-in-progress: false
jobs:
  real-universal-handoff:
    if: github.repository == 'adelrib27/blogger-automation1' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: v31-editorial-safe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Testar tudo antes do R2
        run: |
          python -m unittest discover -s affiliate_hub_v31/tests -q
          python casa_decoracao/src/self_test.py
          python oficina_garagem/src/self_test.py
          python src/editorial_cross_blog_guard_self_test.py
      - name: Teste de temas ainda não cadastrados e blog real existente — R2 somente leitura
        env:
          V31_EDITORIAL_R2_ACCESS_KEY_ID: ${{ secrets.V31_EDITORIAL_R2_ACCESS_KEY_ID }}
          V31_EDITORIAL_R2_SECRET_ACCESS_KEY: ${{ secrets.V31_EDITORIAL_R2_SECRET_ACCESS_KEY }}
          V31_EDITORIAL_R2_ACCOUNT_ID: ${{ vars.V31_EDITORIAL_R2_ACCOUNT_ID }}
          V31_EDITORIAL_R2_BUCKET: ${{ vars.V31_EDITORIAL_R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          python -m affiliate_hub_v31.universal_editorial_handoff --topic 'mesa de madeira' --platform blogger --articles 6
          python -m affiliate_hub_v31.universal_lexicon --topic 'mesa'
          python -m affiliate_hub_v31.universal_editorial_handoff --topic 'pneu de moto' --platform wordpress --articles 6
          python -m affiliate_hub_v31.universal_lexicon --topic 'pneu'
          python -m affiliate_hub_v31.universal_editorial_handoff --topic 'air fryer' --platform blogger --site-key blogger_air_fryers --articles 6
          echo 'V31_C36_REAL_R2_ARBITRARY_TOPICS_AND_REAL_CAMPAIGN_PASS'
