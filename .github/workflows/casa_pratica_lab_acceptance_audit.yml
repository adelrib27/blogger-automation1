name: Casa Prática Lab — Auditoria E2E Page-target

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/casa_pratica_lab_acceptance_audit.yml"
      - ".github/workflows/casa_pratica_lab_store_autonomous.yml"
      - ".github/workflows/casa_pratica_lab_store_page_autonomous.yml"
      - "blogger_stores/src/casa_pratica_lab_store.py"
      - "blogger_stores/src/casa_pratica_lab_store_page.py"
      - "blogger_stores/src/blogger_new_blog_store_page_target.py"
      - "blogger_stores/src/blogger_store_share_card.py"
      - "blogger_stores/src/casa_pratica_lab_public_acceptance.py"
      - "blogger_stores/data/casa_pratica_lab_selection.json"
      - "blogger_stores/data/casa_pratica_lab_rotation.json"
      - "config/shopee_casa_pratica_lab.json"
      - "config/shopee_casa_pratica_lab_intent_rules.json"
      - "NEW_BLOG_E2E_CONTRACT_2026-11-02.md"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar e validar Policy Guard
        run: |
          set -euo pipefail
          python -m py_compile \
            blogger_stores/src/casa_pratica_lab_store.py \
            blogger_stores/src/casa_pratica_lab_store_page.py \
            blogger_stores/src/blogger_new_blog_store_page_target.py \
            blogger_stores/src/blogger_store_share_card.py \
            blogger_stores/src/casa_pratica_lab_public_acceptance.py \
            src/blogger_policy_guard.py \
            src/blogger_policy_guard_self_test.py
          PYTHONPATH=src python src/blogger_policy_guard_self_test.py

      - name: Auditar contrato, writer único e isolamento
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          legacy=Path('.github/workflows/casa_pratica_lab_store_autonomous.yml').read_text(encoding='utf-8')
          live=Path('.github/workflows/casa_pratica_lab_store_page_autonomous.yml').read_text(encoding='utf-8')
          engine=Path('blogger_stores/src/casa_pratica_lab_store.py').read_text(encoding='utf-8')
          wrapper=Path('blogger_stores/src/casa_pratica_lab_store_page.py').read_text(encoding='utf-8')
          adapter=Path('blogger_stores/src/blogger_new_blog_store_page_target.py').read_text(encoding='utf-8')
          share=Path('blogger_stores/src/blogger_store_share_card.py').read_text(encoding='utf-8')
          public=Path('blogger_stores/src/casa_pratica_lab_public_acceptance.py').read_text(encoding='utf-8')
          selection=json.loads(Path('blogger_stores/data/casa_pratica_lab_selection.json').read_text(encoding='utf-8'))
          rotation=json.loads(Path('blogger_stores/data/casa_pratica_lab_rotation.json').read_text(encoding='utf-8'))
          inventory=json.loads(Path('blogger_multi_store/data/NETWORK_STORE_INVENTORY_2026-11-02.json').read_text(encoding='utf-8'))
          rollout=json.loads(Path('blogger_multi_store/config/network_store_rollout_2026-11-01.json').read_text(encoding='utf-8'))

          assert Path('NEW_BLOG_E2E_CONTRACT_2026-11-02.md').exists()
          assert 'workflow_dispatch:' in legacy and '\n  schedule:' not in legacy and '\n  push:' not in legacy
          assert 'LEGACY_RECOVERY_ONLY' in legacy
          assert 'cron: "20 10 * * *"' in live and 'timezone: "America/Recife"' in live and '\n  push:' not in live
          for token in ['BLOGGER_STORE_PAGE_ID: "7110845449177208439"','sync-live','ensure-staging-draft','verify-page','casa_pratica_lab_store_page.py','PAGE_SYNC_PRESERVES_THEME_V20_AND_COMPACT_SHARE_CARD']:
              assert token in live, token
          for token in ['get_post_any_status','def update_staging','def store_write','def hero_write','def identity_write']:
              assert token in wrapper, token
          assert 'service.pages().update' in adapter and 'service.posts().revert' in adapter
          assert 'BLOGGER_STORE_AUTO_START' in adapter and 'BLOGGER_STORE_AUTO_END' in adapter
          assert 'expected_products=20, expected_hero=12' in adapter
          for token in ['BLOGGER_NEW_STORE_PAGE_THEME_FRAME_PRESERVED','FORBIDDEN_THEME_STRIPPING','inject_share_card(page_raw, page_url)','verify_share_card(raw, page_url)']:
              assert token in adapter, token
          for forbidden in ['PAGE_SURFACE_FIX =', 'fundo decorativo removido', 'fundo limpo']:
              assert forbidden not in adapter, forbidden
          for token in ['data-share-compact="1"','Compartilhar esta loja','padding:10px 14px','#729c0b']:
              assert token in share, token
          assert 'CASA_PRATICA_LAB_FIRST_PUBLISH_COMBINED_DRY_RUN_PASS' in engine
          assert 'def fetch_200' in public and 'CASA_PRATICA_LAB_PUBLIC_E2E_PAGE_MATURE_PASS' in public
          for token in ['Tema V20 enquadrado','BLOGGER_NEW_STORE_PAGE_THEME_FRAME_PRESERVED','BLOGGER_MODELO_V20_BRAND_DESCRIPTION_FEED_RUNTIME']:
              assert token in public, token
          for forbidden in ['.bg-photo-container{display:none!important','.bg-photo{display:none!important']:
              assert forbidden in public, 'auditor precisa proibir explicitamente '+forbidden

          categories=selection.get('categories') or {}
          products=[p for values in categories.values() for p in values]
          ids=[str(p.get('itemId') or '') for p in products]
          assert len(categories)==5 and len(products)==20 and len(set(ids))==20 and all(ids)
          assert rotation.get('blogId')=='8930870316690519385'
          runs=rotation.get('runs') or []
          assert runs and len(runs[-1].get('items') or [])==20

          s=inventory['summary']
          assert s['blogs_total']==18 and s['modern_blogger_auto_policy_guard']==18
          assert s['store_scaffold_needs_auto_rotation']==0 and s['duplicate_writer_risks']==0
          assert all(b.get('blog_id')!='8930870316690519385' for b in inventory['blogs'])
          assert rollout['enabled'] is False and rollout['mode']=='PREPARED_NOT_DEPLOYED'
          assert all(t.get('blog_id')!='8930870316690519385' for t in rollout['targets'])
          print('CASA_PRATICA_LAB_REPO_AUDIT_PASS: Page-target 20+12; Tema V20 preservado; share compacto; staging DRAFT; writer único; rede legada 18/18 preservada.')
          PY

      - name: Auditar estado público completo com retry
        run: PYTHONPATH=src:blogger_stores/src python -u blogger_stores/src/casa_pratica_lab_public_acceptance.py

# CASA_PRATICA_LAB_E2E_PAGE_TARGET_ACCEPTANCE_2026_11_03
# FINAL_VISUAL_CONTRACT_THEME_V20_FRAME_COMPACT_SHARE