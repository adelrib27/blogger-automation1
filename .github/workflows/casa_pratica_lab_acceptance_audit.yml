name: Casa Prática Lab — Auditoria E2E

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/casa_pratica_lab_acceptance_audit.yml"
      - ".github/workflows/casa_pratica_lab_store_safe.yml"
      - ".github/workflows/casa_pratica_lab_store_autonomous.yml"
      - "blogger_stores/src/casa_pratica_lab_store.py"
      - "blogger_stores/data/casa_pratica_lab_selection.json"
      - "blogger_stores/data/casa_pratica_lab_rotation.json"
      - "config/shopee_casa_pratica_lab.json"
      - "config/shopee_casa_pratica_lab_intent_rules.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar e validar Policy Guard
        run: |
          set -euo pipefail
          python -m py_compile blogger_stores/src/casa_pratica_lab_store.py src/blogger_policy_guard.py src/blogger_policy_guard_self_test.py
          PYTHONPATH=src python src/blogger_policy_guard_self_test.py

      - name: Auditar contrato E2E e isolamento da produção
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          safe=Path('.github/workflows/casa_pratica_lab_store_safe.yml').read_text(encoding='utf-8')
          live=Path('.github/workflows/casa_pratica_lab_store_autonomous.yml').read_text(encoding='utf-8')
          engine=Path('blogger_stores/src/casa_pratica_lab_store.py').read_text(encoding='utf-8')
          selection=json.loads(Path('blogger_stores/data/casa_pratica_lab_selection.json').read_text(encoding='utf-8'))
          rotation=json.loads(Path('blogger_stores/data/casa_pratica_lab_rotation.json').read_text(encoding='utf-8'))
          inventory=json.loads(Path('blogger_multi_store/data/NETWORK_STORE_INVENTORY_2026-11-01.json').read_text(encoding='utf-8'))
          rollout=json.loads(Path('blogger_multi_store/config/network_store_rollout_2026-11-01.json').read_text(encoding='utf-8'))

          assert 'contents: read' in safe
          for secret in ['BLOGGER_CLIENT_ID','BLOGGER_CLIENT_SECRET','BLOGGER_REFRESH_TOKEN']:
              assert secret not in safe, f'SAFE não pode carregar {secret}'
          assert 'CASA_PRATICA_LAB_SAFE_READ_ONLY_PASS' in safe

          assert 'BLOGGER_BLOG_ID: "8930870316690519385"' in live
          assert 'BLOGGER_STORE_POST_ID: "7691087355641688975"' in live
          assert 'cron: "20 10 * * *"' in live
          assert 'timezone: "America/Recife"' in live
          assert '\n  push:' not in live, 'LIVE final não pode manter push'
          assert 'BLOGGER_POLICY_GUARD_PUBLIC_PASS' in live
          assert 'Persistir rotação somente após PASS público' in live
          assert live.index('Verificar renderização pública + Policy Guard central') < live.index('Persistir rotação somente após PASS público')
          assert 'CASA_PRATICA_LAB_FIRST_PUBLISH_COMBINED_DRY_RUN_PASS' in engine
          assert 'base.verify_hero(new_raw, slides)' in engine

          categories=selection.get('categories') or {}
          assert len(categories)==5, len(categories)
          products=[p for values in categories.values() for p in values]
          assert len(products)==20, len(products)
          ids=[str(p.get('itemId') or '') for p in products]
          assert len(set(ids))==20 and all(ids)
          assert rotation.get('blogId')=='8930870316690519385'
          runs=rotation.get('runs') or []
          assert runs, 'rotação ainda não persistida'
          last=runs[-1]
          assert last.get('source')=='blogger_published'
          assert len(last.get('items') or [])==20
          assert len({str(x.get('itemId')) for x in last.get('items') or []})==20

          assert inventory['summary']['blogs_total']==18
          assert inventory['summary']['modern_blogger_auto_policy_guard']==14
          assert all(b.get('blog_id')!='8930870316690519385' for b in inventory['blogs'])
          assert rollout['enabled'] is False and rollout['mode']=='PREPARED_NOT_DEPLOYED'
          assert all(t.get('blog_id')!='8930870316690519385' for t in rollout['targets'])

          print('CASA_PRATICA_LAB_REPO_AUDIT_PASS: SAFE read-only; LIVE 10:20 sem push; seleção 5x4; rotação 20 persistida; produção preservada 14/18.')
          PY

      - name: Auditar HTML público 20+12
        run: |
          set -euo pipefail
          url="https://casa-pratica-lab-20261102.blogspot.com/2026/11/loja.html"
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36"
          ok=0
          for attempt in $(seq 1 8); do
            code=$(curl -L -sS --max-time 40 -A "$ua" -H "Cache-Control: no-cache" -o /tmp/lab-public.html -w "%{http_code}" "${url}?m=1&e2e_audit=${GITHUB_RUN_ID}-${attempt}" || true)
            echo "LAB_AUDIT_HTTP_${attempt}: ${code}"
            if [ "$code" = "429" ]; then sleep 15; continue; fi
            if [ "$code" != "200" ]; then sleep 8; continue; fi
            store=$(python -c "print(open('/tmp/lab-public.html',encoding='utf-8',errors='ignore').read().count('data-item-id='))")
            hero=$(python -c "print(open('/tmp/lab-public.html',encoding='utf-8',errors='ignore').read().count('data-hero-item-id='))")
            rels=$(python -c "print(open('/tmp/lab-public.html',encoding='utf-8',errors='ignore').read().count('rel=\"nofollow sponsored noopener\"'))")
            echo "LAB_AUDIT_COUNTS: store=${store} hero=${hero} rels=${rels}"
            if [ "$store" -eq 20 ] && [ "$hero" -eq 12 ] && [ "$rels" -ge 32 ]; then ok=1; break; fi
          done
          test "$ok" -eq 1
          PYTHONPATH=src python - <<'PY'
          from blogger_policy_guard import require_store_html_allowed
          raw=open('/tmp/lab-public.html',encoding='utf-8',errors='ignore').read()
          require_store_html_allowed(raw,expected_products=20,expected_hero=12)
          required=[
            'https://casa-pratica-lab-20261102.blogspot.com/p/loja.html',
            'bls-casa-organizacao','bls-cozinha-eletroportateis','bls-iluminacao-decoracao','bls-clima-conforto','bls-utilidades-rotina',
            '<a class="bls-btn bls-btn-main" href="#bls-cozinha-eletroportateis">Ver cozinha</a>',
            '<a class="bls-btn bls-btn-soft" href="#bls-iluminacao-decoracao">Ver iluminação</a>',
            '<a class="bls-btn bls-btn-main" href="#bls-clima-conforto">Ver clima</a>',
            '<a class="bls-btn bls-btn-soft" href="#bls-utilidades-rotina">Ver utilidades</a>',
          ]
          missing=[x for x in required if x not in raw]
          if missing: raise SystemExit(f'LAB public identity missing: {missing}')
          forbidden=['https://guia-de-achados-e-ofertas.blogspot.com/p/loja.html','https://conectaachados.blogspot.com/p/loja.html']
          bad=[x for x in forbidden if x in raw]
          if bad: raise SystemExit(f'LAB public identity contamination: {bad}')
          print('CASA_PRATICA_LAB_PUBLIC_AUDIT_PASS: HTTP 200; Store 20 + Hero 12 + Policy Guard + identidade.')
          PY

# CASA_PRATICA_LAB_E2E_ACCEPTANCE_AUDIT_2026_11_02
